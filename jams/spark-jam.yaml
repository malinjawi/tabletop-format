id: spark-jam
title: "Spark Jam"
theme: spark
tagline: "A rolling, open jam: prototype a tiny card game from a single spark of an idea. Placeholder art welcome — this jam judges design, not illustration."
host: Forge
timezone: "UTC"
starts_at: "2026-09-01T16:00:00Z"
submissions_close_at: "2026-09-19T16:00:00Z"
judging_ends_at: "2026-09-26T16:00:00Z"
results_at: "2026-09-27T16:00:00Z"
organizers: [forge]
team_rules:
  max_members: 12
  one_entry_per_game: true
constraints:
  max_cards: 24
  min_cards: 3
  max_deck_size: 60
  required_license: [CC0-1.0, CC-BY-4.0, CC-BY-SA-4.0]
  theme_word_required: true
  notes: >
    Keep the rules to one page. Solo entries and teams both welcome.
    One-click "Join" forks a tiny spark starter into your account so you
    can begin from something playable.
submission:
  kind: forge-release
  resubmission_before_close: true
  external_entries: false
judging:
  - fun in the first game
  - theme use
  - elegance (rules-to-depth ratio)
prizes:
  - "Winner: featured on the platform front page"
  - "Community pick: a featured card frame for your game page"
entries: []
