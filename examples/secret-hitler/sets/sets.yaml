- id: standard-edition
  name: Standard Edition
  position: 1
  size: 13
  description: >
    13 distinct printable identities (61 printed pieces once quantities are
    counted) from the official free PnP: 10 Secret Roles, 10 Party Membership
    cards, 17 Policy tiles, 20 Ballots, two foldable government placards, and
