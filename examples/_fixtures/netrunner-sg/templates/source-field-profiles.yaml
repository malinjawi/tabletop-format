# Declarative field geometry for the private System Gateway stress test.
#
# This file is game-owned data. tools/compile_source_profiles.py is generic:
# another game supplies its own inspected card IDs, boxes, and style tokens.

schema_version: 1
canonical_size_px: [744, 1030]

styles:
  title:
    type: richtext
    font_family: Forge Cinzel
    font_asset: assets/source-fonts/Cinzel-Variable.ttf
    font_weight: 700
    size_cqw: 4.3
    min_size_cqw: 2.6
    line_height: 1.0
    color: "#080808"
    padding_top_cqw: 0.25
    padding_left_cqw: 0.45
    padding_right_cqw: 0.3
    symbols: false
    autoshrink: true
    max_lines: 1
  subtitle:
    type: richtext
    font_family: Forge Cinzel
    font_asset: assets/source-fonts/Cinzel-Variable.ttf
    font_weight: 700
    size_cqw: 2.8
    min_size_cqw: 2.0
    line_height: 1.0
    color: "#101010"
    padding_left_cqw: 0.4
    symbols: false
    autoshrink: true
    max_lines: 1
  subtype:
    type: richtext
    font_family: Forge Lato
    font_asset: assets/source-fonts/Lato-Regular.ttf
    font_weight: 400
    size_cqw: 3.35
    min_size_cqw: 2.25
    line_height: 1.0
    color: "#111111"
    padding_top_cqw: 0.35
    padding_left_cqw: 0.25
    symbols: false
    autoshrink: true
    max_lines: 1
  rules:
    type: richtext
    font_family: Forge Noto Serif
    font_asset: assets/source-fonts/NotoSerif-Variable.ttf
    font_weight: 400
    size_cqw: 3.55
    min_size_cqw: 2.35
    line_height: 1.18
    color: "#111111"
    padding_top_cqw: 0.4
    padding_right_cqw: 0.5
    padding_bottom_cqw: 0.25
    padding_left_cqw: 0.5
    symbols: true
    autoshrink: true
    max_lines: 6
  flavor:
    type: richtext
    font_family: Forge Noto Serif
    font_asset: assets/source-fonts/NotoSerif-Variable.ttf
    font_weight: 400
    font_style: italic
    size_cqw: 3.05
    min_size_cqw: 2.15
    line_height: 1.2
    color: "#333333"
    padding_top_cqw: 0.25
    padding_right_cqw: 0.45
    padding_bottom_cqw: 0.2
    padding_left_cqw: 0.45
    symbols: true
    autoshrink: true
    max_lines: 6
  number_white:
    type: richtext
    font_family: Forge Orbitron
    font_asset: assets/source-fonts/Orbitron-Variable.ttf
    font_weight: 900
    size_cqw: 6.1
    min_size_cqw: 3.4
    line_height: 1.0
    color: "#ffffff"
    text_align: center
    vertical_align: middle
    symbols: false
    autoshrink: true
    max_lines: 1
  number_dark:
    type: richtext
    font_family: Forge Orbitron
    font_asset: assets/source-fonts/Orbitron-Variable.ttf
    font_weight: 900
    size_cqw: 5.7
    min_size_cqw: 3.5
    line_height: 1.0
    color: "#333333"
    text_align: center
    vertical_align: middle
    symbols: false
    autoshrink: true
    max_lines: 1

