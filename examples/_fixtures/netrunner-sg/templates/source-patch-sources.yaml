# Exact, auditable donor map for card-specific source patches.
#
# The public System Gateway PnP is one flattened JPEG per PDF page. It contains
# no text or frame layers. These patches therefore copy a complete printed badge
# from another neutral-corp agenda at integer coordinates and mask its real edge.
# They are private proof assets and do not grant redistribution permission.

schema_version: 1
canonical_size_px: [744, 1030]

patches:
  - id: offworld_advancement_3
    target_card: offworld_office
    field: attributes.advancement_cost
    value: 3
    donor_card: superconducting_hub
    crop_px: [635, 40, 738, 132]
    mask: { type: difference, threshold: 28, dilation_px: 2, feather_px: 0.7 }
    output: assets/source-patches/offworld_office/advancement_cost-3.png

  - id: offworld_advancement_5
    target_card: offworld_office
    field: attributes.advancement_cost
    value: 5
    donor_card: send_a_message
    crop_px: [635, 40, 738, 132]
    mask: { type: difference, threshold: 28, dilation_px: 2, feather_px: 0.7 }
    output: assets/source-patches/offworld_office/advancement_cost-5.png

  - id: offworld_agenda_points_1
    target_card: offworld_office
    field: attributes.agenda_points
    value: 1
    donor_card: superconducting_hub
    crop_px: [43, 470, 138, 552]
    mask: { type: difference, threshold: 28, dilation_px: 2, feather_px: 0.7 }
    output: assets/source-patches/offworld_office/agenda_points-1.png

  - id: offworld_agenda_points_3
    target_card: offworld_office
    field: attributes.agenda_points
    value: 3
    donor_card: send_a_message
    crop_px: [43, 470, 138, 552]
    mask: { type: difference, threshold: 28, dilation_px: 2, feather_px: 0.7 }
    output: assets/source-patches/offworld_office/agenda_points-3.png

# Repeated fields use the same native-pixel method, expanded deterministically
# by tools/build_source_patches.py. Tight crops avoid transplanting faction art;
# the difference mask carries only the changed glyph and the pixels needed to
# erase the target's old glyph.
patch_sets:
  - id: sure_cost
    target_card: sure_gamble
    field: attributes.cost
    crop_px: [69, 68, 133, 138]
    donors: { "0": smartware_distributor, "1": overclock, "2": t400_memory_diamond, "3": verbal_plasticity, "4": carnivore, "5": sure_gamble }
    mask: { type: difference, threshold: 24, dilation_px: 1, feather_px: 0.45 }
    output_pattern: assets/source-patches/sure_gamble/cost-{value}.png
