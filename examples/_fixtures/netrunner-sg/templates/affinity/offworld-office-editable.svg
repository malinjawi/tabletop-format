<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="744px" height="1030px" viewBox="0 0 744 1030">
  <title>Offworld Office — Forge/Affinity production bridge proof</title>
  <desc>The public PnP face is an immutable reference. Forge-bound objects remain independent text and vector layers.</desc>
  <defs>
    <linearGradient id="title-paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fafafa"/>
      <stop offset="1" stop-color="#e9eaeb"/>
    </linearGradient>
    <linearGradient id="badge-paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.55" stop-color="#f4f5f3"/>
      <stop offset="1" stop-color="#d8dcda"/>
    </linearGradient>
    <pattern id="rules-paper" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(-24)">
      <rect width="12" height="12" fill="#f4f5f3"/>
      <path d="M0 0V12" stroke="#dfe2df" stroke-width="1" opacity="0.55"/>
    </pattern>
    <filter id="number-shadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="2" dy="3" stdDeviation="1.5" flood-color="#000" flood-opacity="0.7"/>
    </filter>
    <style><![CDATA[
      @font-face { font-family: "Cinzel"; src: url("../../assets/source-fonts/Cinzel-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Orbitron"; src: url("../../assets/source-fonts/Orbitron-Black.ttf"); font-weight: 900; }
      @font-face { font-family: "Lato"; src: url("../../assets/source-fonts/Lato-Regular.ttf"); }
      @font-face { font-family: "Lato"; src: url("../../assets/source-fonts/Lato-Bold.ttf"); font-weight: 700; }
      @font-face { font-family: "Noto Serif"; src: url("../../assets/source-fonts/NotoSerif-Variable.ttf"); }
      @font-face { font-family: "Noto Serif"; src: url("../../assets/source-fonts/NotoSerif-Italic-Variable.ttf"); font-style: italic; }
      .editable { fill: #111; }
      /* Affinity ignores SVG @font-face aliases and resolves installed family
         metadata instead. These are the actual names stored in the bundled
         open font files; browsers still load them through the declarations. */
      .name { font-family: "Cinzel", Georgia, serif; font-size: 32px; font-weight: 700; letter-spacing: -0.5px; }
      .kind { font-family: "Orbitron", Verdana, sans-serif; font-size: 25px; font-weight: 900; }
      .subtype { font-family: "Lato", Arial, sans-serif; font-size: 27px; }
      .rules { font-family: "Noto Serif", Georgia, serif; font-size: 28px; }
      .flavor { font-family: "Noto Serif", Georgia, serif; font-size: 24px; font-style: italic; }
    ]]></style>
  </defs>

  <g inkscape:groupmode="layer" inkscape:label="LOCKED — NSG source reference" id="source-reference">
    <image id="source-face" inkscape:label="immutable-source-face" href="../../assets/source-faces/p_offworld_office_sg.png" x="0" y="0" width="744" height="1030" preserveAspectRatio="none"/>
  </g>

  <!-- Each field root is a self-contained overlay. Forge/Affinity hides it
       when the value matches the committed baseline, leaving the lossless
       source face byte-for-byte untouched. -->
  <g inkscape:groupmode="layer" inkscape:label="Forge-bound editable fields" id="editable-fields" class="editable">
    <g id="field-name" inkscape:label="forge:name" data-forge-field="name" data-forge-overlay="true">
      <image inkscape:label="clean-title-field" href="../../assets/source-patches/offworld_office/title-background.png" x="20" y="35" width="500" height="47" preserveAspectRatio="none"/>
      <text inkscape:label="editable-name" class="name" x="30" y="69" font-family="Cinzel" font-size="32" font-weight="700" letter-spacing="-0.5">Offworld Office</text>
    </g>

    <!-- Exact choices are native-pixel patches sampled from official sibling
         cards. Unsupported values fail preflight rather than synthesizing a
         lookalike number. The untouched source already supplies 4 and 2. -->
    <g id="field-advancement-cost" inkscape:label="forge:advancement_cost" data-forge-field="attributes.advancement_cost" data-forge-overlay="true">
      <image inkscape:label="choice:3" data-forge-choice="3" href="../../assets/source-patches/offworld_office/advancement_cost-3.png" x="635" y="40" width="103" height="92" preserveAspectRatio="none"/>
      <image inkscape:label="choice:5" data-forge-choice="5" href="../../assets/source-patches/offworld_office/advancement_cost-5.png" x="635" y="40" width="103" height="92" preserveAspectRatio="none"/>
    </g>
    <g id="field-agenda-points" inkscape:label="forge:agenda_points" data-forge-field="attributes.agenda_points" data-forge-overlay="true">
      <image inkscape:label="choice:1" data-forge-choice="1" href="../../assets/source-patches/offworld_office/agenda_points-1.png" x="43" y="470" width="95" height="82" preserveAspectRatio="none"/>
      <image inkscape:label="choice:3" data-forge-choice="3" href="../../assets/source-patches/offworld_office/agenda_points-3.png" x="43" y="470" width="95" height="82" preserveAspectRatio="none"/>
    </g>

    <g id="field-type" inkscape:label="forge:type" data-forge-field="type" data-forge-overlay="true">
      <image inkscape:label="clean-type-field" href="../../assets/source-patches/offworld_office/type-background.png" x="82" y="570" width="126" height="44" preserveAspectRatio="none"/>
      <text inkscape:label="editable-type" class="kind" x="91" y="602" font-family="Orbitron" font-size="25" font-weight="900">AGENDA:</text>
    </g>
    <g id="field-subtypes" inkscape:label="forge:subtypes" data-forge-field="subtypes" data-forge-overlay="true">
      <image inkscape:label="clean-subtype-field" href="../../assets/source-patches/offworld_office/subtypes-background.png" x="208" y="570" width="212" height="44" preserveAspectRatio="none"/>
      <text inkscape:label="editable-subtypes" class="subtype" x="218" y="602" font-family="Lato" font-size="27" font-weight="400">Expansion</text>
    </g>

    <g id="field-rules-text" inkscape:label="forge:text" data-forge-field="text" data-forge-overlay="true">
      <image inkscape:label="clean-rules-field" href="../../assets/source-patches/offworld_office/rules-background.png" x="84" y="632" width="590" height="62" preserveAspectRatio="none"/>
      <text id="field-rules-prefix" inkscape:label="forge:text:prefix" class="rules" x="91" y="670" font-family="Noto Serif" font-size="28" font-weight="400">When you score this agenda, gain 7</text>
      <!-- Official NSG_CREDIT.svg path, embedded so Affinity keeps it vector-editable. -->
      <g id="token-credit" inkscape:label="forge:token:credit" data-forge-token="credit" transform="translate(555 643) scale(0.00082835)">
        <path d="M16296.3,0.006l8549.41,8549.41l0,15493.8l-8549.41,8549.41l-8549.41,-8549.41l-0,-15493.8l8549.41,-8549.41Zm-6059.93,23027.7l6059.93,6059.93l-0,-12709.5l6059.92,-6059.92l-0,-753.396l-6059.92,-6059.93l-6059.93,6059.93l0,13462.9Z" fill="#111" fill-rule="nonzero"/>
      </g>
      <text id="field-rules-suffix" inkscape:label="forge:text:suffix" class="rules" x="582" y="670" font-family="Noto Serif" font-size="28" font-weight="400">.</text>
    </g>
  </g>

  <g inkscape:groupmode="layer" inkscape:label="PRIVATE PROOF note — non-printing" id="private-note" display="none">
    <rect x="10" y="990" width="724" height="28" fill="#fff3cd"/>
    <text x="20" y="1011" font-family="Arial" font-size="16" fill="#7a4d00">PRIVATE RECONSTRUCTION — not an NSG production source file</text>
  </g>
</svg>
