  - id: corp_influence
    type: pips
    src: card.attributes.influence
    glyph: ●
    max: 5
    direction: column
    x: 1.35
    "y": 61
    w: 3
    h: 16.8
    gap_mm: 0.25
    font: label
    size_pt: 5
    line_height: 0.95
    color: palette
    show_if: attributes.side == corp && attributes.influence && type != identity && type != ice
