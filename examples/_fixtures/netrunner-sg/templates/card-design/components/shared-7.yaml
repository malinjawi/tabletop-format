name: Shared by Agenda, Asset, Operation, Upgrade
description: 2 ordered regions reused by agenda, asset, operation, upgrade.
regions:
  - id: corp_track
    type: pips
    count: 5
    glyph: ○
    max: 5
    direction: column
    x: 1.35
    "y": 61
    w: 3
    h: 16.8
    gap_mm: 0.25
    font: label
    size_pt: 6.1
    line_height: 0.78
