name: Shared by Agenda, Asset, Event, Hardware, Operation, Program, Resource, Upgrade
description: 12 ordered regions reused by agenda, asset, event, hardware, operation, program, resource, upgrade.
regions:
  - id: art_frame
    type: rect
    x: 1.15
    "y": 9.4
    w: 60.7
    h: 39.1
    fill: none
    stroke: palette-light
    stroke_w_mm: 0.55
    shadow: inset 0 0 2mm rgba(0,0,0,.38)
    show_if: type != identity && type != ice
  - id: standard_panel_shadow
    type: rect
    x: 3
    "y": 48.4
    w: 58.4
    h: 34.2
    fill: "#05080b"
    radius_mm: 1
    shadow: 0 -1mm 1.5mm rgba(0,0,0,.38)
    show_if: type != identity && type != ice
  - id: standard_panel
    type: rect
    x: 3.7
    "y": 47.7
    w: 58.2
    h: 34.3
    fill: palette-paper
    stroke: palette-dark
    stroke_w_mm: 0.45
    radius_mm: 0.9
    show_if: type != identity && type != ice
  - id: standard_panel_faction_motif
    type: rect
    x: 3.95
    "y": 47.95
    w: 57.7
    h: 33.8
    fill: palette-panel-motif
    opacity: 0.72
    radius_mm: 0.66
    show_if: type != identity && type != ice
  - id: standard_panel_trace
    type: rect
    x: 5.5
    "y": 53.7
    w: 50.4
    h: 0.62
    fill: palette
    clip_path: polygon(0 0,47% 0,49% 100%,100% 100%,100% 100%,0 100%)
    show_if: type != identity && type != ice
  - id: standard_faction_glyph
    type: richtext
    src: card.attributes.faction
    map:
      anarch: "[faction_anarch]"
      criminal: "[faction_criminal]"
      shaper: "[faction_shaper]"
      haas-bioroid: "[faction_hb]"
      jinteki: "[faction_jinteki]"
      nbn: "[faction_nbn]"
      weyland-consortium: "[faction_weyland]"
    x: 54.3
    "y": 47.7
    w: 7.4
    h: 7.4
    symbols: true
    symbol_style: plain
    icon_only: true
    show_if: type != identity && type != ice && attributes.faction != neutral-corp && attributes.faction != neutral-runner
  - id: footer
    type: rect
    x: 0
    "y": 81.8
    w: 63
    h: 8.6
    fill: palette-gradient
    radius_mm: 0
    show_if: type != identity && type != ice
  - id: footer_faction_motif
    type: rect
    x: 0
    "y": 81.8
    w: 63
    h: 8.6
    fill: palette-shell-motif
    opacity: 0.68
    radius_mm: 0
    show_if: type != identity && type != ice
  - id: footer_signal
    type: rect
    x: 0
    "y": 81.8
    w: 63
    h: 0.62
    fill: palette-metallic
    opacity: 0.82
    show_if: type != identity && type != ice
  - id: footer_side
    type: text
    src: card.attributes.side
    transform: uppercase
    prefix: "// "
    x: 39.5
    "y": 82.8
    w: 8.5
    h: 2.7
    font: subtype
    size_pt: 3.2
    align: right
    valign: middle
    color: palette-light
    show_if: type != identity && type != ice
  - id: footer_set_icon
    type: richtext
    text: "[set_system_gateway]"
    x: 50
    "y": 82.45
    w: 3.35
    h: 3.35
    symbols: true
    symbol_style: plain
    icon_only: true
    filter: invert(1)
    opacity: 0.92
    show_if: type != identity && type != ice
  - id: footer_collector
    type: text
    src: printing.collector_number
    x: 53.85
    "y": 82.75
    w: 6.35
    h: 2.8
    font: label
    size_pt: 4.1
    align: right
    valign: middle
    color: "#f5f6f2"
    show_if: type != identity && type != ice
