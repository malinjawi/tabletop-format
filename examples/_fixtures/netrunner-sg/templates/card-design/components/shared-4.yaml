    type: badge
    text: ""
    x: 2.65
    "y": 2.05
    d: 11.75
    bg: "#07090b"
    color: "#ffffff"
    shadow: 0 .75mm 1.2mm rgba(0,0,0,.56)
    show_if: attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource
