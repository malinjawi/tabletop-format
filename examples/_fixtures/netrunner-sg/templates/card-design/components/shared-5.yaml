name: Shared by Event, Hardware, Operation, Program, Resource
description: 3 ordered regions reused by event, hardware, operation, program, resource.
regions:
  - id: credit_dial_shadow
    type: badge
    text: ""
    x: 2.65
    "y": 2.05
    d: 11.75
    bg: "#07090b"
    color: "#ffffff"
    shadow: 0 .75mm 1.2mm rgba(0,0,0,.56)
    show_if: attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource
  - id: credit_dial_hardware
    type: richtext
    text: "[runner_credit_dial]"
    x: 1.525
    "y": 0.925
    w: 14
    h: 14
    symbols: true
    symbol_style: plain
    icon_only: true
    show_if: attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource
  - id: credit_dial_number
    type: text
    src: card.attributes.cost
    x: 4.22
    "y": 4
    w: 8.61
    h: 6.55
    font: stat
    size_pt: 14.5
    align: center
    valign: middle
    color: "#ffffff"
    text_shadow: "0 .18mm .18mm #000,0 0 .35mm #000"
    show_if: attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource
