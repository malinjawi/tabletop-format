name: Shared by Agenda, Asset, Event, Hardware, Operation, Resource, Upgrade
description: 3 ordered regions reused by agenda, asset, event, hardware, operation, resource, upgrade.
regions:
  - id: standard_body
    type: body
    src: card.text
    secondary_src: printing.flavor_text
    secondary_font: flavor
    secondary_color: "#3f474e"
    secondary_scale: 0.86
    x: 5.8
    "y": 54.9
    w: 50.8
    h: 26.3
    font: body
    size_pt: 8.25
    strong_weight: 800
    strong_terms:
      - Persistent
    min_size_pt: 5.8
    line_height: 1.12
    paragraph_gap_em: 0.45
    secondary_line_height: 1.06
    color: "#151b21"
    symbols: true
    symbol_style: plain
    autoshrink: true
    show_if: type != identity && type != ice && type != program && !attributes.trash_cost
  - id: standard_body_trash
    type: body
    src: card.text
    secondary_src: printing.flavor_text
    secondary_font: flavor
    secondary_color: "#3f474e"
    secondary_scale: 0.86
    x: 5.8
    "y": 54.9
    w: 47.1
    h: 26.3
    font: body
    size_pt: 8.25
    strong_weight: 800
    strong_terms:
      - Persistent
    min_size_pt: 5.8
    line_height: 1.12
    paragraph_gap_em: 0.45
    secondary_line_height: 1.06
    color: "#151b21"
    symbols: true
    symbol_style: plain
    autoshrink: true
    show_if: type != identity && type != ice && type != program && attributes.trash_cost
  - id: footer_artist
    type: text
    src: printing.artist
    prefix: "ILLUS. "
    x: 3
    "y": 82.8
    w: 37
    h: 2.7
    font: label
    size_pt: 4.2
    align: left
    valign: middle
    color: "#f5f6f2"
    show_if: type != identity && type != ice && type != program
