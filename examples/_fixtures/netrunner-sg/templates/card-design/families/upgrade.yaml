name: Upgrade template
description: Production layout specific to upgrade cards. Shared frame and typography live in reusable components.
regions:
  - id: upgrade_header_shadow
    type: rect
    x: 14.7
    "y": 3.5
    w: 48.3
    h: 5.6
    fill: "#06090d"
    clip_path: polygon(5% 0,100% 0,100% 100%,4% 100%,0 48%)
    shadow: 0 .55mm .9mm rgba(0,0,0,.42)
    show_if: type == upgrade
  - id: upgrade_header
    type: rect
    x: 14.6
    "y": 3.14
    w: 48.4
    h: 5.05
    fill: linear-gradient(180deg,#ffffff,#ecefed)
    stroke: palette-dark
    stroke_w_mm: 0.35
    clip_path: polygon(5% 0,100% 0,100% 100%,4% 100%,0 48%)
    show_if: type == upgrade
  - id: upgrade_unique
    type: text
    text: ◆
    x: 18.7
    "y": 3.62
    w: 2.7
    h: 3.8
    font: title
    size_pt: 5.1
    align: center
    valign: middle
    color: "#111820"
    show_if: type == upgrade && attributes.unique
  - id: upgrade_name
    type: richtext
    src: card.name
    x: 17.5
    "y": 3.38
    w: 42.8
    h: 4.15
    font: title
    size_pt: 8.8
    min_size_pt: 4.4
    char_width_em: 0.6
    line_height: 1
    letter_spacing_em: -0.045
    align: left
    valign: middle
    color: "#111820"
    no_wrap: true
    autoshrink: true
    show_if: type == upgrade && !attributes.unique
  - id: upgrade_name_unique
    type: richtext
    src: card.name
    x: 21.2
    "y": 3.38
    w: 39.1
    h: 4.15
    font: title
    size_pt: 8.8
    min_size_pt: 4.4
    char_width_em: 0.6
    line_height: 1
    letter_spacing_em: -0.045
    align: left
    valign: middle
    color: "#111820"
    no_wrap: true
    autoshrink: true
    show_if: type == upgrade && attributes.unique
  - id: upgrade_rez_cost_glyph
    type: richtext
    text: "[rez_cost]"
    x: 1.65
    "y": 1.4
    w: 10.4
    h: 10.4
    symbols: true
    symbol_style: plain
    icon_only: true
    filter: drop-shadow(0 .35mm .45mm rgba(0,0,0,.5))
    show_if: type == upgrade && attributes.cost
  - id: upgrade_cost_shadow
    type: badge
    text: ""
    x: 3.45
    "y": 3.2
    d: 6.85
    bg: "#07090b"
    color: "#ffffff"
    shadow: 0 .48mm .78mm rgba(0,0,0,.58)
    show_if: type == upgrade && attributes.cost
  - id: upgrade_cost_edge
    type: badge
    text: ""
    x: 3.68
    "y": 3.43
    d: 6.39
    bg: palette-dark
    color: "#ffffff"
    show_if: type == upgrade && attributes.cost
  - id: upgrade_cost_face
    type: badge
    text: ""
    x: 3.97
    "y": 3.72
    d: 5.81
    bg: radial-gradient(circle at 50% 42%,#2b3134,#090b0d 72%)
    color: "#ffffff"
    show_if: type == upgrade && attributes.cost
  - id: upgrade_cost_number
    type: text
    src: card.attributes.cost
    x: 3.97
    "y": 3.75
    w: 5.81
    h: 5.75
    font: stat
    size_pt: 11.2
    align: center
    valign: middle
    color: "#ffffff"
    text_shadow: "0 .14mm .16mm #000,0 0 .28mm #000"
    show_if: type == upgrade && attributes.cost
  - id: upgrade_subtypes
    type: richtext
    src: card.subtypes
    transform: join
    separator: " · "
    x: 22.9
    "y": 48.55
    w: 29
    h: 4.7
    font: subtype
    size_pt: 6.6
    min_size_pt: 4.6
    char_width_em: 0.58
    line_height: 1
    align: left
    valign: middle
    color: "#303a43"
    no_wrap: true
    autoshrink: true
    show_if: type == upgrade
