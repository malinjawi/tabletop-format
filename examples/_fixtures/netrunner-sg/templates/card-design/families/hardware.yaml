name: Hardware template
description: Production layout specific to hardware cards. Shared frame and typography live in reusable components.
regions:
  - id: hardware_header_shadow
    type: rect
    x: 15.4
    "y": 3.68
    w: 47.6
    h: 5.25
    fill: "#06090d"
    clip_path: polygon(6% 0,100% 0,100% 100%,5% 100%,0 50%)
    shadow: 0 .55mm .9mm rgba(0,0,0,.42)
    show_if: type == hardware
  - id: hardware_header
    type: rect
    x: 15.6
    "y": 3.35
    w: 47.4
    h: 4.65
    fill: linear-gradient(180deg,#ffffff,#ecefed)
    stroke: palette-dark
    stroke_w_mm: 0.35
    clip_path: polygon(6% 0,100% 0,100% 100%,5% 100%,0 50%)
    show_if: type == hardware
  - id: hardware_unique
    type: text
    text: ◆
    x: 18.7
    "y": 3.8
    w: 2.7
    h: 3.7
    font: title
    size_pt: 5.1
    align: center
    valign: middle
    color: "#111820"
    show_if: type == hardware && attributes.unique
  - id: hardware_name
    type: richtext
    src: card.name
    x: 20.2
    "y": 3.55
    w: 40.2
    h: 3.95
    font: title
    size_pt: 8.7
    min_size_pt: 4.4
    char_width_em: 0.6
    line_height: 1
    letter_spacing_em: -0.045
    align: left
    valign: middle
    color: "#111820"
    no_wrap: true
    autoshrink: true
    show_if: type == hardware && !attributes.unique
  - id: hardware_name_unique
    type: richtext
    src: card.name
    x: 21.8
    "y": 3.55
    w: 38.6
    h: 3.95
    font: title
    size_pt: 8.7
    min_size_pt: 4.4
    char_width_em: 0.6
    line_height: 1
    letter_spacing_em: -0.045
    align: left
    valign: middle
    color: "#111820"
    no_wrap: true
    autoshrink: true
    show_if: type == hardware && attributes.unique
  - id: hardware_subtypes
    type: richtext
    src: card.subtypes
    transform: join
    separator: " · "
    x: 24.1
    "y": 48.55
    w: 27.8
    h: 4.7
    font: subtype
    size_pt: 6.6
    min_size_pt: 4.6
    char_width_em: 0.58
    line_height: 1
    align: left
    valign: middle
    color: "#303a43"
    no_wrap: true
    autoshrink: true
    show_if: type == hardware
