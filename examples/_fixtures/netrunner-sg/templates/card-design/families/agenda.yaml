name: Agenda template
description: Production layout specific to agenda cards. Shared frame and typography live in reusable components.
regions:
  - id: agenda_header_shadow
    type: rect
    x: 0
    "y": 2.02
    w: 50.8
    h: 6.15
    fill: "#06090d"
    clip_path: polygon(0 0,100% 0,96% 100%,0 100%)
    shadow: 0 .55mm .95mm rgba(0,0,0,.42)
    show_if: type == agenda
  - id: agenda_header
    type: rect
    x: 0
    "y": 1.66
    w: 50.5
    h: 5.7
    fill: palette-metallic
    stroke: palette-dark
    stroke_w_mm: 0.35
    clip_path: polygon(0 0,100% 0,96% 100%,0 100%)
    show_if: type == agenda
  - id: agenda_unique
    type: text
    text: ◆
    x: 3
    "y": 2.48
    w: 2.8
    h: 3.9
    font: title
    size_pt: 5.2
    align: center
    valign: middle
    color: "#111820"
    show_if: type == agenda && attributes.unique
  - id: agenda_name
    type: richtext
    src: card.name
    x: 2.6
    "y": 2.25
    w: 45.4
    h: 4.2
    font: title
    size_pt: 8.7
    min_size_pt: 4.4
    char_width_em: 0.6
    line_height: 1
    letter_spacing_em: -0.045
    align: left
    valign: middle
    color: "#111820"
    no_wrap: true
    autoshrink: true
    show_if: type == agenda && !attributes.unique
  - id: agenda_name_unique
    type: richtext
    src: card.name
    x: 6.1
    "y": 2.25
    w: 41.9
    h: 4.2
    font: title
    size_pt: 8.7
    min_size_pt: 4.4
    char_width_em: 0.6
    line_height: 1
    letter_spacing_em: -0.045
    align: left
    valign: middle
    color: "#111820"
    no_wrap: true
    autoshrink: true
    show_if: type == agenda && attributes.unique
  - id: art_agenda
    type: image
    src: printing.scan_data
    fallback_srcs:
      - printing.art_data
      - printing.art_url
      - printing.art
    x: 1.15
    "y": 9.4
    w: 60.7
    h: 39.1
    source_crop:
      - 100
      - 130
      - 544
      - 339
    source_size:
      - 744
      - 1030
    source_crop_fit: cover
    show_if: type == agenda
  - id: agenda_subtypes
    type: richtext
    src: card.subtypes
    transform: join
    separator: " - "
    x: 18.5
    "y": 48.15
    w: 33.4
    h: 4.7
    font: subtype
    size_pt: 7.3
    min_size_pt: 4.6
    char_width_em: 0.58
    line_height: 1
    align: left
    valign: middle
    color: "#303a43"
    no_wrap: true
    autoshrink: true
    show_if: type == agenda
  - id: agenda_adv_shadow
    type: badge
    text: ""
    x: 51.6
    "y": 1
    d: 10.2
    bg: "#c4cac8"
    color: "#151b21"
    shadow: 0 .65mm 1.05mm rgba(0,0,0,.42)
    show_if: type == agenda
  - id: agenda_adv_face
    type: badge
    text: ""
    x: 51.85
    "y": 1.25
    d: 9.7
    bg: radial-gradient(circle at 40% 34%,#ffffff 0%,#f2f3f1 61%,#c9cecc 100%)
    color: "#151b21"
    show_if: type == agenda
  - id: agenda_adv_icon
    type: richtext
    text: "[agenda_advancement_dial]"
    x: 51.85
    "y": 1.25
    w: 9.7
    h: 9.7
    symbols: true
    symbol_style: plain
    icon_only: true
    show_if: type == agenda
  - id: agenda_advancement
    type: text
    src: card.attributes.advancement_cost
    x: 52.85
    "y": 3
    w: 7.75
    h: 6.3
    font: stat
    size_pt: 13.2
    align: center
    valign: middle
    color: "#11171d"
    text_shadow: "0 0 .28mm #ffffff,0 0 .28mm #ffffff"
    show_if: type == agenda
  - id: agenda_points_underlay
    type: richtext
    text: "[agenda_points_plate]"
    x: 0.15
    "y": 35.3
    w: 14.9
    h: 13.15
    symbols: true
    symbol_style: plain
    icon_only: true
    show_if: type == agenda
  - id: agenda_points
    type: text
    src: card.attributes.agenda_points
    x: 4.3
    "y": 36.55
    w: 6.3
    h: 5.75
    font: stat
    size_pt: 12.4
    align: center
    valign: middle
    color: "#11171d"
    text_shadow: "0 0 .24mm #ffffff,0 0 .24mm #ffffff"
    show_if: type == agenda
