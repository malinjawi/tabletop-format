name: Corp Identity template
description: Production layout specific to corp identity cards. Shared frame and typography live in reusable components.
regions:
  - id: corp_identity_header_shadow
    type: rect
    x: 0
    "y": 1.35
    w: 52
    h: 5.65
    fill: "#080a0d"
    clip_path: polygon(0 0,100% 0,92% 100%,0 100%)
    shadow: 0 .55mm .9mm rgba(0,0,0,.52)
    show_if: type == identity && attributes.side == corp
  - id: corp_identity_header
    type: rect
    x: 0
    "y": 1.05
    w: 51.1
    h: 5.15
    fill: palette-metallic
    stroke: palette-dark
    stroke_w_mm: 0.38
    clip_path: polygon(0 0,100% 0,92% 100%,0 100%)
    show_if: type == identity && attributes.side == corp
  - id: corp_identity_subtitle_shadow
    type: rect
    x: 1.55
    "y": 6.35
    w: 39.8
    h: 4.15
    fill: "#080a0d"
    clip_path: polygon(0 0,100% 0,91% 100%,4% 100%)
    shadow: 0 .45mm .75mm rgba(0,0,0,.48)
    show_if: type == identity && attributes.side == corp
  - id: corp_identity_subtitle_rail
    type: rect
    x: 1.85
    "y": 6.15
    w: 38.7
    h: 3.65
    fill: palette-metallic
    stroke: palette-dark
    stroke_w_mm: 0.34
    clip_path: polygon(0 0,100% 0,91% 100%,4% 100%)
    show_if: type == identity && attributes.side == corp
  - id: identity_title_corp
    type: richtext
    src: card.name
    transform: before-colon
    x: 10.75
    "y": 1.35
    w: 35.6
    h: 4.35
    font: title
    size_pt: 8.4
    min_size_pt: 4.8
    char_width_em: 0.6
    line_height: 1
    letter_spacing_em: -0.035
    align: left
    valign: middle
    color: "#10171d"
    no_wrap: true
    autoshrink: true
    show_if: type == identity && attributes.side == corp
  - id: identity_subtitle_corp
    type: richtext
    src: card.name
    transform: after-colon
    x: 5
    "y": 6.28
    w: 31.8
    h: 3.05
    font: title
    size_pt: 5.35
    min_size_pt: 3.9
    char_width_em: 0.6
    line_height: 1
    letter_spacing_em: -0.025
    align: left
    valign: middle
    color: "#202830"
    no_wrap: true
    autoshrink: true
    show_if: type == identity && attributes.side == corp
  - id: identity_faction_glyph_corp
    type: richtext
    src: card.attributes.faction
    map:
      haas-bioroid: "[faction_hb]"
      jinteki: "[faction_jinteki]"
      nbn: "[faction_nbn]"
      weyland-consortium: "[faction_weyland]"
    x: 1.45
    "y": 1.25
    w: 7.8
    h: 5.1
    symbols: true
    symbol_style: plain
    icon_only: true
    show_if: type == identity && attributes.side == corp && attributes.faction != neutral-corp
  - id: identity_art_corp
    type: image
    src: printing.scan_data
    fallback_srcs:
      - printing.art_data
      - printing.art_url
      - printing.art
    x: 0
    "y": 9.8
    w: 63
    h: 47.4
    source_crop:
      - 0
      - 115
      - 744
      - 550
    source_size:
      - 744
      - 1030
    source_crop_fit: cover
    show_if: type == identity && attributes.side == corp
  - id: identity_art_edge_corp
    type: rect
    x: 0
    "y": 9.8
    w: 63
    h: 47.4
    fill: none
    stroke: palette-dark
    stroke_w_mm: 0.45
    shadow: inset 0 0 2.2mm rgba(0,0,0,.45)
    show_if: type == identity && attributes.side == corp
  - id: corp_identity_stats_shadow
    type: badge
    text: ""
    x: 2.4
    "y": 54.2
    d: 9.2
    bg: "#07090b"
    shadow: 0 .55mm .85mm rgba(0,0,0,.52)
    show_if: type == identity && attributes.side == corp
  - id: corp_identity_stats_edge
    type: badge
    text: ""
    x: 2.65
    "y": 54.45
    d: 8.7
    bg: linear-gradient(135deg,#151a1d 0%,#697174 42%,#151a1d 100%)
    show_if: type == identity && attributes.side == corp
  - id: corp_identity_deck_accent_ne
    type: badge
    text: ""
    x: 2.525
    "y": 54.325
    d: 8.95
    bg: palette
    clip_path: polygon(50% 50%,55% 0,78% 0,100% 22%,100% 45%)
    show_if: type == identity && attributes.side == corp
  - id: corp_identity_deck_accent_sw
    type: badge
    text: ""
    x: 2.525
    "y": 54.325
    d: 8.95
    bg: palette
    clip_path: polygon(50% 50%,45% 100%,22% 100%,0 78%,0 55%)
    show_if: type == identity && attributes.side == corp
  - id: corp_identity_deck_bezel
    type: badge
    text: ""
    x: 3.125
    "y": 54.925
    d: 7.75
    bg: linear-gradient(135deg,#f8faf8 0%,#737c80 42%,#eef0ee 68%,#596165 100%)
    show_if: type == identity && attributes.side == corp
  - id: corp_identity_deck_face
    type: badge
    text: ""
    x: 3.7
    "y": 55.5
    d: 6.6
    bg: radial-gradient(circle at 43% 35%,#fbfcfa 0%,#d9ddde 58%,#7b8387 100%)
    show_if: type == identity && attributes.side == corp
  - id: corp_identity_deck
    type: text
    src: card.attributes.minimum_deck_size
    x: 4.13
    "y": 56.62
    w: 5.74
    h: 4.06
    font: stat
    size_pt: 9
    horizontal_scale: 0.86
    align: center
    valign: middle
    color: "#11171d"
    text_shadow: 0 .08mm .12mm rgba(255,255,255,.7)
    show_if: type == identity && attributes.side == corp
  - id: corp_identity_influence_shadow
    type: badge
    text: ""
    x: 51.4
    "y": 54.2
    d: 9.2
    bg: "#07090b"
    shadow: 0 .55mm .85mm rgba(0,0,0,.52)
    show_if: type == identity && attributes.side == corp && attributes.influence_limit
  - id: corp_identity_influence_edge
    type: badge
    text: ""
    x: 51.65
    "y": 54.45
    d: 8.7
    bg: linear-gradient(135deg,#151a1d 0%,#697174 42%,#151a1d 100%)
    show_if: type == identity && attributes.side == corp && attributes.influence_limit
  - id: corp_identity_influence_accent_nw
    type: badge
    text: ""
    x: 51.525
    "y": 54.325
    d: 8.95
    bg: palette
    clip_path: polygon(50% 50%,45% 0,22% 0,0 22%,0 45%)
    show_if: type == identity && attributes.side == corp && attributes.influence_limit
  - id: corp_identity_influence_accent_se
    type: badge
    text: ""
    x: 51.525
    "y": 54.325
    d: 8.95
    bg: palette
    clip_path: polygon(50% 50%,55% 100%,78% 100%,100% 78%,100% 55%)
    show_if: type == identity && attributes.side == corp && attributes.influence_limit
  - id: corp_identity_influence_bezel
    type: badge
    text: ""
    x: 52.125
    "y": 54.925
    d: 7.75
    bg: linear-gradient(135deg,#f8faf8 0%,#737c80 42%,#eef0ee 68%,#596165 100%)
    show_if: type == identity && attributes.side == corp && attributes.influence_limit
  - id: corp_identity_influence_face
    type: badge
    text: ""
    x: 52.7
    "y": 55.5
    d: 6.6
    bg: radial-gradient(circle at 43% 35%,#343a3d 0%,#171c1f 58%,#070a0c 100%)
    show_if: type == identity && attributes.side == corp && attributes.influence_limit
  - id: corp_identity_influence
    type: text
    src: card.attributes.influence_limit
    x: 53.13
    "y": 56.62
    w: 5.74
    h: 4.06
    font: stat
    size_pt: 9
    horizontal_scale: 0.86
    align: center
    valign: middle
    color: "#ffffff"
    text_shadow: "0 .12mm .16mm #000"
    show_if: type == identity && attributes.side == corp && attributes.influence_limit
  - id: corp_identity_artist
    type: text
    src: printing.artist
    prefix: "ILLUS. "
    x: 4.7
    "y": 80.75
    w: 36
    h: 2.25
    font: label
    size_pt: 3.15
    align: left
    valign: middle
    color: "#151b21"
    show_if: type == identity && attributes.side == corp
  - id: corp_identity_set_icon
    type: richtext
    text: "[set_system_gateway]"
    x: 51.75
    "y": 80.55
    w: 3
    h: 3
    symbols: true
    symbol_style: plain
    icon_only: true
    opacity: 0.9
    show_if: type == identity && attributes.side == corp
  - id: corp_identity_collector
    type: text
    src: printing.collector_number
    transform: strip-leading-zeros
    x: 55
    "y": 80.85
    w: 3.6
    h: 2.5
    font: label
    size_pt: 4
    align: left
    valign: middle
    color: "#151b21"
    show_if: type == identity && attributes.side == corp
