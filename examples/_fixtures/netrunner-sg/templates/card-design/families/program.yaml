name: Program template
description: Production layout specific to program cards. Shared frame and typography live in reusable components.
regions:
  - id: program_header_shadow
    type: rect
    x: 0
    "y": 3.48
    w: 62.4
    h: 5.9
    fill: "#06090d"
    radius_mm: 1.9
    shadow: 0 .55mm .95mm rgba(0,0,0,.42)
    show_if: type == program
  - id: program_header
    type: rect
    x: 0
    "y": 3.12
    w: 62
    h: 5.4
    fill: linear-gradient(180deg,#ffffff,#ecefed)
    stroke: palette-dark
    stroke_w_mm: 0.35
    radius_mm: 1.7
    show_if: type == program
  - id: program_unique
    type: text
    text: ◆
    x: 19.3
    "y": 3.7
    w: 2.7
    h: 3.8
    font: title
    size_pt: 5.1
    align: center
    valign: middle
    color: "#111820"
    show_if: type == program && attributes.unique
  - id: program_name
    type: richtext
    src: card.name
    x: 17.9
    "y": 3.42
    w: 41
    h: 4.15
    font: title
    size_pt: 8.8
    min_size_pt: 4.4
    char_width_em: 0.6
    line_height: 1
    letter_spacing_em: -0.045
    align: left
    valign: middle
    color: "#111820"
    no_wrap: true
    autoshrink: true
    show_if: type == program && !attributes.unique
  - id: program_name_unique
    type: richtext
    src: card.name
    x: 22.3
    "y": 3.42
    w: 36.6
    h: 4.15
    font: title
    size_pt: 8.8
    min_size_pt: 4.4
    char_width_em: 0.6
    line_height: 1
    letter_spacing_em: -0.045
    align: left
    valign: middle
    color: "#111820"
    no_wrap: true
    autoshrink: true
    show_if: type == program && attributes.unique
  - id: program_subtypes
    type: richtext
    src: card.subtypes
    transform: join
    separator: " · "
    x: 21.5
    "y": 48.55
    w: 30.4
    h: 4.7
    font: subtype
    size_pt: 6.6
    min_size_pt: 4.6
    char_width_em: 0.58
    line_height: 1
    align: left
    valign: middle
    color: "#303a43"
    no_wrap: true
    autoshrink: true
    show_if: type == program
  - id: program_body
    type: body
    src: card.text
    secondary_src: printing.flavor_text
    secondary_font: flavor
    secondary_color: "#3f474e"
    secondary_scale: 0.86
    x: 5.8
    "y": 54.9
    w: 50.8
    h: 22.4
    font: body
    size_pt: 8.25
    min_size_pt: 5.8
    line_height: 1.12
    secondary_line_height: 1.06
    color: "#151b21"
    symbols: true
    symbol_style: plain
    autoshrink: true
    show_if: type == program
  - id: program_memory_shadow
    type: rect
    x: 2.55
    "y": 14.05
    w: 5.55
    h: 4.45
    fill: "#111518"
    clip_path: polygon(0 0,84% 0,84% 10%,100% 10%,100% 90%,84% 90%,84% 100%,0 100%)
    shadow: 0 .35mm .55mm rgba(0,0,0,.5)
    show_if: type == program && attributes.memory_cost
  - id: program_memory_edge
    type: rect
    x: 2.82
    "y": 14.28
    w: 4.68
    h: 3.98
    fill: linear-gradient(145deg,#ffffff 0%,#d8dcdb 48%,#8f9695 100%)
    stroke: "#4f5659"
    stroke_w_mm: 0.2
    clip_path: polygon(0 0,88% 0,88% 12%,100% 12%,100% 88%,88% 88%,88% 100%,0 100%)
    show_if: type == program && attributes.memory_cost
  - id: program_memory_face
    type: rect
    x: 3.18
    "y": 14.56
    w: 3.18
    h: 3.38
    fill: linear-gradient(180deg,#ffffff,#e7eae9)
    stroke: "#788083"
    stroke_w_mm: 0.18
    show_if: type == program && attributes.memory_cost
  - id: program_memory_pin_1
    type: rect
    x: 6.58
    "y": 14.72
    w: 1.22
    h: 0.28
    fill: "#dce0df"
    stroke: "#535a5d"
    stroke_w_mm: 0.1
    show_if: type == program && attributes.memory_cost
  - id: program_memory_pin_2
    type: rect
    x: 6.58
    "y": 15.67
    w: 1.22
    h: 0.28
    fill: "#dce0df"
    stroke: "#535a5d"
    stroke_w_mm: 0.1
    show_if: type == program && attributes.memory_cost
  - id: program_memory_pin_3
    type: rect
    x: 6.58
    "y": 16.62
    w: 1.22
    h: 0.28
    fill: "#dce0df"
    stroke: "#535a5d"
    stroke_w_mm: 0.1
    show_if: type == program && attributes.memory_cost
  - id: program_memory_pin_4
    type: rect
    x: 6.58
    "y": 17.57
    w: 1.22
    h: 0.28
    fill: "#dce0df"
    stroke: "#535a5d"
    stroke_w_mm: 0.1
    show_if: type == program && attributes.memory_cost
  - id: program_memory
    type: text
    src: card.attributes.memory_cost
    x: 3.18
    "y": 14.56
    w: 3.18
    h: 3.3
    font: stat
    size_pt: 8
    align: center
    valign: middle
    color: "#11171d"
    show_if: type == program && attributes.memory_cost
  - id: program_strength_shadow
    type: badge
    text: ""
    x: -0.95
    "y": 78.05
    d: 14.65
    bg: "#101315"
    color: "#11171d"
    shadow: 0 .6mm 1.1mm rgba(0,0,0,.55)
    show_if: type == program && attributes.strength
  - id: program_strength_face
    type: badge
    text: ""
    x: -0.65
    "y": 78.32
    d: 14.1
    bg: radial-gradient(circle at 58% 38%,#ffffff 0%,#eef0ef 64%,#aeb4b2 100%)
    color: "#11171d"
    show_if: type == program && attributes.strength
  - id: program_strength_bar_1
    type: rect
    x: 0
    "y": 82.55
    w: 3.2
    h: 0.54
    fill: "#8e9493"
    show_if: type == program && attributes.strength
  - id: program_strength_bar_2
    type: rect
    x: 0
    "y": 84.15
    w: 4.4
    h: 0.54
    fill: "#8e9493"
    show_if: type == program && attributes.strength
  - id: program_strength_bar_3
    type: rect
    x: 0
    "y": 85.75
    w: 10.2
    h: 0.54
    fill: "#8e9493"
    show_if: type == program && attributes.strength
  - id: program_strength
    type: text
    src: card.attributes.strength
    x: 3
    "y": 79.55
    w: 7.6
    h: 6.5
    font: stat
    size_pt: 14.4
    align: center
    valign: middle
    color: "#11171d"
    show_if: type == program && attributes.strength
