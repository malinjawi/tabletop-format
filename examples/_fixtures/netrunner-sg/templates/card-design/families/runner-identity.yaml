name: Runner Identity template
description: Production layout specific to runner identity cards. Shared frame and typography live in reusable components.
regions:
  - id: identity_header_shadow
    type: rect
    x: 8
    "y": 2
    w: 54.8
    h: 10.2
    fill: "#070a0e"
    clip_path: polygon(0 0,94% 0,100% 50%,94% 100%,5% 100%,0 50%)
    shadow: 0 .8mm 1.4mm rgba(0,0,0,.5)
    show_if: type == identity && attributes.side == runner
  - id: identity_header
    type: rect
    x: 7
    "y": 1.35
    w: 55.9
    h: 10.2
    fill: linear-gradient(180deg,#ffffff,#e8ecea)
    stroke: palette-dark
    stroke_w_mm: 0.42
    clip_path: polygon(0 0,94% 0,100% 50%,94% 100%,5% 100%,0 50%)
    show_if: type == identity && attributes.side == runner
  - id: identity_title_runner
    type: richtext
    src: card.name
    transform: before-colon
    x: 16.5
    "y": 2.35
    w: 35.9
    h: 5
    font: title
    size_pt: 9
    min_size_pt: 5
    char_width_em: 0.62
    line_height: 1
    align: left
    valign: middle
    color: "#10171d"
    no_wrap: true
    autoshrink: true
    show_if: type == identity && attributes.side == runner
  - id: identity_subtitle_runner
    type: richtext
    src: card.name
    transform: after-colon
    x: 19.6
    "y": 7.1
    w: 32.8
    h: 3.3
    font: title
    size_pt: 5.5
    min_size_pt: 4.1
    char_width_em: 0.6
    line_height: 1
    align: left
    valign: middle
    color: "#303840"
    no_wrap: true
    autoshrink: true
    show_if: type == identity && attributes.side == runner
  - id: runner_link_ring
    type: badge
    text: ""
    x: 0.55
    "y": 0.75
    d: 11
    bg: palette
    color: "#ffffff"
    shadow: 0 .7mm 1.2mm rgba(0,0,0,.5)
    show_if: type == identity && attributes.side == runner
  - id: runner_link
    type: badge
    src: card.attributes.base_link
    x: 1.45
    "y": 1.65
    d: 9.2
    font: stat
    size_pt: 14.2
    bg: "#15191c"
    color: "#ffffff"
    show_if: type == identity && attributes.side == runner
  - id: runner_link_icon
    type: richtext
    text: "[link]"
    x: 7.15
    "y": 1.65
    w: 2.8
    h: 2.8
    symbols: true
    symbol_style: plain
    icon_only: true
    filter: "invert(1) drop-shadow(0 0 .25mm #15191c)"
    show_if: type == identity && attributes.side == runner
  - id: identity_faction_glyph_runner
    type: richtext
    src: card.attributes.faction
    map:
      anarch: "[faction_anarch]"
      criminal: "[faction_criminal]"
      shaper: "[faction_shaper]"
    x: 52.8
    "y": 1
    w: 9.8
    h: 9.8
    symbols: true
    symbol_style: plain
    icon_only: true
    show_if: type == identity && attributes.side == runner && attributes.faction != neutral-runner
  - id: identity_art_runner
    type: image
    src: printing.scan_data
    fallback_srcs:
      - printing.art_data
      - printing.art_url
      - printing.art
    x: 7.6
    "y": 12.5
    w: 47.8
    h: 44.7
    source_crop:
      - 110
      - 130
      - 524
      - 500
    source_size:
      - 744
      - 1030
    source_crop_fit: cover
    credit: printing.artist
    show_if: type == identity && attributes.side == runner
  - id: identity_art_edge_runner
    type: rect
    x: 1.5
    "y": 12.5
    w: 60
    h: 44.7
    fill: none
    stroke: palette-light
    stroke_w_mm: 0.65
    shadow: inset 0 0 2.2mm rgba(0,0,0,.45)
    show_if: type == identity && attributes.side == runner
  - id: runner_identity_stats_shadow
    type: rect
    x: 54.05
    "y": 72.15
    w: 8.95
    h: 14.75
    fill: "#07090b"
    clip_path: polygon(13% 0,100% 0,100% 100%,0 100%,0 9%)
    shadow: "-.25mm 0 .85mm rgba(0,0,0,.52)"
    show_if: type == identity && attributes.side == runner
  - id: runner_identity_stats_edge
    type: rect
    x: 54.45
    "y": 72.52
    w: 8.55
    h: 14.25
    fill: palette-gradient
    stroke: palette-light
    stroke_w_mm: 0.28
    clip_path: polygon(13% 0,100% 0,100% 100%,0 100%,0 9%)
    show_if: type == identity && attributes.side == runner
  - id: runner_identity_deck_face
    type: rect
    x: 55
    "y": 73.1
    w: 7.35
    h: 5.65
    fill: linear-gradient(145deg,#ffffff 0%,#e4e7e6 60%,#aab0af 100%)
    stroke: "#20262a"
    stroke_w_mm: 0.28
    clip_path: polygon(7% 0,93% 0,100% 11%,100% 89%,93% 100%,7% 100%,0 89%,0 11%)
    show_if: type == identity && attributes.side == runner
  - id: runner_identity_deck
    type: text
    src: card.attributes.minimum_deck_size
    x: 55
    "y": 73.22
    w: 7.35
    h: 5.35
    font: stat
    size_pt: 11.2
    align: center
    valign: middle
    color: "#11171d"
    show_if: type == identity && attributes.side == runner
  - id: runner_identity_stats_divider
    type: rect
    x: 55.15
    "y": 79.05
    w: 7.05
    h: 0.42
    fill: palette-light
    show_if: type == identity && attributes.side == runner
  - id: runner_identity_influence_face
    type: rect
    x: 55
    "y": 79.75
    w: 7.35
    h: 5.65
    fill: linear-gradient(180deg,#343a3d,#080b0d)
    stroke: "#c7ccca"
    stroke_w_mm: 0.28
    clip_path: polygon(7% 0,93% 0,100% 11%,100% 89%,93% 100%,7% 100%,0 89%,0 11%)
    show_if: type == identity && attributes.side == runner && attributes.influence_limit
  - id: runner_identity_influence
    type: text
    src: card.attributes.influence_limit
    x: 55
    "y": 79.87
    w: 7.35
    h: 5.35
    font: stat
    size_pt: 11.2
    align: center
    valign: middle
    color: "#ffffff"
    text_shadow: "0 .12mm .16mm #000"
    show_if: type == identity && attributes.side == runner && attributes.influence_limit
