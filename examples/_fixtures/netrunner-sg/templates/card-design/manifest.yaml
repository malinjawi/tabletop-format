version: 1
name: "Netrunner: System Gateway card design system"
description: Each card resolves to one family template plus shared components. Every source is independently reviewable in Git; releases pin the complete manifest at one commit.
system: templates/card-design/system.yaml
legacy_source: templates/layout.yaml
components:
  - id: foundation
    label: Shared foundation
    description: 10 ordered regions reused by every card family.
    source: templates/card-design/components/foundation.yaml
    applies_to: "*"
  - id: shared-1
    label: Shared by Hardware, Program, Resource
    description: 1 ordered region reused by hardware, program, resource.
    source: templates/card-design/components/shared-1.yaml
    applies_to:
      - hardware
      - program
      - resource
  - id: shared-2
    label: Shared by Asset, Operation, Upgrade
    description: 1 ordered region reused by asset, operation, upgrade.
    source: templates/card-design/components/shared-2.yaml
    applies_to:
      - asset
      - operation
      - upgrade
  - id: shared-3
    label: Shared by Agenda, Asset, Event, Hardware, Operation, Program, Resource, Upgrade
    description: 12 ordered regions reused by agenda, asset, event, hardware, operation, program, resource, upgrade.
    source: templates/card-design/components/shared-3.yaml
    applies_to:
      - agenda
      - asset
      - event
      - hardware
      - operation
      - program
      - resource
      - upgrade
  - id: shared-4
    label: Shared by Event, Hardware, Operation, Program, Resource
    description: 12 ordered regions reused by event, hardware, operation, program, resource.
    source: templates/card-design/components/shared-4.yaml
    applies_to:
      - event
      - hardware
      - operation
      - program
      - resource
  - id: shared-5
    label: Shared by Agenda, Asset, Event, Hardware, Operation, Resource, Upgrade
    description: 2 ordered regions reused by agenda, asset, event, hardware, operation, resource, upgrade.
    source: templates/card-design/components/shared-5.yaml
    applies_to:
      - agenda
      - asset
      - event
      - hardware
      - operation
      - resource
      - upgrade
  - id: shared-6
    label: Shared by Event, Hardware, Program, Resource
    description: 2 ordered regions reused by event, hardware, program, resource.
    source: templates/card-design/components/shared-6.yaml
    applies_to:
      - event
      - hardware
      - program
      - resource
  - id: shared-7
    label: Shared by Agenda, Asset, Operation, Upgrade
    description: 2 ordered regions reused by agenda, asset, operation, upgrade.
    source: templates/card-design/components/shared-7.yaml
    applies_to:
      - agenda
      - asset
      - operation
      - upgrade
  - id: shared-8
    label: Shared by Corp Identity, Runner Identity
    description: 11 ordered regions reused by corp-identity, runner-identity.
    source: templates/card-design/components/shared-8.yaml
    applies_to:
      - corp-identity
      - runner-identity
families:
  - id: agenda
    label: Agenda
    description: Production layout specific to agenda cards. Shared frame and typography live in reusable components.
    match:
      type: agenda
    source: templates/card-design/families/agenda.yaml
    specimens:
      - luminal_transubstantiation
      - longevity_serum
      - orbital_superiority
  - id: asset
    label: Asset
    description: Production layout specific to asset cards. Shared frame and typography live in reusable components.
    match:
      type: asset
    source: templates/card-design/families/asset.yaml
    specimens:
      - urtica_cipher
      - nico_campaign
      - clearinghouse
  - id: event
    label: Event
    description: Production layout specific to event cards. Shared frame and typography live in reusable components.
    match:
      type: event
    source: templates/card-design/families/event.yaml
    specimens:
      - mutual_favor
      - jailbreak
      - overclock
  - id: hardware
    label: Hardware
    description: Production layout specific to hardware cards. Shared frame and typography live in reusable components.
    match:
      type: hardware
    source: templates/card-design/families/hardware.yaml
    specimens:
      - pennyshaver
      - pantograph
      - carnivore
  - id: ice
    label: Ice
    description: Production layout specific to ice cards. Shared frame and typography live in reusable components.
    match:
      type: ice
    source: templates/card-design/families/ice.yaml
    specimens:
      - ansel_1_0
      - bran_1_0
      - pharos
  - id: corp-identity
    label: Corp Identity
    description: Production layout specific to corp identity cards. Shared frame and typography live in reusable components.
    match:
      type: identity
      attributes.side: corp
    source: templates/card-design/families/corp-identity.yaml
    specimens:
      - haas_bioroid_precision_design
      - jinteki_restoring_humanity
      - nbn_reality_plus
  - id: runner-identity
    label: Runner Identity
    description: Production layout specific to runner identity cards. Shared frame and typography live in reusable components.
    match:
      type: identity
      attributes.side: runner
    source: templates/card-design/families/runner-identity.yaml
    specimens:
      - zahya_sadeghi_versatile_smuggler
      - rene_loup_arcemont_party_animal
      - tao_salonga_telepresence_magician
  - id: operation
    label: Operation
    description: Production layout specific to operation cards. Shared frame and typography live in reusable components.
    match:
      type: operation
    source: templates/card-design/families/operation.yaml
    specimens:
      - public_trail
      - predictive_planogram
      - neurospike
  - id: program
    label: Program
    description: Production layout specific to program cards. Shared frame and typography live in reusable components.
    match:
      type: program
    source: templates/card-design/families/program.yaml
    specimens:
      - tranquilizer
      - botulus
      - conduit
  - id: resource
    label: Resource
    description: Production layout specific to resource cards. Shared frame and typography live in reusable components.
    match:
      type: resource
    source: templates/card-design/families/resource.yaml
    specimens:
      - red_team
      - telework_contract
      - smartware_distributor
  - id: upgrade
    label: Upgrade
    description: Production layout specific to upgrade cards. Shared frame and typography live in reusable components.
    match:
      type: upgrade
    source: templates/card-design/families/upgrade.yaml
    specimens:
      - amaze_amusements
      - malapert_data_vault
      - anoetic_void
