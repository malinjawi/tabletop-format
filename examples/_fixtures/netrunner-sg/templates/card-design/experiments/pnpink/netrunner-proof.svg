    <rect x="77.95" y="4.5" width="60.75" height="84.55" rx="1.9" fill="none" stroke="#c695c5" stroke-width="0.35"/>
    <path d="M76.825 5.05 h50.5 l-2.3 5.7 h-48.2z" fill="url(#paper)" stroke="#3d243d" stroke-width="0.35"/>
    <text id="agenda_name" x="79.6" y="8.9" font-family="Cinzel, serif" font-size="3.05" font-weight="600" fill="#111820">Agenda name</text>
    <rect x="78" y="12.6" width="60.7" height="39.1" rx="1" fill="#3a233b" stroke="#c695c5" stroke-width="0.28"/>
    <path d="M78 45 L138.7 18 M78 50 L138.7 23" stroke="#9f6b9e" stroke-width="0.25" opacity="0.48"/>
    <rect x="95.3" y="51.2" width="33.8" height="5.1" rx="0.8" fill="url(#paper)" stroke="#3d243d" stroke-width="0.3"/>
    <text id="agenda_subtypes" x="97" y="54.65" font-family="sans-serif" font-size="2.2" fill="#303a43">Agenda subtypes</text>
    <text id="agenda_keywords" x="97" y="57" font-family="sans-serif" font-size="0.1" opacity="0">keywords</text>
    <rect x="82.6" y="56.9" width="51.4" height="23.7" rx="1.1" fill="#f7f5ef" stroke="#3d243d" stroke-width="0.35"/>
    <text id="agenda_text" x="84.6" y="60.7" font-family="serif" font-size="2.45" fill="#151b21">Agenda rules text</text>
    <circle cx="134.1" cy="8.9" r="4.85" fill="url(#paper)" stroke="#676e70" stroke-width="0.45"/>
    <circle cx="134.1" cy="8.9" r="3.75" fill="none" stroke="#9ca3a3" stroke-width="0.35"/>
    <text id="agenda_advancement" x="134.1" y="10.35" text-anchor="middle" font-family="sans-serif" font-size="4.6" font-weight="700" fill="#11171d">0</text>
    <path d="M79.2 45.2 l3.6-3.4 3.6 3.4-3.6 3.4z M84.7 45.2 l3.6-3.4 3.6 3.4-3.6 3.4z M81.95 41.9 l3.6-3.4 3.6 3.4-3.6 3.4z" fill="#eef1ef" stroke="#6d7478" stroke-width="0.3"/>
    <text id="agenda_points" x="85.55" y="43.35" text-anchor="middle" font-family="sans-serif" font-size="4.5" font-weight="700" fill="#11171d">0</text>
    <text id="agenda_influence" x="129" y="86.7" font-family="sans-serif" font-size="0.1" opacity="0">0</text>
    <text id="agenda_faction" x="134.45" y="86.7" text-anchor="end" font-family="sans-serif" font-size="1.8" font-weight="700" fill="#f1dff0">haas-bioroid</text>
  </g>

  <!-- These nine compact templates are deliberately neutral PnPInk working
       sources. A designer can refine them in Inkscape without changing the
       active Forge renderer; every returned SVG is versioned and reviewed. -->
  <g id="asset_template" inkscape:groupmode="layer" inkscape:label="Asset template" transform="translate(150 3.175)">
    <rect id="bbox_asset" width="63" height="87.21" rx="2.5" fill="url(#corp_frame)" stroke="#10151b" stroke-width="0.5"/>
    <rect x="2" y="2" width="59" height="83.2" rx="1.8" fill="none" stroke="#e6b7dd" stroke-width="0.35"/>
    <rect x="2" y="3" width="59" height="7" rx="1.4" fill="url(#paper)"/><text id="asset_name" x="11" y="8" font-family="Cinzel,serif" font-size="3.4">Asset name</text>
    <circle cx="7" cy="7" r="4.4" fill="#111820" stroke="#e8edf0"/><text id="asset_cost" x="7" y="8.3" text-anchor="middle" fill="white" font-size="4" font-weight="700">0</text>
    <rect x="3.5" y="12" width="56" height="38" rx="1" fill="#293744"/><rect x="6" y="51" width="51" height="29" rx="1" fill="#f5eee9"/>
    <text id="asset_subtypes" x="8" y="55" font-size="2.2" font-family="sans-serif">Asset · subtype</text><text id="asset_text" x="8" y="60" font-size="2.35" font-family="serif">Rules text</text>
