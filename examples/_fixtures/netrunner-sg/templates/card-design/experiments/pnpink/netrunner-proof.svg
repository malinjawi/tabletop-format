<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="143mm" height="93.56mm" viewBox="0 0 143 93.56" version="1.1">
  <title>Forge Netrunner PnPInk adapter proof</title>
  <desc>Two editable representative templates. The active Forge renderer remains the production source of truth.</desc>
  <defs>
    <linearGradient id="program_frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141d"/><stop offset="1" stop-color="#238fc2"/>
    </linearGradient>
    <linearGradient id="agenda_frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0c1c"/><stop offset="1" stop-color="#804d7f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8eceb"/>
    </linearGradient>
  </defs>

  <g id="program_template" inkscape:groupmode="layer" inkscape:label="Program template">
    <text id="program_forge_id" x="3.175" y="3.175" font-size="0.1" opacity="0">forge-id</text>
    <rect id="bbox_program" x="3.175" y="3.175" width="63" height="87.21" rx="2.5"
          fill="url(#program_frame)" stroke="#0b1116" stroke-width="0.5"/>
    <rect x="4.3" y="4.5" width="60.75" height="84.55" rx="1.9" fill="none" stroke="#60b7dc" stroke-width="0.35"/>
    <rect x="3.175" y="6.3" width="62" height="5.4" rx="1.7" fill="url(#paper)" stroke="#12384a" stroke-width="0.35"/>
    <text id="program_name" x="21.1" y="10.15" font-family="Cinzel, serif" font-size="3.1" font-weight="600" fill="#111820">Program name</text>
    <rect x="5.3" y="13.2" width="58.7" height="37.1" rx="1" fill="#163a4c" stroke="#9fd5e8" stroke-width="0.28"/>
    <path d="M5.3 41 L64 20 M5.3 48 L64 27" stroke="#5aa9c8" stroke-width="0.25" opacity="0.48"/>
    <rect x="17.3" y="50.7" width="46.7" height="5.1" rx="0.8" fill="url(#paper)" stroke="#12384a" stroke-width="0.3"/>
    <text id="program_subtypes" x="23.1" y="54.1" font-family="sans-serif" font-size="2.2" fill="#303a43">Program subtypes</text>
    <rect x="9" y="56.4" width="51.4" height="24.2" rx="1.1" fill="#f7f5ef" stroke="#12384a" stroke-width="0.35"/>
    <text id="program_text" x="11" y="60.2" font-family="serif" font-size="2.45" fill="#151b21">Program rules text</text>
    <circle cx="8.15" cy="8.9" r="4.15" fill="#111518" stroke="#dfe5e4" stroke-width="0.55"/>
    <text id="program_cost" x="8.15" y="10.25" text-anchor="middle" font-family="sans-serif" font-size="4.25" font-weight="700" fill="#ffffff">0</text>
    <path d="M5.7 17.2 h4.7 v3.8 h-4.7 z m4.7 .55 h1.25 v.45 H10.4z m0 1.2 h1.25 v.45 H10.4z m0 1.2 h1.25 v.45 H10.4z" fill="#e5e9e8" stroke="#596165" stroke-width="0.15"/>
    <text id="program_memory" x="8.05" y="20.05" text-anchor="middle" font-family="sans-serif" font-size="2.8" font-weight="700" fill="#11171d">0</text>
    <circle cx="9" cy="84.3" r="5.7" fill="url(#paper)" stroke="#343b3e" stroke-width="0.5"/>
    <text id="program_strength" x="9" y="85.8" text-anchor="middle" font-family="sans-serif" font-size="4.5" font-weight="700" fill="#11171d">0</text>
    <text id="program_faction" x="60.8" y="86.7" text-anchor="end" font-family="sans-serif" font-size="1.8" font-weight="700" fill="#d8f1fb">criminal</text>
  </g>

  <g id="agenda_template" inkscape:groupmode="layer" inkscape:label="Agenda template">
    <text id="agenda_forge_id" x="76.825" y="3.175" font-size="0.1" opacity="0">forge-id</text>
    <rect id="bbox_agenda" x="76.825" y="3.175" width="63" height="87.21" rx="2.5"
          fill="url(#agenda_frame)" stroke="#0b1116" stroke-width="0.5"/>
    <rect x="77.95" y="4.5" width="60.75" height="84.55" rx="1.9" fill="none" stroke="#c695c5" stroke-width="0.35"/>
    <path d="M76.825 5.05 h50.5 l-2.3 5.7 h-48.2z" fill="url(#paper)" stroke="#3d243d" stroke-width="0.35"/>
    <text id="agenda_name" x="79.6" y="8.9" font-family="Cinzel, serif" font-size="3.05" font-weight="600" fill="#111820">Agenda name</text>
    <rect x="78" y="12.6" width="60.7" height="39.1" rx="1" fill="#3a233b" stroke="#c695c5" stroke-width="0.28"/>
    <path d="M78 45 L138.7 18 M78 50 L138.7 23" stroke="#9f6b9e" stroke-width="0.25" opacity="0.48"/>
    <rect x="95.3" y="51.2" width="33.8" height="5.1" rx="0.8" fill="url(#paper)" stroke="#3d243d" stroke-width="0.3"/>
    <text id="agenda_subtypes" x="97" y="54.65" font-family="sans-serif" font-size="2.2" fill="#303a43">Agenda subtypes</text>
    <rect x="82.6" y="56.9" width="51.4" height="23.7" rx="1.1" fill="#f7f5ef" stroke="#3d243d" stroke-width="0.35"/>
    <text id="agenda_text" x="84.6" y="60.7" font-family="serif" font-size="2.45" fill="#151b21">Agenda rules text</text>
    <circle cx="134.1" cy="8.9" r="4.85" fill="url(#paper)" stroke="#676e70" stroke-width="0.45"/>
    <circle cx="134.1" cy="8.9" r="3.75" fill="none" stroke="#9ca3a3" stroke-width="0.35"/>
    <text id="agenda_advancement" x="134.1" y="10.35" text-anchor="middle" font-family="sans-serif" font-size="4.6" font-weight="700" fill="#11171d">0</text>
    <path d="M79.2 45.2 l3.6-3.4 3.6 3.4-3.6 3.4z M84.7 45.2 l3.6-3.4 3.6 3.4-3.6 3.4z M81.95 41.9 l3.6-3.4 3.6 3.4-3.6 3.4z" fill="#eef1ef" stroke="#6d7478" stroke-width="0.3"/>
    <text id="agenda_points" x="85.55" y="43.35" text-anchor="middle" font-family="sans-serif" font-size="4.5" font-weight="700" fill="#11171d">0</text>
    <text id="agenda_faction" x="134.45" y="86.7" text-anchor="end" font-family="sans-serif" font-size="1.8" font-weight="700" fill="#f1dff0">haas-bioroid</text>
  </g>
</svg>
