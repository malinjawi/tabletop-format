          fill="url(#program_frame)" stroke="#0b1116" stroke-width="0.5"/>
    <rect x="4.3" y="4.5" width="60.75" height="84.55" rx="1.9" fill="none" stroke="#60b7dc" stroke-width="0.35"/>
    <rect x="3.175" y="6.3" width="62" height="5.4" rx="1.7" fill="url(#paper)" stroke="#12384a" stroke-width="0.35"/>
    <text id="program_name" x="21.1" y="10.15" font-family="Cinzel, serif" font-size="3.1" font-weight="600" fill="#111820">Program name</text>
    <rect x="5.3" y="13.2" width="58.7" height="37.1" rx="1" fill="#163a4c" stroke="#9fd5e8" stroke-width="0.28"/>
    <path d="M5.3 41 L64 20 M5.3 48 L64 27" stroke="#5aa9c8" stroke-width="0.25" opacity="0.48"/>
    <rect x="17.3" y="50.7" width="46.7" height="5.1" rx="0.8" fill="url(#paper)" stroke="#12384a" stroke-width="0.3"/>
    <text id="program_subtypes" x="23.1" y="54.1" font-family="sans-serif" font-size="2.2" fill="#303a43">Program subtypes</text>
    <text id="program_keywords" x="23.1" y="57" font-family="sans-serif" font-size="0.1" opacity="0">keywords</text>
    <rect x="9" y="56.4" width="51.4" height="24.2" rx="1.1" fill="#f7f5ef" stroke="#12384a" stroke-width="0.35"/>
    <text id="program_text" x="11" y="60.2" font-family="serif" font-size="2.45" fill="#151b21">Program rules text</text>
    <circle cx="8.15" cy="8.9" r="4.15" fill="#111518" stroke="#dfe5e4" stroke-width="0.55"/>
    <text id="program_cost" x="8.15" y="10.25" text-anchor="middle" font-family="sans-serif" font-size="4.25" font-weight="700" fill="#ffffff">0</text>
    <path d="M5.7 17.2 h4.7 v3.8 h-4.7 z m4.7 .55 h1.25 v.45 H10.4z m0 1.2 h1.25 v.45 H10.4z m0 1.2 h1.25 v.45 H10.4z" fill="#e5e9e8" stroke="#596165" stroke-width="0.15"/>
    <text id="program_memory" x="8.05" y="20.05" text-anchor="middle" font-family="sans-serif" font-size="2.8" font-weight="700" fill="#11171d">0</text>
    <circle cx="9" cy="84.3" r="5.7" fill="url(#paper)" stroke="#343b3e" stroke-width="0.5"/>
    <text id="program_strength" x="9" y="85.8" text-anchor="middle" font-family="sans-serif" font-size="4.5" font-weight="700" fill="#11171d">0</text>
    <text id="program_influence" x="55" y="86.7" font-family="sans-serif" font-size="0.1" opacity="0">0</text>
    <text id="program_faction" x="60.8" y="86.7" text-anchor="end" font-family="sans-serif" font-size="1.8" font-weight="700" fill="#d8f1fb">criminal</text>
  </g>

