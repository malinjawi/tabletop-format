<?xml version="1.0" encoding="UTF-8" standalone="no"?>
<svg xmlns="http://www.w3.org/2000/svg"
     xmlns:inkscape="http://www.inkscape.org/namespaces/inkscape"
     width="289mm" height="279.56mm" viewBox="0 0 289 279.56" version="1.1">
  <title>Forge Netrunner PnPInk working-copy templates</title>
  <desc>Eleven editable family templates. The active Forge renderer remains the production source of truth.</desc>
  <defs>
    <linearGradient id="program_frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07141d"/><stop offset="1" stop-color="#238fc2"/>
    </linearGradient>
    <linearGradient id="agenda_frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1a0c1c"/><stop offset="1" stop-color="#804d7f"/>
    </linearGradient>
    <linearGradient id="paper" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#e8eceb"/>
    </linearGradient>
    <linearGradient id="corp_frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#7c3b74"/>
    </linearGradient>
    <linearGradient id="runner_frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10212a"/><stop offset="1" stop-color="#db5b2f"/>
    </linearGradient>
    <linearGradient id="neutral_frame" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1b2329"/><stop offset="1" stop-color="#62717a"/>
    </linearGradient>
  </defs>

  <g id="program_template" inkscape:groupmode="layer" inkscape:label="Program template">
