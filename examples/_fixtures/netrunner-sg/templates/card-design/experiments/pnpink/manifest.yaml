version: 1
kind: pnpink
description: A version-pinned PnPInk/Inkscape working copy for all production card families. Forge commits remain canonical; family CSV and .pnp files are derived from an exact committed baseline.
upstream:
  repository: https://github.com/xoellijo/pnpink
  license: MIT
  tested_tag: v0.57
template: templates/card-design/experiments/pnpink/netrunner-proof.svg
families:
  - id: agenda
    specimen: luminal_transubstantiation
    bbox: bbox_agenda
    fields:
      id: agenda_forge_id
      name: agenda_name
      subtypes: agenda_subtypes
      keywords: agenda_keywords
      text: agenda_text
      attributes.advancement_cost: agenda_advancement
      attributes.agenda_points: agenda_points
      attributes.influence: agenda_influence
      attributes.faction: agenda_faction
  - id: asset
    specimen: urtica_cipher
    bbox: bbox_asset
    fields:
      id: asset_forge_id
      name: asset_name
      subtypes: asset_subtypes
      keywords: asset_keywords
      text: asset_text
      attributes.cost: asset_cost
      attributes.trash_cost: asset_trash
      attributes.influence: asset_influence
      attributes.faction: asset_faction
  - id: event
