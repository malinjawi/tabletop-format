# Private source-backed proofing for the official System Gateway PnP faces.
#
# The scan is an immutable composed source face. Forge may only repaint fields
# declared in `regions`. Each baseline signature covers every other semantic
# field; if one of those fields changes, Forge refuses the source-backed path
# and falls back to the distinct community frame instead of printing stale data.
# This file does not grant permission to redistribute altered NSG faces.

schema_version: 5
enabled: false
private_only: true
notice: "Private playtest proxy using an altered NSG source face. Do not publish or redistribute without permission."
baseline_data: templates/source-baseline-data.json
source_ref: dea1633a4145435b0ca38c628dac0c88716bb6ea
nonvisual_card_fields: [deck_limit, keywords]
frame_defining_card_fields: [type, attributes.side, attributes.faction, attributes.unique, attributes.memory_limit]

# Derived from the 300 dpi crop axes in NSG's official PnP PDF: 744 x 1030 px.
card: { w_mm: 63.0, h_mm: 87.21, radius_mm: 2.5 }

regions:
  # Every mapping is explicitly scoped to one inspected target card. We add
  # another card only after its source geometry passes native-pixel and PDF QA.
