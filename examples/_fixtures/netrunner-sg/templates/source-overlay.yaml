  # Unlike the finite numeric patches above, this is a live semantic text
  # layer. It covers only Offworld's inspected rules line, uses a bundled open
  # font substitute, and resolves [credit] through game.yaml's official NSG
  # symbol asset. Strings fit via deterministic autoshrink down to an explicit
  # readability floor; longer text and edits to any other unmapped field still
  # trigger the honest community-frame fallback.
  - id: offworld_rules_text
    src: text
    match: { id: offworld_office, type: agenda }
    x_pct: 11.290
