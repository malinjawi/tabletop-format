baselines:
  "rene_loup_arcemont_party_animal": { signature: "fnv1a:09e957ac", printing_signature: "fnv1a:c6529b46", values: {"name": "René \"Loup\" Arcemont: Party Animal", "subtypes": ["G-mod"], "attributes.base_link": 0, "attributes.minimum_deck_size": 40, "attributes.influence_limit": 15, "text": "The first time each turn you trash a card you are accessing, gain 1[credit] and draw 1 card.", "printing.flavor_text": "Run wyld."} }
  "wildcat_strike": { signature: "fnv1a:4e13abce", printing_signature: "fnv1a:c1c57235", values: {"name": "Wildcat Strike", "subtypes": null, "text": "Resolve 1 of the following of the Corp's choice:\n- Gain 6[credit].\n- Draw 4 cards.", "printing.flavor_text": "They can buy off union leadership, but they can't stop us walking out!", "attributes.cost": 2, "attributes.influence": 1} }
  "carnivore": { signature: "fnv1a:13406eb5", printing_signature: "fnv1a:238a2f12", values: {"name": "Carnivore", "subtypes": ["Console"], "text": "+1[mu]\nAccess → **Trash 2 cards from your grip:** Trash the card you are accessing. Use this ability only once per turn.\nLimit 1 **console** per player.", "printing.flavor_text": "\"It hungers to sink teeth into problems.\"\n—Loup", "attributes.cost": 4, "attributes.influence": 3} }
  "botulus": { signature: "fnv1a:016f159f", printing_signature: "fnv1a:139725c1", values: {"name": "Botulus", "subtypes": ["Virus", "Trojan"], "text": "Install only on a piece of ice.\nWhen you install this program and when your turn begins, place 1 virus counter on this program.\n**Hosted virus counter:** Break 1 subroutine on host ice.", "printing.flavor_text": "Was it something you ate?", "attributes.cost": 2, "attributes.memory_cost": 1, "attributes.strength": null, "attributes.influence": 3} }
  "buzzsaw": { signature: "fnv1a:3d9f6e89", printing_signature: "fnv1a:6ec6b730", values: {"name": "Buzzsaw", "subtypes": ["Icebreaker", "Decoder"], "text": "Interface → **1[credit]:** Break up to 2 **code gate** subroutines.\n**3[credit]:** +1 strength.", "printing.flavor_text": "Destruction is an art.", "attributes.cost": 4, "attributes.memory_cost": 1, "attributes.strength": 3, "attributes.influence": 1} }
  "cleaver": { signature: "fnv1a:356b4035", printing_signature: "fnv1a:ffdd7563", values: {"name": "Cleaver", "subtypes": ["Icebreaker", "Fracter"], "text": "Interface → **1[credit]:** Break up to 2 **barrier** subroutines.\n**2[credit]:** +1 strength.", "printing.flavor_text": "Subtlety is a luxury.", "attributes.cost": 3, "attributes.memory_cost": 1, "attributes.strength": 3, "attributes.influence": 2} }
  "fermenter": { signature: "fnv1a:6f227af1", printing_signature: "fnv1a:9eb975aa", values: {"name": "Fermenter", "subtypes": ["Virus"], "text": "When you install this program and when your turn begins, place 1 virus counter on this program.\n[click], [trash]**:** Gain 2[credit] for each hosted virus counter.", "printing.flavor_text": "\"There's a tension to a cook. Each processing cycle sweetens the pot and raises the heat. I stir all night, but few have my appetite for danger.\"\n—René \"Loup\" Arcemont", "attributes.cost": 1, "attributes.memory_cost": 1, "attributes.strength": null, "attributes.influence": 2} }
  "leech": { signature: "fnv1a:cef7a450", printing_signature: "fnv1a:b2f75b25", values: {"name": "Leech", "subtypes": ["Virus"], "text": "Whenever you make a successful run on a central server, place 1 virus counter on this program.\n**Hosted virus counter:** The ice you are encountering gets -1 strength for the remainder of this encounter.", "printing.flavor_text": "The greediest bloodsucker this side of a corporate boardroom.", "attributes.cost": 1, "attributes.memory_cost": 1, "attributes.strength": null, "attributes.influence": 1} }
  "cookbook": { signature: "fnv1a:28c032ff", printing_signature: "fnv1a:664b0ab4", values: {"name": "Cookbook", "subtypes": ["Virtual"], "text": "Whenever you install a **virus** program, you may place 1 virus counter on it.", "printing.flavor_text": "\"It waits on an unlabelled memstrip far below the deepest hab. Angry, desperate souls seek it out, hungry for power to change a brutal world. Once they can stomach no more bitter revenge, they return to that nameless tunnel, the book a recipe thicker.\"\n—Heinlein urban legend", "attributes.cost": 1, "attributes.influence": 3} }
  "zahya_sadeghi_versatile_smuggler": { signature: "fnv1a:9beabe73", printing_signature: "fnv1a:20ce5cfc", values: {"name": "Zahya Sadeghi: Versatile Smuggler", "subtypes": ["Cyborg"], "attributes.base_link": 0, "attributes.minimum_deck_size": 40, "attributes.influence_limit": 15, "text": "Whenever a run on HQ or R&D ends, you may gain 1[credit] for each time you accessed a card during that run. Use this ability only once per turn.", "printing.flavor_text": "I obtain your desire."} }
  "mutual_favor": { signature: "fnv1a:777d08dc", printing_signature: "fnv1a:62884cc5", values: {"name": "Mutual Favor", "subtypes": null, "text": "Search your stack for 1 **icebreaker** program and reveal it. *(Shuffle your stack after searching it.)* If you made a successful run this turn, you may install it. If you do not, add it to your grip.", "printing.flavor_text": "The real reward is the friends you make along the way.", "attributes.cost": 0, "attributes.influence": 3} }
  "tread_lightly": { signature: "fnv1a:1e808ef9", printing_signature: "fnv1a:476e736d", values: {"name": "Tread Lightly", "subtypes": ["Run"], "text": "Run any server. During that run, the rez cost of each piece of ice is increased by 3[credit].", "printing.flavor_text": "\"A mirrorfiber mod or high-end mantle can be helpful, but nothing beats a good dose of 'keeping your damn head down.'\"\n—\"G0ph3r\" O'Ryan", "attributes.cost": 1, "attributes.influence": 1} }
  "docklands_pass": { signature: "fnv1a:795b2c9d", printing_signature: "fnv1a:82e32467", values: {"name": "Docklands Pass", "subtypes": null, "text": "The first time each turn you breach HQ, access 1 additional card.", "printing.flavor_text": "Zahya knows the keeper of every door between the Docklands and the Domes. More importantly, she knows their price.", "attributes.cost": 2, "attributes.influence": 2} }
  "pennyshaver": { signature: "fnv1a:553027cf", printing_signature: "fnv1a:b4a40362", values: {"name": "Pennyshaver", "subtypes": ["Console"], "text": "+1[mu]\nWhenever you make a successful run, place 1[credit] on this hardware.\n[click]**:** Place 1[credit] on this hardware, then take all credits from it.\nLimit 1 **console** per player.", "printing.flavor_text": "\"Braggarts chase big heists. Patience enriches skimming fractions of a credit at a time.\" —Zahya", "attributes.cost": 3, "attributes.influence": 3} }
  "carmen": { signature: "fnv1a:0ed0575b", printing_signature: "fnv1a:4ff02aca", values: {"attributes.memory_cost": 1, "attributes.strength": 2, "name": "Carmen", "subtypes": ["Icebreaker", "Killer"], "text": "If you made a successful run this turn, this program costs 2[credit] less to install.\nInterface → **1[credit]:** Break 1 **sentry** subroutine.\n**2[credit]:** +3 strength.", "printing.flavor_text": "The whole wide world your domain\nFor law your own free will.", "attributes.cost": 5, "attributes.influence": 2} }
  "marjanah": { signature: "fnv1a:94ea1cc1", printing_signature: "fnv1a:6a936161", values: {"name": "Marjanah", "subtypes": ["Icebreaker", "Fracter"], "text": "Interface → **2[credit]:** Break 1 **barrier** subroutine. If you made a successful run this turn, this ability costs 1[credit] less to use.\n**1[credit]:** +1 strength.", "printing.flavor_text": "\"You can't rule a kingdom by standing still.\"\n—Zahya Sadeghi", "attributes.cost": 0, "attributes.memory_cost": 1, "attributes.strength": 1, "attributes.influence": 1} }
  "tranquilizer": { signature: "fnv1a:c03449bf", printing_signature: "fnv1a:437daf50", values: {"name": "Tranquilizer", "subtypes": ["Virus", "Trojan"], "text": "Install only on a piece of ice.\nWhen you install this program and when your turn begins, place 1 virus counter on this program. Then, if there are 3 or more hosted virus counters, derez host ice.", "printing.flavor_text": "Shhhh. It's naptime.", "attributes.cost": 2, "attributes.memory_cost": 1, "attributes.strength": null, "attributes.influence": 3} }
  "red_team": { signature: "fnv1a:e0537164", printing_signature: "fnv1a:a514d5dc", values: {"name": "Red Team", "subtypes": ["Job"], "text": "When you install this resource, load 12[credit] onto it. When it is empty, trash it.\n[click]**:** Run a central server you have not run this turn. If successful, take 3[credit] from this resource.", "printing.flavor_text": "The Domes of Heinlein are a pressure cooker of cutthroat capitalism. Prospective employers rarely have time for background checks.", "attributes.cost": 5, "attributes.influence": 2} }
  "tao_salonga_telepresence_magician": { signature: "fnv1a:6c4ae6b9", printing_signature: "fnv1a:43ed6ee5", values: {"name": "Tāo Salonga: Telepresence Magician", "subtypes": ["Natural"], "attributes.base_link": 0, "attributes.minimum_deck_size": 40, "attributes.influence_limit": 15, "text": "Whenever an agenda is scored or stolen, you may swap 2 installed pieces of ice.", "printing.flavor_text": "Sufficient skill is indistinguishable from magic."} }
  "creative_commission": { signature: "fnv1a:b8d97be0", printing_signature: "fnv1a:e7c393b9", values: {"name": "Creative Commission", "subtypes": null, "text": "Gain 5[credit]. If you have any [click] remaining, lose [click].", "printing.flavor_text": "The challenge of my art is what I live for, but I'm not going to say no to a patron with taste.", "attributes.cost": 1, "attributes.influence": 2} }
  "vrcation": { signature: "fnv1a:ea76c0c3", printing_signature: "fnv1a:a0f0eec8", values: {"name": "VRcation", "subtypes": null, "text": "Draw 4 cards. If you have any [click] remaining, lose [click].", "printing.flavor_text": "\"You know there's no water in the Sea of Tranquility, right?\"\n\"That doesn't mean there's no beach.\"", "attributes.cost": 1, "attributes.influence": 2} }
  "dzmz_optimizer": { signature: "fnv1a:208559c4", printing_signature: "fnv1a:d7ffb753", values: {"name": "DZMZ Optimizer", "subtypes": null, "text": "+1[mu]\nThe first program you install each turn costs 1[credit] less to install.", "printing.flavor_text": "Tāo exhaled, the med-exoskeleton faithfully stabilizing him. In that absent breath, he reached through layers of waldos and optimizers and plucked the errant molecule from the chip.", "attributes.cost": 2, "attributes.influence": 2} }
  "pantograph": { signature: "fnv1a:5a68fba6", printing_signature: "fnv1a:a443695c", values: {"name": "Pantograph", "subtypes": ["Console"], "text": "+1[mu]\nWhenever an agenda is scored or stolen, gain 1[credit]. Then, you may install 1 card from your grip.\nLimit 1 **console** per player.", "printing.flavor_text": "\"With this beautiful baby I can juggle simultaneous runs by haptic feedback alone!\"\n—Tāo", "attributes.cost": 2, "attributes.influence": 3} }
  "conduit": { signature: "fnv1a:a1c85d73", printing_signature: "fnv1a:1aedfc80", values: {"name": "Conduit", "subtypes": ["Virus"], "text": "Whenever a successful run on R&D ends, you may place 1 virus counter on this program.\n[click]**:** Run R&D. If successful, access X additional cards when you breach R&D. X is equal to the number of hosted virus counters.", "printing.flavor_text": "A dabbling with truth is a pernicious dream\nDrink deep, or taste not the raw datastream.", "attributes.cost": 4, "attributes.memory_cost": 1, "attributes.strength": null, "attributes.influence": 4} }
  "echelon": { signature: "fnv1a:3605546d", printing_signature: "fnv1a:b79a2891", values: {"name": "Echelon", "subtypes": ["Icebreaker", "Killer"], "text": "This program gets +1 strength for each installed **icebreaker** *(including this one)*.\nInterface → **1[credit]:** Break 1 **sentry** subroutine.\n**3[credit]:** +2 strength.", "printing.flavor_text": "The beauty of open projects—each stands atop past success.", "attributes.cost": 3, "attributes.memory_cost": 1, "attributes.strength": 0, "attributes.influence": 1} }
  "unity": { signature: "fnv1a:ca085f5a", printing_signature: "fnv1a:87f3f27a", values: {"name": "Unity", "subtypes": ["Icebreaker", "Decoder"], "text": "Interface → **1[credit]:** Break 1 **code gate** subroutine.\n**1[credit]:** +1 strength for each installed **icebreaker** *(including this one)*.", "printing.flavor_text": "The joy of handcrafted code—each fits perfectly within the whole.", "attributes.cost": 3, "attributes.memory_cost": 1, "attributes.strength": 1, "attributes.influence": 2} }
  "telework_contract": { signature: "fnv1a:f316a795", printing_signature: "fnv1a:7457928e", values: {"name": "Telework Contract", "subtypes": ["Job"], "text": "When you install this resource, load 9[credit] onto it. When it is empty, trash it.\n[click]**:** Take 3[credit] from this resource. Use this ability only once per turn.", "printing.flavor_text": "\"For all I know, I could spend a shift digging next to old Weyland himself.\"\n—Lane", "attributes.cost": 1, "attributes.influence": 2} }
  "jailbreak": { signature: "fnv1a:c7647d89", printing_signature: "fnv1a:9c494849", values: {"name": "Jailbreak", "subtypes": ["Run"], "text": "Run HQ or R&D. If successful, draw 1 card and when you breach the attacked server, access 1 additional card.", "printing.flavor_text": "\"We'll take the access codes from their own prisec—privilege escalation through local application of force.\"\n—The Catalyst", "attributes.cost": 0, "attributes.influence": 0} }
  "overclock": { signature: "fnv1a:971f3e28", printing_signature: "fnv1a:edf1c3a2", values: {"name": "Overclock", "subtypes": ["Run"], "text": "Place 5[credit] on this event, then run any server. You can spend hosted credits during that run.", "printing.flavor_text": "\"After 381FS4 started acting independently, all bets were off. Rethreading its own brain chip... even probing **our** nodes. I had to shut it down.\"\n—Linus Lovegood, NBN Novelties&Acquisitions", "attributes.cost": 1, "attributes.influence": 0} }
  "sure_gamble": { signature: "fnv1a:d4d0472a", printing_signature: "fnv1a:0e391465", values: {"attributes.cost": 5, "name": "Sure Gamble", "subtypes": null, "text": "Gain 9[credit].", "printing.flavor_text": "Anyone can put in the hours of planning, practice, and preparation—but making it all look like luck takes **style**.", "attributes.influence": 0} }
  "t400_memory_diamond": { signature: "fnv1a:4db63223", printing_signature: "fnv1a:4a855ac0", values: {"name": "T400 Memory Diamond", "subtypes": ["Chip"], "text": "+1[mu]\nYou get +1 maximum hand size.", "printing.flavor_text": "LLDS still holds the patent, but good tech attracts knockoffs.", "attributes.cost": 2, "attributes.influence": 0} }
  "mayfly": { signature: "fnv1a:33417da4", printing_signature: "fnv1a:7ab2bc5a", values: {"name": "Mayfly", "subtypes": ["Icebreaker", "AI"], "text": "Interface → **1[credit]:** Break 1 subroutine. When this run ends, trash this program.\n**1[credit]:** +1 strength.", "printing.flavor_text": "Compiling even the smallest AI takes weeks for only seconds of runtime, but that brief, shining moment allows... **everything**.", "attributes.cost": 1, "attributes.memory_cost": 2, "attributes.strength": 1, "attributes.influence": 0} }
  "smartware_distributor": { signature: "fnv1a:87d7d140", printing_signature: "fnv1a:31473915", values: {"name": "Smartware Distributor", "subtypes": ["Connection"], "text": "[click]**:** Place 3[credit] on this resource.\nWhen your turn begins, take 1[credit] from this resource.", "printing.flavor_text": "The beauty of 22nd-century tech: if it still functions after all these decades, you know the build quality is solid.", "attributes.cost": 0, "attributes.influence": 0} }
  "verbal_plasticity": { signature: "fnv1a:727ca4e2", printing_signature: "fnv1a:b0c67daa", values: {"name": "Verbal Plasticity", "subtypes": ["Genetics"], "text": "The first time each turn you take the basic action to draw 1 card, instead draw 2 cards.", "printing.flavor_text": "\"Some kids got g-mods for beauty, sports, or staying up all night. My parents thought Broca-mods were cool. Hah. Fluent in ten languages so far, and still searching for the words to thank them.\"\n—Patrick Blue, Solar Artist", "attributes.cost": 3, "attributes.influence": 0} }
  "haas_bioroid_precision_design": { signature: "fnv1a:4d878002", printing_signature: "fnv1a:16799c11", values: {"name": "Haas-Bioroid: Precision Design", "subtypes": ["Megacorp"], "attributes.minimum_deck_size": 40, "attributes.influence_limit": 15, "text": "You get +1 maximum hand size.\nWhenever you score an agenda, you may add 1 card from Archives to HQ.", "printing.flavor_text": "Not an Atom Misplaced."} }
  "luminal_transubstantiation": { signature: "fnv1a:48615d1e", printing_signature: "fnv1a:1acefcbb", values: {"name": "Luminal Transubstantiation", "subtypes": ["Research"], "text": "When you score this agenda, gain [click][click][click]. You cannot score agendas for the remainder of the turn.\nLimit 1 per deck.", "printing.flavor_text": "We are the light of tomorrow.", "attributes.advancement_cost": 3, "attributes.agenda_points": 2} }
  "nico_campaign": { signature: "fnv1a:114cf7ee", printing_signature: "fnv1a:25a42dc1", values: {"name": "Nico Campaign", "subtypes": ["Advertisement"], "text": "When you rez this asset, load 9[credit] onto it. When it is empty, trash it and draw 1 card.\nWhen your turn begins, take 3[credit] from this asset.", "printing.flavor_text": "Haas thinks they're making a new line of androgynous products. In truth, they're making us thousands of new siblings to free.", "attributes.cost": 2, "attributes.trash_cost": 2, "attributes.influence": 2} }
  "ansel_1_0": { signature: "fnv1a:c91ca279", printing_signature: "fnv1a:3fe2c08f", values: {"name": "Ansel 1.0", "subtypes": ["Sentry", "Bioroid", "Destroyer"], "text": "**Lose [click]:** Break 1 subroutine on this ice. Only the Runner can use this ability.\n[subroutine] Trash 1 installed Runner card.\n[subroutine] You may install 1 card from HQ or Archives.\n[subroutine] The Runner cannot steal or trash Corp cards for the remainder of this run.", "printing.flavor_text": "**Designed by 2018 European Champion Patrick Gower**", "attributes.cost": 6, "attributes.strength": 4, "attributes.influence": 3} }
  "bran_1_0": { signature: "fnv1a:0822def1", printing_signature: "fnv1a:3d7838b6", values: {"name": "Brân 1.0", "subtypes": ["Barrier", "Bioroid"], "text": "**Lose [click]:** Break 1 subroutine on this ice. Only the Runner can use this ability.\n[subroutine] You may install 1 piece of ice from HQ or Archives directly inward from this ice, ignoring all costs.\n[subroutine] End the run.\n[subroutine] End the run.", "printing.flavor_text": "A giant wakes...", "attributes.cost": 6, "attributes.strength": 6, "attributes.influence": 2} }
  "seamless_launch": { signature: "fnv1a:fda1b7a4", printing_signature: "fnv1a:3608f263", values: {"name": "Seamless Launch", "subtypes": null, "text": "Place 2 advancement counters on 1 installed card that you did not install this turn.", "printing.flavor_text": "The first lesson for handling bioroids is simple: they must not be allowed to feel.", "attributes.cost": 1, "attributes.influence": 2} }
  "sprint": { signature: "fnv1a:a6ef70af", printing_signature: "fnv1a:13223f6b", values: {"name": "Sprint", "subtypes": null, "text": "Draw 3 cards. Shuffle 2 cards from HQ into R&D.", "printing.flavor_text": "All time is crunch time.", "attributes.cost": 0, "attributes.influence": 1} }
  "manegarm_skunkworks": { signature: "fnv1a:45d08da2", printing_signature: "fnv1a:49c2a2c1", values: {"name": "Manegarm Skunkworks", "subtypes": null, "text": "Whenever the Runner approaches this server, end the run unless they either spend [click][click] or pay 5[credit].", "printing.flavor_text": "\"Whose memory-tape needs such stringent security?\"\n—The Catalyst", "attributes.cost": 2, "attributes.trash_cost": 3, "attributes.influence": 3} }
  "jinteki_restoring_humanity": { signature: "fnv1a:f0ffb270", printing_signature: "fnv1a:7078dfce", values: {"name": "Jinteki: Restoring Humanity", "subtypes": ["Megacorp"], "attributes.minimum_deck_size": 40, "attributes.influence_limit": 15, "text": "When your discard phase ends, if there is a facedown card in Archives, gain 1[credit].", "printing.flavor_text": "An End to Suffering."} }
  "longevity_serum": { signature: "fnv1a:5e715452", printing_signature: "fnv1a:2c1ff935", values: {"name": "Longevity Serum", "subtypes": ["Research"], "text": "When you score this agenda, trash any number of cards from HQ. Shuffle up to 3 cards from Archives into R&D.\nLimit 1 per deck.", "printing.flavor_text": "We make you anew.", "attributes.advancement_cost": 3, "attributes.agenda_points": 2} }
  "urtica_cipher": { signature: "fnv1a:f02f6386", printing_signature: "fnv1a:e25ed916", values: {"name": "Urtica Cipher", "subtypes": ["Ambush"], "text": "You can advance this asset.\nWhen the Runner accesses this asset while it is installed, do 2 net damage plus 1 net damage for each hosted advancement counter.", "printing.flavor_text": "A novel spin-off of Chronos tech was admixing sensitive data with ethically-sourced brain images of injured staff. Few intruders can handle a thousand years of skin burns in one moment.", "attributes.cost": 0, "attributes.trash_cost": 2, "attributes.influence": 2} }
  "diviner": { signature: "fnv1a:c63e319a", printing_signature: "fnv1a:e05b4da0", values: {"name": "Diviner", "subtypes": ["Code Gate", "AP"], "text": "[subroutine] Do 1 net damage. If you trash a card with a printed play or install cost that is an odd number, end the run. *(0 is not odd.)*", "printing.flavor_text": "It reads your future in a single biometric sweep.", "attributes.cost": 2, "attributes.strength": 3, "attributes.influence": 2} }
  "karuna": { signature: "fnv1a:b9764235", printing_signature: "fnv1a:fab8c5b1", values: {"name": "Karunā", "subtypes": ["Sentry", "AP"], "text": "[subroutine] Do 2 net damage. The Runner may jack out.\n[subroutine] Do 2 net damage.", "printing.flavor_text": "You did not escape, you were shown mercy.", "attributes.cost": 4, "attributes.strength": 3, "attributes.influence": 2} }
  "hansei_review": { signature: "fnv1a:9e3383b0", printing_signature: "fnv1a:2c7c7f1b", values: {"name": "Hansei Review", "subtypes": ["Transaction"], "text": "Gain 10[credit]. If there are any cards in HQ, trash 1 of them.", "printing.flavor_text": "\"Constant self-reflection is the key to excellence. We remember failed ideas, but do not carry them forward.\"\n—Director Kase, unknown leadership seminar", "attributes.cost": 5, "attributes.influence": 1} }
  "neurospike": { signature: "fnv1a:dc0a0fae", printing_signature: "fnv1a:7db49d77", values: {"name": "Neurospike", "subtypes": ["Gray Ops"], "text": "Do X net damage, where X is equal to the sum of the printed agenda points on agendas you scored this turn.", "printing.flavor_text": "Macroscale developments within the Net decouple the prior informational states—surplus entropy is then gifted where it will do the most good.", "attributes.cost": 3, "attributes.influence": 3} }
  "anoetic_void": { signature: "fnv1a:1ce847e3", printing_signature: "fnv1a:eea1c3a1", values: {"name": "Anoetic Void", "subtypes": null, "text": "Whenever the Runner approaches this server, you may pay 2[credit] and trash 2 cards from HQ. If you do, end the run.", "printing.flavor_text": "The self-evolving Net twists into spaces unthought and unthinkable: realms of gods and other infohazards, mocking our sacrifices to petty causality.\n—Conceptual Frameworks for Applied Theology", "attributes.cost": 0, "attributes.trash_cost": 1, "attributes.influence": 4} }
  "nbn_reality_plus": { signature: "fnv1a:b75ccafc", printing_signature: "fnv1a:dd3e6413", values: {"name": "NBN: Reality Plus", "subtypes": ["Megacorp"], "attributes.minimum_deck_size": 40, "attributes.influence_limit": 15, "text": "The first time each turn the Runner takes a tag, gain 2[credit] or draw 2 cards.", "printing.flavor_text": "Why Settle for Real?"} }
  "tomorrows_headline": { signature: "fnv1a:f5c439e5", printing_signature: "fnv1a:c9399a91", values: {"name": "Tomorrow's Headline", "subtypes": ["Ambush"], "text": "When this agenda is scored or stolen, give the Runner 1 tag.\nLimit 1 per deck.", "printing.flavor_text": "We don't find news. We make it.", "attributes.advancement_cost": 3, "attributes.agenda_points": 2} }
  "spin_doctor": { signature: "fnv1a:3e2eb1f9", printing_signature: "fnv1a:3983b4b3", values: {"attributes.trash_cost": 2, "name": "Spin Doctor", "subtypes": ["Character"], "text": "When you rez this asset, draw 2 cards.\n**Remove this asset from the game:** Shuffle up to 2 cards from Archives into R&D.", "printing.flavor_text": "\"It's worse than dead meat—your project is too toxic to even feed to the vultures! If you don't want to **join** it in the bloody memory hole, crawl onto every business show you can and wallow in blame like a pig in muck.\"", "attributes.cost": 0, "attributes.influence": 1} }
  "funhouse": { signature: "fnv1a:3467d3dc", printing_signature: "fnv1a:78f2706f", values: {"name": "Funhouse", "subtypes": ["Code Gate"], "text": "When the Runner encounters this ice, end the run unless the Runner takes 1 tag.\n[subroutine] Give the Runner 1 tag unless they pay 4[credit].", "printing.flavor_text": "\"I might take a break from VR after this one.\"\n—SeaOfRibaldry, sensie streamer", "attributes.cost": 5, "attributes.strength": 4, "attributes.influence": 2} }
  "ping": { signature: "fnv1a:9d555965", printing_signature: "fnv1a:840c8e16", values: {"name": "Ping", "subtypes": ["Barrier"], "text": "When you rez this ice during a run against this server, give the Runner 1 tag.\n[subroutine] End the run.", "printing.flavor_text": "AvID:??:73.174 time=0.632 ms\nAvID:??:73.174 time=0.201 ms\nAvID:??:73.174 time=0.000 ms **ALERT**", "attributes.cost": 2, "attributes.strength": 1, "attributes.influence": 2} }
  "predictive_planogram": { signature: "fnv1a:3b0d6414", printing_signature: "fnv1a:c4d2d4cd", values: {"name": "Predictive Planogram", "subtypes": ["Transaction"], "text": "Resolve 1 of the following. If the Runner is tagged, you may resolve both instead.\n- Gain 3[credit].\n- Draw 3 cards.", "printing.flavor_text": "For the best augmented reality shopping experience, please disable tracking protection.", "attributes.cost": 0, "attributes.influence": 1} }
  "public_trail": { signature: "fnv1a:455812a5", printing_signature: "fnv1a:5bcab13c", values: {"name": "Public Trail", "subtypes": ["Gray Ops"], "text": "Play only if the Runner made a successful run during their last turn.\nGive the Runner 1 tag unless they pay 8[credit].", "printing.flavor_text": "\"A runner uses significant resources scrubbing their traces. Every cycle, it's harder to pin them down. But the game changes. In Heinlein, no one can last a day without brushing **our** AR-network.\"\n—Cassie LaRosa, Lunar NetDefense Sysop", "attributes.cost": 4, "attributes.influence": 2} }
  "amaze_amusements": { signature: "fnv1a:631a1a8e", printing_signature: "fnv1a:ce2a341b", values: {"name": "AMAZE Amusements", "subtypes": null, "text": "Persistent → Whenever a run on this server ends, if the Runner stole any agendas during that run, give the Runner 2 tags. *(If the Runner trashes this card while accessing it, this ability still applies for the remainder of this run.)*", "printing.flavor_text": "Free commemorative souvenir!", "attributes.cost": 1, "attributes.trash_cost": 3, "attributes.influence": 3} }
  "weyland_consortium_built_to_last": { signature: "fnv1a:84234388", printing_signature: "fnv1a:2ae09e0b", values: {"name": "Weyland Consortium: Built to Last", "subtypes": ["Megacorp"], "attributes.minimum_deck_size": 40, "attributes.influence_limit": 15, "text": "Whenever you advance a card, gain 2[credit] if it had no advancement counters.", "printing.flavor_text": "Here to Stay."} }
  "above_the_law": { signature: "fnv1a:f5a7a88e", printing_signature: "fnv1a:e7e0d043", values: {"name": "Above the Law", "subtypes": ["Security"], "text": "When you score this agenda, you may trash 1 installed resource.\nLimit 1 per deck.", "printing.flavor_text": "We are judge, jury, and executioner.", "attributes.advancement_cost": 3, "attributes.agenda_points": 2} }
  "clearinghouse": { signature: "fnv1a:1a8f0e65", printing_signature: "fnv1a:373c0e1c", values: {"name": "Clearinghouse", "subtypes": ["Hostile"], "text": "You can advance this asset.\nWhen your turn begins, you may trash this asset to do 1 meat damage for each hosted advancement counter.", "printing.flavor_text": "\"First rule of the business: make sure you're not 'personally liable' when the transaction executes.\"\n—Ted J. Son, Central Counterparty Clearance", "attributes.cost": 0, "attributes.trash_cost": 3, "attributes.influence": 3} }
  "ballista": { signature: "fnv1a:c07cd6ad", printing_signature: "fnv1a:6ecd758c", values: {"attributes.cost": 5, "attributes.strength": 4, "name": "Ballista", "subtypes": ["Sentry", "Destroyer"], "text": "[subroutine] Trash 1 installed program or end the run.", "printing.flavor_text": "\"Puts a hole in your rig **and** your plans.\"\n—René \"Loup\" Arcemont", "attributes.influence": 2} }
  "pharos": { signature: "fnv1a:91fcb460", printing_signature: "fnv1a:99e4b61d", values: {"name": "Pharos", "subtypes": ["Barrier"], "text": "You can advance this ice. It gets +5 strength while there are 3 or more hosted advancement counters.\n[subroutine] Give the Runner 1 tag.\n[subroutine] End the run.\n[subroutine] End the run.", "printing.flavor_text": null, "attributes.cost": 7, "attributes.strength": 5, "attributes.influence": 3} }
  "government_subsidy": { signature: "fnv1a:6d4845d6", printing_signature: "fnv1a:645c9fa1", values: {"name": "Government Subsidy", "subtypes": ["Transaction"], "text": "Gain 15[credit].", "printing.flavor_text": "\"If the government spent 1% of the funding they provide us tracking where the other 99% went, my colleagues and I would be in prison…\n…but that is a very big **if**.\"\n—Huey DeMora, W-Con public-private facilitation seminar", "attributes.cost": 10, "attributes.influence": 1} }
  "retribution": { signature: "fnv1a:386fb128", printing_signature: "fnv1a:6c855590", values: {"name": "Retribution", "subtypes": ["Gray Ops"], "text": "Play only if the Runner is tagged.\nTrash 1 installed program or piece of hardware.", "printing.flavor_text": "Did you really think you'd get away with it?", "attributes.cost": 1, "attributes.influence": 1} }
  "malapert_data_vault": { signature: "fnv1a:e4cf43ff", printing_signature: "fnv1a:ba2ede40", values: {"name": "Malapert Data Vault", "subtypes": null, "text": "Whenever you score an agenda from this server, you may search R&D for 1 non-agenda card and reveal it. *(Shuffle R&D after searching it.)* Add that card to HQ.", "printing.flavor_text": "Sunlight does not touch the Crater of Eternal Darkness, a fitting abode for the Consortium's malefic secrets.", "attributes.cost": 1, "attributes.trash_cost": 4, "attributes.influence": 3} }
  "offworld_office": { signature: "fnv1a:524e2c5c", printing_signature: "fnv1a:54c11392", values: {"attributes.advancement_cost": 4, "name": "Offworld Office", "type": "agenda", "subtypes": ["Expansion"], "attributes.agenda_points": 2, "text": "When you score this agenda, gain 7[credit].", "printing.flavor_text": "As the first lunar city, Heinlein was built on the dreams of a new frontier and boundless opportunity, but He3 mining is too lucrative for the corps to ever relinquish control.", "attributes.influence": 0} }
  "orbital_superiority": { signature: "fnv1a:2879022d", printing_signature: "fnv1a:f51a6fed", values: {"name": "Orbital Superiority", "subtypes": ["Security"], "text": "When you score this agenda, if the Runner is tagged, do 4 meat damage; otherwise, give the Runner 1 tag.", "printing.flavor_text": "Mobsters bribe police, megacorps acquire militaries.", "attributes.advancement_cost": 4, "attributes.agenda_points": 2, "attributes.influence": 0} }
  "send_a_message": { signature: "fnv1a:fe0da346", printing_signature: "fnv1a:c24c3f14", values: {"name": "Send a Message", "subtypes": ["Security"], "text": "When this agenda is scored or stolen, you may rez 1 installed piece of ice, ignoring all costs.", "printing.flavor_text": "It might be over, but we **will** get them next time.", "attributes.advancement_cost": 5, "attributes.agenda_points": 3, "attributes.influence": 0} }
  "superconducting_hub": { signature: "fnv1a:d6cacdd1", printing_signature: "fnv1a:71465ef4", values: {"name": "Superconducting Hub", "subtypes": ["Expansion"], "text": "When you score this agenda, you may draw 2 cards.\nYou get +2 maximum hand size.", "printing.flavor_text": "With Earth-Luna communications, saving microseconds returns megacredits.", "attributes.advancement_cost": 3, "attributes.agenda_points": 1, "attributes.influence": 0} }
  "regolith_mining_license": { signature: "fnv1a:c82cf7bf", printing_signature: "fnv1a:a2bb6f43", values: {"name": "Regolith Mining License", "subtypes": null, "text": "When you rez this asset, load 15[credit] onto it. When it is empty, trash it.\n[click]**:** Take 3[credit] from this asset.", "printing.flavor_text": "\"The economy of three worlds is sustained by He3 extraction from the lunar surface. The very fulcrum of power, the key to collective survival—auctioned to the highest bidder.\"\n—The Catalyst", "attributes.cost": 2, "attributes.trash_cost": 3, "attributes.influence": 0} }
  "palisade": { signature: "fnv1a:3b796f50", printing_signature: "fnv1a:cd6fffae", values: {"name": "Palisade", "subtypes": ["Barrier"], "text": "While this ice is protecting a remote server, it gets +2 strength.\n[subroutine] End the run.", "printing.flavor_text": "Keep the neighbors honest.", "attributes.cost": 3, "attributes.strength": 2, "attributes.influence": 0} }
  "tithe": { signature: "fnv1a:dbc88cf9", printing_signature: "fnv1a:aafdd307", values: {"name": "Tithe", "subtypes": ["Sentry", "AP"], "text": "[subroutine] Do 1 net damage.\n[subroutine] Gain 1[credit].", "printing.flavor_text": "\"You'll give till it hurts... then it'll reach for more.\"\n—Red Comyn", "attributes.cost": 1, "attributes.strength": 1, "attributes.influence": 0} }
  "whitespace": { signature: "fnv1a:822f9ffe", printing_signature: "fnv1a:8a9077e8", values: {"name": "Whitespace", "subtypes": ["Code Gate"], "text": "[subroutine] The Runner loses 3[credit].\n[subroutine] If the Runner has 6[credit] or less, end the run.", "printing.flavor_text": "[this space intentionally left blank]", "attributes.cost": 2, "attributes.strength": 0, "attributes.influence": 0} }
  "hedge_fund": { signature: "fnv1a:5fe44ea0", printing_signature: "fnv1a:09e2f944", values: {"name": "Hedge Fund", "subtypes": ["Transaction"], "text": "Gain 9[credit].", "printing.flavor_text": "A financial instrument for diverting money from those outside to those inside.", "attributes.cost": 5, "attributes.influence": 0} }
  "the_catalyst_convention_breaker": { signature: "fnv1a:1a4ba6cc", printing_signature: "fnv1a:08644f9c", values: {"name": "The Catalyst: Convention Breaker", "subtypes": ["Natural"], "attributes.base_link": 0, "attributes.minimum_deck_size": 30, "attributes.influence_limit": null, "text": "Starter game only.", "printing.flavor_text": "Are you ready to start something big?"} }
  "the_syndicate_profit_over_principle": { signature: "fnv1a:3019b08b", printing_signature: "fnv1a:eb685f97", values: {"name": "The Syndicate: Profit over Principle", "subtypes": ["Megacorp"], "attributes.minimum_deck_size": 30, "attributes.influence_limit": null, "text": "Starter game only.", "printing.flavor_text": "You work for us. You just don't know it yet."} }
