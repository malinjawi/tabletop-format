# Auditable field-background recovery for the Offworld Office private proof.
# Coordinates are native pixels on the lossless 744x1030 PDF crop.  These
# assets remove only the printed semantic field; all art and surrounding frame
# pixels continue to come from the immutable source face.

schema_version: 1
source: assets/source-faces/p_offworld_office_sg.png
canonical_size_px: [744, 1030]

backgrounds:
  - id: offworld_title_background
    crop_px: [20, 35, 520, 82]
    method: row_profile
    sample_x_px: [410, 520]
    output: assets/source-patches/offworld_office/title-background.png

  - id: offworld_type_background
    crop_px: [82, 570, 208, 614]
    method: clone
    sample_px: [420, 570, 546, 614]
    output: assets/source-patches/offworld_office/type-background.png

  - id: offworld_subtypes_background
    crop_px: [208, 570, 420, 614]
    method: clone
    sample_px: [450, 570, 662, 614]
    output: assets/source-patches/offworld_office/subtypes-background.png

  - id: offworld_flavor_background
    source: assets/source-faces/p_offworld_office_sg.png
    crop_px: [86, 687, 660, 835]
    method: inpaint_dark
    threshold: 180
    dilate_px: 2
    radius_px: 5
    output: assets/source-patches/offworld_office/flavor-background.png

