# Forge Netrunner production kit — community frame v2.
#
# A fully semantic, independently authored Netrunner frame. The official PnP
# crop supplies only each illustration; all title rails, faction shells, type
# hardware, rules, flavor, statistics, influence, glyphs and credits are live
# Forge regions. The goal is faithful game-language and production hierarchy,
# not a pixel copy of Null Signal Games' private Affinity sources.

card:
  w_mm: 63.0
  h_mm: 87.21
  bleed_mm: 3.175
  radius_mm: 0
  bg: "palette-deep"

fonts:
  # NSG/FFG production references use Trajan Pro for card names and Minion Pro
  # for rules. Those commercial fonts are not redistributable through Forge.
  # Cinzel and Source Serif 4 are reproducible OFL substitutes with matching
  # classical-cap and readable oldstyle-serif roles. Orbitron supplies the
  # squared primary type labels, while Lato supplies the mixed-case subtype
  # text used by the NSG-era frame. Licensed Bank Gothic remains an optional
  # local source for vertical ICE and stat typography.
  - { id: title, family: "Forge Cinzel", weight: 600, asset: "assets/source-fonts/Cinzel-Variable.ttf" }
  - { id: tech, family: "Forge Orbitron Black", weight: 900, asset: "assets/source-fonts/Orbitron-Black.ttf" }
  - { id: subtype, family: "Forge Lato", weight: 400, asset: "assets/source-fonts/Lato-Regular.ttf" }
  - { id: ice_type, family: "Forge Bank Gothic Light", weight: 300, asset: "assets/source-fonts/Orbitron-Variable.ttf", local_asset: "assets/source-fonts/BankGothic-Light.local.ttf" }
  - { id: stat, family: "Forge Bank Gothic", weight: 500, asset: "assets/source-fonts/Orbitron-Black.ttf", local_asset: "assets/source-fonts/BankGothic-Medium.local.ttf" }
  - { id: label, family: "Forge Lato", weight: 700, asset: "assets/source-fonts/Lato-Bold.ttf" }
  - { id: body, family: "Forge Source Serif 4", weight: 400, asset: "assets/source-fonts/SourceSerif4-Variable.ttf" }
  - { id: body_strong, family: "Forge Source Serif 4", weight: 800, asset: "assets/source-fonts/SourceSerif4-Variable.ttf" }
  - { id: flavor, family: "Forge Source Serif 4", weight: 400, style: italic, asset: "assets/source-fonts/SourceSerif4-Italic-Variable.ttf" }

palette:
  by: "attributes.faction"
  map:
    anarch: "#f06432"
    criminal: "#238fc2"
    shaper: "#65ad61"
    # Sampled from the mid-tone production rails on System Gateway HB faces.
    # The previous value was too bright/magenta and washed out the faction's
    # smoky violet hierarchy.
    haas-bioroid: "#804d7f"
    jinteki: "#bd3b35"
    nbn: "#d3a124"
    weyland-consortium: "#617e67"
    neutral-corp: "#687078"
    neutral-runner: "#7d8389"
  default: "#7d8389"
  # Surface motifs are reusable design tokens, selected by the same semantic
  # field as the faction color. They are independently authored geometry—not
  # pixels copied from the source faces—and are shared by every card family.
  motifs:
    anarch:
      shell: >-
        repeating-radial-gradient(circle at 1% 72%,transparent 0 4.6mm,rgba(255,255,255,.22) 4.7mm 4.96mm,transparent 5.08mm 8.2mm),repeating-conic-gradient(from -8deg at 1% 72%,rgba(255,255,255,.18) 0deg .68deg,transparent .84deg 16deg),linear-gradient(125deg,transparent 0 61%,rgba(255,255,255,.12) 61.2% 61.8%,transparent 62% 100%)
      panel: >-
        repeating-radial-gradient(circle at 0% 68%,transparent 0 4.1mm,color-mix(in srgb,{palette} 34%,transparent) 4.2mm 4.46mm,transparent 4.58mm 7.8mm),repeating-conic-gradient(from -7deg at 0% 68%,color-mix(in srgb,{palette} 28%,transparent) 0deg .7deg,transparent .9deg 18deg)
    criminal:
      shell: >-
        radial-gradient(circle,rgba(255,255,255,.3) 0 .25mm,transparent .31mm) 1.2mm 1.2mm/7mm 7mm,repeating-linear-gradient(0deg,transparent 0 5.45mm,rgba(255,255,255,.18) 5.52mm 5.74mm,transparent 5.82mm 10.9mm),repeating-linear-gradient(90deg,transparent 0 6.85mm,rgba(255,255,255,.14) 6.92mm 7.12mm,transparent 7.2mm 13.8mm)
      panel: >-
        radial-gradient(circle,color-mix(in srgb,{palette} 40%,transparent) 0 .24mm,transparent .3mm) 0 0/7mm 7mm,repeating-linear-gradient(0deg,transparent 0 5.4mm,color-mix(in srgb,{palette} 25%,transparent) 5.48mm 5.7mm,transparent 5.78mm 10.8mm),repeating-linear-gradient(90deg,transparent 0 6.8mm,color-mix(in srgb,{palette} 22%,transparent) 6.88mm 7.08mm,transparent 7.16mm 13.6mm)
    shaper:
      shell: >-
        repeating-radial-gradient(circle at 0% 70%,transparent 0 3.6mm,rgba(255,255,255,.22) 3.72mm 3.98mm,transparent 4.1mm 7.2mm),repeating-linear-gradient(45deg,transparent 0 5.6mm,rgba(255,255,255,.16) 5.68mm 5.92mm,transparent 6mm 11.2mm),radial-gradient(circle at 77% 15%,rgba(255,255,255,.18) 0 .3mm,transparent .36mm) 0 0/6mm 6mm
      panel: >-
        repeating-radial-gradient(circle at 0% 66%,transparent 0 3.5mm,color-mix(in srgb,{palette} 32%,transparent) 3.62mm 3.9mm,transparent 4.04mm 7mm),repeating-linear-gradient(45deg,transparent 0 5.5mm,color-mix(in srgb,{palette} 24%,transparent) 5.58mm 5.82mm,transparent 5.9mm 11mm)
    haas-bioroid:
      shell: >-
        repeating-linear-gradient(60deg,transparent 0 5mm,rgba(255,255,255,.2) 5.08mm 5.32mm,transparent 5.4mm 10mm),repeating-linear-gradient(-60deg,transparent 0 5mm,rgba(255,255,255,.16) 5.08mm 5.32mm,transparent 5.4mm 10mm),repeating-linear-gradient(0deg,transparent 0 8.6mm,rgba(255,255,255,.13) 8.68mm 8.9mm,transparent 8.98mm 17.2mm)
      panel: >-
        repeating-linear-gradient(60deg,transparent 0 5mm,color-mix(in srgb,{palette} 27%,transparent) 5.08mm 5.3mm,transparent 5.38mm 10mm),repeating-linear-gradient(-60deg,transparent 0 5mm,color-mix(in srgb,{palette} 22%,transparent) 5.08mm 5.3mm,transparent 5.38mm 10mm),repeating-linear-gradient(0deg,transparent 0 8.6mm,color-mix(in srgb,{palette} 18%,transparent) 8.68mm 8.88mm,transparent 8.96mm 17.2mm)
    jinteki:
      shell: >-
        repeating-radial-gradient(ellipse at 100% 69%,transparent 0 4.2mm,rgba(255,255,255,.2) 4.34mm 4.62mm,transparent 4.78mm 8.4mm),repeating-linear-gradient(74deg,transparent 0 7.2mm,rgba(255,255,255,.16) 7.3mm 7.55mm,transparent 7.65mm 14.4mm),linear-gradient(22deg,transparent 0 69%,rgba(255,255,255,.13) 69.2% 69.8%,transparent 70% 100%)
      panel: >-
        repeating-radial-gradient(ellipse at 100% 67%,transparent 0 4mm,color-mix(in srgb,{palette} 30%,transparent) 4.14mm 4.42mm,transparent 4.56mm 8mm),repeating-linear-gradient(74deg,transparent 0 7mm,color-mix(in srgb,{palette} 21%,transparent) 7.1mm 7.34mm,transparent 7.44mm 14mm)
    nbn:
      shell: >-
        repeating-radial-gradient(circle at 74% 72%,transparent 0 3.8mm,rgba(255,255,255,.24) 3.92mm 4.2mm,transparent 4.34mm 7.6mm),repeating-linear-gradient(90deg,transparent 0 8mm,rgba(255,255,255,.16) 8.08mm 8.42mm,transparent 8.5mm 16mm),linear-gradient(0deg,transparent 0 20%,rgba(255,255,255,.12) 20.2% 22%,transparent 22.2% 100%)
      panel: >-
        repeating-radial-gradient(circle at 72% 72%,transparent 0 3.8mm,color-mix(in srgb,{palette} 32%,transparent) 3.92mm 4.2mm,transparent 4.34mm 7.6mm),repeating-linear-gradient(90deg,transparent 0 8mm,color-mix(in srgb,{palette} 22%,transparent) 8.08mm 8.38mm,transparent 8.46mm 16mm)
    weyland-consortium:
      shell: >-
        repeating-linear-gradient(135deg,transparent 0 5.1mm,rgba(255,255,255,.22) 5.2mm 5.55mm,transparent 5.66mm 10.2mm),repeating-linear-gradient(45deg,transparent 0 10.2mm,rgba(255,255,255,.13) 10.3mm 10.6mm,transparent 10.7mm 20.4mm),linear-gradient(90deg,rgba(255,255,255,.1) 0 1.1mm,transparent 1.15mm 100%)
      panel: >-
        repeating-linear-gradient(135deg,transparent 0 5mm,color-mix(in srgb,{palette} 30%,transparent) 5.1mm 5.46mm,transparent 5.56mm 10mm),repeating-linear-gradient(45deg,transparent 0 10mm,color-mix(in srgb,{palette} 18%,transparent) 10.1mm 10.4mm,transparent 10.5mm 20mm)
    neutral-corp:
      shell: >-
        repeating-linear-gradient(135deg,transparent 0 6mm,rgba(255,255,255,.2) 6.1mm 6.48mm,transparent 6.58mm 12mm),linear-gradient(90deg,rgba(255,255,255,.12),transparent 28%,rgba(0,0,0,.18) 100%)
      panel: >-
        repeating-linear-gradient(135deg,transparent 0 6mm,color-mix(in srgb,{palette} 25%,transparent) 6.1mm 6.42mm,transparent 6.52mm 12mm)
    neutral-runner:
      shell: >-
        repeating-linear-gradient(135deg,transparent 0 6mm,rgba(255,255,255,.2) 6.1mm 6.48mm,transparent 6.58mm 12mm),linear-gradient(90deg,rgba(255,255,255,.12),transparent 28%,rgba(0,0,0,.18) 100%)
      panel: >-
        repeating-linear-gradient(135deg,transparent 0 6mm,color-mix(in srgb,{palette} 25%,transparent) 6.1mm 6.42mm,transparent 6.52mm 12mm)
  default_motif:
    shell: >-
      repeating-linear-gradient(135deg,transparent 0 6mm,rgba(255,255,255,.18) 6.1mm 6.42mm,transparent 6.52mm 12mm)
    panel: >-
      repeating-linear-gradient(135deg,transparent 0 6mm,color-mix(in srgb,{palette} 22%,transparent) 6.1mm 6.4mm,transparent 6.5mm 12mm)

regions:
  # ================= SHARED FACTION SHELL =================
  - { id: shell, type: rect, x: 0, y: 0, w: 63, h: 87.21, fill: "palette-gradient", radius_mm: 0 }
  - { id: shell_faction_motif, type: rect, x: 0, y: 0, w: 63, h: 87.21, fill: "palette-shell-motif", opacity: 0.88, radius_mm: 0 }
  - { id: shell_mesh, type: rect, x: 0, y: 0, w: 63, h: 87.21, fill: "repeating-linear-gradient(60deg,transparent 0 4.4mm,rgba(255,255,255,.13) 4.45mm 4.7mm)", opacity: 0.12, radius_mm: 0 }
  - { id: shell_scanlines, type: rect, x: 0, y: 0, w: 63, h: 87.21, fill: "repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 .12mm,transparent .12mm .7mm)", opacity: 0.18, radius_mm: 0 }
  - { id: shell_outer_keyline, type: rect, x: 0.22, y: 0.22, w: 62.56, h: 86.77, fill: "none", stroke: "palette-dark", stroke_w_mm: 0.42, opacity: 0.92, radius_mm: 0 }
  - { id: shell_inner_keyline, type: rect, x: 0.82, y: 0.74, w: 61.36, h: 85.73, fill: "none", stroke: "palette-light", stroke_w_mm: 0.24, opacity: 0.74, radius_mm: 0 }
  - { id: top_signal, type: rect, x: 0, y: 0, w: 63, h: 1.65, fill: "palette-gradient", opacity: 0.96 }
  - { id: top_signal_faction_motif, type: rect, x: 0, y: 0, w: 63, h: 1.65, fill: "palette-shell-motif", opacity: 0.72 }
  - { id: left_signal, type: rect, x: 0, y: 0, w: 1.2, h: 87.21, fill: "palette-gradient", opacity: 0.78 }
  - { id: left_signal_faction_motif, type: rect, x: 0, y: 0, w: 1.2, h: 87.21, fill: "palette-shell-motif", opacity: 0.58 }
  - { id: right_signal, type: rect, x: 62.05, y: 0, w: 0.95, h: 87.21, fill: "palette-gradient", opacity: 0.76, show_if: "type != ice" }
  - { id: right_signal_faction_motif, type: rect, x: 62.05, y: 0, w: 0.95, h: 87.21, fill: "palette-shell-motif", opacity: 0.56, show_if: "type != ice" }
  - { id: ice_info_rail, type: rect, x: 58.4, y: 9.75, w: 4.6, h: 80.64, fill: "palette-gradient", show_if: "type == ice" }
  - { id: ice_info_rail_faction_motif, type: rect, x: 58.4, y: 9.75, w: 4.6, h: 80.64, fill: "palette-shell-motif", opacity: 0.62, show_if: "type == ice" }

  # ================= STANDARD PORTRAIT FAMILIES =================
  # Title rails are family hardware, not a universal banner. Their positions
  # are measured from the corresponding System Gateway source faces.
  - { id: event_header_shadow, type: rect, x: 0.0, y: 1.72, w: 61.7, h: 7.15, fill: "#06090d", radius_mm: 2.3, shadow: "0 .7mm 1.25mm rgba(0,0,0,.42)", show_if: "type == event" }
  - { id: event_header, type: rect, x: 0.0, y: 1.22, w: 61.1, h: 6.55, fill: "palette-metallic", stroke: "palette-dark", stroke_w_mm: 0.35, radius_mm: 2.1, show_if: "type == event" }
  - { id: event_unique, type: text, text: "◆", x: 19.2, y: 2.35, w: 2.8, h: 3.9, font: title, size_pt: 5.2, align: center, valign: middle, color: "#111820", show_if: "type == event && attributes.unique" }
  - { id: event_name, type: richtext, src: "card.name", x: 17.5, y: 2.0, w: 40.8, h: 4.9, font: title, size_pt: 8.9, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == event && !attributes.unique" }
  - { id: event_name_unique, type: richtext, src: "card.name", x: 22.3, y: 2.0, w: 36.0, h: 4.9, font: title, size_pt: 8.9, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == event && attributes.unique" }

  - { id: resource_header_shadow, type: rect, x: 14.8, y: 2.52, w: 48.2, h: 5.25, fill: "#06090d", clip_path: "polygon(5% 0,100% 0,100% 100%,4% 100%,0 48%)", shadow: "0 .55mm .9mm rgba(0,0,0,.42)", show_if: "type == resource" }
  - { id: resource_header, type: rect, x: 14.55, y: 2.16, w: 48.45, h: 4.75, fill: "palette-metallic", stroke: "palette-dark", stroke_w_mm: 0.35, clip_path: "polygon(5% 0,100% 0,100% 100%,4% 100%,0 48%)", show_if: "type == resource" }
