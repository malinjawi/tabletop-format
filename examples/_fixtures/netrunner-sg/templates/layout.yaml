# Forge Netrunner production kit — community frame v2.
#
# A fully semantic, independently authored Netrunner frame. The official PnP
# crop supplies only each illustration; all title rails, faction shells, type
# hardware, rules, flavor, statistics, influence, glyphs and credits are live
# Forge regions. The goal is faithful game-language and production hierarchy,
# not a pixel copy of Null Signal Games' private Affinity sources.

card:
  w_mm: 63.0
  h_mm: 87.21
  bleed_mm: 3.175
  radius_mm: 2.5
  bg: "palette-deep"

fonts:
  # NSG/FFG production references use Trajan Pro for card names and Minion Pro
  # for rules. Those commercial fonts are not redistributable through Forge.
  # Cinzel and Source Serif 4 are reproducible OFL substitutes with matching
  # classical-cap and readable oldstyle-serif roles; Orbitron supplies the
  # squared Bank Gothic-like numerals used by the physical stat hardware.
  - { id: title, family: "Forge Cinzel", weight: 600, asset: "assets/source-fonts/Cinzel-Variable.ttf" }
  - { id: tech, family: "Forge Gill Sans Ultra Bold", weight: 900, asset: "assets/source-fonts/Orbitron-Black.ttf", local_asset: "assets/source-fonts/GillSansUltraBold.local.ttf" }
  - { id: subtype, family: "Forge Bank Gothic Light", weight: 300, asset: "assets/source-fonts/Orbitron-Variable.ttf", local_asset: "assets/source-fonts/BankGothic-Light.local.ttf" }
  - { id: stat, family: "Forge Bank Gothic", weight: 500, asset: "assets/source-fonts/Orbitron-Black.ttf", local_asset: "assets/source-fonts/BankGothic-Medium.local.ttf" }
  - { id: label, family: "Forge Lato", weight: 700, asset: "assets/source-fonts/Lato-Bold.ttf" }
  - { id: body, family: "Forge Source Serif 4", weight: 400, asset: "assets/source-fonts/SourceSerif4-Variable.ttf" }
  - { id: flavor, family: "Forge Source Serif 4", weight: 400, style: italic, asset: "assets/source-fonts/SourceSerif4-Italic-Variable.ttf" }

palette:
  by: "attributes.faction"
  map:
    anarch: "#f06432"
    criminal: "#238fc2"
    shaper: "#65ad61"
    # Sampled from the mid-tone production rails on System Gateway HB faces.
    # The previous value was too bright/magenta and washed out the faction's
    # smoky violet hierarchy.
    haas-bioroid: "#804d7f"
    jinteki: "#bd3b35"
    nbn: "#d3a124"
    weyland-consortium: "#617e67"
    neutral-corp: "#687078"
    neutral-runner: "#7d8389"
  default: "#7d8389"

regions:
  # ================= SHARED FACTION SHELL =================
  - { id: shell, type: rect, x: 0, y: 0, w: 63, h: 87.21, fill: "palette-gradient", radius_mm: 2.5 }
  - { id: shell_mesh, type: rect, x: 0, y: 0, w: 63, h: 87.21, fill: "repeating-linear-gradient(60deg,transparent 0 4.4mm,rgba(255,255,255,.13) 4.45mm 4.7mm)", opacity: 0.32, radius_mm: 2.5 }
  - { id: shell_scanlines, type: rect, x: 0, y: 0, w: 63, h: 87.21, fill: "repeating-linear-gradient(0deg,rgba(255,255,255,.08) 0 .12mm,transparent .12mm .7mm)", opacity: 0.28, radius_mm: 2.5 }
  - { id: top_signal, type: rect, x: 0, y: 0, w: 63, h: 1.65, fill: "palette" }
  - { id: left_signal, type: rect, x: 0, y: 0, w: 1.2, h: 87.21, fill: "palette-light", opacity: 0.82 }
  - { id: right_signal, type: rect, x: 62.05, y: 0, w: 0.95, h: 87.21, fill: "palette", opacity: 0.7 }

  # ================= STANDARD PORTRAIT FAMILIES =================
  # Title rails are family hardware, not a universal banner. Their positions
  # are measured from the corresponding System Gateway source faces.
  - { id: event_header_shadow, type: rect, x: 0.0, y: 1.72, w: 61.7, h: 7.15, fill: "#06090d", radius_mm: 2.3, shadow: "0 .7mm 1.25mm rgba(0,0,0,.42)", show_if: "type == event" }
  - { id: event_header, type: rect, x: 0.0, y: 1.22, w: 61.1, h: 6.55, fill: "linear-gradient(180deg,#ffffff,#ecefed)", stroke: "palette-dark", stroke_w_mm: 0.35, radius_mm: 2.1, show_if: "type == event" }
  - { id: event_unique, type: text, text: "◆", x: 19.2, y: 2.35, w: 2.8, h: 3.9, font: title, size_pt: 5.2, align: center, valign: middle, color: "#111820", show_if: "type == event && attributes.unique" }
  - { id: event_name, type: richtext, src: "card.name", x: 17.5, y: 2.0, w: 40.8, h: 4.9, font: title, size_pt: 8.9, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == event && !attributes.unique" }
  - { id: event_name_unique, type: richtext, src: "card.name", x: 22.3, y: 2.0, w: 36.0, h: 4.9, font: title, size_pt: 8.9, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == event && attributes.unique" }

  - { id: resource_header_shadow, type: rect, x: 14.8, y: 2.52, w: 48.2, h: 5.25, fill: "#06090d", clip_path: "polygon(5% 0,100% 0,100% 100%,4% 100%,0 48%)", shadow: "0 .55mm .9mm rgba(0,0,0,.42)", show_if: "type == resource" }
  - { id: resource_header, type: rect, x: 14.55, y: 2.16, w: 48.45, h: 4.75, fill: "linear-gradient(180deg,#ffffff,#ecefed)", stroke: "palette-dark", stroke_w_mm: 0.35, clip_path: "polygon(5% 0,100% 0,100% 100%,4% 100%,0 48%)", show_if: "type == resource" }
  - { id: resource_unique, type: text, text: "◆", x: 19.4, y: 2.6, w: 2.6, h: 3.7, font: title, size_pt: 5.1, align: center, valign: middle, color: "#111820", show_if: "type == resource && attributes.unique" }
  - { id: resource_name, type: richtext, src: "card.name", x: 18.2, y: 2.38, w: 42.0, h: 3.95, font: title, size_pt: 8.7, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == resource && !attributes.unique" }
  - { id: resource_name_unique, type: richtext, src: "card.name", x: 22.4, y: 2.38, w: 37.8, h: 3.95, font: title, size_pt: 8.7, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == resource && attributes.unique" }

  - { id: program_header_shadow, type: rect, x: 0.0, y: 3.48, w: 62.4, h: 5.9, fill: "#06090d", radius_mm: 1.9, shadow: "0 .55mm .95mm rgba(0,0,0,.42)", show_if: "type == program" }
  - { id: program_header, type: rect, x: 0.0, y: 3.12, w: 62.0, h: 5.4, fill: "linear-gradient(180deg,#ffffff,#ecefed)", stroke: "palette-dark", stroke_w_mm: 0.35, radius_mm: 1.7, show_if: "type == program" }
  - { id: program_unique, type: text, text: "◆", x: 19.3, y: 3.7, w: 2.7, h: 3.8, font: title, size_pt: 5.1, align: center, valign: middle, color: "#111820", show_if: "type == program && attributes.unique" }
  - { id: program_name, type: richtext, src: "card.name", x: 17.9, y: 3.42, w: 41.0, h: 4.15, font: title, size_pt: 8.8, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == program && !attributes.unique" }
  - { id: program_name_unique, type: richtext, src: "card.name", x: 22.3, y: 3.42, w: 36.6, h: 4.15, font: title, size_pt: 8.8, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == program && attributes.unique" }

  - { id: hardware_header_shadow, type: rect, x: 15.4, y: 3.68, w: 47.6, h: 5.25, fill: "#06090d", clip_path: "polygon(6% 0,100% 0,100% 100%,5% 100%,0 50%)", shadow: "0 .55mm .9mm rgba(0,0,0,.42)", show_if: "type == hardware" }
  - { id: hardware_header, type: rect, x: 15.6, y: 3.35, w: 47.4, h: 4.65, fill: "linear-gradient(180deg,#ffffff,#ecefed)", stroke: "palette-dark", stroke_w_mm: 0.35, clip_path: "polygon(6% 0,100% 0,100% 100%,5% 100%,0 50%)", show_if: "type == hardware" }
  - { id: hardware_unique, type: text, text: "◆", x: 18.7, y: 3.8, w: 2.7, h: 3.7, font: title, size_pt: 5.1, align: center, valign: middle, color: "#111820", show_if: "type == hardware && attributes.unique" }
  - { id: hardware_name, type: richtext, src: "card.name", x: 20.2, y: 3.55, w: 40.2, h: 3.95, font: title, size_pt: 8.7, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == hardware && !attributes.unique" }
  - { id: hardware_name_unique, type: richtext, src: "card.name", x: 21.8, y: 3.55, w: 38.6, h: 3.95, font: title, size_pt: 8.7, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == hardware && attributes.unique" }

  - { id: operation_header_shadow, type: rect, x: 13.9, y: 3.0, w: 49.1, h: 5.65, fill: "#06090d", clip_path: "polygon(5% 0,100% 0,100% 100%,4% 100%,0 45%)", shadow: "0 .55mm .9mm rgba(0,0,0,.42)", show_if: "type == operation" }
  - { id: operation_header, type: rect, x: 13.8, y: 2.62, w: 49.2, h: 5.15, fill: "linear-gradient(180deg,#ffffff,#ecefed)", stroke: "palette-dark", stroke_w_mm: 0.35, clip_path: "polygon(5% 0,100% 0,100% 100%,4% 100%,0 45%)", show_if: "type == operation" }
  - { id: operation_unique, type: text, text: "◆", x: 17.2, y: 3.18, w: 2.7, h: 3.8, font: title, size_pt: 5.1, align: center, valign: middle, color: "#111820", show_if: "type == operation && attributes.unique" }
  - { id: operation_name, type: richtext, src: "card.name", x: 18.5, y: 2.98, w: 41.7, h: 4.15, font: title, size_pt: 8.8, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == operation && !attributes.unique" }
  - { id: operation_name_unique, type: richtext, src: "card.name", x: 20.2, y: 2.98, w: 40.0, h: 4.15, font: title, size_pt: 8.8, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == operation && attributes.unique" }

  - { id: asset_header_shadow, type: rect, x: 14.8, y: 2.84, w: 48.2, h: 5.15, fill: "#06090d", clip_path: "polygon(5% 0,100% 0,100% 100%,4% 100%,0 48%)", shadow: "0 .55mm .9mm rgba(0,0,0,.42)", show_if: "type == asset" }
  - { id: asset_header, type: rect, x: 14.7, y: 2.48, w: 48.3, h: 4.65, fill: "linear-gradient(180deg,#ffffff,#ecefed)", stroke: "palette-dark", stroke_w_mm: 0.35, clip_path: "polygon(5% 0,100% 0,100% 100%,4% 100%,0 48%)", show_if: "type == asset" }
  - { id: asset_unique, type: text, text: "◆", x: 19.5, y: 2.88, w: 2.7, h: 3.8, font: title, size_pt: 5.1, align: center, valign: middle, color: "#111820", show_if: "type == asset && attributes.unique" }
  - { id: asset_name, type: richtext, src: "card.name", x: 18.3, y: 2.68, w: 42.0, h: 4.0, font: title, size_pt: 8.8, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == asset && !attributes.unique" }
  - { id: asset_name_unique, type: richtext, src: "card.name", x: 22.4, y: 2.68, w: 37.9, h: 4.0, font: title, size_pt: 8.8, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == asset && attributes.unique" }

  - { id: upgrade_header_shadow, type: rect, x: 14.7, y: 3.5, w: 48.3, h: 5.6, fill: "#06090d", clip_path: "polygon(5% 0,100% 0,100% 100%,4% 100%,0 48%)", shadow: "0 .55mm .9mm rgba(0,0,0,.42)", show_if: "type == upgrade" }
  - { id: upgrade_header, type: rect, x: 14.6, y: 3.14, w: 48.4, h: 5.05, fill: "linear-gradient(180deg,#ffffff,#ecefed)", stroke: "palette-dark", stroke_w_mm: 0.35, clip_path: "polygon(5% 0,100% 0,100% 100%,4% 100%,0 48%)", show_if: "type == upgrade" }
  - { id: upgrade_unique, type: text, text: "◆", x: 18.7, y: 3.62, w: 2.7, h: 3.8, font: title, size_pt: 5.1, align: center, valign: middle, color: "#111820", show_if: "type == upgrade && attributes.unique" }
  - { id: upgrade_name, type: richtext, src: "card.name", x: 17.5, y: 3.38, w: 42.8, h: 4.15, font: title, size_pt: 8.8, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == upgrade && !attributes.unique" }
  - { id: upgrade_name_unique, type: richtext, src: "card.name", x: 21.2, y: 3.38, w: 39.1, h: 4.15, font: title, size_pt: 8.8, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == upgrade && attributes.unique" }

  - { id: agenda_header_shadow, type: rect, x: 0.0, y: 2.02, w: 50.8, h: 6.15, fill: "#06090d", clip_path: "polygon(0 0,100% 0,96% 100%,0 100%)", shadow: "0 .55mm .95mm rgba(0,0,0,.42)", show_if: "type == agenda" }
  - { id: agenda_header, type: rect, x: 0.0, y: 1.66, w: 50.5, h: 5.7, fill: "linear-gradient(180deg,#ffffff,#ecefed)", stroke: "palette-dark", stroke_w_mm: 0.35, clip_path: "polygon(0 0,100% 0,96% 100%,0 100%)", show_if: "type == agenda" }
  - { id: agenda_unique, type: text, text: "◆", x: 3.0, y: 2.48, w: 2.8, h: 3.9, font: title, size_pt: 5.2, align: center, valign: middle, color: "#111820", show_if: "type == agenda && attributes.unique" }
  - { id: agenda_name, type: richtext, src: "card.name", x: 2.6, y: 2.25, w: 45.4, h: 4.2, font: title, size_pt: 8.7, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == agenda && !attributes.unique" }
  - { id: agenda_name_unique, type: richtext, src: "card.name", x: 6.1, y: 2.25, w: 41.9, h: 4.2, font: title, size_pt: 8.7, min_size_pt: 4.4, char_width_em: 0.60, line_height: 1.0, letter_spacing_em: -0.045, align: left, valign: middle, color: "#111820", no_wrap: true, autoshrink: true, show_if: "type == agenda && attributes.unique" }

  # Only the illustration window from each immutable reference face is used.
  - { id: art_event, type: image, src: "printing.scan_data", fallback_srcs: ["printing.art_data", "printing.art_url", "printing.art"], x: 1.15, y: 9.4, w: 60.7, h: 39.1, source_crop: [50, 145, 644, 401], source_size: [744, 1030], source_crop_fit: cover, show_if: "type == event" }
  - { id: art_runner_installed, type: image, src: "printing.scan_data", fallback_srcs: ["printing.art_data", "printing.art_url", "printing.art"], x: 1.15, y: 9.4, w: 60.7, h: 39.1, source_crop: [50, 145, 644, 401], source_size: [744, 1030], source_crop_fit: cover, show_if: "type == hardware || type == program || type == resource" }
  - { id: art_corp_standard, type: image, src: "printing.scan_data", fallback_srcs: ["printing.art_data", "printing.art_url", "printing.art"], x: 1.15, y: 9.4, w: 60.7, h: 39.1, source_crop: [50, 145, 644, 401], source_size: [744, 1030], source_crop_fit: cover, show_if: "type == asset || type == operation || type == upgrade" }
  - { id: art_agenda, type: image, src: "printing.scan_data", fallback_srcs: ["printing.art_data", "printing.art_url", "printing.art"], x: 1.15, y: 9.4, w: 60.7, h: 39.1, source_crop: [100, 130, 544, 339], source_size: [744, 1030], source_crop_fit: cover, show_if: "type == agenda" }
  - { id: art_frame, type: rect, x: 1.15, y: 9.4, w: 60.7, h: 39.1, fill: "none", stroke: "palette-light", stroke_w_mm: 0.55, shadow: "inset 0 0 2mm rgba(0,0,0,.38)", show_if: "type != identity && type != ice" }

  # Event/operation/program/hardware/resource cards use NSG's large circular
  # credit dial.  Its yellow metal is universal production hardware, not a
  # faction tint. Assets and upgrades use the smaller angular rez-cost plate.
  - { id: credit_dial_shadow, type: badge, text: "", x: 2.65, y: 2.05, d: 11.75, bg: "#07090b", color: "#ffffff", shadow: "0 .75mm 1.2mm rgba(0,0,0,.56)", show_if: "attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource" }
  - { id: credit_dial_rim, type: badge, text: "", x: 2.85, y: 2.25, d: 11.35, bg: "linear-gradient(145deg,#f7df58 0%,#d4bb36 43%,#8c7a20 78%,#62571b 100%)", color: "#ffffff", show_if: "attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource" }
  - { id: credit_dial_face, type: badge, text: "", x: 3.90, y: 3.20, d: 9.25, bg: "repeating-linear-gradient(0deg,rgba(255,255,255,.055) 0 .12mm,transparent .12mm .48mm),radial-gradient(circle at 50% 43%,#343b3e 0%,#161b1e 55%,#07090b 100%)", color: "#ffffff", show_if: "attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource" }
  - { id: credit_dial_inner, type: badge, text: "", x: 4.15, y: 3.45, d: 8.75, bg: "radial-gradient(circle,transparent 0 68%,rgba(248,249,246,.96) 69% 71%,rgba(102,111,117,.78) 72%,transparent 74%)", color: "#ffffff", show_if: "attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource" }
  - { id: credit_dial_number, type: text, src: "card.attributes.cost", x: 4.15, y: 4.0, w: 8.75, h: 6.8, font: stat, size_pt: 14.7, align: center, valign: middle, color: "#ffffff", text_shadow: "0 .18mm .18mm #000,0 0 .35mm #000", show_if: "attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource" }
  - { id: credit_tick_l1, type: rect, x: 4.75, y: 10.75, w: 0.92, h: 0.18, fill: "#eef1ef", show_if: "attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource" }
  - { id: credit_tick_l2, type: rect, x: 5.95, y: 11.35, w: 0.74, h: 0.18, fill: "#eef1ef", show_if: "attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource" }
  - { id: credit_tick_dot_l, type: badge, text: "", x: 7.30, y: 11.62, d: 0.38, bg: "#eef1ef", color: "#ffffff", show_if: "attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource" }
  - { id: credit_tick_dot_c, type: badge, text: "", x: 8.15, y: 11.64, d: 0.52, bg: "#eef1ef", color: "#ffffff", show_if: "attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource" }
  - { id: credit_tick_dot_r, type: badge, text: "", x: 9.14, y: 11.62, d: 0.38, bg: "#eef1ef", color: "#ffffff", show_if: "attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource" }
  - { id: credit_tick_r2, type: rect, x: 10.16, y: 11.35, w: 0.74, h: 0.18, fill: "#eef1ef", show_if: "attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource" }
  - { id: credit_tick_r1, type: rect, x: 11.18, y: 10.75, w: 0.92, h: 0.18, fill: "#eef1ef", show_if: "attributes.cost && type == event || attributes.cost && type == operation || attributes.cost && type == program || attributes.cost && type == hardware || attributes.cost && type == resource" }

  # Corp installed cards use a compact black rez-cost socket. Asset and
  # upgrade rails sit at different heights in the physical family templates.
