format_version: "0.1.0"
id: netrunner-sg
title: "Netrunner: System Gateway"
# license: this fixture reproduces card names/text/costs fetched from NetrunnerDB.
# The card-data repository does not provide a general open-content license for that
# material. "Proprietary" below is a conservative placeholder - the underlying IP is
# NOT owned by this repo or its authors. The separately attributed NSG symbol assets
# are CC BY-ND 4.0; that license does not extend to the card data, frames, art, or backs.
# This fixture exists ONLY as an internal test fixture for the tabletop-format platform
# and MUST NOT be hosted, published, or distributed as if it were an original game.
# See README.md in this directory for the full provenance statement.
#
# NOTE: components/printings.json entries carry an "image" URL that hot-links full-size
# card scans from card-images.netrunnerdb.com (NetrunnerDB's own CDN). This lets the hub
# UI show the authentic printed card next to our rendered/editable preview. Test-fixture
# convenience only -- do not copy this hot-linking pattern into a real/production game.
license: Proprietary
version: "0.1.0"
book_style: classic
description: >
  Test fixture: a faithful port of the 77-card System Gateway set for the
  asymmetric Corp-vs-Runner cyberpunk card game, used to stress-test the
  tabletop-format schema against a real, well-documented trading card game
  (two-sided decks, influence-based deckbuilding, non-deck-limit-of-N
  singleton cards, a banlist with live entries, etc). Not a production game.
genre: asymmetric deckbuilding card game
tags: [cyberpunk, asymmetric, two-player, test-fixture, ccg]
authors:
  - name: Fantasy Flight Games / Null Signal Games (original design)
    role: design
  - name: NetrunnerDB contributors (card data)
    role: data
players:
  min: 2
  max: 2
playtime_minutes:
  min: 45
  max: 75
default_provenance:
  source: human
  creator: NetrunnerDB community data (imported); original design by FFG / Null Signal Games
attribute_definitions:
  - key: side
    name: Side
    type: string
    choices: [corp, runner]
    required: true
    description: Which side of the asymmetric matchup this card belongs to ("corp" or "runner").
  - key: faction
    name: Faction
    type: string
    choices: [anarch, criminal, shaper, haas-bioroid, jinteki, nbn, weyland-consortium, neutral-corp, neutral-runner]
    required: true
    description: Card's faction (e.g. anarch, criminal, shaper, haas-bioroid, jinteki, nbn, weyland-consortium, or a neutral-* faction).
  - key: influence
    name: Influence
    type: integer
    description: Influence cost to include this card in a deck of a different faction (from NRDB faction_cost). Absent on identities and true faction agendas, which are influence-exempt.
  - key: cost
    name: Cost
    type: integer
    description: Credits to play/install/rez this card. Identities have no cost.
  - key: strength
    name: Strength
    type: integer
    description: Ice strength, or icebreaker strength.
  - key: memory_cost
    name: Memory (MU)
    type: integer
    description: Memory units required to install this program.
  - key: trash_cost
    name: Trash cost
    type: integer
    description: Credits the Runner must pay to trash this installed/accessed card.
  - key: advancement_cost
    name: Advancement requirement
    type: integer
    description: Advancement tokens needed for the Corp to score this agenda.
  - key: agenda_points
    name: Agenda points
    type: integer
    description: Points toward the 7-point win condition when this agenda is scored or stolen.
  - key: minimum_deck_size
    name: Minimum deck size
    type: integer
    description: Identity-only. Smallest legal deck size when using this identity.
  - key: influence_limit
    name: Influence limit
    type: integer
    description: Identity-only. Total influence this identity may spend on out-of-faction cards. Absent (not zero) on the two neutral starter identities, which cannot splash at all.
  - key: base_link
    name: Base link
    type: integer
    description: Runner identity-only. Starting link strength (trace defense).
  - key: unique
    name: Unique
    type: boolean
    required: true
    description: True if only one copy of this card may be in play/scored at a time (printed with a diamond marker on the real card).
