format_version: "0.1.0"
id: ember
title: Ember
description: >
  An 18-card dueling microgame. Draft embers, stoke your flame, extinguish
  your rival's. Created as the reference example for the format — free to
  copy, fork, sell, or set on fire.
version: "0.2.0"
license: CC0-1.0
authors:
  - name: The Format Project
    role: design
players:
  min: 2
  max: 2
playtime_minutes:
  min: 10
  max: 15
default_provenance:
  source: human
  creator: The Format Project
attribute_definitions:
  - key: cost
    name: Cost
    type: integer
    required: true
    description: Sparks paid to play this card.
  - key: power
    name: Power
    type: integer
    description: Flame strength in a clash.
symbols:
  - key: spark
    name: Spark
    asset: assets/icons/spark.png
  - key: ash
    name: Ash
    asset: assets/icons/ash.png
