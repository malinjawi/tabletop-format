name: Forge qualification

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Superseded PR checks can be cancelled. A main-branch qualification must
  # finish because it may already have promoted an immutable image.
  group: forge-qualification-${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  product-gate:
    name: Product and protocol gate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use qualified Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Use Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install locked toolchains
        run: npm run setup:dev
      - name: Run clean product gate
        run: |
          set -a
          . deploy/qualified-images.env
          set +a
          unset FORGEJO_TEST_IMAGE ALPINE_TEST_IMAGE CADDY_TEST_IMAGE NODE_TEST_IMAGE
          FORGE_REQUIRE_CLEAN_TREE=1 ./launch-gate.sh

  release-image:
    name: Exact image and recovery gate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out candidate
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Use qualified Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.20.0
          cache: npm
      - name: Install locked Node dependencies
        run: npm ci --ignore-scripts
      - name: Build and recover through the exact image
        env:
          FORGE_REQUIRE_CLEAN_TREE: "1"
          FORGE_QUALIFICATION_RECEIPT_PATH: ${{ runner.temp }}/recovery-receipt.json
        run: ./tools/qualify-production-image.sh
      - name: Preserve exact recovery evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: recovery-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/recovery-receipt.json
          if-no-files-found: error
          retention-days: 90
      - name: Package the qualified image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          set -euo pipefail
          image_tag="forge-platform:qualification-${GITHUB_SHA:0:12}"
          image_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_tag")"
          test "$image_revision" = "$GITHUB_SHA"

          artifact_dir="$RUNNER_TEMP/qualified-image"
          mkdir -p "$artifact_dir"
          docker save "$image_tag" | gzip -1 > "$artifact_dir/forge-platform.tar.gz"
          (
            cd "$artifact_dir"
            sha256sum forge-platform.tar.gz > forge-platform.tar.gz.sha256
          )
      - name: Preserve the qualified image for promotion
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualified-image-${{ github.sha }}
          path: |
            ${{ runner.temp }}/qualified-image/forge-platform.tar.gz
            ${{ runner.temp }}/qualified-image/forge-platform.tar.gz.sha256
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  publish-image:
    name: Publish qualified image to GHCR
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [product-gate, release-image]
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      packages: write
    steps:
      - name: Retrieve the exact qualified image
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: qualified-image-${{ github.sha }}
          path: ${{ runner.temp }}/qualified-image
      - name: Retrieve exact recovery evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: recovery-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/qualification
      - name: Verify and load the qualified image
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/qualified-image"
          sha256sum --check forge-platform.tar.gz.sha256
          gzip -dc forge-platform.tar.gz | docker load

          image_tag="forge-platform:qualification-${GITHUB_SHA:0:12}"
          image_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$image_tag")"
          test "$image_revision" = "$GITHUB_SHA"
          test "$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.licenses"}}' "$image_tag")" = "Apache-2.0"
      - name: Publish the immutable commit tag
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          image="ghcr.io/${owner}/forge-platform"
          target="${image}:sha-${GITHUB_SHA}"
          local_tag="forge-platform:qualification-${GITHUB_SHA:0:12}"

          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1 || true' EXIT

          local_image_id="$(docker image inspect --format '{{.Id}}' "$local_tag")"
          if existing="$(docker manifest inspect "$target" 2>&1)"; then
            docker pull "$target" >/dev/null
            existing_image_id="$(docker image inspect --format '{{.Id}}' "$target")"
            existing_revision="$(docker image inspect --format '{{index .Config.Labels "org.opencontainers.image.revision"}}' "$target")"
            if [ "$existing_image_id" != "$local_image_id" ] || [ "$existing_revision" != "$GITHUB_SHA" ]; then
              printf 'Existing qualified image tag does not match this candidate; refusing to overwrite: %s\n' "$target" >&2
              exit 1
            fi
            digest="$(docker image inspect --format '{{range .RepoDigests}}{{println .}}{{end}}' "$target" \
              | sed -nE "s|^${image}@(sha256:[0-9a-f]{64})\$|\\1|p" | head -1)"
          elif ! grep -Eqi 'manifest unknown|no such manifest' <<<"$existing"; then
            printf 'Could not prove that the target tag is unused; refusing to publish.\n%s\n' "$existing" >&2
            exit 1
          else
            docker tag "$local_tag" "$target"
            push_output="$(docker push "$target" 2>&1)"
            printf '%s\n' "$push_output"
            digest="$(sed -nE 's/.*digest: (sha256:[0-9a-f]{64}).*/\1/p' <<<"$push_output" | tail -1)"
          fi
          if [[ ! "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]; then
            printf 'Registry did not return an immutable image digest.\n' >&2
            exit 1
          fi
          docker manifest inspect "${image}@${digest}" >/dev/null

          node --input-type=module - "$RUNNER_TEMP/qualification" "$GITHUB_SHA" "$local_image_id" "${image}@${digest}" <<'NODE'
          import {readFileSync,writeFileSync} from "node:fs";
          import {join} from "node:path";
          const [directory,commit,imageId,registry]=process.argv.slice(2);
          const receipt=JSON.parse(readFileSync(join(directory,"recovery-receipt.json"),"utf8"));
          if(receipt.source_commit!==commit||receipt.local_image_id!==imageId||receipt.image_recovery_passed!==true)
            throw new Error("Recovery receipt does not identify the promoted image");
          receipt.product_gate_passed=true;
          receipt.registry_reference=registry;
          writeFileSync(join(directory,"qualification-receipt.json"),JSON.stringify(receipt,null,2)+"\n",{flag:"wx"});
          NODE

          {
            printf '### Qualified Forge image published\n\n'
            printf -- '- Commit: `%s`\n' "$GITHUB_SHA"
            printf -- '- Immutable deployment reference: `%s@%s`\n' "$image" "$digest"
            printf -- '- Convenience commit tag: `%s`\n' "$target"
            printf '\nThis workflow promotes an image only; it does not deploy Forge.\n'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve complete qualification receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: qualification-receipt-${{ github.sha }}
          path: ${{ runner.temp }}/qualification/qualification-receipt.json
          if-no-files-found: error
          retention-days: 90
