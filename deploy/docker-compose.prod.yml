# Controlled-beta production profile. Every image reference is supplied by
# digest in .env; credentials are mounted from deploy/.secrets, never written
# into this file or exposed to the gateway container as Forgejo admin basics.

services:
  gateway:
    image: ${FORGE_GATEWAY_IMAGE:?set a digest-pinned FORGE_GATEWAY_IMAGE}
    restart: unless-stopped
    user: "1000:1000"
    read_only: true
    init: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    command:
      - /bin/sh
      - -ec
      - |
        export FORGE_TOKEN="$$(cat /run/secrets/forge_token)"
        export PGPASSWORD="$$(cat /run/secrets/platform_db_password)"
        exec node server.mjs --port 8420
    ports:
      - "${FORGE_BIND_IP:-127.0.0.1}:8420:8420"
    tmpfs:
      - /tmp:size=536870912,mode=1777
    volumes:
      - gateway-data:/app/data
    secrets:
      - forge_token
      - platform_db_password
    environment:
      STORE1: forgejo
      FORGE_URL: http://forgejo:3000
      DB: postgres
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: platform
      PGUSER: platform
      CACHE_DIR: /app/data/cache
      FARM_DIR: /app/data/forge-farm
      # The shell is regenerated when application assets change. /app itself
      # is intentionally read-only, so derived UI must live on the data volume.
      FORGE_HUB_PATH: /app/data/hub.html
      FORGE_PUBLIC_ORIGIN: ${FORGE_PUBLIC_ORIGIN:?set the public HTTPS Forge URL}
      # Exposed only as a public repository/link origin in project views. The
      # gateway still uses the private FORGE_URL above for API and Git traffic.
      FORGEJO_PUBLIC_ORIGIN: ${FORGEJO_PUBLIC_ORIGIN:?set the public HTTPS Forgejo URL}
      FORGE_BUILD_ID: ${FORGE_GATEWAY_IMAGE:?set the digest-pinned gateway image}
      FORGE_ALLOWED_ORIGINS: ${FORGE_PUBLIC_ORIGIN:?set the public HTTPS Forge URL}
      FORGE_HTTPS: "1"
      FORGE_TRUST_PROXY: "1"
      FORGE_REGISTRATION_MODE: ${FORGE_REGISTRATION_MODE:-invite}
      # Invitations are high-entropy, single-use rows in Store 2. No reusable
      # cohort secret is exposed in the container environment.
      FORGE_INVITE_MODE: ${FORGE_INVITE_MODE:-database}
      FORGE_OPERATOR_NAME: ${FORGE_OPERATOR_NAME:?set the accountable service operator}
      FORGE_CONTACT_EMAIL: ${FORGE_CONTACT_EMAIL:?set support/privacy/moderation/takedown contact}
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8420/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      forgejo: { condition: service_healthy }
      db: { condition: service_healthy }
    networks: [edge, backend]
    pids_limit: 256
    mem_limit: 2g

  forgejo:
    image: ${FORGEJO_IMAGE:?set a tested digest-pinned FORGEJO_IMAGE}
    restart: unless-stopped
    init: true
    security_opt: [no-new-privileges:true]
    ports:
      # Git HTTP/LFS must be reachable by the host TLS proxy, but never on a
      # public interface directly.
      - "${FORGE_BIND_IP:-127.0.0.1}:${FORGEJO_BIND_PORT:-3000}:3000"
    volumes:
      - forgejo-data:/data
    secrets:
      - forge_db_password
      - forgejo_secret_key
      - forgejo_internal_token
      - forgejo_oauth2_jwt_secret
      - lfs_jwt_secret
      - r2_access_key
      - r2_secret_key
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      FORGEJO__security__INSTALL_LOCK: "true"
      FORGEJO__server__ROOT_URL: ${FORGEJO_PUBLIC_ORIGIN:?set the public HTTPS Forgejo URL}/
      FORGEJO__service__DISABLE_REGISTRATION: "true"
      # Every new source repository starts private. Forge promotes it only
      # after the rights index authorizes a public project.
      FORGEJO__repository__FORCE_PRIVATE: "true"
      FORGEJO__repository__DEFAULT_PRIVATE: private
      FORGEJO__database__DB_TYPE: postgres
      FORGEJO__database__HOST: db:5432
      FORGEJO__database__NAME: forgejo
      FORGEJO__database__USER: forgejo
      FORGEJO__database__PASSWD_URI: file:/run/secrets/forge_db_password
      # These values encrypt account data and sign internal/OAuth traffic.
      # They are part of the recovery identity of the installation: rotate by
      # an explicit key-migration procedure, never by recreating a container.
      # The container's environment-to-ini loader reads these files and
      # overwrites any generated app.ini values on every start.
      FORGEJO__security__SECRET_KEY__FILE: /run/secrets/forgejo_secret_key
      FORGEJO__security__INTERNAL_TOKEN__FILE: /run/secrets/forgejo_internal_token
      FORGEJO__oauth2__JWT_SIGNING_ALGORITHM: HS256
      FORGEJO__oauth2__JWT_SECRET__FILE: /run/secrets/forgejo_oauth2_jwt_secret
      FORGEJO__server__LFS_START_SERVER: "true"
      FORGEJO__server__LFS_JWT_SECRET__FILE: /run/secrets/lfs_jwt_secret
      FORGEJO__lfs__STORAGE_TYPE: minio
      FORGEJO__lfs__MINIO_ENDPOINT: ${R2_ACCOUNT_ID:?set the R2 account id}.r2.cloudflarestorage.com
      FORGEJO__lfs__MINIO_ACCESS_KEY_ID__FILE: /run/secrets/r2_access_key
      FORGEJO__lfs__MINIO_SECRET_ACCESS_KEY__FILE: /run/secrets/r2_secret_key
      FORGEJO__lfs__MINIO_BUCKET: ${R2_LFS_BUCKET:-forge-lfs}
      FORGEJO__lfs__MINIO_USE_SSL: "true"
      FORGEJO__lfs__MINIO_CHECKSUM_ALGORITHM: md5
      FORGEJO__lfs__SERVE_DIRECT: "false"
      FORGEJO__webhook__ALLOWED_HOST_LIST: gateway
    healthcheck:
      test: [CMD, curl, -fsS, http://127.0.0.1:3000/api/healthz]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    depends_on:
      db: { condition: service_healthy }
    networks: [edge, backend]

  db:
    image: ${POSTGRES_IMAGE:?set a digest-pinned POSTGRES_IMAGE}
    restart: unless-stopped
    shm_size: 256mb
    volumes:
      - pg-data:/var/lib/postgresql/data
      - ./initdb:/docker-entrypoint-initdb.d:ro
    secrets:
      - pg_super_password
      - forge_db_password
      - platform_db_password
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/pg_super_password
    healthcheck:
      test: [CMD-SHELL, pg_isready -U postgres -d postgres]
      interval: 10s
      timeout: 5s
      retries: 10
    networks: [backend]

secrets:
  forge_token: { file: "${FORGE_SECRET_DIR:-./.secrets}/forge-token" }
  pg_super_password: { file: "${FORGE_SECRET_DIR:-./.secrets}/pg-super-password" }
  forge_db_password: { file: "${FORGE_SECRET_DIR:-./.secrets}/forge-db-password" }
  platform_db_password: { file: "${FORGE_SECRET_DIR:-./.secrets}/platform-db-password" }
  forgejo_secret_key: { file: "${FORGE_SECRET_DIR:-./.secrets}/forgejo-secret-key" }
  forgejo_internal_token: { file: "${FORGE_SECRET_DIR:-./.secrets}/forgejo-internal-token" }
  forgejo_oauth2_jwt_secret: { file: "${FORGE_SECRET_DIR:-./.secrets}/forgejo-oauth2-jwt-secret" }
  lfs_jwt_secret: { file: "${FORGE_SECRET_DIR:-./.secrets}/lfs-jwt-secret" }
  r2_access_key: { file: "${FORGE_SECRET_DIR:-./.secrets}/r2-access-key" }
  r2_secret_key: { file: "${FORGE_SECRET_DIR:-./.secrets}/r2-secret-key" }

networks:
  edge: {}
  backend: { internal: true }

volumes:
  gateway-data: {}
  forgejo-data: {}
  pg-data: {}
