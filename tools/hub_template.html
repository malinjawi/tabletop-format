<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Forge — where games live</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--h:#1c2128;--bd:#d0d7de;--bg:#f6f8fa;--fg:#1f2328;--mut:#656d76;--acc:#8250df;--grn:#1a7f37;--red:#cf222e;--blu:#0969da;--org:#bc4c00}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--fg);background:#fff;font-size:14px;line-height:1.5}
a{color:var(--blu);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
/* top bar */
#top{background:var(--h);color:#fff;display:flex;align-items:center;gap:16px;padding:12px 24px}
#top .logo{font-weight:700;font-size:16px;color:#fff;display:flex;gap:8px;align-items:center}
#top input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:#fff;padding:5px 12px;width:280px;font-size:13px}
#top input::placeholder{color:#aab}
#top .nl{color:#d6dae0;font-size:14px}#top .nl:hover{color:#fff;text-decoration:none}
#top .spacer{flex:1}
#top .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#8c2f1b,#e0a458);border:1.5px solid rgba(255,255,255,.4)}
/* buttons & badges */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--bg);border-radius:6px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--fg);cursor:pointer}
.btn:hover{background:#eef1f4}
.btn.primary{background:var(--grn);border-color:var(--grn);color:#fff}.btn.primary:hover{background:#166f2f}
.count{background:rgba(175,184,193,.3);border-radius:20px;padding:0 7px;font-size:11px;font-weight:600;margin-left:5px}
.badge{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:1px 10px;font-size:12px;color:var(--mut)}
.badge.lic{color:var(--acc);border-color:var(--acc)}
.badge.legal{color:var(--grn);border-color:var(--grn)}.badge.illegal{color:var(--red);border-color:var(--red)}
.badge.prov{color:var(--org);border-color:var(--org)}
/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
/* explore */
.hero{background:var(--bg);border-bottom:1px solid var(--bd);padding:38px 0 30px}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:var(--mut);max-width:640px}
.gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:24px 0}
.gcard{border:1px solid var(--bd);border-radius:10px;padding:16px 18px;transition:box-shadow .15s}
.gcard:hover{box-shadow:0 3px 14px rgba(0,0,0,.1)}
.gcard h3{margin:0 0 4px;font-size:16px}.gcard .desc{color:var(--mut);font-size:13px;min-height:38px}
.gcard .thumbs{display:flex;gap:6px;margin:10px 0}.gcard .thumbs img{width:52px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.gcard .meta{display:flex;gap:14px;color:var(--mut);font-size:12px;margin-top:8px;align-items:center}
/* repo header */
.repohead{padding:18px 0 0;border-bottom:1px solid var(--bd)}
.repohead .titleline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.repohead h1{font-size:20px;font-weight:400;margin:0}
.repohead h1 b{font-weight:700}
.repohead .actions{margin-left:auto;display:flex;gap:8px}
.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto}
.tabs a{padding:9px 14px;border-bottom:2px solid transparent;color:var(--fg);font-size:14px;white-space:nowrap}
.tabs a:hover{text-decoration:none;border-bottom-color:#d0d7de}
.tabs a.on{border-bottom-color:#fd8c73;font-weight:600}
/* content */
.pane{padding:22px 0 60px}
.two{display:grid;grid-template-columns:1fr 296px;gap:28px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.box{border:1px solid var(--bd);border-radius:8px;margin-bottom:16px}
.box .bh{background:var(--bg);border-bottom:1px solid var(--bd);padding:9px 16px;font-weight:600;font-size:13px;border-radius:8px 8px 0 0}
.box .bb{padding:14px 16px}
.sideh{font-size:13px;font-weight:600;margin:0 0 8px}
.side .box .bb{font-size:13px}
/* cards tab */
.filterbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filterbar input,.filterbar select{border:1px solid var(--bd);border-radius:6px;padding:6px 12px;font-size:13px;background:var(--bg)}
.filterbar input{flex:1;min-width:200px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.ctile{cursor:pointer;transition:transform .12s;display:flex;flex-direction:column;align-items:center}.ctile:hover{transform:translateY(-3px)}
.ctile .cn{font-size:12px;color:var(--mut);text-align:center;margin-top:4px;width:100%}
/* history */
.commit{display:flex;gap:14px;padding:14px 16px;border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;cursor:pointer}
.commit:hover{background:var(--bg)}
.commit .dot{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#8c2f1b,#e0a458);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.commit .sub{font-weight:600}.commit .who{color:var(--mut);font-size:12px}
.chg{font-size:13px;padding:4px 0 4px 12px;border-left:2px solid var(--bd);margin:6px 0 0 6px}
.chg b{font-weight:600}
.old{background:#ffebe9;text-decoration:line-through;padding:0 5px;border-radius:3px}
.new{background:#dafbe1;padding:0 5px;border-radius:3px}
.exp{display:none;padding:0 16px 12px 60px}
.commit.open + .exp{display:block}
/* PR */
.pr{border:1px solid var(--bd);border-radius:8px;margin-bottom:16px}
.prh{padding:14px 18px;border-bottom:1px solid var(--bd)}
.prh h3{margin:0 0 3px;font-size:16px}
.prstate{background:var(--grn);color:#fff;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600}
.prstate.merged{background:#8250df}.prstate.closed{background:#57606a}
.revbadge{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;background:#eef;color:#3538cd}
.revbadge.approve{background:#e6f4ea;color:#1a7f37}.revbadge.request_changes{background:#fff1e5;color:#b35900}
.prbody{padding:16px 18px}
.prcard{display:flex;gap:20px;align-items:flex-start;border-top:1px solid #eaeef2;padding:16px 0;flex-wrap:wrap}
.prcard img{width:180px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.arrow{align-self:center;font-size:22px;color:var(--mut)}
.mergebar{background:var(--bg);border-top:1px solid var(--bd);padding:14px 18px;display:flex;gap:12px;align-items:center}
/* releases / banlist / decks */
.rel{border-left:3px solid var(--acc);padding:4px 0 4px 16px;margin-bottom:20px}
.rel h3{margin:0}.rel pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap}
blockquote{border-left:3px solid var(--org);margin:10px 0 0;padding:2px 14px;color:#57606a}
/* modal */
#modal{position:fixed;inset:0;background:rgba(28,33,40,.55);display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal .mbox{background:#fff;border-radius:12px;max-width:760px;width:92%;max-height:88vh;overflow-y:auto;display:flex;gap:22px;padding:24px}
#modal img{width:260px;border-radius:10px;align-self:flex-start;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#modal h2{margin:0 0 4px}
.kv{font-size:13px;margin:3px 0}.kv b{display:inline-block;min-width:90px;color:var(--mut);font-weight:500}
.emptystate{color:var(--mut);text-align:center;padding:40px 0}
.activity{font-size:13px;padding:7px 0;border-bottom:1px solid #eaeef2;display:flex;gap:8px}
.activity:last-child{border:none}
/* ---- in-hub card editor drawer ---- */
#drawer{position:fixed;inset:0;background:rgba(28,33,40,.5);display:none;z-index:60}
#drawer.on{display:block}
.dpanel{position:absolute;top:0;right:0;height:100%;width:min(940px,96vw);background:var(--bg2,#fff);box-shadow:-12px 0 40px rgba(0,0,0,.3);display:flex;flex-direction:column;transform:translateX(30px);opacity:0;transition:transform .22s ease,opacity .22s ease}
.editgrid{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.editcol-list{flex:0 0 190px;max-height:640px;overflow:auto}
.editcol-form{flex:1;min-width:300px}
.editcol-prev{flex:0 0 300px;position:sticky;top:12px}
.editcol-prev canvas{width:300px;height:420px;border-radius:16px;box-shadow:0 10px 34px rgba(0,0,0,.22)}
.editcol-list .ecardlist{flex-direction:column;align-items:stretch;gap:4px}
.editcol-list .epill{text-align:left}
.edhrow{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.edwrap{display:grid;grid-template-columns:minmax(190px,220px) minmax(0,1fr) minmax(280px,320px);border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:#fff;min-height:560px}
.edside{border-right:1px solid var(--bd);background:var(--bg);display:flex;flex-direction:column}
.edside .edsearch{padding:12px}
.edside .edsearch input{width:100%;padding:8px 11px;border:1px solid var(--bd);border-radius:8px;font-size:13px;box-sizing:border-box}
.edlist2{flex:1;overflow:auto;padding:0 6px 6px}
.edrow{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:14px;border-left:3px solid transparent}
.edrow:hover{background:#eceff2}
.edrow.sel{background:#fff;border-left-color:var(--acc);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.edrow .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(0,0,0,.15)}
.edrow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edrow .dd{width:7px;height:7px;border-radius:50%;background:var(--org);flex:0 0 auto}
.ednew{margin:6px 8px 10px;padding:9px;border:1px dashed var(--bd);border-radius:8px;text-align:center;color:var(--mut);cursor:pointer;font-size:13px}
.ednew:hover{border-color:var(--acc);color:var(--acc);background:#fff}
.edform{padding:24px 26px;overflow:auto;min-width:0}
.edprev{border-left:1px solid var(--bd);background:var(--bg);padding:22px 20px;display:flex;flex-direction:column;align-items:center}
.edprev canvas{width:292px;height:409px;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.2)}
.edcommit{margin-top:18px;width:100%;border-top:1px solid var(--bd);padding-top:14px}
.edcommit .msg{font-size:13px;line-height:1.5;margin-bottom:11px;min-height:32px;color:var(--mut)}
.edcommit .msg b{color:var(--fg)}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(130,80,223,.12)}
.fld.name input{font-size:17px;font-weight:600}
@media(max-width:960px){.edwrap{grid-template-columns:1fr}.edside,.edprev{border-right:none;border-left:none;border-bottom:1px solid var(--bd)}.edprev{align-items:flex-start}}
#drawer.on .dpanel{transform:none;opacity:1}
.dhead{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--bd)}
.dhead h2{margin:0;font-size:18px}.dhead .sub{color:var(--mut);font-size:13px}
.dbody{flex:1;overflow-y:auto;display:flex;gap:26px;padding:22px}
.dprev{flex:0 0 300px;position:sticky;top:0}
.dprev canvas{width:300px;height:420px;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.dprev .hint{color:var(--mut);font-size:12px;text-align:center;margin-top:10px}
.dform{flex:1;min-width:280px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;font:inherit;font-size:14px;background:#fff;box-sizing:border-box}
.fld textarea{min-height:84px;resize:vertical;line-height:1.5}
.fld .row{display:flex;gap:12px;flex-wrap:wrap}
.fld .row>div{min-width:88px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ecardlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.epill{border:1px solid var(--bd);background:#fff;border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer}
.epill.sel{background:var(--acc,#0969da);color:#fff;border-color:var(--acc,#0969da)}
.epill.new{border-style:dashed;color:var(--mut)}
.epill.dirty::after{content:"•";color:#d29922;margin-left:5px}
.dbar{border-top:1px solid var(--bd);padding:14px 22px;background:var(--bg2,#fff);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dbar .msg{flex:1;min-width:200px;font-size:13px}
.dbar .msg b{color:var(--fg,#1f2328)}
.dbar .msg .mut{color:var(--mut)}
.symbtn{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:2px 8px;font-size:13px;cursor:pointer}
.issrow{display:flex;gap:10px;align-items:flex-start;padding:11px 6px;border-bottom:1px solid var(--bd);cursor:pointer}
.issrow:hover{background:var(--bg2,#f6f8fa)}
.istatus.open{color:#1a7f37}.istatus.closed{color:#8250df}
.thread{display:flex;flex-direction:column;gap:10px}
.cmt{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;background:var(--bg2,#fff)}
.cmt-h{font-size:13px;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.cmt-b{font-size:14px;white-space:pre-wrap;line-height:1.5}
.av.sm{width:20px;height:20px;font-size:11px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#6e40c9;color:#fff}
/* ---- shared client card renderer (cardFrame): cards render FROM DATA, everywhere ---- */
/* .cf-* card-renderer CSS lives in the CF_CSS JS constant (see the
   "shared client card renderer" section in the page script) and is
   injected into this document's head at load time -- and into the
   print-sheet window -- from that one string, so the editor/modal/
   PR-diff card and the printed card can never drift out of sync. */
</style></head><body>
<div id="top">
  <a class="logo" onclick="go('')">⬡ <span>Forge</span><span style="opacity:.5;font-weight:400;font-size:12px">· where games live · prototype</span></a>
  <input id="q" placeholder="Search games and cards…" oninput="searchAll(this.value)">
  <a class="nl" onclick="go('')">Explore</a><a class="nl" onclick="go('jams')">Jams</a><a class="nl" onclick="showNotifs()" title="Notifications">🔔 Inbox</a>
  <div class="spacer"></div>
  <button class="btn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.35)" onclick="alert('Platform: creates a repo + format scaffold. CLI today: fmt import csv your.csv my-game')">+ New game</button>
  <span id="authArea"><div class="av" title="you"></div></span>
</div>
<div id="authModal" style="display:none;position:fixed;inset:0;background:rgba(28,33,40,.6);z-index:70;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;padding:26px 30px;width:340px">
    <h2 style="margin:0 0 4px" id="amTitle">Sign in</h2>
    <p style="color:var(--mut);font-size:13px;margin:0 0 14px">Stars, forks, and claims need an account. Your games never do.</p>
    <div id="amErr" style="display:none;color:var(--red);font-size:13px;margin-bottom:8px"></div>
    <input id="amHandle" placeholder="handle" style="width:100%;padding:9px 12px;margin:5px 0;border:1px solid var(--bd);border-radius:8px">
    <input id="amEmail" placeholder="email" style="width:100%;padding:9px 12px;margin:5px 0;border:1px solid var(--bd);border-radius:8px;display:none">
    <input id="amPass" type="password" placeholder="password (8+ chars)" style="width:100%;padding:9px 12px;margin:5px 0;border:1px solid var(--bd);border-radius:8px">
    <button class="btn primary" style="width:100%;margin-top:10px" onclick="authSubmit()">Continue</button>
    <div style="font-size:13px;color:var(--mut);margin-top:12px;text-align:center">
      <a id="amSwitch" onclick="authMode(amMode==='login'?'register':'login')">Create an account instead</a>
      · <a onclick="document.getElementById('authModal').style.display='none'">cancel</a>
    </div>
  </div>
</div>
<div id="view"></div>
<div id="modal" onclick="if(event.target===this)this.classList.remove('on')"><div class="mbox" id="mbody"></div></div>
<div id="drawer" onclick="if(event.target===this)closeEditor()"><div class="dpanel">
  <div class="dhead">
    <div style="flex:1"><h2 id="ed-title">Edit cards</h2><div class="sub" id="ed-sub"></div></div>
    <button class="btn" onclick="closeEditor()">Close ✕</button>
  </div>
  <div class="dbody">
    <div class="dprev">
      <canvas id="ed-canvas" width="600" height="840"></canvas>
      <div class="hint">live preview — updates as you type</div>
    </div>
    <div class="dform">
      <div class="ecardlist" id="ed-list"></div>
      <div id="ed-fields"></div>
    </div>
  </div>
  <div class="dbar">
    <div class="msg" id="ed-msg"></div>
    <button class="btn" id="ed-del" onclick="edDelete()" style="color:#cf222e">Delete card</button>
    <button class="btn primary" id="ed-commit" onclick="edCommit()">Commit</button>
  </div>
</div></div>
<script>
const DATA = __DATA__;
/* ---- live mode + auth + stars (feature: accounts & stars end-to-end) ---- */
let LIVE=false, ME=null, STARS={}, MYSTARS=new Set(), amMode="login";
const tok = () => localStorage.getItem("forge_token");
const authH = () => tok() ? {Authorization:"Bearer "+tok()} : {};
async function refreshLive(){
  try {
    const h = await (await fetch("/healthz")).json(); LIVE = !!h.ok;
    if(!LIVE) return;
    const gs = await (await fetch("/api/games")).json();
    for(const g of gs) STARS[g.slug]=g.stars??0;
    if(tok()){
      const r = await fetch("/api/me",{headers:authH()});
      if(r.ok){ ME=await r.json(); MYSTARS=new Set(ME.starred); }
      else localStorage.removeItem("forge_token");
    }
    renderAuthArea(); render();
  } catch{}
}
function renderAuthArea(){
  const el=document.getElementById("authArea");
  if(!LIVE){ el.innerHTML='<div class="av" title="you"></div>'; return; }
  el.innerHTML = ME
    ? `<span style="font-size:13px;color:#d6dae0">@${esc(ME.handle)}</span>
       <a class="nl" style="font-size:12px" onclick="localStorage.removeItem('forge_token');ME=null;MYSTARS=new Set();renderAuthArea();render()">sign out</a>`
    : `<button class="btn" style="background:#e0632f;color:#fff;border:none" onclick="authOpen()">Sign in</button>`;
}
function authOpen(mode){ authMode(mode||"login"); document.getElementById("authModal").style.display="flex"; }
function authMode(m){ amMode=m;
  document.getElementById("amTitle").textContent = m==="login"?"Sign in":"Create account";
  document.getElementById("amEmail").style.display = m==="register"?"":"none";
  document.getElementById("amSwitch").textContent = m==="login"?"Create an account instead":"I have an account";
  document.getElementById("amErr").style.display="none";
}
async function authSubmit(){
  const body={handle:document.getElementById("amHandle").value.trim(),
              password:document.getElementById("amPass").value};
  if(amMode==="register") body.email=document.getElementById("amEmail").value.trim();
  const r=await fetch(`/api/auth/${amMode}`,{method:"POST",
    headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();
  if(r.ok){ localStorage.setItem("forge_token",d.token);
    document.getElementById("authModal").style.display="none"; refreshLive(); }
  else { const e=document.getElementById("amErr"); e.textContent=d.error??r.status; e.style.display=""; }
}
async function toggleStar(slug, ev){
  ev?.stopPropagation?.();
  if(!ME){ authOpen(); return; }
  const method = MYSTARS.has(slug) ? "DELETE" : "PUT";
  const r = await fetch(`/api/stars/${slug}`,{method,headers:authH()});
  if(r.status===401){ authOpen(); return; }
  const d = await r.json();
  STARS[slug]=d.stars; d.starred?MYSTARS.add(slug):MYSTARS.delete(slug);
  render();
}
const starBtn = (slug) => LIVE
  ? `<button class="btn" onclick="toggleStar('${slug}',event)" title="${ME?"":"sign in to star"}">${MYSTARS.has(slug)?"★":"☆"} <span class="count">${STARS[slug]??0}</span></button>`
  : "";
let FORKED_FROM={};
async function forkGame(slug){
  if(!ME){ authOpen(); return; }
  const r=await fetch(`/api/games/${slug}/fork`,{method:"POST",headers:authH()});
  const d=await r.json();
  if(r.status===201){
    alert(`⑂ Forked! '${d.slug}' is yours — attribution to '${slug}' is committed (${d.commit}).\nTaking you to your copy…`);
    location.href=`/?t=${Date.now()}#/g/${d.slug}`; // reload → hub rebakes with the new game
  } else if(r.status===401){ authOpen(); }
  else toast(`✗ ${d.error??r.status}`);
}
refreshLive();
const $ = s => document.querySelector(s);
const esc = s => (s??"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;");
const G = slug => DATA.games.find(g=>g.slug===slug);

/* ================= SHARED CLIENT CARD RENDERER =================
 * cardFrame(g, c, opts) -> HTML string. A card rendered FROM DATA as a
 * plain styled div (no canvas, no iframe) — used by the card modal, the
 * live card editor preview, the PR visual diff, AND the print sheet
 * (printSheet(), below), so "what the card looks like" is always one
 * function away from "what the data says" -- the card you edit IS the
 * card that prints.
 * opts: {w:number|string (card width; a plain number is px, same as
 *          always -- try 120-150 for "small"; a CSS length string like
 *          "63.5mm" renders at TRUE PHYSICAL SIZE, used by printSheet()),
 *        highlight:Set|string[] (attribute keys to outline green — PR diff)}
 *
 * g.card_style selects an EXACT-LOOK physical template instead of the
 * generic data-driven frame below: "cah" (Cards Against Humanity) or
 * "playing-card" (standard French-suited card) — see cfCAH()/
 * cfPlayingCard(). Anything else (or unset) falls through to the
 * original generic/faction-aware frame. */

/* .cf-* CSS -- ONE string, injected into this document's <head> below
 * AND into the print-sheet window (printSheet()) so the on-screen card
 * and the printed card are guaranteed to share the same stylesheet. */
const CF_CSS = `
.cf-card{position:relative;width:230px;border-radius:12px;overflow:hidden;background:#fff;border:1px solid var(--bd);box-shadow:0 3px 12px rgba(0,0,0,.14);font-size:12px;display:flex;flex-direction:column}
.cf-card.cf-nr{border-left:8px solid var(--cf-fg,#8a8f98)}
.cf-card.cf-sm{width:120px;font-size:10px}
.cf-card.cf-sm .cf-name{font-size:11px}
.cf-card.cf-sm .cf-hd{padding:5px 7px}
.cf-hd{display:flex;align-items:center;gap:6px;background:var(--cf-bg,#eceff2);color:var(--cf-fg,#334);padding:7px 9px}
.cf-name{flex:1;font-weight:700;font-size:13px;line-height:1.2;overflow-wrap:anywhere}
.cf-badge{flex:none;min-width:22px;height:22px;padding:0 4px;border-radius:50%;background:var(--cf-fg,#334);color:#fff;font-size:12px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.cf-nrrow{display:flex;justify-content:space-between;align-items:center;gap:6px;padding:3px 9px;background:rgba(0,0,0,.04);flex-wrap:wrap}
.cf-pips{letter-spacing:1px;font-size:11px;color:var(--cf-fg,#334)}
.cf-nrnum{font-weight:800;font-size:13px;color:var(--cf-fg,#334);border-radius:5px;padding:0 3px}
.cf-tl{padding:4px 9px;font-size:10px;text-transform:uppercase;letter-spacing:.04em;color:var(--cf-fg,#556);background:rgba(0,0,0,.03);border-top:1px solid rgba(0,0,0,.05);border-bottom:1px solid rgba(0,0,0,.05)}
.cf-tx{padding:8px 9px;font-size:11.5px;line-height:1.42;color:#2a2e33;white-space:pre-wrap;flex:1}
.cf-sym{display:inline-block;min-width:14px;padding:0 4px;margin:0 1px;border-radius:4px;background:rgba(0,0,0,.12);font-size:10px;line-height:16px;text-align:center;vertical-align:-3px;font-weight:700}
.cf-ft{display:flex;flex-wrap:wrap;gap:4px;padding:6px 8px;border-top:1px solid rgba(0,0,0,.07);background:#fafbfc}
.cf-ab{border:1px solid var(--bd);border-radius:5px;padding:1px 6px;font-size:10px;color:#3a3f47;background:#fff;white-space:nowrap}
.cf-str{position:absolute;left:7px;bottom:7px;min-width:24px;height:24px;padding:0 3px;border-radius:6px;background:var(--cf-fg,#334);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;box-shadow:0 2px 6px rgba(0,0,0,.3)}
.cf-hl{outline:2px solid var(--grn);outline-offset:1px}
.cf-card.cf-cah{border:none;font-family:'Helvetica Neue',Helvetica,Arial,sans-serif;box-shadow:0 3px 14px rgba(0,0,0,.28)}

.cf-cah-ico{flex:none;font-size:1.2em;line-height:1}
.cf-cah-brand{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cf-cah-pick{position:absolute;right:6%;bottom:6%;background:#fff;color:#111;font-size:.6em;font-weight:800;border-radius:.3em;padding:.3em .6em;letter-spacing:.02em;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.cf-card.cf-pc{border:1px solid #ccc;background:#fff;font-family:Georgia,'Times New Roman',serif;color:#111}
.cf-pc-idx{position:absolute;display:flex;flex-direction:column;align-items:center;line-height:1;font-weight:700;color:var(--pc-color,#111)}

.cf-pc-idx.cf-pc-br{right:6%;bottom:5%}

.cf-pc-face{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.15em;color:var(--pc-color,#111)}

document.head.insertAdjacentHTML("beforeend", `<style>${CF_CSS}</style>`);

function cfSym(g){return (g.symbols||[]).reduce((m,s)=>(m[s.key]=s.glyph||("["+s.key+"]"),m),{});}
function cfRich(g,t){const sym=cfSym(g);
  return esc(t).replace(/\[([a-z0-9_]+)\]/gi,(m,k)=>`<span class="cf-sym">${esc(sym[k]||k)}</span>`);}
function cfColor(g,c){
  const fac=(c.attributes||{}).faction;
  if(fac!=null && g.faction_colors && g.faction_colors[fac]) return g.faction_colors[fac];
  return (g.type_colors||{})[c.type] || {fg:"#3a3f47",bg:"#e8eaed"};
}
/* opts.w normalizer: a plain number is px (every existing call site).
 * A CSS length string ("63.5mm") is used as-is for `width:` and also
 * converted to a px-equivalent for internal em/% math -- mm/cm/in
 * convert at the CSS-defined 96px = 1in = 25.4mm ratio, the same ratio
 * print engines honor at 100% scale, so a px font-size inside an
 * mm-wide card still prints at the right physical fraction of the card. */
function cfLen(w){
  if(typeof w==="number") return {css:w+"px", num:w};
  const m=/^([\d.]+)\s*(px|mm|cm|in)?$/.exec(String(w||"").trim());
  if(!m) return {css:"230px", num:230};
  const n=parseFloat(m[1]), unit=m[2]||"px";
  const num=unit==="mm"?n*96/25.4:unit==="cm"?n*96/2.54:unit==="in"?n*96:n;
  return {css:String(w).trim(), num};
}
const CF_SUIT_GLYPH={hearts:"♥",diamonds:"♦",clubs:"♣",spades:"♠"};
function cfSuitGlyph(g,suit){
  const s=(suit||"").toLowerCase();
  const sym=(g.symbols||[]).find(x=>x.key==="suit_"+s || (x.name||"").toLowerCase()===s);
  return (sym&&sym.glyph) || CF_SUIT_GLYPH[s] || "?";
}
function cfSuitColor(suit){
  const s=(suit||"").toLowerCase();
  return (s==="hearts"||s==="diamonds") ? "#d40000" : "#111111";
}
// Standard playing-card pip layout, [x%,y%] per rank, card-relative.
// Pips in the lower half (y>50) render rotated 180° so the card reads
// correctly from either end -- the same convention real cards use.
const CF_PIPS={
  2:[[50,20],[50,80]],
  3:[[50,15],[50,50],[50,85]],
  4:[[25,20],[75,20],[25,80],[75,80]],
  5:[[25,20],[75,20],[50,50],[25,80],[75,80]],
  6:[[25,18],[75,18],[25,50],[75,50],[25,82],[75,82]],
  7:[[25,15],[75,15],[50,32],[25,50],[75,50],[25,85],[75,85]],
  8:[[25,15],[75,15],[50,32],[25,50],[75,50],[50,68],[25,85],[75,85]],
  9:[[25,13],[75,13],[25,37],[75,37],[50,50],[25,63],[75,63],[25,87],[75,87]],
  10:[[25,13],[75,13],[50,26],[25,37],[75,37],[25,63],[75,63],[50,74],[25,87],[75,87]],
};
/* ---- card_style:"cah" -- exact physical Cards Against Humanity look:
 * pure black/white rounded card, heavy top-left text (blanks render as
 * the literal "____" already in the data), footer wordmark, and a
 * PICK-n badge on multi-pick black cards. ---- */
function cfCAH(g,c,ctx){
  const {wCss,w,hl}=ctx, at=c.attributes||{};
  const col=(g.type_colors||{})[c.type] || (c.type==="black"?{fg:"#ffffff",bg:"#111111"}:{fg:"#111111",bg:"#ffffff"});
  const base=15*(w/230);
  const pick=at.pick;
  const pickBadge=(c.type==="black" && Number(pick)>1)
    ? `<div class="cf-cah-pick${hl.has('pick')?' cf-hl':''}">PICK ${esc(pick)}</div>` : "";
  return `<div class="cf-card cf-cah" style="width:${wCss};aspect-ratio:63.5/88.9;border-radius:.8em;background:${col.bg};color:${col.fg};font-size:${base.toFixed(2)}px">
    <div class="cf-cah-tx">${cfRich(g,c.text||c.name||"")}</div>
    <div class="cf-cah-foot"><span class="cf-cah-ico">▪</span><span class="cf-cah-brand">Cards Against Humanity</span></div>
    ${pickBadge}
  </div>`;
}
/* ---- card_style:"playing-card" -- authentic French-suited playing
 * card: corner indices (bottom-right rotated 180°), and a centered
 * pip/face/ace layout driven by attributes.suit + attributes.rank. ---- */
function cfPlayingCard(g,c,ctx){
  const {wCss,w,hl}=ctx, at=c.attributes||{};
  const suit=at.suit||"", rank=String(at.rank??"").toUpperCase();
  const glyph=cfSuitGlyph(g,suit), color=cfSuitColor(suit);
  const base=15*(w/230);
  const idx=(cls,rot)=>`<div class="cf-pc-idx ${cls}${rot?' cf-pc-rot':''}"><div class="cf-pc-rank">${esc(rank)}</div><div class="cf-pc-suit">${esc(glyph)}</div></div>`;
  let center;
  if(rank==="A"){
    center=`<div class="cf-pc-ace">${esc(glyph)}</div>`;
  } else if(rank==="J"||rank==="Q"||rank==="K"){
    center=`<div class="cf-pc-face"><div class="cf-pc-face-letter">${esc(rank)}</div><div class="cf-pc-face-suit">${esc(glyph)}</div></div>`;
  } else {
    const n=parseInt(rank,10)||Number(at.rank_value)||0;
    const pos=CF_PIPS[n]||[];
    center=`<div class="cf-pc-pips">${pos.map(([x,y])=>`<span class="cf-pc-pip${y>50?' cf-pc-rot':''}" style="left:${x}%;top:${y}%">${esc(glyph)}</span>`).join("")}</div>`;
  }
  const hlCard=hl.has('suit')||hl.has('rank')||hl.has('rank_value');
  return `<div class="cf-card cf-pc${hlCard?' cf-hl':''}" style="width:${wCss};aspect-ratio:63.5/88.9;border-radius:.8em;font-size:${base.toFixed(2)}px;--pc-color:${color}">
    ${idx('cf-pc-tl',false)}
    ${center}
    ${idx('cf-pc-br',true)}
  </div>`;
}
function cardFrame(g, c, opts){
  opts=opts||{};
  const wi=cfLen(opts.w||230), w=wi.num, wCss=wi.css, small=w<180;
  const hl=opts.highlight instanceof Set?opts.highlight:new Set(opts.highlight||[]);
  if(g.card_style==="cah") return cfCAH(g,c,{w,wCss,small,hl});
  if(g.card_style==="playing-card") return cfPlayingCard(g,c,{w,wCss,small,hl});
  const at=c.attributes||{}, defs=g.schema||g.attribute_definitions||[];
  const col=cfColor(g,c), nr=at.faction!=null;
  const used=new Set(["cost"]);
  const ab=(label,val,key)=>`<span class="cf-ab${hl.has(key)?' cf-hl':''}">${esc(label)}: ${esc(val)}</span>`;
  let nrRow="";
  if(nr && at.influence!=null){ used.add("influence");
    nrRow+=`<div class="cf-nrrow"><span class="cf-pips${hl.has('influence')?' cf-hl':''}" title="influence ${esc(at.influence)}">${"●".repeat(Math.max(0,Math.min(Number(at.influence)||0,10)))}</span></div>`; }
  if(nr && c.type==="agenda"){ used.add("advancement_cost"); used.add("agenda_points");
    nrRow+=`<div class="cf-nrrow"><span class="cf-nrnum${hl.has('advancement_cost')?' cf-hl':''}" title="advancement requirement">${esc(at.advancement_cost??"?")}</span><span class="cf-nrnum${hl.has('agenda_points')?' cf-hl':''}" title="agenda points">${esc(at.agenda_points??"?")}⬡ pts</span></div>`;
  } else if(nr && c.type==="identity"){ used.add("minimum_deck_size"); used.add("influence_limit");
    nrRow+=`<div class="cf-nrrow"><span class="cf-nrnum${hl.has('minimum_deck_size')?' cf-hl':''}" title="minimum deck size">${esc(at.minimum_deck_size??"?")} cards</span><span class="cf-nrnum${hl.has('influence_limit')?' cf-hl':''}" title="influence limit">inf ${esc(at.influence_limit??"—")}</span></div>`;
  }
  const strengthEl=(nr && c.type==="ice" && at.strength!=null)
    ? (used.add("strength"), `<span class="cf-str${hl.has('strength')?' cf-hl':''}" title="strength">${esc(at.strength)}</span>`) : "";
  const footer=defs.filter(d=>(d.type==="integer"||d.type==="number")&&!used.has(d.key)&&at[d.key]!=null)
    .map(d=>ab(d.name||d.key, at[d.key], d.key)).join("");
  const sub=(c.subtypes||[]).join(" · ");
  return `<div class="cf-card${nr?' cf-nr':''}${small?' cf-sm':''}" style="width:${wCss};--cf-fg:${col.fg};--cf-bg:${col.bg}">
    <div class="cf-hd"><span class="cf-name">${esc(c.name||"Untitled")}</span>${at.cost!=null?`<span class="cf-badge${hl.has('cost')?' cf-hl':''}" title="cost">${esc(at.cost)}</span>`:""}</div>
    ${nrRow}
    <div class="cf-tl">${esc(c.type||"card")}${sub?" · "+esc(sub):""}</div>
    ${small?"":`<div class="cf-tx">${cfRich(g,c.text||"")}</div>`}
    ${footer?`<div class="cf-ft">${footer}</div>`:""}
    ${strengthEl}
  </div>`;
}

/* ================= PRINT SHEET =================
 * printSheet(slug) -- the "not a preview" proof: opens a standalone
 * window and renders EVERY card in the game through the exact same
 * cardFrame() used by the editor/modal/PR-diff, at TRUE PHYSICAL SIZE
 * (63.5mm x 88.9mm -- standard poker/trading-card trim size), laid out
 * 3x3 per page with 5mm gaps and light cut lines. Same CF_CSS string as
 * the hub page, so there is no second "print renderer" to drift out of
 * sync -- what you edit is literally what prints. Works for every
 * card_style (cah, playing-card, and the generic/faction frame) because
 * cardFrame() itself dispatches on g.card_style; this function just asks
 * for the cards at a millimeter width instead of a pixel one. */
function printSheet(slug){
  const g = G(slug);
  if(!g){ toast("No such game."); return; }
  const win = window.open("", "_blank", "width=980,height=1040");
  if(!win){ toast("Pop-up blocked — allow pop-ups for this site to print cards."); return; }
  const cards = g.cards||[];
  const CARD_W_MM = 63.5, CARD_H_MM = 88.9, GAP_MM = 5, MARGIN_MM = 10, PER_PAGE = 9;
  const pageW = (MARGIN_MM*2 + CARD_W_MM*3 + GAP_MM*2).toFixed(1);
  const pageH = (MARGIN_MM*2 + CARD_H_MM*3 + GAP_MM*2).toFixed(1);
  const pages = [];
  for(let i=0;i<cards.length;i+=PER_PAGE) pages.push(cards.slice(i,i+PER_PAGE));
  if(!pages.length) pages.push([]);
  const pageHtml = pages.map(pageCards => `<div class="ps-page">${
    pageCards.map(c => `<div class="ps-card">${cardFrame(g, c, {w:`${CARD_W_MM}mm`})}</div>`).join("")
  }</div>`).join("");
  const doc = `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>${esc(g.title)} — print sheet</title>
<style>
${CF_CSS}
*{box-sizing:border-box}
html,body{margin:0;background:#e9ebee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1f2328}
@page{size:${pageW}mm ${pageH}mm;margin:${MARGIN_MM}mm}
.ps-note{max-width:${pageW}mm;margin:14px auto 0;padding:0 4px;font-size:13px;line-height:1.5;color:#444}
.ps-note b{color:#111}
.ps-toolbar{max-width:${pageW}mm;margin:10px auto 16px;padding:0 4px;display:flex;gap:10px}
.ps-toolbar button{font:inherit;font-size:13px;font-weight:600;padding:7px 16px;border:1px solid #8a8f98;border-radius:6px;background:#fff;cursor:pointer}
.ps-toolbar button:hover{background:#f0f1f3}
.ps-page{width:${pageW}mm;min-height:${pageH}mm;margin:0 auto 24px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25);padding:${MARGIN_MM}mm;display:grid;grid-template-columns:repeat(3,${CARD_W_MM}mm);grid-auto-rows:${CARD_H_MM}mm;gap:${GAP_MM}mm;justify-content:start}
.ps-card{position:relative;width:${CARD_W_MM}mm;height:${CARD_H_MM}mm;overflow:hidden;outline:.5pt dashed #b7bcc4;outline-offset:1.5mm}
.ps-card .cf-card{width:100%;height:100%}
@media print{
  html,body{background:#fff}
  .ps-note,.ps-toolbar{display:none}
  .ps-page{box-shadow:none;margin:0;break-after:page;page-break-after:always}
  .ps-page:last-child{break-after:auto;page-break-after:auto}
  .ps-card{outline-color:#ccc}
}
</style></head>
<body>
<div class="ps-note"><b>${esc(g.title)}</b> — ${cards.length} card${cards.length===1?"":"s"}, ${pages.length} page${pages.length===1?"":"s"} at true size (${CARD_W_MM}mm × ${CARD_H_MM}mm / 2.5in × 3.5in per card). <b>Print at 100% scale</b> — turn off "fit to page" / "shrink to fit" in the print dialog, or choose "Save as PDF" for an exact-size file. Light dashed lines mark cut edges, not ink.</div>
<div class="ps-toolbar"><button onclick="window.print()">🖨 Print</button><button onclick="window.close()">Close</button></div>
${pageHtml}
</body></html>`;
  win.document.open(); win.document.write(doc); win.document.close();
}

/* ---------- router ---------- */
function go(hash){ location.hash = hash; }
window.onhashchange = render;
function render(){
  const h = location.hash.replace(/^#\/?/,"");
  const [_, slug, tab, mode] = h.match(/^g\/([^/]+)(?:\/(\w+))?(?:\/(\w+))?/) || [];
  const [__, jamId] = h.match(/^jam\/([^/]+)/) || [];
  const [___, userName] = h.match(/^u\/(.+)/) || [];
  if (slug && G(slug)) repoPage(G(slug), tab||"overview", mode);
  else if (jamId) jamPage(jamId);
  else if (h === "jams") jamsPage();
  else if (userName) profilePage(decodeURIComponent(userName));
  else explorePage();
  window.scrollTo(0,0);
}
const person = name => (DATA.people||[]).find(p=>p.name===name);
const userLink = name => person(name) ? `<a onclick="go('u/${encodeURIComponent(name)}')">${esc(name)}</a>` : esc(name);

async function showNotifs(){

  const d=await (await fetch("/api/notifications",{headers:authHdr()})).json();

async function syncPull(slug,dry){
  const out=$("#sync-out"); if(out)out.innerHTML="<span style='color:var(--mut);font-size:13px'>Reading the sheet…</span>";
  const r=await fetch(`/api/games/${slug}/sync/pull${dry?"?dry=1":""}`,{method:"POST",headers:authHdr()});

  if(out)out.innerHTML=(dry?`<div style="font-size:13px;color:var(--mut);margin-bottom:6px">${ch.length} change${ch.length===1?"":"s"} waiting — nothing committed yet.</div>`:"")+ch.map(chgHtml).join("");

    ov.appendChild(box); document.body.appendChild(ov);
    const done=v=>{ov.remove();resolve(v);};

function edSet(key,val){
  const c=edCard(); if(!c)return;
  if(key==="__subtypes"){c.subtypes=val.split(",").map(s=>s.trim()).filter(Boolean);}
  else if(key==="__keywords"){c.keywords=val.split(",").map(s=>s.trim()).filter(Boolean);}
  else if(key==="deck_limit"){c.deck_limit=val===""||val==null?null:Number(val);}
  else if(key.startsWith("attributes.")){c.attributes=c.attributes||{};const k=key.slice(11);
    if(val===""||val==null||(typeof val==="number"&&isNaN(val)))delete c.attributes[k];else c.attributes[k]=val;}
  else c[key]=val;
  edRefreshDirty();
  edRowSync();      // update only the current sidebar row (no form rebuild = no focus loss)
  edPreview(); edBar();
}
// update just the active card's sidebar row text/dot — never touches the form inputs
function edRowSync(){
  const c=edCard(); if(!c)return;
  const row=document.querySelector(`.edrow.sel .nm`);
  if(row) row.textContent=c.name||c.id;
  const dot=document.querySelector(`.edrow.sel .dot`);
  const g=G(ED.slug); if(dot) dot.style.background=((g.type_colors||{})[c.type]||{}).fg||"#9aa0a6";
  const r=document.querySelector(`.edrow.sel`);

}

  const s=el.selectionStart??el.value.length; el.value=el.value.slice(0,s)+token+el.value.slice(el.selectionEnd??s);
  el.focus(); el.selectionStart=el.selectionEnd=s+token.length; edSet(key,el.value);}
function edAdd(){

function edSummary(){ // mirror carddiff.summarize titles
  const changed=[],added=[],removed=[];
  const om=new Map(ED.orig.map(c=>[c.id,c])),nm=new Map(ED.cards.map(c=>[c.id,c]));
  for(const[id,o]of om){const n=nm.get(id);if(!n)removed.push(o.name);else if(JSON.stringify(o)!==JSON.stringify(n))changed.push(n.name);}
  for(const[id,n]of nm)if(!om.has(id))added.push(n.name);
  const parts=[];const names=[...changed,...added.map(a=>a+" (new)"),...removed.map(r=>r+" (removed)")];
  const n=changed.length+added.length+removed.length;
  if(!n)return null;
  const verb=changed.length&&!added.length&&!removed.length?"changed":"updated";
  return {title:`cards: ${verb} ${n} card${n===1?"":"s"} (${names.slice(0,3).join(", ")}${names.length>3?", …":""})`, n};
}
function edBar(){

async function edCommit(){
  const s=edSummary(); if(!s)return;
  if(!LIVE){ toast("<b>Preview mode</b><br>Run <code>node server.mjs</code> to commit these changes."); return; }
  const btn=$("#ed-commit"); btn.disabled=true; const was=btn.textContent; btn.textContent="Saving…";
  try{
    if(ED.access.canWrite){
      const r=await fetch(`/api/games/${ED.slug}/cards`,{method:"PUT",headers:{"content-type":"application/json",...edToken()},body:JSON.stringify(ED.cards)});
      const d=await r.json();
      if(r.status===200&&d.saved){toast(`<b>✓ Committed ${esc(d.commit)}</b><br>${esc(d.message)}<br><span style="opacity:.7">Now in ${esc(ED.slug)}'s history.</span>`);closeEditorForce();await reload();}
      else if(r.status===422)toast(`<b style="color:#ffa198">✗ Validation failed</b><br>`+(d.report||[]).filter(l=>l.includes("ERROR")).slice(0,3).map(esc).join("<br>"),9000);
      else if(r.status===403&&d.propose){ED.access.canWrite=false;$("#ed-commit").textContent="Propose as PR";toast("You don't have write access — switching to propose.",6000);}
      else toast(`<b style="color:#ffa198">✗ ${esc(d.error||r.status)}</b>`,8000);
    } else {

      const r=await fetch(`/api/games/${ED.slug}/cards/propose`,{method:"POST",headers:{"content-type":"application/json",...edToken()},body:JSON.stringify({cards:ED.cards,title})});
      const d=await r.json();

      else toast(`<b style="color:#ffa198">✗ ${esc(d.error||r.status)}</b>`,8000);
    }
  }catch(e){toast(`<b style="color:#ffa198">✗ ${esc(e.message)}</b>`,8000);}
  btn.disabled=false; btn.textContent=was; edBar();
}

// visual PR diff: cardFrame(before) -> cardFrame(after) per touched card, using
// the small (before_cards/after_cards) payload the PR-detail route now sends.
// Changed numeric attributes get a green outline on the AFTER card.
function prVisualDiff(g,pr){
  const before=Object.fromEntries((pr.before_cards||[]).map(c=>[c.id,c]));
  const after=Object.fromEntries((pr.after_cards||[]).map(c=>[c.id,c]));
  if(!g||(!pr.before_cards&&!pr.after_cards))return"";
  const byCard={};
  for(const ch of (pr.changes||[])){
    const e=byCard[ch.card]||(byCard[ch.card]={kind:ch.kind,attrs:new Set()});
    e.kind=ch.kind;
    if(ch.kind==="changed"&&String(ch.field).startsWith("attributes."))e.attrs.add(ch.field.slice(11));
  }
  const ids=[...new Set((pr.changes||[]).map(c=>c.card))];
  const cells=ids.map(cid=>{
    const info=byCard[cid]||{kind:"changed",attrs:new Set()}, b=before[cid], a=after[cid];
    if(info.kind==="added"&&a) return `<div class="prcard"><div style="text-align:center">${cardFrame(g,a,{w:150})}<div style="font-size:11px;color:var(--grn);margin-top:4px;font-weight:600">+ added</div></div></div>`;
    if(info.kind==="removed"&&b) return `<div class="prcard"><div style="text-align:center;opacity:.5;filter:grayscale(.6)">${cardFrame(g,b,{w:150})}<div style="font-size:11px;color:var(--red);margin-top:4px;font-weight:600">− removed</div></div></div>`;
    if(b&&a) return `<div class="prcard"><div>${cardFrame(g,b,{w:150})}</div><div class="arrow">→</div><div>${cardFrame(g,a,{w:150,highlight:info.attrs})}</div></div>`;
    return "";
  }).join("");
  return cells?`<div style="margin-bottom:6px">${cells}</div>`:"";
}

function play(g){ window._ps={g,deckIdx:0,seed:String(Math.floor(Math.random()*1e6)),lib:[],hand:[],board:[],discard:[],life:20,turn:1,started:false}; renderPlay(); }
function _prng(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;} let a=(h>>>0)||1; return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;}; }
function _pshuffle(arr,s){ const r=_prng(s); const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function _plibrary(g,deck){ const byId=Object.fromEntries(g.cards.map(c=>[c.id,c])); let ids=[]; if(deck&&deck.cards){for(const [cid,n] of Object.entries(deck.cards)){for(let i=0;i<n;i++) ids.push(cid);}} else ids=g.cards.map(c=>c.id); return ids.map(id=>byId[id]).filter(Boolean); }
function playStart(){ const S=window._ps; const el=document.getElementById("pl-seed"); if(el)S.seed=el.value.trim()||S.seed; const deck=(S.g.decks||[])[S.deckIdx]; S.lib=_pshuffle(_plibrary(S.g,deck),S.seed); S.hand=S.lib.splice(0,7); S.board=[]; S.discard=[]; S.life=20; S.turn=1; S.started=true; renderPlay(); }
function playNew(){ window._ps.seed=String(Math.floor(Math.random()*1e6)); playStart(); }
function playDeckSel(i){ window._ps.deckIdx=i; playStart(); }
function pDraw(){ const S=window._ps; if(S.lib.length){S.hand.push(S.lib.shift());renderPlay();} }
function pPlay(i){ const S=window._ps; const c=S.hand.splice(i,1)[0]; if(c){S.board.push(c);renderPlay();} }
function pBoardDisc(i){ const S=window._ps; const c=S.board.splice(i,1)[0]; if(c){S.discard.push(c);renderPlay();} }
function pReturn(i){ const S=window._ps; const c=S.board.splice(i,1)[0]; if(c){S.hand.push(c);renderPlay();} }
function pLife(d){ window._ps.life+=d; renderPlay(); }
function pTurn(){ window._ps.turn++; pDraw(); }

const JSTATUS = {upcoming:["#0969da","Starts soon"],running:["#1a7f37","● Running"],judging:["#bc4c00","Judging"],complete:["#656d76","Complete"]};
function jamCountdown(j){
  const now=new Date(); const end=new Date(j.ends+"T23:59:59"); const start=new Date(j.starts);
  if(j.status==="running"){ const d=Math.max(0,Math.ceil((end-now)/864e5)); return `${d} day${d===1?"":"s"} left`; }
  if(j.status==="upcoming"){ const d=Math.max(0,Math.ceil((start-now)/864e5)); return `starts in ${d} day${d===1?"":"s"}`; }
  return j.status==="judging" ? "entries closed — judging underway" : "finished";
}

async function joinJam(id){
  if(!ME){ toast("Sign in to join this jam."); return; }
  const r=await fetch(`/api/jams/${id}/join`,{method:"POST",headers:authHdr()});
  const d=await r.json().catch(()=>({}));
  if(r.status===201){ toast("You're in — a starter game was forked into your account. Opening it…"); setTimeout(()=>{ location.hash="#/g/"+d.slug; location.reload(); },900); }
  else toast(d.error||"Couldn't join.");
}
async function submitJam(id){
  if(!ME){ toast("Sign in to submit."); return; }
  const v=await askForm("Submit a game to this jam",[{name:"game",label:"Slug of a game you own",placeholder:"my-game"}],"Submit");
  if(!v||!v.game) return;
  const r=await fetch(`/api/jams/${id}/submit`,{method:"POST",headers:authHdr(),body:JSON.stringify({game:v.game})});
  const d=await r.json().catch(()=>({}));
  if(r.status===201){ toast("Submitted — your entry qualifies! 🎉"); renderJamEntries(id); }
  else toast((d.error||"Submit failed")+(d.reasons?": "+d.reasons.join("; "):""));
}
async function renderJamEntries(id){
  let data; try{ data=await (await fetch(`/api/jams/${id}`)).json(); }catch{ return; }
  if(!data||!Array.isArray(data.entries)) return;
  const box=$("#jam-entries"); if(!box) return;
  const es=data.entries;
  const cnt=box.parentElement&&box.parentElement.querySelector(".count"); if(cnt)cnt.textContent=es.length;
  if(!es.length){ box.innerHTML="<div class='emptystate'>No entries yet — be first.</div>"; return; }
  const slugs=new Set(es.map(e=>e.game_slug));
  const kids=s=>es.filter(e=>e.forked_from===s);
  const roots=es.filter(e=>!e.forked_from||!slugs.has(e.forked_from));
  const row=(e,depth)=>`<div style="display:flex;gap:10px;align-items:center;margin:9px 0;padding-left:${depth*22}px">
      ${depth?'<span style="color:var(--mut)">↳</span>':''}
      <div style="flex:1"><b><a onclick="go('g/${e.game_slug}')">${esc(e.title)}</a></b>
        ${e.qualified?'<span class="revbadge approve">✓ qualifies</span>':'<span class="revbadge request_changes">needs work</span>'}
        ${e.award?`<span class="badge" style="color:var(--org);border-color:var(--org)">${esc(e.award)}</span>`:""}
        <div style="color:var(--mut);font-size:12.5px">${e.author?"by "+userLink(e.author):"host entry"}${e.forked_from&&slugs.has(e.forked_from)?" · remix of "+esc(e.forked_from):""}</div></div>
    </div>${kids(e.game_slug).map(k=>row(k,depth+1)).join("")}`;
  box.innerHTML=roots.map(e=>row(e,0)).join("");
}

function community(g){
  const c = g.community || {};
  const gov = c.governance || {};
  const govLabel = {lead:"👑 Lead designer decides",council:"🏛 Council of maintainers",open:"🌊 Open — playtest bar decides"}[gov.model] || "Not declared";
  const statusStyle = {idea:"var(--mut)",in_design:"var(--blu)",playtesting:"var(--org)",released:"var(--grn)",parked:"var(--mut)"};
  const statusLabel = {idea:"idea",in_design:"in design",playtesting:"playtesting",released:"released",parked:"parked"};
  $("#pane").innerHTML = `<div class="two"><div>
    <div class="box"><div class="bh">Governance — how this game is led</div><div class="bb">
      <div style="font-size:15px;font-weight:600;margin-bottom:6px">${govLabel}</div>
      ${gov.maintainers?`<div class="kv"><b>Maintainers</b>${gov.maintainers.map(esc).join(", ")}</div>`:""}
      ${gov.decision_process?`<p style="font-size:13px;color:#444">${esc(gov.decision_process)}</p>`:""}
      <div style="color:var(--mut);font-size:12px">Disagree with the direction? <b>Fork it.</b> That's the appeal process — and great forks get linked back.</div>
    </div></div>
    ${(c.open_calls||[]).length?`<div class="box"><div class="bh">🙋 Help wanted</div><div class="bb">
      ${c.open_calls.map(o=>`<div style="margin:10px 0"><span class="badge" style="color:var(--org);border-color:var(--org);font-weight:600">${esc(o.role)}</span>
        <span style="font-size:13px"> ${esc(o.note)}</span></div>`).join("")}
    </div></div>`:""}
    ${(c.roadmap||[]).length?`<div class="box"><div class="bh">🗺 Roadmap</div><div class="bb">
      ${c.roadmap.map(r=>`<div style="display:flex;gap:12px;align-items:baseline;margin:9px 0">
        <span class="badge" style="color:${statusStyle[r.status]};border-color:currentColor;min-width:86px;text-align:center">${statusLabel[r.status]}</span>
        <div><b>${esc(r.title)}</b>${r.target?` <span style="color:var(--mut);font-size:12px">· ${esc(r.target)}</span>`:""}
        ${r.notes?`<div style="color:var(--mut);font-size:12.5px">${esc(r.notes)}</div>`:""}</div></div>`).join("")}
    </div></div>`:""}
    ${g.design_html?`<div class="box"><div class="bh">📓 Design notes — the why behind the what</div><div class="bb" style="max-width:700px">${g.design_html}</div></div>`:""}
  </div><div class="side">
    <div class="box"><div class="bh">Credits <span style="font-weight:400;color:var(--mut)">· auto-generated</span></div><div class="bb">
      ${g.credit_roll.slice().sort((a,b)=>(b.commits+b.sessions)-(a.commits+a.sessions)).map(p=>`
        <div style="display:flex;gap:10px;align-items:center;margin:9px 0">
          <div class="dot" style="width:26px;height:26px;font-size:12px;border-radius:50%;background:linear-gradient(135deg,#8c2f1b,#e0a458);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">${esc(p.name[0].toUpperCase())}</div>
          <div><b style="font-size:13px">${userLink(p.name)}</b><br><span style="font-size:11.5px;color:var(--mut)">${p.roles.map(esc).join(", ")}${p.commits?` · ${p.commits} commit${p.commits!==1?"s":""}`:""}${p.sessions?` · ${p.sessions} session${p.sessions!==1?"s":""}`:""}</span></div>
        </div>`).join("")}
      <div style="color:var(--mut);font-size:11.5px;margin-top:10px">Playtesters are credited automatically — showing up to break the game is a contribution. <code>fmt credits</code></div>
    </div></div>
  </div></div>`;
  if(typeof LIVE!=="undefined"&&LIVE) liveCollab(g);
}
async function liveCollab(g){
  let list; try{ list=await (await fetch(`/api/games/${g.slug}/collaborators`)).json(); }catch{ return; }
  if(!Array.isArray(list)) return;
  const side=document.querySelector("#pane .side"); if(!side) return;
  const canManage=(typeof ME!=="undefined"&&ME);
  const box=document.createElement("div"); box.className="box";
  box.innerHTML=`<div class="bh">👥 Collaborators</div><div class="bb">
    ${list.length?list.map(c=>`<div style="display:flex;justify-content:space-between;align-items:center;margin:7px 0;font-size:13px"><span><b>${esc(c.handle)}</b> <span style="color:var(--mut)">· ${esc(c.role||"maintainer")}</span></span>${canManage?`<button class="btn" style="padding:2px 8px" onclick="revokeCollab('${g.slug}','${esc(c.handle)}')">remove</button>`:""}</div>`).join(""):"<div style='color:var(--mut);font-size:13px'>No collaborators yet.</div>"}
    ${canManage?`<div style="margin-top:10px;display:flex;gap:6px"><input id="collab-h" placeholder="handle to invite" style="flex:1;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;font:inherit"><button class="btn primary" onclick="addCollab('${g.slug}')">Invite</button></div>`:""}
    <div style="color:var(--mut);font-size:11.5px;margin-top:8px">Collaborators commit directly; everyone else forks + proposes. (Owner-only to change.)</div>
  </div>`;
  const _exc=document.getElementById("collab-box"); if(_exc)_exc.remove(); box.id="collab-box";
  side.appendChild(box);
}
async function addCollab(slug){ const el=$("#collab-h"); const handle=((el&&el.value)||"").trim(); if(!handle)return;
  const r=await fetch(`/api/games/${slug}/collaborators/${encodeURIComponent(handle)}`,{method:"PUT",headers:authHdr()}); const d=await r.json().catch(()=>({}));
  if(r.ok){toast(`Invited ${handle}`);community(G(slug));}else toast(d.error||"couldn't invite (owner only)"); }
async function revokeCollab(slug,handle){
  const r=await fetch(`/api/games/${slug}/collaborators/${encodeURIComponent(handle)}`,{method:"DELETE",headers:authHdr()}); const d=await r.json().catch(()=>({}));
  if(r.ok){toast(`Removed ${handle}`);community(G(slug));}else toast(d.error||"couldn't remove"); }

render();
</script></body></html>
