<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Forge — where games live</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Barlow+Condensed:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--h:#1c2128;--bd:#d0d7de;--bg:#f6f8fa;--fg:#1f2328;--mut:#656d76;--acc:#8250df;--grn:#1a7f37;--red:#cf222e;--blu:#0969da;--org:#bc4c00}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--fg);background:#fff;font-size:14px;line-height:1.5}
a{color:var(--blu);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
a:focus-visible,button:focus-visible,summary:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid rgba(9,105,218,.34);outline-offset:2px}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
/* top bar */
#top{background:var(--h);color:#fff;display:flex;align-items:center;gap:12px;padding:10px 24px;min-height:54px}
#top .logo{font-weight:750;font-size:16px;color:#fff;display:flex;gap:7px;align-items:center;white-space:nowrap}
#top .brand-note{opacity:.5;font-weight:400;font-size:12px}
#top input,#top textarea{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:7px;color:#fff;padding:6px 11px;width:clamp(180px,24vw,320px);height:32px;font-family:inherit;font-size:13px;line-height:18px;resize:none;overflow:hidden}
#top input::placeholder,#top textarea::placeholder{color:#aab}
#top .nl{color:#d6dae0;font-size:14px}#top .nl:hover{color:#fff;text-decoration:none}
#top .topnav{display:flex;align-items:center;gap:13px;white-space:nowrap}
#top .compact-label{display:none}
#top .spacer{flex:1}
#top .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#8c2f1b,#e0a458);border:1.5px solid rgba(255,255,255,.4)}
#authArea{display:flex;align-items:center;white-space:nowrap}
.account-menu{position:relative}.account-menu summary{list-style:none;color:#d6dae0;font-size:13px;cursor:pointer;padding:5px 7px;border-radius:6px}.account-menu summary::-webkit-details-marker{display:none}.account-menu summary:hover{background:#ffffff12;color:#fff}.account-popover{position:absolute;right:0;top:calc(100% + 7px);z-index:95;width:150px;padding:6px;background:#fff;border:1px solid var(--bd);border-radius:8px;box-shadow:0 10px 30px #0003}.account-popover button{display:block;width:100%;min-height:44px;padding:7px 9px;border:0;background:none;text-align:left;font:inherit;color:var(--fg);cursor:pointer;border-radius:5px}.account-popover button:hover{background:var(--bg)}
/* buttons & badges */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--bg);border-radius:6px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--fg);cursor:pointer}
.btn:hover{background:#eef1f4}
.btn.primary{background:var(--grn);border-color:var(--grn);color:#fff}.btn.primary:hover{background:#166f2f}
.count{background:rgba(175,184,193,.3);border-radius:20px;padding:0 7px;font-size:11px;font-weight:600;margin-left:5px}
.badge{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:1px 10px;font-size:12px;color:var(--mut)}
.badge.lic{color:var(--acc);border-color:var(--acc)}
.badge.legal{color:var(--grn);border-color:var(--grn)}.badge.illegal{color:var(--red);border-color:var(--red)}
.badge.prov{color:var(--org);border-color:var(--org)}
/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
/* explore */
.hero{background:var(--bg);border-bottom:1px solid var(--bd);padding:38px 0 30px}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:var(--mut);max-width:640px}
.hero-flow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-width:760px;margin-top:18px}
.hero-step{border:1px solid var(--bd);border-radius:9px;background:#fff;padding:10px 12px;font-size:12px;line-height:1.4;color:var(--mut)}
.hero-step b{display:block;color:var(--fg);font-size:13px;margin-bottom:2px}
.gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:24px 0}
.gcard{border:1px solid var(--bd);border-radius:10px;padding:16px 18px;transition:box-shadow .15s}
.gcard:hover{box-shadow:0 3px 14px rgba(0,0,0,.1)}
.gcard h3{margin:0 0 4px;font-size:16px}.gcard .desc{color:var(--mut);font-size:13px;min-height:38px}
.gcard .thumbs{display:flex;gap:6px;margin:10px 0;max-height:130px;overflow:hidden;align-items:flex-start}.gcard .thumbs .cf-card{flex:none}
.gcard .meta{display:flex;gap:10px 14px;color:var(--mut);font-size:12px;margin-top:8px;align-items:center;flex-wrap:wrap}
/* repo header */
.repohead{padding:18px 0 0;border-bottom:1px solid var(--bd);background:linear-gradient(180deg,#fff,#fbfcfd)}
.repohead .titleline{display:flex;align-items:flex-start;gap:18px}
.repo-identity{flex:1;min-width:230px}.repo-meta{display:flex;align-items:center;gap:7px;flex-wrap:wrap;margin-top:7px}
.repohead h1{font-size:20px;font-weight:400;margin:0}
.repohead h1 b{font-weight:700}
.repohead .actions{margin-left:auto;display:flex;align-items:center;justify-content:flex-end;gap:7px;flex-wrap:wrap}
.repo-more,.more-tabs{position:relative}.repo-more summary,.more-tabs summary{list-style:none;cursor:pointer}.repo-more summary::-webkit-details-marker,.more-tabs summary::-webkit-details-marker{display:none}
.repo-menu{position:absolute;right:0;top:calc(100% + 7px);z-index:90;width:220px;padding:6px;background:#fff;border:1px solid var(--bd);border-radius:9px;box-shadow:0 12px 34px #0003}
.repo-menu button,.repo-menu a{display:flex;width:100%;align-items:center;gap:8px;padding:8px 10px;border:0;background:none;color:var(--fg);font:inherit;font-size:13px;text-align:left;cursor:pointer;border-radius:6px}.repo-menu button:hover,.repo-menu a:hover{background:var(--bg);text-decoration:none}.repo-menu .menu-note{padding:7px 10px 4px;color:var(--mut);font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.tabs{display:flex;align-items:flex-end;gap:2px;margin-top:14px;overflow:visible}
.tabs>a,.more-tabs>summary{display:block;padding:9px 12px;border-bottom:2px solid transparent;color:var(--fg);font-size:13px;white-space:nowrap}
.tabs a:hover{text-decoration:none;border-bottom-color:#d0d7de}
.tabs a.on,.more-tabs>summary.on{border-bottom-color:#fd8c73;font-weight:650}
.more-tabs{margin-left:auto}.more-tabs .repo-menu{top:calc(100% + 1px)}
/* content */
.pane{padding:22px 0 60px}
.two{display:grid;grid-template-columns:1fr 296px;gap:28px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.box{border:1px solid var(--bd);border-radius:10px;margin-bottom:16px;background:#fff}
.box .bh{background:var(--bg);border-bottom:1px solid var(--bd);padding:10px 16px;font-weight:650;font-size:13px;border-radius:10px 10px 0 0}
.box .bb{padding:14px 16px}
.section-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}.section-head .section-title{flex:1;min-width:190px}.section-actions{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.pub-disclosure{border:1px solid var(--bd);border-radius:9px;background:#fff;margin-top:12px}.pub-disclosure>summary{cursor:pointer;padding:9px 12px;font-size:12px;font-weight:650;list-style:none}.pub-disclosure>summary::-webkit-details-marker{display:none}.pub-disclosure>summary:before{content:"▸";display:inline-block;margin-right:7px;color:var(--mut);transition:transform .12s}.pub-disclosure[open]>summary:before{transform:rotate(90deg)}.pub-disclosure[open]>summary{border-bottom:1px solid var(--bd)}.pub-detail-tags{display:flex;gap:7px;flex-wrap:wrap;padding:10px 12px}.pub-dependencies{padding:10px 12px}.pub-dependencies>div{margin:4px 0;word-break:break-all}.pub-source{margin:0 0 16px}.pub-source>div{padding:3px 12px}
.sideh{font-size:13px;font-weight:600;margin:0 0 8px}
.side .box .bb{font-size:13px}
/* cards tab */
.filterbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filterbar input,.filterbar select{border:1px solid var(--bd);border-radius:6px;padding:6px 12px;font-size:13px;background:var(--bg)}
.filterbar input{flex:1;min-width:200px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.ctile{cursor:pointer;transition:transform .12s;display:flex;flex-direction:column;align-items:center}.ctile:hover{transform:translateY(-3px)}
.ctile .cn{font-size:12px;color:var(--mut);text-align:center;margin-top:4px;width:100%}
/* reusable game source */
.asset-hero{border:1px solid #b8d9cb;background:linear-gradient(135deg,#f3fff9,#fff);border-radius:10px;padding:18px 20px;margin-bottom:16px}
.asset-hero h2{font-size:18px;margin:0 0 5px}.asset-hero p{color:var(--mut);margin:0;max-width:760px}
.asset-flow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:13px;font-size:12px}.asset-flow span{border:1px solid var(--bd);background:#fff;border-radius:20px;padding:3px 10px}.asset-flow i{color:var(--mut);font-style:normal}
.asset-cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:9px;margin-bottom:16px}
.asset-cat{border:1px solid var(--bd);background:#fff;border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}.asset-cat:hover,.asset-cat.on{border-color:var(--acc);background:#faf8ff}.asset-cat b{display:block;font-size:13px}.asset-cat span{color:var(--mut);font-size:12px}
.asset-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:12px}
.asset-tile{border:1px solid var(--bd);border-radius:9px;background:#fff;overflow:hidden;cursor:pointer;min-width:0;transition:transform .12s,box-shadow .12s}.asset-tile:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(0,0,0,.09)}
.asset-preview{height:132px;background:linear-gradient(145deg,#f6f8fa,#eef1f4);display:flex;align-items:center;justify-content:center;overflow:hidden;border-bottom:1px solid var(--bd);font-size:38px;color:#6e7781;font-weight:650}.asset-preview img{width:100%;height:100%;object-fit:contain;padding:8px}.asset-preview code{font-size:30px;color:#8250df}
.asset-info{padding:10px 11px}.asset-name{font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.asset-path{font:10.5px/1.35 ui-monospace,Menlo,monospace;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}.asset-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-top:7px;color:var(--mut);font-size:11px}
.asset-detail-preview{min-height:260px;display:flex;align-items:center;justify-content:center;background:var(--bg);border:1px solid var(--bd);border-radius:9px;overflow:hidden}.asset-detail-preview img{display:block;width:100%!important;max-height:460px;object-fit:contain;border-radius:0!important;box-shadow:none!important}.asset-code{margin:0;max-height:390px;overflow:auto;white-space:pre-wrap;word-break:break-word;background:#f6f8fa;border:1px solid var(--bd);border-radius:8px;padding:12px;font:11.5px/1.45 ui-monospace,Menlo,monospace}
@media(max-width:700px){.asset-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.asset-preview{height:105px}.asset-cats{grid-template-columns:repeat(2,minmax(0,1fr))}}
/* history */
.commit{display:flex;gap:14px;padding:14px 16px;border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;cursor:pointer}
.commit:hover{background:var(--bg)}
.commit .dot{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#8c2f1b,#e0a458);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.commit .sub{font-weight:600}.commit .who{color:var(--mut);font-size:12px}
.chg{font-size:13px;padding:4px 0 4px 12px;border-left:2px solid var(--bd);margin:6px 0 0 6px}
.chg b{font-weight:600}
.old{background:#ffebe9;text-decoration:line-through;padding:0 5px;border-radius:3px}
.new{background:#dafbe1;padding:0 5px;border-radius:3px}
.exp{display:none;padding:0 16px 12px 60px}
.commit.open + .exp{display:block}
/* PR */
.pr{border:1px solid var(--bd);border-radius:8px;margin-bottom:16px}
.prh{padding:14px 18px;border-bottom:1px solid var(--bd)}
.prh h3{margin:0 0 3px;font-size:16px}
.prstate{background:var(--grn);color:#fff;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600}
.prstate.merged{background:#8250df}.prstate.closed{background:#57606a}
.revbadge{display:inline-block;border-radius:20px;padding:3px 10px;font-size:12px;font-weight:600;background:#eef;color:#3538cd}
.revbadge.approve{background:#e6f4ea;color:#1a7f37}.revbadge.request_changes{background:#fff1e5;color:#b35900}
.prbody{padding:16px 18px}
.prcard{display:flex;gap:20px;align-items:flex-start;border-top:1px solid #eaeef2;padding:16px 0;flex-wrap:wrap}
.prcard img{width:180px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.arrow{align-self:center;font-size:22px;color:var(--mut)}
.mergebar{background:var(--bg);border-top:1px solid var(--bd);padding:14px 18px;display:flex;gap:12px;align-items:center}
/* releases / banlist / decks */
.rel{border-left:3px solid var(--acc);padding:4px 0 4px 16px;margin-bottom:20px}
.rel h3{margin:0}.rel pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap}
blockquote{border-left:3px solid var(--org);margin:10px 0 0;padding:2px 14px;color:#57606a}
/* modal */
#modal{position:fixed;inset:0;background:rgba(28,33,40,.55);display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal .mbox{background:#fff;border-radius:12px;max-width:760px;width:92%;max-height:88vh;overflow-y:auto;display:flex;gap:22px;padding:24px}
#modal img{width:260px;border-radius:10px;align-self:flex-start;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#modal h2{margin:0 0 4px}
.kv{font-size:13px;margin:3px 0}.kv b{display:inline-block;min-width:90px;color:var(--mut);font-weight:500}
.emptystate{color:var(--mut);text-align:center;padding:40px 0}
.activity{font-size:13px;padding:7px 0;border-bottom:1px solid #eaeef2;display:flex;gap:8px}
.activity:last-child{border:none}
/* ---- in-hub card editor drawer ---- */
#drawer{position:fixed;inset:0;background:rgba(28,33,40,.5);display:none;z-index:60}
#drawer.on{display:block}
.dpanel{position:absolute;top:0;right:0;height:100%;width:min(940px,96vw);background:var(--bg2,#fff);box-shadow:-12px 0 40px rgba(0,0,0,.3);display:flex;flex-direction:column;transform:translateX(30px);opacity:0;transition:transform .22s ease,opacity .22s ease}
.editgrid{display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap}
.editcol-list{flex:0 0 190px;max-height:640px;overflow:auto}
.editcol-form{flex:1;min-width:300px}
.editcol-prev{flex:0 0 300px;position:sticky;top:12px}
.editcol-prev canvas{width:300px;height:420px;border-radius:16px;box-shadow:0 10px 34px rgba(0,0,0,.22)}
.editcol-list .ecardlist{flex-direction:column;align-items:stretch;gap:4px}
.editcol-list .epill{text-align:left}
.edhrow{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.edwrap{display:grid;grid-template-columns:minmax(190px,220px) minmax(0,1fr) minmax(280px,320px);grid-template-areas:"side form preview";border:1px solid var(--bd);border-radius:14px;overflow:hidden;background:#fff;min-height:560px}
.edside{grid-area:side;border-right:1px solid var(--bd);background:var(--bg);display:flex;flex-direction:column;min-height:0}
.edside .edsearch{padding:12px}
.edside .edsearch input{width:100%;padding:8px 11px;border:1px solid var(--bd);border-radius:8px;font-size:13px;box-sizing:border-box}
.edlist2{flex:1;overflow:auto;padding:0 6px 6px}
.edrow{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:8px;cursor:pointer;font-size:14px;border-left:3px solid transparent}
.edrow:hover{background:#eceff2}
.edrow.sel{background:#fff;border-left-color:var(--acc);font-weight:600;box-shadow:0 1px 4px rgba(0,0,0,.07)}
.edrow .dot{width:10px;height:10px;border-radius:50%;flex:0 0 auto;border:1px solid rgba(0,0,0,.15)}
.edrow .nm{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.edrow .dd{width:7px;height:7px;border-radius:50%;background:var(--org);flex:0 0 auto}
.ednew{margin:6px 8px 10px;padding:9px;border:1px dashed var(--bd);border-radius:8px;text-align:center;color:var(--mut);cursor:pointer;font-size:13px}
.ednew:hover{border-color:var(--acc);color:var(--acc);background:#fff}
.edform{grid-area:form;padding:24px 26px;overflow:auto;min-width:0}
.edprev{grid-area:preview;border-left:1px solid var(--bd);background:var(--bg);padding:22px 20px;display:flex;flex-direction:column;align-items:center}
.edprev-title{width:100%;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.07em;color:var(--mut);margin-bottom:9px;text-align:center}
.ed-advanced{width:100%;max-width:280px;margin-top:12px;border-top:1px solid var(--bd);padding-top:10px;color:var(--mut);font-size:11.5px;line-height:1.4}
.ed-advanced summary{cursor:pointer;font-weight:600;color:var(--mut)}
.edprev canvas{width:292px;height:409px;border-radius:16px;box-shadow:0 12px 34px rgba(0,0,0,.2)}
.edcommit{margin-top:18px;width:100%;border-top:1px solid var(--bd);padding-top:14px}
.edcommit .msg{font-size:13px;line-height:1.5;margin-bottom:11px;min-height:32px;color:var(--mut)}
.edcommit .msg b{color:var(--fg)}
.fld input:focus,.fld textarea:focus,.fld select:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px rgba(130,80,223,.12)}
.fld.name input{font-size:17px;font-weight:600}
@media(max-width:960px){
  .edwrap{grid-template-columns:1fr;grid-template-areas:"side" "preview" "form";min-height:0}
  .edside{height:250px;max-height:250px;border-right:none;border-bottom:1px solid var(--bd)}
  .edprev{border-left:none;border-bottom:1px solid var(--bd);padding:18px 16px;align-items:center}
  .edform{padding:20px 18px}
}
#drawer.on .dpanel{transform:none;opacity:1}
.dhead{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--bd)}
.dhead h2{margin:0;font-size:18px}.dhead .sub{color:var(--mut);font-size:13px}
.dbody{flex:1;overflow-y:auto;display:flex;gap:26px;padding:22px}
.dprev{flex:0 0 300px;position:sticky;top:0}
.dprev canvas{width:300px;height:420px;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.dprev .hint{color:var(--mut);font-size:12px;text-align:center;margin-top:10px}
.dform{flex:1;min-width:280px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;font:inherit;font-size:14px;background:#fff;box-sizing:border-box}
.fld textarea{min-height:84px;resize:vertical;line-height:1.5}
.fld .row{display:flex;gap:12px;flex-wrap:wrap}
.fld .row>div{min-width:88px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ecardlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.epill{border:1px solid var(--bd);background:#fff;border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer}
.epill.sel{background:var(--acc,#0969da);color:#fff;border-color:var(--acc,#0969da)}
.epill.new{border-style:dashed;color:var(--mut)}
.epill.dirty::after{content:"•";color:#d29922;margin-left:5px}
.dbar{border-top:1px solid var(--bd);padding:14px 22px;background:var(--bg2,#fff);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dbar .msg{flex:1;min-width:200px;font-size:13px}
.dbar .msg b{color:var(--fg,#1f2328)}
.dbar .msg .mut{color:var(--mut)}
.symbtn{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--bd);background:#fff;border-radius:6px;padding:3px 7px;margin:0 3px 4px 0;font-size:12px;line-height:18px;cursor:pointer;vertical-align:top}
.symbtn:hover{border-color:var(--acc);background:#f6f8fa}
.symbtn .cf-sym{min-width:18px;min-height:18px;padding:0;background:none;line-height:18px;vertical-align:0}
.symbtn .cf-sym img{width:17px!important;height:17px!important}
.issrow{display:flex;gap:10px;align-items:flex-start;padding:11px 6px;border-bottom:1px solid var(--bd);cursor:pointer}

let DATA = __DATA__;
// The prototype historically used <a onclick> for client-side navigation.
// Make every one keyboard- and assistive-technology reachable while preserving
// the lightweight hash router; ordinary href links retain native behavior.
function upgradePseudoLinks(root=document){
  const links=[];
  if(root.matches?.("a:not([href])"))links.push(root);
  root.querySelectorAll?.("a:not([href])").forEach(link=>links.push(link));
  links.forEach(link=>{
    link.setAttribute("role","link");
    if(!link.hasAttribute("tabindex"))link.tabIndex=0;
  });
}
document.addEventListener("keydown",event=>{
  const link=event.target?.closest?.("a:not([href])");
  if(link&&event.key==="Enter"){event.preventDefault();link.click();}
});
new MutationObserver(records=>records.forEach(record=>record.addedNodes.forEach(node=>{
  if(node.nodeType===1)upgradePseudoLinks(node);
}))).observe(document.body,{childList:true,subtree:true});
upgradePseudoLinks();
/* ---- live mode + auth + stars (feature: accounts & stars end-to-end) ---- */
let LIVE=false, ME=null, STARS={}, MYSTARS=new Set(), amMode="login", _afterAuth=null, CATALOG_LOADING=true;
let EXPLORE_QUERY="", EXPLORE_TOPIC="";
// Browser sessions are HttpOnly cookies. JavaScript never reads or persists a
// bearer token; API/connector clients can still request and use one directly.
const authH = () => ({});
async function refreshLive(){
  try {
    const h = await (await fetch("/healthz")).json(); LIVE = !!h.ok;
    if(!LIVE) return;
    const catalog = await (await fetch("/api/catalog?limit=24")).json();
    const gs = catalog.items||[]; CATALOG_LOADING=false;
    DATA.games=gs;
    window.__catalog=gs;
    for(const g of gs) STARS[g.slug]=g.stars??0;
    const r = await fetch("/api/me",{headers:authH()});
    if(r.ok){ ME=await r.json(); MYSTARS=new Set(ME.starred); }
    else { ME=null; MYSTARS=new Set(); }
    renderAuthArea(); render();
  } catch{}
}
function renderAuthArea(){
  const el=document.getElementById("authArea");
  if(!LIVE){ el.innerHTML='<div class="av" title="you"></div>'; return; }
  el.innerHTML = ME
    ? `<details class="account-menu"><summary>@${esc(ME.handle)} ▾</summary><div class="account-popover"><button onclick="signOut()">Sign out</button></div></details>`
    : `<button class="btn" style="background:#e0632f;color:#fff;border:none" onclick="authOpen()">Sign in</button>`;
}
function authOpen(mode){ authMode(mode||"login"); document.getElementById("authModal").style.display="flex"; }
function authMode(m){ amMode=m;
  document.getElementById("amTitle").textContent = m==="login"?"Sign in":"Create account";
  document.getElementById("amEmail").style.display = m==="register"?"":"none";
  document.getElementById("amSwitch").textContent = m==="login"?"Create an account instead":"I have an account";
  document.getElementById("amErr").style.display="none";
}
async function authSubmit(){
  const body={handle:document.getElementById("amHandle").value.trim(),
              password:document.getElementById("amPass").value};
  if(amMode==="register") body.email=document.getElementById("amEmail").value.trim();
  const r=await fetch(`/api/auth/${amMode}`,{method:"POST",
    headers:{"content-type":"application/json","x-forge-browser":"1"},body:JSON.stringify(body)});
  const d=await r.json();
  if(r.ok){
    document.getElementById("authModal").style.display="none"; await refreshLive();
    if(_afterAuth){ const fn=_afterAuth; _afterAuth=null; fn(); } }
  else { const e=document.getElementById("amErr"); e.textContent=d.error??r.status; e.style.display=""; }
}
async function signOut(){
  await fetch("/api/auth/logout",{method:"POST",headers:{"x-forge-browser":"1"}});
  ME=null;MYSTARS=new Set();renderAuthArea();render();
}
async function toggleStar(slug, ev){
  ev?.stopPropagation?.();
  if(!ME){ authOpen(); return; }
  const method = MYSTARS.has(slug) ? "DELETE" : "PUT";
  const r = await fetch(`/api/stars/${slug}`,{method,headers:authH()});
  if(r.status===401){ authOpen(); return; }
  const d = await r.json();
  STARS[slug]=d.stars; d.starred?MYSTARS.add(slug):MYSTARS.delete(slug);
  render();
}

async function forkGame(slug){
  if(!ME){ _afterAuth=()=>forkGame(slug); authOpen(); return; }

    <div style="font-size:12px;color:var(--acc);font-weight:700;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Create your own edition</div>
    <h3 style="margin:0 0 8px;font-size:20px">Fork ${esc(g?.title||slug)}</h3>
    <p style="margin:0 0 16px;color:var(--mut);font-size:13.5px;line-height:1.55">This creates a complete independent game under your account. Change one card or rebuild the whole thing within its <b>${esc(g?.license||"source")}</b> license. Nothing is sent upstream unless you explicitly propose it later.</p>

      <select data-ref style="display:block;width:100%;margin-top:6px;padding:10px 11px;border:1px solid var(--bd);border-radius:8px;background:#fff;font:inherit">
        ${choices.map((c,i)=>`<option value="${i}">${esc(c.label)} · ${esc(c.sha)}</option>`).join("")}
      </select></label>
    <div data-err style="display:none;color:var(--red);font-size:13px;margin-top:12px;background:#fff0f0;border:1px solid #ffd7d7;border-radius:8px;padding:9px 11px"></div>

  ov.appendChild(box);document.body.appendChild(ov);
  const close=()=>ov.remove();
  box.querySelector("[data-x]").onclick=close;
  ov.addEventListener("mousedown",e=>{if(e.target===ov)close();});
  box.querySelector("[data-ok]").onclick=async()=>{
    const btn=box.querySelector("[data-ok]"), err=box.querySelector("[data-err]");

    const d=await r.json().catch(()=>({}));

      setTimeout(()=>{location.href=`/?t=${Date.now()}${d.url||`#/g/${d.slug}`}`;},700);
    }else if(r.status===409&&d.existing){
      err.style.display="";err.innerHTML=`${esc(d.error)} <a data-open style="font-weight:600">Open it →</a>`;
      err.querySelector("[data-open]").onclick=()=>{close();location.href=`/?t=${Date.now()}#/g/${d.existing}`;};

 * generic data-driven frame below: "cah" (Cards Against Humanity) or

function cfSym(g){return (g.symbols||[]).reduce((m,s)=>(m[s.key]=s.glyph||("["+s.key+"]"),m),{});}
function cfSymDef(g,key){return (g.symbols||[]).find(s=>s.key===key)||null;}
function cfSymHtml(g,key,cls){
  const s=cfSymDef(g,key);
  if(!s) return null;
  const src=s.asset_data||s.asset;
  const body=src?`<img src="${esc(src)}" alt="${esc(s.name||key)}">`:esc(s.glyph||key);
  return `<span class="${cls||"cf-sym"}" title="${esc(s.name||key)}">${body}</span>`;
}
function cfRich(g,t){const sym=cfSym(g);
  return esc(t).replace(/\[([a-z0-9_]+)\]/gi,(m,k)=>cfSymHtml(g,k,"cf-sym")||`<span class="cf-sym">${esc(sym[k]||k)}</span>`);}
function cfColor(g,c){
  const fac=(c.attributes||{}).faction;
  if(fac!=null && g.faction_colors && g.faction_colors[fac]) return g.faction_colors[fac];
  return (g.type_colors||{})[c.type] || {fg:"#3a3f47",bg:"#e8eaed"};
}
/* opts.w normalizer: a plain number is px (every existing call site).
 * A CSS length string ("63.5mm") is used as-is for `width:` and also
 * converted to a px-equivalent for internal em/% math -- mm/cm/in
 * convert at the CSS-defined 96px = 1in = 25.4mm ratio, the same ratio
 * print engines honor at 100% scale, so a px font-size inside an
 * mm-wide card still prints at the right physical fraction of the card. */
function cfLen(w){
  if(typeof w==="number") return {css:w+"px", num:w};
  const m=/^([\d.]+)\s*(px|mm|cm|in)?$/.exec(String(w||"").trim());
  if(!m) return {css:"230px", num:230};
  const n=parseFloat(m[1]), unit=m[2]||"px";
  const num=unit==="mm"?n*96/25.4:unit==="cm"?n*96/2.54:unit==="in"?n*96:n;
  return {css:String(w).trim(), num};
}
const CF_SUIT_GLYPH={hearts:"♥",diamonds:"♦",clubs:"♣",spades:"♠"};

  3:[[50,15],[50,50],[50,85]],
  4:[[25,20],[75,20],[25,80],[75,80]],
  5:[[25,20],[75,20],[50,50],[25,80],[75,80]],
  6:[[25,18],[75,18],[25,50],[75,50],[25,82],[75,82]],
  7:[[25,15],[75,15],[50,32],[25,50],[75,50],[25,85],[75,85]],
  8:[[25,15],[75,15],[50,32],[25,50],[75,50],[50,68],[25,85],[75,85]],
  9:[[25,13],[75,13],[25,37],[75,37],[50,50],[25,63],[75,63],[25,87],[75,87]],

/* ---- card_style:"cah" -- exact physical Cards Against Humanity look:

 * the literal "____" already in the data), footer wordmark, and a
 * PICK-n badge on multi-pick black cards. ---- */
function cfCAH(g,c,ctx){
  const {wCss,w,hl}=ctx, at=c.attributes||{};

/* ---- card_style:"playing-card" -- authentic French-suited playing

 * pip/face/ace layout driven by attributes.suit + attributes.rank. ---- */
function cfPlayingCard(g,c,ctx){
  const {wCss,w,hl}=ctx, at=c.attributes||{};

    center=`<div class="cf-pc-ace">${esc(glyph)}</div>`;

    center=`<div class="cf-pc-face"><div class="cf-pc-face-letter">${esc(rank)}</div><div class="cf-pc-face-suit">${esc(glyph)}</div></div>`;

const LAY_FONTS_LOADED = new Set();
function layEnsureFonts(g, layout){
  const fonts = (layout && layout.fonts) || (g && g.layout && g.layout.fonts) || [];
  const key=f=>`${f.family}|${f.weight||400}|${f.style||"normal"}`;
  const need = fonts.filter(f => f && f.family && !LAY_FONTS_LOADED.has(key(f)));

  need.forEach(f => LAY_FONTS_LOADED.add(key(f)));

    need.filter(f=>f.asset_data||f.asset).forEach(f=>{
      const src=f.asset_data||f.asset;

    need.filter(f=>!f.asset_data&&!f.asset&&!f.local_asset).forEach(f=>{if(!grouped.has(f.family))grouped.set(f.family,new Set());grouped.get(f.family).add(f.weight||400);});

/* ---- src/show_if path resolution -- dot paths against {card, printing, g,

 * a bare path ("attributes.faction", "name") tries card first, then
 * printing -- covers both styles used in a layout.yaml (region src usually

function layDig(obj, path){
  if(obj==null || !path) return undefined;
  let v = obj;

function layResolve(ctx, path){
  if(path==null) return undefined;

  if(p.startsWith("printing.")){
    const v = layDig(ctx.printing, p.slice(9));
    // Static hubs keep source faces once in g.scans to avoid duplicating tens
    // of megabytes in every printing.  Live/headless contexts may provide the
    // same value directly on the printing.
    if(v===undefined && p==="printing.scan_data") return ctx.g?.scans?.[ctx.card?.id];
    return v;
  }
  if(p.startsWith("g.")) return layDig(ctx.g, p.slice(2));
  if(p==="card") return ctx.card;
  if(p==="printing") return ctx.printing;

  let val=raw;
  if(r.map && typeof r.map==="object"){

  }
  if(r.transform==="before-colon") val=layStringify(val).split(":",1)[0].trim();
  else if(r.transform==="after-colon") val=layStringify(val).includes(":")?layStringify(val).slice(layStringify(val).indexOf(":")+1).trim():"";

  const or=s.split(/\s*\|\|\s*/); if(or.length>1)return or.some(part=>layCond(ctx,part));

    const left = layStringify(layResolve(ctx, m[1].trim()));

    if((right[0]==='"' && right.slice(-1)==='"') || (right[0]==="'" && right.slice(-1)==="'")) right = right.slice(1,-1);
    const eq = left===right;
    return m[2]==="==" ? eq : !eq;
  }

  if(path.startsWith("!")){ neg=true; path=path.slice(1).trim(); }
  const v = layResolve(ctx, path);
  const truthy = !(v==null || v==="" || v===false || (Array.isArray(v) && !v.length));

/* ================= PRINT SHEET =================
 * printSheet(slug) -- the "not a preview" proof: opens a standalone
 * window and renders EVERY card in the game through the exact same
 * layoutCard() used by the grid/modal/editor/PR-diff, at TRUE PHYSICAL
 * SIZE (the game's templates/layout.yaml card.w_mm x h_mm, or 63.5mm x
 * 88.9mm -- standard poker/trading-card trim size -- for games with no
 * layout spec), laid out 3x3 per page with 5mm gaps and light cut lines.
 * Same CF_CSS/LAY_CSS strings as the hub page, so there is no second
 * "print renderer" to drift out of sync -- what you edit is literally
 * what prints. Works for every card_style (cah, playing-card, the
 * generic/faction frame, AND a full layout.yaml spec) because
 * layoutCard() itself dispatches on g.layout (falling back to
 * cardFrame(), which dispatches on g.card_style); this function just
 * asks for the cards at a millimeter width instead of a pixel one. */
function printSheet(slug){
  const g = G(slug);
  if(!g){ toast("No such game."); return; }
  const win = window.open("", "_blank", "width=980,height=1040");
  if(!win){ toast("Pop-up blocked — allow pop-ups for this site to print cards."); return; }
  const cards = g.cards||[];
  const layCard = (g.production && g.production.card) || (g.source_overlay && g.source_overlay.card) || (g.layout && g.layout.card) || {};
  const CARD_W_MM = layCard.w_mm || 63.5, CARD_H_MM = layCard.h_mm || 88.9, GAP_MM = 5, MARGIN_MM = 10, PER_PAGE = 9;

  const pages = [];
  for(let i=0;i<cards.length;i+=PER_PAGE) pages.push(cards.slice(i,i+PER_PAGE));
  if(!pages.length) pages.push([]);
  const pageHtml = pages.map(pageCards => `<div class="ps-page">${
    pageCards.map(c => `<div class="ps-card">${layoutCard(g, c, cfPrinting(g,c), {w:`${CARD_W_MM}mm`})}</div>`).join("")
  }</div>`).join("");
  const fonts = (g.layout && g.layout.fonts) || [];
  const fontLink = fonts.length ? `<link rel="stylesheet" href="https://fonts.googleapis.com/css2?${
    fonts.map(f=>`family=${encodeURIComponent(f.family).replace(/%20/g,"+")}:wght@${f.weight||400}`).join("&")
  }&display=swap">` : "";
  const doc = `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>${esc(g.title)} — print sheet</title>
${fontLink}
<style>
${CF_CSS}
${LAY_CSS}
*{box-sizing:border-box}
html,body{margin:0;background:#e9ebee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1f2328}
@page{size:${pageW}mm ${pageH}mm;margin:${MARGIN_MM}mm}
.ps-note{max-width:${pageW}mm;margin:14px auto 0;padding:0 4px;font-size:13px;line-height:1.5;color:#444}
.ps-note b{color:#111}
.ps-toolbar{max-width:${pageW}mm;margin:10px auto 16px;padding:0 4px;display:flex;gap:10px}
.ps-toolbar button{font:inherit;font-size:13px;font-weight:600;padding:7px 16px;border:1px solid #8a8f98;border-radius:6px;background:#fff;cursor:pointer}
.ps-toolbar button:hover{background:#f0f1f3}
.ps-page{width:${pageW}mm;min-height:${pageH}mm;margin:0 auto 24px;background:#fff;box-shadow:0 1px 6px rgba(0,0,0,.25);padding:${MARGIN_MM}mm;display:grid;grid-template-columns:repeat(3,${CARD_W_MM}mm);grid-auto-rows:${CARD_H_MM}mm;gap:${GAP_MM}mm;justify-content:start}
.ps-card{position:relative;width:${CARD_W_MM}mm;height:${CARD_H_MM}mm;overflow:hidden;outline:.5pt dashed #b7bcc4;outline-offset:1.5mm}
.ps-card .cf-card{width:100%;height:100%}
.ps-card .lay-wrap{width:100%!important;height:100%!important;aspect-ratio:auto!important}

  html,body{background:#fff}
  .ps-note,.ps-toolbar{display:none}
  .ps-page{box-shadow:none;margin:0;break-after:page;page-break-after:always}

  .ps-card{outline-color:#ccc}

</style></head>
<body>
<div class="ps-note"><b>${esc(g.title)}</b> — ${cards.length} card${cards.length===1?"":"s"}, ${pages.length} page${pages.length===1?"":"s"} at true size (${CARD_W_MM}mm × ${CARD_H_MM}mm per card). <b>Print at 100% scale</b> — turn off "fit to page" / "shrink to fit" in the print dialog, or choose "Save as PDF" for an exact-size file. Light dashed lines mark cut edges, not ink.${g.source_overlay&&g.source_overlay.private_only?` <b>${esc(g.source_overlay.notice||"Source-backed modified faces are private playtest proxies; check permission before sharing them.")}</b>`:""}</div>
<div class="ps-toolbar"><button onclick="window.print()">🖨 Print</button><button onclick="window.close()">Close</button></div>
${pageHtml}
</body></html>`;
  win.document.open(); win.document.write(doc); win.document.close();
}

function openPnpPackage(slug){
  if(LIVE){ doExport(slug,"pnp","Forge PnP PDF"); return; }
  printSheet(slug);
}

document.head.insertAdjacentHTML("beforeend", `<style>${DES_CSS}</style>`);

function clamp(v,lo,hi){ return Math.max(lo,Math.min(hi,v)); }
function round2(n){ return Math.round(n*100)/100; }
function desTrim(s,n){ s=String(s); return s.length>n ? s.slice(0,n-1)+"…" : s; }
function desSlug(s){ const t=String(s||"").toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,""); return t||"region"; }

/* ---- palette: every bindable path off the currently-previewed card+printing ---- */
function desFields(g, c, p){
  const out=[], seen=new Set();
  const push=(path,val,kind)=>{
    if(seen.has(path)) return; seen.add(path);
    if(!kind){
      if(typeof val==="number") kind="number";
      else if(typeof val==="boolean") kind="boolean";
      else if(val==null) kind="string";
      else{
        const s=String(val);
        if(/^https?:\/\//i.test(s) && /\.(png|jpe?g|gif|webp|svg)(\?.*)?$/i.test(s)) kind="image";
        else if(/^https?:\/\//i.test(s)) kind="url";
        else if(s.length>36 || /\n/.test(s)) kind="longstring";
        else kind="string";
      }
    }
    out.push({path,value:val,kind});
  };
  if(c){
    push("card.name", c.name, "string");
    push("card.type", c.type, "string");
    push("card.subtypes", (c.subtypes||[]).join(", "), "array");
    push("card.text", c.text||"", "longstring");
    push("card.keywords", (c.keywords||[]).join(", "), "array");
    if(c.deck_limit!=null) push("card.deck_limit", c.deck_limit, "number");
    const declared=g.schema||[];
    for(const d of declared){
      const v=(c.attributes||{})[d.key];
      push(`card.attributes.${d.key}`, v, (d.type==="integer"||d.type==="number")?"number":(d.type==="boolean"?"boolean":"string"));
    }
    for(const k of Object.keys(c.attributes||{})) if(!declared.find(d=>d.key===k)) push(`card.attributes.${k}`, c.attributes[k]);
  }
  if(p){
    if(p.art_url!=null) push("printing.art_url", p.art_url, "image");
    if(p.background_url!=null) push("printing.background_url", p.background_url, "image");
    if(p.image!=null) push("printing.image", p.image, "image");
    push("printing.collector_number", p.collector_number ?? "", "string");
    push("printing.quantity", p.quantity ?? 1, "number");
    if(p.artist!=null) push("printing.artist", p.artist, "string");
    if(p.flavor_text!=null) push("printing.flavor_text", p.flavor_text, "longstring");
    if(p.variant!=null) push("printing.variant", p.variant, "string");
    if(p.set_id!=null) push("printing.set_id", p.set_id, "string");
  }
  return out;
}
function desKindLabel(k){ return {string:"text",longstring:"rich text",number:"badge",image:"image",url:"text",array:"text",boolean:"text"}[k]||"text"; }
function desPaletteHtml(g,c,p){
  const fields=desFields(g,c,p);
  if(!fields.length) return `<div class="mut" style="font-size:13px;color:var(--mut)">No bindable fields on this card yet.</div>`;
  return fields.map(f=>{
    const empty=f.value===undefined||f.value===null||f.value==="";
    return `<div class="des-field" draggable="true" ondragstart="desFieldDragStart(event,'${esc(f.path)}','${f.kind}')" title="Drag onto the card to create a ${esc(desKindLabel(f.kind))} region bound to ${esc(f.path)}">
      <div class="des-field-path">${esc(f.path)}</div>
      <div class="des-field-val${empty?' des-field-empty':''}">${empty?'—':esc(desTrim(String(f.value),42))}</div>
    </div>`;
  }).join("");
}

/* ---- geometry: mm<->px, ghost game (DES.layout overlaid on the real game), card shell ---- */
function desGeom(){
  const spec=(DES.layout&&DES.layout.card)||{};
  const W=spec.w_mm||63.5, H=spec.h_mm||88.9;
  const pxmm = DES.view==="1:1" ? (96/25.4) : (460/H);
  return {W,H,pxmm,pxW:W*pxmm,pxH:H*pxmm};
}
function desGhostGame(){ const g=G(DES.slug); return Object.assign({}, g, {layout: DES.layout,card_design:null}); }
function desCard(){ const g=G(DES.slug); if(!g||!g.cards||!g.cards.length) return null; return g.cards.find(c=>c.id===DES.sel) || g.cards[0]; }
function desRegion(id){ return DES.layout && (DES.layout.regions||[]).find(r=>r.id===id); }
function desCardHtml(geom){
  const g=desGhostGame(), c=desCard(); if(!c) return "";
  const p=cfPrinting(g,c);
  const pxW=Math.max(1,Math.round(geom.pxW));
  if(DES.layout && Array.isArray(DES.layout.regions) && DES.layout.regions.length)
    return layoutCard(g,c,p,{w:pxW});
  // 0-region layout (blank start, or every region deleted): a bare card shell at
  // the right size/bg so there's still something to drop fields onto -- layoutCard()
  // itself would fall through to cardFrame() here, which is the wrong thing while designing.
  const ctx={card:c,printing:p||{},g,attributes:c.attributes||{}};
  const spec=(DES.layout&&DES.layout.card)||{};
  const bg=layColor(g,ctx,spec.bg,"#ffffff");
  const rx=(((spec.radius_mm||0)/geom.W)*100).toFixed(3), ry=(((spec.radius_mm||0)/geom.H)*100).toFixed(3);
  return `<div class="lay-wrap cf-card" style="width:${pxW}px;aspect-ratio:${geom.W}/${geom.H};border-radius:${rx}% / ${ry}%">
    <div class="lay-card" style="width:${geom.W}mm;height:${geom.H}mm;background:${bg}"></div>
  </div>`;
}

/* ---- region overlay boxes: absolutely positioned atop the SAME layoutCard() output,
 * same mm->px scale, so a box always sits exactly on top of the region it edits ---- */
function desRegionBoxHtml(r, geom, selId){
  const isBadge=r.type==="badge";
  const w=isBadge?(r.d??r.w??8):(r.w??10), h=isBadge?(r.d??r.h??8):(r.h??10);
  const x=r.x||0, y=r.y||0;
  const left=(x*geom.pxmm).toFixed(2), top=(y*geom.pxmm).toFixed(2);
  const ww=Math.max(4,w*geom.pxmm).toFixed(2), hh=Math.max(4,h*geom.pxmm).toFixed(2);
  const g=G(DES.slug), c=desCard(), p=c?cfPrinting(g,c):null;
  const ctx={card:c,printing:p||{},g,attributes:(c&&c.attributes)||{}};
  let visible=true; try{ visible=layCond(ctx, r.show_if); }catch(e){}
  const sel=r.id===selId;
  const handles=sel?DES_HANDLES.map(hd=>`<div class="des-h des-h-${hd}" data-h="${hd}" onmousedown="desBoxMouseDown(event,'${esc(r.id)}')"></div>`).join(""):"";
  return `<div class="des-box${sel?' sel':''}${visible?'':' des-hidden-now'}" data-rid="${esc(r.id)}"
    style="left:${left}px;top:${top}px;width:${ww}px;height:${hh}px"
    onmousedown="desBoxMouseDown(event,'${esc(r.id)}')">
    <span class="des-tag">${esc(r.id)}${visible?'':' (hidden for this card)'}</span>
    ${handles}
  </div>`;
}
function desReadoutHtml(geom){
  const r=DES_DRAG && desRegion(DES_DRAG.id); if(!r) return "";
  const isBadge=r.type==="badge";
  const w=isBadge?(r.d||0):(r.w||0), h=isBadge?(r.d||0):(r.h||0);
  const left=((r.x||0)+w/2)*geom.pxmm, top=Math.max(0,(r.y||0)*geom.pxmm-4);
  return `<div class="des-readout" style="left:${left.toFixed(1)}px;top:${top.toFixed(1)}px">${(r.x||0).toFixed(1)}, ${(r.y||0).toFixed(1)} mm · ${w.toFixed(1)}×${h.toFixed(1)} mm</div>`;
}
function desStageInnerHtml(){
  const geom=desGeom();
  const cardHtml=desCardHtml(geom);
  const boxes=(DES.layout.regions||[]).map(r=>desRegionBoxHtml(r,geom,DES.selRegion)).join("");
  const readout=DES_DRAG?desReadoutHtml(geom):"";
  return `<div class="des-cardhost">${cardHtml}</div><div class="des-overlay">${boxes}</div>${readout}`;
}
function desRenderCanvasOnly(){ const host=document.getElementById("des-stage-inner"); if(host) host.innerHTML=desStageInnerHtml(); }
function desRenderInspectorOnly(){ const host=document.getElementById("des-inspector"); if(host) host.innerHTML=desInspectorHtml(); }
function desRefreshToolbar(){
  const g=G(DES.slug); if(!g) return;
  const host=document.querySelector(".des-toolbar-host");
  if(host) host.innerHTML=desToolbarHtml(g, DES.showGallery, desDirty());
}
function desDirty(){ return !!(DES.layout && JSON.stringify(DES.layout)!==JSON.stringify(DES.orig)); }

function desSelectRegion(id){ DES.selRegion=id; DES._addFontOpen=false; desRenderCanvasOnly(); desRenderInspectorOnly(); }
function desCanvasBgMouseDown(e){
  const t=e.target;
  if(t && (t.id==="des-stage"||t.id==="des-stage-inner"||t.classList.contains("des-overlay")||t.classList.contains("des-cardhost"))) desSelectRegion(null);
}

/* ---- undo: a plain stack of JSON snapshots (<=20), pushed BEFORE each discrete edit ---- */
function desBeginChange(){ return JSON.stringify(DES.layout); }
function desPushUndo(snapshot){ DES.undo.push(snapshot); if(DES.undo.length>20) DES.undo.shift(); }
function desCommitChange(pre){ desPushUndo(pre); }
function desUndo(){
  if(!DES || !DES.undo.length){ toast("Nothing to undo."); return; }
  DES.layout=JSON.parse(DES.undo.pop());
  if(!desRegion(DES.selRegion)) DES.selRegion=null;
  DES._showIfDraft=null; // show_if may differ post-undo; force the builder to re-derive
  desRenderFull();
}

/* ---- direct manipulation: drag to move, 8 handles to resize, snap to 0.5mm (Alt disables),
 * live mm readout while dragging, one undo step per completed drag (not per mousemove) ---- */
function desBoxMouseDown(e, rid){
  if(e.button!==0) return;
  e.stopPropagation(); e.preventDefault();
  desSelectRegion(rid);
  const r=desRegion(rid); if(!r) return;
  const handleEl=e.target && e.target.closest ? e.target.closest(".des-h") : null;
  const handle=handleEl ? handleEl.dataset.h : null;
  const geom=desGeom(), isBadge=r.type==="badge";
  DES_DRAG={ id:rid, handle, sx:e.clientX, sy:e.clientY, geom, moved:false,
    snapshot: JSON.stringify(DES.layout),
    orig:{ x:r.x||0, y:r.y||0, w:isBadge?(r.d||8):(r.w||10), h:isBadge?(r.d||8):(r.h||10) } };
  document.addEventListener("mousemove", desDragMove);
  document.addEventListener("mouseup", desDragEnd);
}
function desDragMove(e){
  if(!DES_DRAG) return;
  const d=DES_DRAG, r=desRegion(d.id); if(!r){ desDragEnd(); return; }
  const dxPx=e.clientX-d.sx, dyPx=e.clientY-d.sy;
  if(Math.abs(dxPx)>1||Math.abs(dyPx)>1) d.moved=true;
  const dxmm=dxPx/d.geom.pxmm, dymm=dyPx/d.geom.pxmm;
  const grid=e.altKey?0:0.5;
  const snap=v=> grid ? Math.round(v/grid)*grid : v;
  const W=d.geom.W, H=d.geom.H, minS=2;
  let x,y,w,h;
  if(!d.handle){
    x=snap(clamp(d.orig.x+dxmm,0,Math.max(0,W-d.orig.w)));
    y=snap(clamp(d.orig.y+dymm,0,Math.max(0,H-d.orig.h)));
    w=d.orig.w; h=d.orig.h;
  } else {
    let nx=d.orig.x, ny=d.orig.y, nw=d.orig.w, nh=d.orig.h;
    if(d.handle.includes("e")) nw=Math.max(minS, d.orig.w+dxmm);
    if(d.handle.includes("s")) nh=Math.max(minS, d.orig.h+dymm);
    if(d.handle.includes("w")){ nw=Math.max(minS, d.orig.w-dxmm); nx=d.orig.x+(d.orig.w-nw); }
    if(d.handle.includes("n")){ nh=Math.max(minS, d.orig.h-dymm); ny=d.orig.y+(d.orig.h-nh); }
    if(r.type==="badge"){ const dd=Math.max(nw,nh); nw=dd; nh=dd; }
    x=snap(nx); y=snap(ny); w=snap(nw); h=snap(nh);
    x=clamp(x,0,Math.max(0,W-minS)); y=clamp(y,0,Math.max(0,H-minS));
    w=clamp(w,minS,W-x); h=clamp(h,minS,H-y);
  }
  r.x=round2(x); r.y=round2(y);
  if(r.type==="badge") r.d=round2(Math.max(w,h)); else { r.w=round2(w); r.h=round2(h); }
  desRenderCanvasOnly();
}
function desDragEnd(){
  document.removeEventListener("mousemove", desDragMove);
  document.removeEventListener("mouseup", desDragEnd);
  const d=DES_DRAG; DES_DRAG=null;
  if(d && d.moved) desPushUndo(d.snapshot);
  desRenderCanvasOnly();
  desSyncInspectorXYWH();
  if(d && d.moved) desRefreshToolbar();
}
function desSyncInspectorXYWH(){
  const r=desRegion(DES.selRegion); if(!r) return;
  const isBadge=r.type==="badge";
  const setv=(id,val)=>{ const el=document.getElementById(id); if(el && document.activeElement!==el) el.value=val; };
  setv("des-ix", r.x??0); setv("des-iy", r.y??0);
  if(isBadge) setv("des-id", r.d??8); else { setv("des-iw", r.w??0); setv("des-ih", r.h??0); }
}

/* ---- keyboard: arrows nudge 0.5mm (shift=2mm), Delete removes, Esc deselects, Ctrl/Cmd+Z undo ---- */
function desOnKey(e){
  if(!DES) return;
  const stage=document.getElementById("des-stage"); if(!stage) return; // design tab not currently shown
  const ae=document.activeElement, tag=(ae&&ae.tagName)||"";
  const typing = tag==="INPUT"||tag==="TEXTAREA"||tag==="SELECT"||(ae&&ae.isContentEditable);
  if((e.ctrlKey||e.metaKey) && !e.shiftKey && e.key.toLowerCase()==="z"){
    if(typing) return;
    e.preventDefault(); desUndo(); return;
  }
  if(typing) return;
  if(e.key==="Escape"){ if(DES.selRegion){ e.preventDefault(); desSelectRegion(null); } return; }
  if(!DES.selRegion) return;
  const r=desRegion(DES.selRegion); if(!r) return;
  if(e.key==="Delete"||e.key==="Backspace"){ e.preventDefault(); desDeleteRegion(DES.selRegion); return; }
  let dx=0,dy=0; const step=e.shiftKey?2:0.5;
  if(e.key==="ArrowLeft") dx=-step; else if(e.key==="ArrowRight") dx=step;
  else if(e.key==="ArrowUp") dy=-step; else if(e.key==="ArrowDown") dy=step;
  else return;
  e.preventDefault();
  const geom=desGeom(), pre=desBeginChange();
  const w=r.type==="badge"?(r.d||8):(r.w||10), h=r.type==="badge"?(r.d||8):(r.h||10);
  r.x=round2(clamp((r.x||0)+dx,0,Math.max(0,geom.W-w)));
  r.y=round2(clamp((r.y||0)+dy,0,Math.max(0,geom.H-h)));
  desCommitChange(pre);
  desRenderCanvasOnly(); desSyncInspectorXYWH(); desRefreshToolbar();
}
document.addEventListener("keydown", desOnKey);

/* ---- creating regions: drag a field from the palette and drop it on the canvas,
 * or "+ Add region" for a blank one. Default type/size inferred from field kind. ---- */
function desFieldDragStart(e, path, kind){
  DES_FIELD_DRAG={path,kind};
  try{ e.dataTransfer.setData("text/plain", path); e.dataTransfer.effectAllowed="copy"; }catch(err){}
}
function desFieldDrop(e){
  e.preventDefault();
  const info=DES_FIELD_DRAG || {path:(e.dataTransfer&&e.dataTransfer.getData("text/plain"))||"", kind:"string"};
  DES_FIELD_DRAG=null;
  if(!info.path) return;
  const stage=document.getElementById("des-stage"); if(!stage) return;
  const rect=stage.getBoundingClientRect();
  const geom=desGeom();
  const xmm=(e.clientX-rect.left)/geom.pxmm, ymm=(e.clientY-rect.top)/geom.pxmm;
  desCreateRegionFromField(info.path, info.kind, xmm, ymm);
}
function desUniqueId(base){
  const ids=new Set((DES.layout.regions||[]).map(r=>r.id));
  if(!ids.has(base)) return base;
  let n=2; while(ids.has(`${base}_${n}`)) n++;
  return `${base}_${n}`;
}
function desDefaultTextColor(){
  const bg=DES.layout.card && DES.layout.card.bg;
  if(!bg || bg==="palette") return "#ffffff";
  const m=/^#([0-9a-fA-F]{6})$/.exec(bg);
  if(!m) return "#222222";
  const n=parseInt(m[1],16), r=(n>>16)&255, gg=(n>>8)&255, b=n&255;
  const lum=(0.299*r+0.587*gg+0.114*b)/255;
  return lum>0.55 ? "#1a1a1a" : "#ffffff";
}
function desCreateRegionFromField(path, kind, xmm, ymm){
  if(!DES.layout) return;
  const pre=desBeginChange();
  const geom=desGeom();
  const base=desSlug(String(path).split(".").pop());
  const id=desUniqueId(base);
  let type="text", w=32, h=7, extra={align:"left",valign:"middle"};
  if(kind==="longstring"){ type="richtext"; w=42; h=22; extra={symbols:true,autoshrink:true,min_size_pt:5.5}; }
  else if(kind==="number"){ type="badge"; w=8; h=8; extra={shape:"circle"}; }
  else if(kind==="image"){ type="image"; w=30; h=30; extra={fit:"cover"}; }
  let x=round2(clamp(xmm-w/2,0,Math.max(0,geom.W-w)));
  let y=round2(clamp(ymm-h/2,0,Math.max(0,geom.H-h)));
  w=Math.min(w, Math.max(2,geom.W-x)); h=Math.min(h, Math.max(2,geom.H-y));
  const fontId=DES.layout.fonts && DES.layout.fonts[0] && DES.layout.fonts[0].id;
  const region={id,type,src:path,x,y};
  if(type==="badge") region.d=round2(Math.max(w,h)); else { region.w=round2(w); region.h=round2(h); }
  if(fontId && type!=="image") region.font=fontId;
  region.size_pt = type==="richtext"?8:(type==="badge"?11:10);
  Object.assign(region, extra);
  if(type!=="image") region.color=desDefaultTextColor();
  DES.layout.regions.push(region);
  desCommitChange(pre);
  desSelectRegion(id);
  desRenderFull();
}
function desAddBlank(){
  if(!DES.layout) return;
  const pre=desBeginChange();
  const geom=desGeom();
  const id=desUniqueId("region");
  const w=20,h=10;
  const x=round2(Math.max(0,(geom.W-w)/2)), y=round2(Math.max(0,(geom.H-h)/2));
  DES.layout.regions.push({id,type:"rect",x,y,w,h,fill:"#cccccc",stroke:"#00000040",stroke_w_mm:0.3});
  desCommitChange(pre);
  desSelectRegion(id);
  desRenderFull();
}
function desDeleteRegion(id){
  if(!DES.layout) return;
  const pre=desBeginChange();
  DES.layout.regions=(DES.layout.regions||[]).filter(r=>r.id!==id);
  desCommitChange(pre);
  if(DES.selRegion===id) DES.selRegion=null;
  desRenderFull();
}
function desRenameRegion(newIdRaw){
  const r=desRegion(DES.selRegion); if(!r) return;
  const newId=desSlug(newIdRaw);
  if(newId===r.id){ desFieldCommit(); desRenderInspectorOnly(); return; }
  const ids=new Set((DES.layout.regions||[]).map(x=>x.id));
  if(ids.has(newId)){ toast("A region with that id already exists — pick another name."); desRenderInspectorOnly(); return; }
  r.id=newId; DES.selRegion=newId;
  desFieldCommit();
  desRenderFull();
}
function desChangeRegionType(newType){
  const r=desRegion(DES.selRegion); if(!r) return;
  const pre=desBeginChange();
  const oldType=r.type;
  r.type=newType;
  if(newType==="badge" && oldType!=="badge"){
    const d=round2(Math.max(4, Math.min(r.w||8, r.h||8)));
    delete r.w; delete r.h; r.d=d; r.shape=r.shape||"circle";
  } else if(newType!=="badge" && oldType==="badge"){
    const s=r.d||8; r.w=s; r.h=s; delete r.d; delete r.shape;
  }
  if(newType==="richtext"){ if(r.symbols===undefined) r.symbols=true; if(r.autoshrink===undefined) r.autoshrink=true; }
  if(newType==="rect"){ delete r.src; delete r.text; delete r.font; delete r.size_pt; delete r.align; delete r.valign; delete r.color; if(!r.fill) r.fill="#cccccc"; }
  if(newType==="image"||newType==="background"){ if(!r.fit) r.fit="cover"; }
  if(newType==="row" && !r.of) r.of=[];
  desCommitChange(pre);
  desRenderFull();
}

/* ---- inspector field plumbing: two update paths --
 * desInspSet: instantaneous controls (select/checkbox/color) -- begin+set+commit in one call.
 * desInspLive/desFieldFocus/desFieldCommit: typed inputs -- live-update the canvas on every
 * keystroke (oninput) but only push ONE undo step per focus-session (on blur/change), the
 * same "one snapshot per gesture" discipline as drag. ---- */
function desApplyProp(r,prop,val){
  if(val===""||val===undefined){ delete r[prop]; return; }
  if(prop==="uppercase"||prop==="symbols"||prop==="autoshrink"){ r[prop]=!!val; return; }
  r[prop]=val;
}
function desInspSet(prop,val){
  const r=desRegion(DES.selRegion); if(!r) return;
  if(prop==="type"){ desChangeRegionType(val); return; }
  const pre=desBeginChange();
  desApplyProp(r,prop,val);
  desCommitChange(pre);
  desRenderCanvasOnly(); desRenderInspectorOnly(); desRefreshToolbar();
}
function desInspLive(prop,val){ const r=desRegion(DES.selRegion); if(!r) return; desApplyProp(r,prop,val); desRenderCanvasOnly(); }
function desInspLiveNum(prop,val){
  const r=desRegion(DES.selRegion); if(!r) return;
  const n=parseFloat(val);
  if(val===""||isNaN(n)) delete r[prop]; else r[prop]=n;
  desRenderCanvasOnly();
}
function desGeomLive(prop,val){
  const r=desRegion(DES.selRegion); if(!r) return;
  const n=parseFloat(val); if(isNaN(n)) return;
  const geom=desGeom();
  if(prop==="x") r.x=clamp(n,0,geom.W);
  else if(prop==="y") r.y=clamp(n,0,geom.H);
  else if(prop==="w") r.w=clamp(n,2,geom.W);
  else if(prop==="h") r.h=clamp(n,2,geom.H);
  else if(prop==="d") r.d=clamp(n,2,Math.min(geom.W,geom.H));
  desRenderCanvasOnly();
}
function desFieldFocus(){ DES._pre=JSON.stringify(DES.layout); }
function desFieldCommit(){
  if(DES._pre!=null){ desPushUndo(DES._pre); DES._pre=null; }
  desRefreshToolbar();
}

/* ---- color/bg: literal hex, "palette", or none -- never forces a palette to exist
 * until the first time someone actually asks for one, then it's auto-bootstrapped
 * from the game's own faction/type colors (same heuristic the presets use). ---- */
function desPickColorAttr(g){
  if(g.faction_colors && Object.keys(g.faction_colors).length)
    return {by:"attributes.faction", map:Object.fromEntries(Object.entries(g.faction_colors).map(([k,v])=>[k,(v&&v.fg)||"#4a4a4a"])), default:"#4a4a4a"};
  if(g.type_colors && Object.keys(g.type_colors).length)
    return {by:"type", map:Object.fromEntries(Object.entries(g.type_colors).map(([k,v])=>[k,(v&&v.fg)||"#4a4a4a"])), default:"#4a4a4a"};
  return null;
}
function desEnsurePalette(){
  if(DES.layout.palette && DES.layout.palette.by) return;
  const g=G(DES.slug);
  DES.layout.palette = desPickColorAttr(g) || {by:"attributes.faction", map:{}, default:"#4a4a4a"};
  toast("Created a starter palette bound to "+esc(DES.layout.palette.by)+" — fine-tune its color map in the raw-YAML view.",5000);
}
function desColorFieldHtml(r, prop, label){

  const mode = val==null ? "none" : (isPalette ? "palette" : "color");

  else r[prop]="#222222";

/* ---- show_if builder: always / only if <field> exists / only if <field> is empty /
 * only if <field> == value -- a picklist, never a hand-typed condition string. ---- */
function desParseShowIf(cond){
  if(!cond) return {mode:"always", field:"", value:""};
  const s=String(cond).trim();
  const m=/^(.+?)\s*(==|!=)\s*(.+)$/.exec(s);
  if(m){ let v=m[3].trim(); if(/^".*"$/.test(v)||/^'.*'$/.test(v)) v=v.slice(1,-1);
    return {mode:m[2]==="=="?"eq":"neq", field:m[1].trim(), value:v}; }
  if(s.startsWith("!")) return {mode:"notexists", field:s.slice(1).trim(), value:""};
  return {mode:"exists", field:s, value:""};
}
function desShowIfCompose(mode, field, value){
  if(mode==="always"||!field) return undefined;
  if(mode==="exists") return field;
  if(mode==="notexists") return "!"+field;
  if(mode==="eq") return `${field} == ${value}`;
  return undefined;
}
/* desShowIfDraft: the mode/field/value picker is a THREE-part choice (mode, then
 * field, then maybe a value) built up across separate onchange events, but
 * desShowIfCompose only writes r.show_if once mode+field are BOTH non-empty --
 * so each setter must accumulate into a small per-region draft rather than
 * re-deriving from r.show_if on every call (which would make picking "only if
 * field exists" and THEN a field a no-op, since neither half alone composes to
 * anything). Invalidated whenever selection changes or show_if is set from
 * outside this builder (raw-YAML apply, undo) so it never goes stale. */
function desShowIfDraft(r){
  if(!DES._showIfDraft || DES._showIfDraftFor!==r.id){ DES._showIfDraft=desParseShowIf(r.show_if); DES._showIfDraftFor=r.id; }
  return DES._showIfDraft;
}
function desShowIfHtml(r, fields){
  const si=desShowIfDraft(r);
  const modes=[["always","Always"],["exists","Only if field exists"],["notexists","Only if field is empty/absent"],["eq","Only if field equals…"]];
  const fieldOpts=fields.map(x=>`<option value="${esc(x.path)}" ${si.field===x.path?"selected":""}>${esc(x.path)}</option>`).join("");
  return `<div class="fld"><label>Show</label>
    <select onchange="desShowIfMode(this.value)">${modes.map(([v,l])=>`<option value="${v}" ${si.mode===v?"selected":""}>${esc(l)}</option>`).join("")}</select>
    ${si.mode!=="always"?`<select style="margin-top:6px" onchange="desShowIfField(this.value)"><option value="">— pick a field —</option>${fieldOpts}</select>`:""}
    ${si.mode==="eq"?`<input style="margin-top:6px" placeholder="value" value="${esc(si.value)}" onfocus="desFieldFocus()" oninput="desShowIfLiveValue(this.value)" onchange="desFieldCommit()">`:""}
  </div>`;
}
function desShowIfApply(r, si){
  const composed=desShowIfCompose(si.mode, si.field, si.value);
  if(composed) r.show_if=composed; else delete r.show_if;
}
function desShowIfMode(mode){
  const r=desRegion(DES.selRegion); if(!r) return;
  const si=desShowIfDraft(r); si.mode=mode;
  const pre=desBeginChange();
  desShowIfApply(r, si);
  desCommitChange(pre);
  desRenderInspectorOnly(); desRenderCanvasOnly(); desRefreshToolbar();
}
function desShowIfField(field){
  const r=desRegion(DES.selRegion); if(!r) return;
  const si=desShowIfDraft(r); si.field=field;
  const pre=desBeginChange();
  desShowIfApply(r, si);
  desCommitChange(pre);
  desRenderInspectorOnly(); desRenderCanvasOnly(); desRefreshToolbar();
}
function desShowIfLiveValue(value){
  const r=desRegion(DES.selRegion); if(!r) return;
  const si=desShowIfDraft(r); si.value=value;
  desShowIfApply(r, si);
  desRenderCanvasOnly();
}

/* ---- z-order: paint order IS stacking order (layoutCard paints regions in array
 * order) -- bring forward/send back reorder DES.layout.regions directly. ---- */
function desZOrderHtml(r, idx, n){
  return `<div class="fld"><label>Layer order <span style="text-transform:none;font-weight:400">(${idx+1} of ${n} — later draws on top)</span></label>
    <div style="display:flex;gap:6px;flex-wrap:wrap">
      <button class="btn" ${idx<=0?"disabled":""} onclick="desZOrder('back')" title="Move earlier (further back)">⤒ Send back</button>
      <button class="btn" ${idx>=n-1?"disabled":""} onclick="desZOrder('front')" title="Move later (further forward)">⤓ Bring forward</button>
      <button class="btn" ${idx<=0?"disabled":""} onclick="desZOrder('bottom')" title="Move to the very back">⇤ To back</button>
      <button class="btn" ${idx>=n-1?"disabled":""} onclick="desZOrder('top')" title="Move to the very front">⇥ To front</button>
    </div>
  </div>`;
}
function desZOrder(dir){
  const r=desRegion(DES.selRegion); if(!r) return;
  const arr=DES.layout.regions; const idx=arr.indexOf(r); if(idx<0) return;
  const pre=desBeginChange();
  arr.splice(idx,1);
  if(dir==="back") arr.splice(Math.max(0,idx-1),0,r);
  else if(dir==="front") arr.splice(Math.min(arr.length,idx+1),0,r);
  else if(dir==="bottom") arr.unshift(r);
  else if(dir==="top") arr.push(r);
  desCommitChange(pre);
  desRenderFull();
}

/* ---- font picker: dropdown of layout.fonts[] + inline "add font" panel (no

function desFontSelect(val){
  if(val==="__new__"){ DES._addFontOpen=true; desRenderInspectorOnly(); setTimeout(()=>{const el=document.getElementById("des-nf-fam"); if(el) el.focus();},20); return; }

function desCancelAddFont(){ DES._addFontOpen=false; desRenderInspectorOnly(); }
function desUniqueFontId(base){
  const ids=new Set((DES.layout.fonts||[]).map(f=>f.id));
  if(!ids.has(base)) return base;

function desAddFont(){
  const famEl=document.getElementById("des-nf-fam");

  r.font=id;
  DES._addFontOpen=false;
  desCommitChange(pre);
  desRenderFull();

}

/* ---- x/y/w/h (or x/y/d for a badge), synced both ways with dragging ---- */
function desGeomFieldsHtml(r){
  const isBadge=r.type==="badge";
  let h=`<div class="fld"><label>Position &amp; size (mm)</label><div class="row">`;
  h+=`<div><label style="font-weight:400;text-transform:none;font-size:11px">x</label><input id="des-ix" type="number" step="0.5" value="${r.x||0}" onfocus="desFieldFocus()" oninput="desGeomLive('x',this.value)" onchange="desFieldCommit()"></div>`;
  h+=`<div><label style="font-weight:400;text-transform:none;font-size:11px">y</label><input id="des-iy" type="number" step="0.5" value="${r.y||0}" onfocus="desFieldFocus()" oninput="desGeomLive('y',this.value)" onchange="desFieldCommit()"></div>`;
  if(isBadge){
    h+=`<div><label style="font-weight:400;text-transform:none;font-size:11px">size (d)</label><input id="des-id" type="number" step="0.5" min="2" value="${r.d||8}" onfocus="desFieldFocus()" oninput="desGeomLive('d',this.value)" onchange="desFieldCommit()"></div>`;
  } else {
    h+=`<div><label style="font-weight:400;text-transform:none;font-size:11px">w</label><input id="des-iw" type="number" step="0.5" min="2" value="${r.w||10}" onfocus="desFieldFocus()" oninput="desGeomLive('w',this.value)" onchange="desFieldCommit()"></div>`;
    h+=`<div><label style="font-weight:400;text-transform:none;font-size:11px">h</label><input id="des-ih" type="number" step="0.5" min="2" value="${r.h||10}" onfocus="desFieldFocus()" oninput="desGeomLive('h',this.value)" onchange="desFieldCommit()"></div>`;
  }
  h+=`</div></div>`;
  return h;
}

/* ---- the inspector, dispatched by region type ---- */
function desInspectorHtml(){
  if(!DES.selRegion) return `<div style="font-size:13px;color:var(--mut);padding:6px 0">Select a region on the card, or drag a field from the left to create one.</div>`;
  const r=desRegion(DES.selRegion);
  if(!r){ DES.selRegion=null; return desInspectorHtml(); }
  const g=G(DES.slug);
  const c=desCard(), p=c?cfPrinting(g,c):null;
  const fields=desFields(g,c,p);
  const fonts=DES.layout.fonts||[];
  const idx=(DES.layout.regions||[]).indexOf(r), n=(DES.layout.regions||[]).length;

  let h=`<div style="display:flex;align-items:center;gap:8px;margin-bottom:10px">
    <input id="des-rid" value="${esc(r.id)}" style="font-weight:700;font-size:14px;flex:1;padding:6px 9px;border:1px solid var(--bd);border-radius:6px" onfocus="desFieldFocus()" onchange="desRenameRegion(this.value)">
    <button class="btn" title="Delete region" style="color:var(--red)" onclick="desDeleteRegion('${esc(r.id)}')">🗑</button>
  </div>`;
  h+=`<div class="fld"><label>Type</label><select onchange="desInspSet('type',this.value)">
    ${["text","richtext","body","image","badge","pips","row","rect","background"].map(t=>`<option value="${t}" ${t===r.type?"selected":""}>${t}</option>`).join("")}
  </select></div>`;

  switch(r.type){
    case "text":
      h+=desSrcBindingHtml(r,fields)+desFontFieldHtml(r,fonts)+desFontSizeHtml(r,false)+desAlignValignHtml(r,true)+desUppercaseHtml(r)+desColorFieldHtml(r,"color","Text color")+desColorFieldHtml(r,"bg","Background");
      break;
    case "richtext":
      h+=desSrcBindingHtml(r,fields)+desFontFieldHtml(r,fonts)+desFontSizeHtml(r,true)+desAlignValignHtml(r,false)+desUppercaseHtml(r)+desSymbolsAutoshrinkHtml(r)+desColorFieldHtml(r,"color","Text color")+desColorFieldHtml(r,"bg","Background");
      break;
    case "image":
      h+=desSrcBindingHtml(r,fields)+desCreditHtml(r,fields)+desFitHtml(r)+desColorFieldHtml(r,"bg","Placeholder tint");
      break;
    case "background":
      h+=desSrcBindingHtml(r,fields)+desFitHtml(r)+desColorFieldHtml(r,"bg","Placeholder tint");
      break;
    case "badge":
      h+=desSrcBindingHtml(r,fields)+desShapeHtml(r)+desFontFieldHtml(r,fonts)+desFontSizeHtml(r,false)+desColorFieldHtml(r,"color","Text color")+desColorFieldHtml(r,"bg","Chip color");
      break;
    case "pips":
      h+=desSrcBindingHtml(r,fields)+desFontFieldHtml(r,fonts)+desFontSizeHtml(r,false)+desAlignValignHtml(r,false)+desColorFieldHtml(r,"color","Pip color")+desColorFieldHtml(r,"bg","Background");
      break;
    case "row":
      h+=desRowHtml(r);
      break;
    case "rect":
      h+=desColorFieldHtml(r,"fill","Fill")+desColorFieldHtml(r,"stroke","Stroke")+desStrokeWidthRadiusHtml(r);
      break;
  }
  h+=desShowIfHtml(r, fields);
  h+=desZOrderHtml(r, idx, n);
  h+=desGeomFieldsHtml(r);
  return h;
}

/* ---- presets: the zero-layout-work path (docs/card-formatting-pipelines.md 6.4.7) --
 * generated FROM this game's own real data (attribute_definitions, faction/type
 * colors, whether any printing has art) so even the "one click" starting point is
 * tailored, not a generic mockup -- and rendered through the real layoutCard(). ---- */
function desPreset(kind, g){
  const W=63.5, H=88.9;
  const pal=desPickColorAttr(g);
  const numAttrs=(g.schema||[]).filter(d=>d.type==="integer"||d.type==="number");
  const costAttr=numAttrs.find(d=>/cost|price|mana|energy/i.test(d.key))||numAttrs[0]||null;
  const otherNum=numAttrs.filter(d=>d!==costAttr).slice(0,3);
  const hasArt=(g.printings||[]).some(p=>p && (p.art_url||p.art));

  if(kind==="minimal"){
    return { card:{w_mm:W,h_mm:H,bleed_mm:2,radius_mm:3,bg:"#ffffff"},
      fonts:[{id:"body",family:"Lora",weight:400},{id:"title",family:"Lora",weight:700}],
      regions:[
        {id:"edge",type:"rect",x:0,y:0,w:W,h:H,fill:"none",stroke:"#00000022",stroke_w_mm:0.4,radius_mm:3},
        {id:"title",type:"text",src:"card.name",x:4,y:4,w:W-8,h:8,font:"title",size_pt:12,align:"left",valign:"middle",color:"#1a1a1a"},
        {id:"type_line",type:"text",src:"card.type",x:4,y:12.5,w:W-8,h:5,font:"body",size_pt:7,align:"left",color:"#666666",uppercase:true},
        {id:"text",type:"richtext",src:"card.text",x:4,y:20,w:W-8,h:H-28,font:"body",size_pt:9,min_size_pt:6,color:"#222222",symbols:true,autoshrink:true}
      ]};
  }
  if(kind==="party"){
    const regions=[
      {id:"bg",type:"rect",x:0,y:0,w:W,h:H,fill:pal?"palette":"#161616",radius_mm:4},
      {id:"text",type:"richtext",src:"card.text",x:6,y:8,w:W-12,h:H-22,font:"body",size_pt:14,min_size_pt:8,color:"#ffffff",align:"left",autoshrink:true},
      {id:"type_line",type:"text",src:"card.type",x:6,y:H-11,w:W-12,h:6,font:"body",size_pt:8,color:"#ffffffaa",uppercase:true,align:"left"}
    ];
    return { card:{w_mm:W,h_mm:H,bleed_mm:2,radius_mm:4,bg:pal?"palette":"#161616"},
      fonts:[{id:"body",family:"Barlow Condensed",weight:600}], ...(pal?{palette:pal}:{}), regions };
  }
  // classic
  const regions=[];
  regions.push({id:"frame",type:"rect",x:0,y:0,w:W,h:H,fill:pal?"palette":"#e8e2d0",radius_mm:3});
  if(hasArt) regions.push({id:"art",type:"image",src:"printing.art_url",credit:"printing.artist",x:4,y:11,w:W-8,h:34,fit:"cover"});
  regions.push({id:"title",type:"text",src:"card.name",x:4,y:3,w:costAttr?W-16:W-8,h:7,font:"title",size_pt:10,align:"left",valign:"middle",color:"#ffffff",bg:"#00000066"});
  if(costAttr) regions.push({id:"cost",type:"badge",src:`card.attributes.${costAttr.key}`,x:W-11,y:2.5,d:8,shape:"circle",font:"title",size_pt:10,bg:"#1c1c1c",color:"#ffffff"});
  const textY=hasArt?47:13;
  regions.push({id:"type_line",type:"text",src:"card.type",x:4,y:textY,w:W-8,h:5,font:"body",size_pt:7,align:"left",color:"#333333",uppercase:true,bg:"#ffffffaa"});
  const rowY=H-22, textH=Math.max(14, rowY-(textY+6));
  regions.push({id:"text",type:"richtext",src:"card.text",x:4,y:textY+6,w:W-8,h:textH,font:"body",size_pt:8,min_size_pt:5.5,color:"#1c1c1c",bg:"#ffffffcc",symbols:true,autoshrink:true});
  if(otherNum.length) regions.push({id:"stats",type:"row",x:4,y:H-14,w:W-8,h:9,gap_mm:2,
    of:otherNum.map(d=>({key:`attributes.${d.key}`,label:d.name||d.key,show_if:`attributes.${d.key}`}))});
  regions.push({id:"edge",type:"rect",x:0,y:0,w:W,h:H,fill:"none",stroke:"#00000040",stroke_w_mm:0.3,radius_mm:3});
  return { card:{w_mm:W,h_mm:H,bleed_mm:2,radius_mm:3,bg:pal?"palette":"#e8e2d0"},
    fonts:[{id:"title",family:"Cinzel",weight:700},{id:"body",family:"Lora",weight:400}], ...(pal?{palette:pal}:{}), regions };
}
function desGalleryHtml(g){

/* ---- layout.yaml <-> JS object, browser twin of layoutToYaml()/the (write-only)
 * serializer in server.mjs. Deliberately NOT a general YAML implementation --
 * this is a parser+serializer pair for the EXACT constrained shape both this
 * editor and server.mjs emit: block-style top-level keys (card/fonts/palette/
 * regions), a plain key:value block for card/palette, and single-line flow-maps
 * ("- { id: x, ... }") for each fonts/regions list item -- the same style
 * examples/arcmage/templates/layout.yaml is hand-authored in, and standard,
 * valid YAML (PyYAML reads flow collections fine) so tools/build_hub.py and
 * tools/validate.py need no changes. Good enough for the raw-YAML power-user
 * toggle (tweak a number, add a show_if, hand-add a region) -- not a claim of
 * general YAML-spec coverage (no anchors, no block scalars, no arbitrary deep
 * block nesting beyond what's documented here). Parse errors are caught by the
 * caller (desApplyRaw) and reported inline rather than applied. */
function desYamlStringify(layout){
  const L=layout||{};
  const out=[];
  const card=L.card||{};
  out.push("card:");
  for(const k of ["w_mm","h_mm","bleed_mm","radius_mm","bg"])
    if(card[k]!==undefined && card[k]!==null) out.push(`  ${k}: ${desYVal(card[k])}`);
  out.push("");
  if(Array.isArray(L.fonts) && L.fonts.length){
    out.push("fonts:");
    for(const f of L.fonts) out.push(`  - ${desYFlowMap(f,["id","family","weight","style"])}`);
    out.push("");
  }
  if(L.palette && L.palette.by){
    out.push("palette:");
    out.push(`  by: ${desYVal(L.palette.by)}`);
    if(L.palette.map) out.push(`  map: ${desYFlowMapRaw(L.palette.map)}`);
    if(L.palette.default!==undefined) out.push(`  default: ${desYVal(L.palette.default)}`);
    out.push("");
  }
  out.push("regions:");
  const RKEYS=["id","type","x","y","w","h","d","shape","src","text","map","glyph","max","credit","fit","font","size_pt","min_size_pt",
    "align","valign","color","bg","uppercase","symbols","autoshrink","fill","stroke","stroke_w_mm","radius_mm",
    "opacity","gap_mm","of","show_if"];
  for(const r of (L.regions||[])) out.push(`  - ${desYFlowMap(r,RKEYS)}`);
  return out.join("\n")+"\n";
}
function desYFlowMap(obj,order){
  const keys=[...order.filter(k=>obj[k]!==undefined && obj[k]!==null),
              ...Object.keys(obj).filter(k=>!order.includes(k) && obj[k]!==undefined && obj[k]!==null)];
  return "{ "+keys.map(k=>`${k}: ${desYVal(obj[k],k)}`).join(", ")+" }";
}
function desYFlowMapRaw(o){ return "{ "+Object.keys(o).map(k=>`${desYScalarStr(String(k))}: ${desYScalarStr(String(o[k]))}`).join(", ")+" }"; }
function desYVal(v,key){
  if(v===null||v===undefined) return "null";
  if(typeof v==="number") return String(Math.round(v*1000)/1000);
  if(typeof v==="boolean") return String(v);
  if(Array.isArray(v)){
    if(key==="of") return "["+v.map(cell=>desYFlowMap(cell,["key","label","font","size_pt","color","show_if"])).join(", ")+"]";
    return "["+v.map(x=>desYVal(x)).join(", ")+"]";
  }
  if(typeof v==="object") return desYFlowMapRaw(v);
  return desYScalarStr(String(v));
}
function desYScalarStr(s){
  if(/^[A-Za-z_][A-Za-z0-9_]*$/.test(s) && !/^(true|false|null|yes|no|on|off)$/i.test(s)) return s;
  return '"'+s.replace(/\\/g,"\\\\").replace(/"/g,'\\"')+'"';
}

function desYamlParse(text){
  const lines=String(text).replace(/\t/g,"  ").split("\n").map(desYStripComment);
  let i=0;
  const layout={};
  while(i<lines.length){
    const line=lines[i];
    if(!line.trim()){ i++; continue; }
    const mm=/^(\S+)\s*:\s*(.*)$/.exec(line.trim());
    if(!mm){ i++; continue; }
    const key=mm[1], restRaw=mm[2];
    if(key==="card"){ const res=desYBlockOrFlow(lines,i,restRaw); layout.card=res.value; i=res.next; continue; }
    if(key==="fonts"){ const res=desYBlockSeq(lines,i); layout.fonts=res.value; i=res.next; continue; }
    if(key==="palette"){ const res=desYBlockOrFlow(lines,i,restRaw); layout.palette=res.value; i=res.next; continue; }
    if(key==="regions"){ const res=desYBlockSeq(lines,i); layout.regions=res.value; i=res.next; continue; }
    i++;
  }
  return layout;
}
function desYStripComment(line){
  let inD=false,inS=false;
  for(let j=0;j<line.length;j++){
    const c=line[j];
    if(c==='"' && !inS) inD=!inD;
    else if(c==="'" && !inD) inS=!inS;
    else if(c==="#" && !inD && !inS) return line.slice(0,j);
  }
  return line;
}
function desYIndent(s){ const m=/^(\s*)/.exec(s); return m[1].length; }
// "key:\n  a: 1\n  b: 2" (block) OR "key: { a: 1, b: 2 }" (flow, may span lines).
function desYBlockOrFlow(lines, i, restRaw){
  const rest=restRaw.trim();
  if(rest.startsWith("{")){
    const joined=desYJoinFlow(lines, i, restRaw);
    return { value: desYParseFlowValue(joined.text,0).value, next: joined.next };
  }
  const headerIndent=desYIndent(lines[i]);
  const obj={};
  let j=i+1;
  for(; j<lines.length; j++){
    const line=lines[j];
    if(!line.trim()) continue;
    if(desYIndent(line)<=headerIndent) break;
    const m=/^(\S+)\s*:\s*(.*)$/.exec(line.trim());
    if(!m) continue;
    const k=m[1], vRest=m[2].trim();
    if(vRest.startsWith("{")||vRest.startsWith("[")||vRest.startsWith('"')||vRest.startsWith("'")){
      const joined=desYJoinFlow(lines, j, m[2]);
      obj[k]=desYParseFlowValue(joined.text,0).value; j=joined.next-1;
    } else {
      obj[k]=desYScalar(vRest);
    }
  }
  return { value: obj, next: j };
}
// "key:\n  - { ... }\n  - { ... }"
function desYBlockSeq(lines, i){
  const headerIndent=desYIndent(lines[i]);
  const arr=[];
  let j=i+1;
  for(; j<lines.length; j++){
    const line=lines[j];
    if(!line.trim()) continue;
    if(desYIndent(line)<=headerIndent) break;
    const t=line.trim();
    if(!t.startsWith("-")) continue;
    const after=t.slice(1).trim();
    const joined=desYJoinFlow(lines, j, after);
    arr.push(desYParseFlowValue(joined.text,0).value); j=joined.next-1;
  }
  return { value: arr, next: j };
}
// Join continuation lines until {}/[] braces balance, starting from `firstRest`
// (the text after "- " or "key:" on line `i`) -- supports a hand-wrapped flow value.
function desYJoinFlow(lines, i, firstRest){
  let text=firstRest, depth=0, k=i;
  const count=(s)=>{ for(const ch of s){ if(ch==="{"||ch==="[") depth++; else if(ch==="}"||ch==="]") depth--; } };
  count(text);
  while(depth>0 && k+1<lines.length){ k++; text+="\n"+lines[k]; count(lines[k]); }
  return { text, next: k+1 };
}
// Recursive-descent for one flow value: {...} | [...] | "..." | '...' | bare token.
function desYParseFlowValue(s, pos){
  pos=desYSkipWs(s,pos);
  const c=s[pos];
  if(c==="{") return desYParseFlowMap(s,pos);
  if(c==="[") return desYParseFlowArr(s,pos);
  if(c==='"'||c==="'") return desYParseQuoted(s,pos);
  return desYParseBare(s,pos);
}
function desYSkipWs(s,pos){ while(pos<s.length && /\s/.test(s[pos])) pos++; return pos; }
function desYParseFlowMap(s,pos){
  pos++; // consume {
  const obj={};
  pos=desYSkipWs(s,pos);
  if(s[pos]==="}") return {value:obj,pos:pos+1};
  for(;;){
    pos=desYSkipWs(s,pos);
    let key;
    if(s[pos]==='"'||s[pos]==="'"){ const kr=desYParseQuoted(s,pos); key=kr.value; pos=kr.pos; }
    else { const m=/^[^\s:]+/.exec(s.slice(pos)); if(!m) throw new Error("expected a key near: "+s.slice(pos,pos+24)); key=m[0]; pos+=m[0].length; }
    pos=desYSkipWs(s,pos);
    if(s[pos]!==":") throw new Error("expected ':' after key '"+key+"'"); pos++;
    const vr=desYParseFlowValue(s,pos); obj[key]=vr.value; pos=vr.pos;
    pos=desYSkipWs(s,pos);
    if(s[pos]===","){ pos++; continue; }
    if(s[pos]==="}"){ pos++; break; }
    throw new Error("expected ',' or '}' near: "+s.slice(pos,pos+24));
  }
  return {value:obj,pos};
}
function desYParseFlowArr(s,pos){
  pos++; // consume [
  const arr=[];
  pos=desYSkipWs(s,pos);
  if(s[pos]==="]") return {value:arr,pos:pos+1};
  for(;;){
    const vr=desYParseFlowValue(s,pos); arr.push(vr.value); pos=desYSkipWs(s,vr.pos);
    if(s[pos]===","){ pos++; continue; }
    if(s[pos]==="]"){ pos++; break; }
    throw new Error("expected ',' or ']' near: "+s.slice(pos,pos+24));
  }
  return {value:arr,pos};
}
function desYParseQuoted(s,pos){
  const q=s[pos]; pos++;
  let out="";
  while(pos<s.length){
    const c=s[pos];
    if(q==='"' && c==="\\" && pos+1<s.length){ out+=s[pos+1]; pos+=2; continue; }
    if(c===q){
      if(q==="'" && s[pos+1]==="'"){ out+="'"; pos+=2; continue; }
      pos++; return {value:out,pos};
    }
    out+=c; pos++;
  }
  throw new Error("unterminated quoted string: "+s.slice(0,24)+"…");
}
function desYParseBare(s,pos){
  const m=/^[^,\]\}\s][^,\]\}]*/.exec(s.slice(pos));
  if(!m) throw new Error("expected a value near: "+s.slice(pos,pos+24));
  const tok=m[0].replace(/\s+$/,"");
  pos+=m[0].length;
  return {value: desYScalar(tok), pos};
}
function desYScalar(tok){
  const t=String(tok).trim();
  if(t==="") return null;
  if(/^-?\d+$/.test(t)) return parseInt(t,10);
  if(/^-?(\d+\.\d+|\.\d+|\d+\.)$/.test(t)) return parseFloat(t);
  if(/^true$/i.test(t)) return true;
  if(/^false$/i.test(t)) return false;
  if(/^(null|~)$/i.test(t)) return null;
  if(/^".*"$/.test(t)||/^'.*'$/.test(t)) return t.slice(1,-1);
  return t;
}
