<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>Forge — where games live</title>
<meta name="viewport" content="width=device-width,initial-scale=1"><style>
:root{--h:#1c2128;--bd:#d0d7de;--bg:#f6f8fa;--fg:#1f2328;--mut:#656d76;--acc:#8250df;--grn:#1a7f37;--red:#cf222e;--blu:#0969da;--org:#bc4c00}
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:var(--fg);background:#fff;font-size:14px;line-height:1.5}
a{color:var(--blu);text-decoration:none;cursor:pointer}a:hover{text-decoration:underline}
code,.mono{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px}
/* top bar */
#top{background:var(--h);color:#fff;display:flex;align-items:center;gap:16px;padding:12px 24px}
#top .logo{font-weight:700;font-size:16px;color:#fff;display:flex;gap:8px;align-items:center}
#top input{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:6px;color:#fff;padding:5px 12px;width:280px;font-size:13px}
#top input::placeholder{color:#aab}
#top .nl{color:#d6dae0;font-size:14px}#top .nl:hover{color:#fff;text-decoration:none}
#top .spacer{flex:1}
#top .av{width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,#8c2f1b,#e0a458);border:1.5px solid rgba(255,255,255,.4)}
/* buttons & badges */
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--bd);background:var(--bg);border-radius:6px;padding:5px 14px;font-size:13px;font-weight:600;color:var(--fg);cursor:pointer}
.btn:hover{background:#eef1f4}
.btn.primary{background:var(--grn);border-color:var(--grn);color:#fff}.btn.primary:hover{background:#166f2f}
.count{background:rgba(175,184,193,.3);border-radius:20px;padding:0 7px;font-size:11px;font-weight:600;margin-left:5px}
.badge{display:inline-block;border:1px solid var(--bd);border-radius:20px;padding:1px 10px;font-size:12px;color:var(--mut)}
.badge.lic{color:var(--acc);border-color:var(--acc)}
.badge.legal{color:var(--grn);border-color:var(--grn)}.badge.illegal{color:var(--red);border-color:var(--red)}
.badge.prov{color:var(--org);border-color:var(--org)}
/* layout */
.wrap{max-width:1180px;margin:0 auto;padding:0 24px}
/* explore */
.hero{background:var(--bg);border-bottom:1px solid var(--bd);padding:38px 0 30px}
.hero h1{margin:0 0 6px;font-size:26px}.hero p{margin:0;color:var(--mut);max-width:640px}
.gamegrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px;padding:24px 0}
.gcard{border:1px solid var(--bd);border-radius:10px;padding:16px 18px;transition:box-shadow .15s}
.gcard:hover{box-shadow:0 3px 14px rgba(0,0,0,.1)}
.gcard h3{margin:0 0 4px;font-size:16px}.gcard .desc{color:var(--mut);font-size:13px;min-height:38px}
.gcard .thumbs{display:flex;gap:6px;margin:10px 0}.gcard .thumbs img{width:52px;border-radius:4px;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.gcard .meta{display:flex;gap:14px;color:var(--mut);font-size:12px;margin-top:8px;align-items:center}
/* repo header */
.repohead{padding:18px 0 0;border-bottom:1px solid var(--bd)}
.repohead .titleline{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.repohead h1{font-size:20px;font-weight:400;margin:0}
.repohead h1 b{font-weight:700}
.repohead .actions{margin-left:auto;display:flex;gap:8px}
.tabs{display:flex;gap:6px;margin-top:14px;overflow-x:auto}
.tabs a{padding:9px 14px;border-bottom:2px solid transparent;color:var(--fg);font-size:14px;white-space:nowrap}
.tabs a:hover{text-decoration:none;border-bottom-color:#d0d7de}
.tabs a.on{border-bottom-color:#fd8c73;font-weight:600}
/* content */
.pane{padding:22px 0 60px}
.two{display:grid;grid-template-columns:1fr 296px;gap:28px}
@media(max-width:900px){.two{grid-template-columns:1fr}}
.box{border:1px solid var(--bd);border-radius:8px;margin-bottom:16px}
.box .bh{background:var(--bg);border-bottom:1px solid var(--bd);padding:9px 16px;font-weight:600;font-size:13px;border-radius:8px 8px 0 0}
.box .bb{padding:14px 16px}
.sideh{font-size:13px;font-weight:600;margin:0 0 8px}
.side .box .bb{font-size:13px}
/* cards tab */
.filterbar{display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap}
.filterbar input,.filterbar select{border:1px solid var(--bd);border-radius:6px;padding:6px 12px;font-size:13px;background:var(--bg)}
.filterbar input{flex:1;min-width:200px}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.ctile{cursor:pointer;transition:transform .12s}.ctile:hover{transform:translateY(-3px)}
.ctile img{width:100%;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.ctile .cn{font-size:12px;color:var(--mut);text-align:center;margin-top:4px}
/* history */
.commit{display:flex;gap:14px;padding:14px 16px;border:1px solid var(--bd);border-radius:8px;margin-bottom:10px;cursor:pointer}
.commit:hover{background:var(--bg)}
.commit .dot{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#8c2f1b,#e0a458);flex:none;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:13px}
.commit .sub{font-weight:600}.commit .who{color:var(--mut);font-size:12px}
.chg{font-size:13px;padding:4px 0 4px 12px;border-left:2px solid var(--bd);margin:6px 0 0 6px}
.chg b{font-weight:600}
.old{background:#ffebe9;text-decoration:line-through;padding:0 5px;border-radius:3px}
.new{background:#dafbe1;padding:0 5px;border-radius:3px}
.exp{display:none;padding:0 16px 12px 60px}
.commit.open + .exp{display:block}
/* PR */
.pr{border:1px solid var(--bd);border-radius:8px;margin-bottom:16px}
.prh{padding:14px 18px;border-bottom:1px solid var(--bd)}
.prh h3{margin:0 0 3px;font-size:16px}
.prstate{background:var(--grn);color:#fff;border-radius:20px;padding:3px 12px;font-size:12px;font-weight:600}
.prstate.merged{background:#8250df}.prstate.closed{background:#57606a}
.prbody{padding:16px 18px}
.prcard{display:flex;gap:20px;align-items:flex-start;border-top:1px solid #eaeef2;padding:16px 0;flex-wrap:wrap}
.prcard img{width:180px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.arrow{align-self:center;font-size:22px;color:var(--mut)}
.mergebar{background:var(--bg);border-top:1px solid var(--bd);padding:14px 18px;display:flex;gap:12px;align-items:center}
/* releases / banlist / decks */
.rel{border-left:3px solid var(--acc);padding:4px 0 4px 16px;margin-bottom:20px}
.rel h3{margin:0}.rel pre{background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:12px;font-size:12px;white-space:pre-wrap}
blockquote{border-left:3px solid var(--org);margin:10px 0 0;padding:2px 14px;color:#57606a}
/* modal */
#modal{position:fixed;inset:0;background:rgba(28,33,40,.55);display:none;align-items:center;justify-content:center;z-index:50}
#modal.on{display:flex}
#modal .mbox{background:#fff;border-radius:12px;max-width:760px;width:92%;max-height:88vh;overflow-y:auto;display:flex;gap:22px;padding:24px}
#modal img{width:260px;border-radius:10px;align-self:flex-start;box-shadow:0 8px 30px rgba(0,0,0,.3)}
#modal h2{margin:0 0 4px}
.kv{font-size:13px;margin:3px 0}.kv b{display:inline-block;min-width:90px;color:var(--mut);font-weight:500}
.emptystate{color:var(--mut);text-align:center;padding:40px 0}
.activity{font-size:13px;padding:7px 0;border-bottom:1px solid #eaeef2;display:flex;gap:8px}
.activity:last-child{border:none}
/* ---- in-hub card editor drawer ---- */
#drawer{position:fixed;inset:0;background:rgba(28,33,40,.5);display:none;z-index:60}
#drawer.on{display:block}
.dpanel{position:absolute;top:0;right:0;height:100%;width:min(940px,96vw);background:var(--bg2,#fff);box-shadow:-12px 0 40px rgba(0,0,0,.3);display:flex;flex-direction:column;transform:translateX(30px);opacity:0;transition:transform .22s ease,opacity .22s ease}
#drawer.on .dpanel{transform:none;opacity:1}
.dhead{display:flex;align-items:center;gap:12px;padding:16px 22px;border-bottom:1px solid var(--bd)}
.dhead h2{margin:0;font-size:18px}.dhead .sub{color:var(--mut);font-size:13px}
.dbody{flex:1;overflow-y:auto;display:flex;gap:26px;padding:22px}
.dprev{flex:0 0 300px;position:sticky;top:0}
.dprev canvas{width:300px;height:420px;border-radius:16px;box-shadow:0 12px 40px rgba(0,0,0,.28)}
.dprev .hint{color:var(--mut);font-size:12px;text-align:center;margin-top:10px}
.dform{flex:1;min-width:280px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.03em;color:var(--mut);margin-bottom:5px}
.fld input,.fld select,.fld textarea{width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;font:inherit;font-size:14px;background:#fff;box-sizing:border-box}
.fld textarea{min-height:84px;resize:vertical;line-height:1.5}
.fld .row{display:flex;gap:10px}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px}
.ecardlist{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px}
.epill{border:1px solid var(--bd);background:#fff;border-radius:16px;padding:5px 12px;font-size:13px;cursor:pointer}
.epill.sel{background:var(--acc,#0969da);color:#fff;border-color:var(--acc,#0969da)}
.epill.new{border-style:dashed;color:var(--mut)}
.epill.dirty::after{content:"•";color:#d29922;margin-left:5px}
.dbar{border-top:1px solid var(--bd);padding:14px 22px;background:var(--bg2,#fff);display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.dbar .msg{flex:1;min-width:200px;font-size:13px}
.dbar .msg b{color:var(--fg,#1f2328)}
.dbar .msg .mut{color:var(--mut)}
.symbtn{border:1px solid var(--bd);background:#fff;border-radius:6px;padding:2px 8px;font-size:13px;cursor:pointer}
.issrow{display:flex;gap:10px;align-items:flex-start;padding:11px 6px;border-bottom:1px solid var(--bd);cursor:pointer}
.issrow:hover{background:var(--bg2,#f6f8fa)}
.istatus.open{color:#1a7f37}.istatus.closed{color:#8250df}
.thread{display:flex;flex-direction:column;gap:10px}
.cmt{border:1px solid var(--bd);border-radius:8px;padding:10px 12px;background:var(--bg2,#fff)}
.cmt-h{font-size:13px;margin-bottom:5px;display:flex;align-items:center;gap:6px}
.cmt-b{font-size:14px;white-space:pre-wrap;line-height:1.5}
.av.sm{width:20px;height:20px;font-size:11px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:#6e40c9;color:#fff}
</style></head><body>
<div id="top">
  <a class="logo" onclick="go('')">⬡ <span>Forge</span><span style="opacity:.5;font-weight:400;font-size:12px">· where games live · prototype</span></a>
  <input id="q" placeholder="Search games and cards…" oninput="searchAll(this.value)">
  <a class="nl" onclick="go('')">Explore</a><a class="nl" onclick="go('jams')">Jams</a><a class="nl" onclick="alert('Platform feature: your games, forks, and suggestions in one place.')">Your games</a>
  <div class="spacer"></div>
  <button class="btn" style="background:transparent;color:#fff;border-color:rgba(255,255,255,.35)" onclick="alert('Platform: creates a repo + format scaffold. CLI today: fmt import csv your.csv my-game')">+ New game</button>
  <span id="authArea"><div class="av" title="you"></div></span>
</div>
<div id="authModal" style="display:none;position:fixed;inset:0;background:rgba(28,33,40,.6);z-index:70;align-items:center;justify-content:center">
  <div style="background:#fff;border-radius:12px;padding:26px 30px;width:340px">
    <h2 style="margin:0 0 4px" id="amTitle">Sign in</h2>
    <p style="color:var(--mut);font-size:13px;margin:0 0 14px">Stars, forks, and claims need an account. Your games never do.</p>
    <div id="amErr" style="display:none;color:var(--red);font-size:13px;margin-bottom:8px"></div>
    <input id="amHandle" placeholder="handle" style="width:100%;padding:9px 12px;margin:5px 0;border:1px solid var(--bd);border-radius:8px">
    <input id="amEmail" placeholder="email" style="width:100%;padding:9px 12px;margin:5px 0;border:1px solid var(--bd);border-radius:8px;display:none">
    <input id="amPass" type="password" placeholder="password (8+ chars)" style="width:100%;padding:9px 12px;margin:5px 0;border:1px solid var(--bd);border-radius:8px">
    <button class="btn primary" style="width:100%;margin-top:10px" onclick="authSubmit()">Continue</button>
    <div style="font-size:13px;color:var(--mut);margin-top:12px;text-align:center">
      <a id="amSwitch" onclick="authMode(amMode==='login'?'register':'login')">Create an account instead</a>
      · <a onclick="document.getElementById('authModal').style.display='none'">cancel</a>
    </div>
  </div>
</div>
<div id="view"></div>
<div id="modal" onclick="if(event.target===this)this.classList.remove('on')"><div class="mbox" id="mbody"></div></div>
<div id="drawer" onclick="if(event.target===this)closeEditor()"><div class="dpanel">
  <div class="dhead">
    <div style="flex:1"><h2 id="ed-title">Edit cards</h2><div class="sub" id="ed-sub"></div></div>
    <button class="btn" onclick="closeEditor()">Close ✕</button>
  </div>
  <div class="dbody">
    <div class="dprev">
      <canvas id="ed-canvas" width="600" height="840"></canvas>
      <div class="hint">live preview — updates as you type</div>
    </div>
    <div class="dform">
      <div class="ecardlist" id="ed-list"></div>
      <div id="ed-fields"></div>
    </div>
  </div>
  <div class="dbar">
    <div class="msg" id="ed-msg"></div>
    <button class="btn" id="ed-del" onclick="edDelete()" style="color:#cf222e">Delete card</button>
    <button class="btn primary" id="ed-commit" onclick="edCommit()">Commit</button>
  </div>
</div></div>
<script>
const DATA = __DATA__;
/* ---- live mode + auth + stars (feature: accounts & stars end-to-end) ---- */
let LIVE=false, ME=null, STARS={}, MYSTARS=new Set(), amMode="login";
const tok = () => localStorage.getItem("forge_token");
const authH = () => tok() ? {Authorization:"Bearer "+tok()} : {};
async function refreshLive(){
  try {
    const h = await (await fetch("/healthz")).json(); LIVE = !!h.ok;
    if(!LIVE) return;
    const gs = await (await fetch("/api/games")).json();
    for(const g of gs) STARS[g.slug]=g.stars??0;
    if(tok()){
      const r = await fetch("/api/me",{headers:authH()});
      if(r.ok){ ME=await r.json(); MYSTARS=new Set(ME.starred); }
      else localStorage.removeItem("forge_token");
    }
    renderAuthArea(); render();
  } catch{}
}
function renderAuthArea(){
  const el=document.getElementById("authArea");
  if(!LIVE){ el.innerHTML='<div class="av" title="you"></div>'; return; }
  el.innerHTML = ME
    ? `<span style="font-size:13px;color:#d6dae0">@${esc(ME.handle)}</span>
       <a class="nl" style="font-size:12px" onclick="localStorage.removeItem('forge_token');ME=null;MYSTARS=new Set();renderAuthArea();render()">sign out</a>`
    : `<button class="btn" style="background:#e0632f;color:#fff;border:none" onclick="authOpen()">Sign in</button>`;
}
function authOpen(mode){ authMode(mode||"login"); document.getElementById("authModal").style.display="flex"; }
function authMode(m){ amMode=m;
  document.getElementById("amTitle").textContent = m==="login"?"Sign in":"Create account";
  document.getElementById("amEmail").style.display = m==="register"?"":"none";
  document.getElementById("amSwitch").textContent = m==="login"?"Create an account instead":"I have an account";
  document.getElementById("amErr").style.display="none";
}
async function authSubmit(){
  const body={handle:document.getElementById("amHandle").value.trim(),
              password:document.getElementById("amPass").value};
  if(amMode==="register") body.email=document.getElementById("amEmail").value.trim();
  const r=await fetch(`/api/auth/${amMode}`,{method:"POST",
    headers:{"content-type":"application/json"},body:JSON.stringify(body)});
  const d=await r.json();
  if(r.ok){ localStorage.setItem("forge_token",d.token);
    document.getElementById("authModal").style.display="none"; refreshLive(); }
  else { const e=document.getElementById("amErr"); e.textContent=d.error??r.status; e.style.display=""; }
}
async function toggleStar(slug, ev){
  ev?.stopPropagation?.();
  if(!ME){ authOpen(); return; }
  const method = MYSTARS.has(slug) ? "DELETE" : "PUT";
  const r = await fetch(`/api/stars/${slug}`,{method,headers:authH()});
  if(r.status===401){ authOpen(); return; }
  const d = await r.json();
  STARS[slug]=d.stars; d.starred?MYSTARS.add(slug):MYSTARS.delete(slug);
  render();
}
const starBtn = (slug) => LIVE
  ? `<button class="btn" onclick="toggleStar('${slug}',event)" title="${ME?"":"sign in to star"}">${MYSTARS.has(slug)?"★":"☆"} <span class="count">${STARS[slug]??0}</span></button>`
  : "";
let FORKED_FROM={};
async function forkGame(slug){
  if(!ME){ authOpen(); return; }
  const r=await fetch(`/api/games/${slug}/fork`,{method:"POST",headers:authH()});
  const d=await r.json();
  if(r.status===201){
    alert(`⑂ Forked! '${d.slug}' is yours — attribution to '${slug}' is committed (${d.commit}).\nTaking you to your copy…`);
    location.href=`/?t=${Date.now()}#/g/${d.slug}`; // reload → hub rebakes with the new game
  } else if(r.status===401){ authOpen(); }
  else alert(`✗ ${d.error??r.status}`);
}
refreshLive();
const $ = s => document.querySelector(s);
const esc = s => (s??"").toString().replace(/&/g,"&amp;").replace(/</g,"&lt;");
const G = slug => DATA.games.find(g=>g.slug===slug);

/* ---------- router ---------- */
function go(hash){ location.hash = hash; }
window.onhashchange = render;
function render(){
  const h = location.hash.replace(/^#\/?/,"");
  const [_, slug, tab] = h.match(/^g\/([^/]+)\/?(\w*)/) || [];
  const [__, jamId] = h.match(/^jam\/([^/]+)/) || [];
  const [___, userName] = h.match(/^u\/(.+)/) || [];
  if (slug && G(slug)) repoPage(G(slug), tab||"overview");
  else if (jamId) jamPage(jamId);
  else if (h === "jams") jamsPage();
  else if (userName) profilePage(decodeURIComponent(userName));
  else explorePage();
  window.scrollTo(0,0);
}
const person = name => (DATA.people||[]).find(p=>p.name===name);
const userLink = name => person(name) ? `<a onclick="go('u/${encodeURIComponent(name)}')">${esc(name)}</a>` : esc(name);

/* ---------- explore ---------- */
function explorePage(filter){
  const games = DATA.games.filter(g=>!filter||g.title.toLowerCase().includes(filter));
  $("#view").innerHTML = `
  <div class="hero"><div class="wrap">
    <h1>Games are repositories here.</h1>
    <p>Every game is versioned, forkable, and exportable. Card changes diff like code — but read like a designer wrote them. Print it, play it in TTS, remix it with credit.</p>
  </div></div>
  <div class="wrap"><div class="gamegrid">${games.map(g=>`
    <div class="gcard">
      <h3><a onclick="go('g/${g.slug}')">${esc(g.title)}</a> <span class="badge lic">${esc(g.license)}</span></h3>
      <div class="desc">${esc(g.description).slice(0,120)}</div>
      <div class="thumbs">${g.cards.slice(0,5).map(c=>g.images[c.id]?`<img src="${g.images[c.id]}">`:"").join("")}</div>
      <div class="meta">
        ${starBtn(g.slug)}
        <span>🃏 ${g.ncards} cards</span><span>⑂ ${g.prs.length} PR${g.prs.length===1?"":"s"}</span>
        <span>🏷 ${g.releases.length} release${g.releases.length===1?"":"s"}</span>
        <span>updated ${esc(g.updated)}</span>
      </div>
    </div>`).join("")}
  </div></div>`;
}
function searchAll(v){
  v=v.trim().toLowerCase();
  if(!location.hash || location.hash==="#"){ explorePage(v); return; }
  const m = location.hash.match(/^#\/?g\/([^/]+)/);
  if(m && G(m[1])){ go(`g/${m[1]}/cards`); setTimeout(()=>{ const i=$("#cardq"); if(i){i.value=v; filterCards(m[1]);} },30); }
}

/* ---------- repo page ---------- */
function repoPage(g, tab){
  const tabs = [
    ["overview","Overview",null],["cards","Cards",g.ncards],["rules","Rules",null],
    ["playtests","Playtests",g.playtests.length],["history","Commits",g.history.length],
    ["suggestions","Pull requests",g.prs.length],["issues","Issues",null],["releases","Releases",g.releases.length],
    ["banlist","Banlist",null],["decks","Decks",g.decks.length],
    ["community","Community",g.credit_roll.length]];
  $("#view").innerHTML = `
  <div class="repohead"><div class="wrap">
    <div class="titleline">
      <h1>📦 <a onclick="go('')">community</a> / <b>${esc(g.slug)}</b></h1>
      <span class="badge lic">${esc(g.license)}</span>
      <span class="badge prov">provenance: ${esc(g.provenance)}</span>
      ${g.attribution?`<span class="badge">⑂ remix of ${esc(g.attribution.source_title)}</span>`:""}
      <div class="actions">
        ${starBtn(g.slug)}
        <button class="btn" onclick="LIVE?forkGame('${g.slug}'):alert('Forking needs the platform server (node server.mjs).\\nCLI today: fmt fork src.git dst.git')">⑂ Fork</button>
        <button class="btn" onclick="alert('Same data, every output:\\n· Print-and-play PDF (crop marks, 300dpi)\\n· Tabletop Simulator mod\\n· CSV / InDesign data merge')">⤓ Export</button>

function edField(label, key, val, opts){
  const id="ef-"+key.replace(/\./g,"_");
  if(opts&&opts.type==="select")
    return `<div class="fld"><label>${esc(label)}</label><select id="${id}" onchange="edSet('${key}',this.value)">${opts.options.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join("")}</select></div>`;
  if(opts&&opts.type==="textarea"){
    const g=G(ED.slug), syms=(g.symbols||[]);
    const chips=syms.length?`<div style="margin-bottom:6px">${syms.map(s=>`<button class="symbtn" onclick="edInsert('${key}','[${s.key}]')" title="${esc(s.name||s.key)}">${esc(s.glyph||s.key)} ${esc(s.key)}</button>`).join(" ")}</div>`:``;
    return `<div class="fld"><label>${esc(label)}</label>${chips}<textarea id="${id}" oninput="edSet('${key}',this.value)">${esc(val||"")}</textarea></div>`;
  }
  const t=opts&&opts.type==="integer"?"number":"text";
  return `<div class="fld"><label>${esc(label)}</label><input id="${id}" type="${t}" value="${esc(val??"")}" oninput="edSet('${key}',${t==='number'?'this.valueAsNumber':'this.value'})"></div>`;
}
function edRenderFields(){
  const g=G(ED.slug), c=edCard(); if(!c){$("#ed-fields").innerHTML="";return;}
  const types=Object.keys(g.type_colors||{}); if(!types.includes(c.type)&&c.type)types.unshift(c.type);
  const defs=g.schema||[];
  let h=edField("Name","name",c.name);
  h+=`<div class="row">${types.length?edField("Type","type",c.type,{type:"select",options:types}):edField("Type","type",c.type)}
       <div style="flex:1">${edField("Deck limit","deck_limit",c.deck_limit)}</div></div>`;
  h+=edField("Subtypes (comma-sep)","__subtypes",(c.subtypes||[]).join(", "));
  h+=`<div class="row">${defs.map(d=>`<div style="flex:1">${edField(d.name||d.key,"attributes."+d.key,(c.attributes||{})[d.key],{type:d.type})}</div>`).join("")||""}</div>`;
  h+=edField("Rules text","text",c.text,{type:"textarea"});
  h+=edField("Keywords (comma-sep)","__keywords",(c.keywords||[]).join(", "));
  $("#ed-fields").innerHTML=h;
}
function edSet(key,val){
  const c=edCard(); if(!c)return;
  if(key==="__subtypes"){c.subtypes=val.split(",").map(s=>s.trim()).filter(Boolean);}
  else if(key==="__keywords"){c.keywords=val.split(",").map(s=>s.trim()).filter(Boolean);}
  else if(key==="deck_limit"){c.deck_limit=val===""||val==null?null:Number(val);}
  else if(key.startsWith("attributes.")){c.attributes=c.attributes||{};const k=key.slice(11);
    if(val===""||val==null||(typeof val==="number"&&isNaN(val)))delete c.attributes[k];else c.attributes[k]=val;}
  else c[key]=val;
  edRefreshDirty(); edRenderList();
  if(key==="name"||key==="type")edRenderFields();
  edPreview(); edBar();
}
function edInsert(key,token){const el=document.getElementById("ef-"+key);if(!el)return;
  const s=el.selectionStart??el.value.length; el.value=el.value.slice(0,s)+token+el.value.slice(el.selectionEnd??s);
  el.focus(); el.selectionStart=el.selectionEnd=s+token.length; edSet(key,el.value);}
function edAdd(){
  let n=1,id; do{id="new_card_"+n++;}while(ED.cards.find(c=>c.id===id));
  const g=G(ED.slug), t=Object.keys(g.type_colors||{})[0]||"card";
  ED.cards.push({id,name:"New Card",type:t,subtypes:[],text:"",keywords:[],attributes:{},deck_limit:1});
  edRefreshDirty(); edSelect(id); edBar();
}
function edDelete(){
  const c=edCard(); if(!c)return;
  if(!confirm(`Remove "${c.name}" from this edit?`))return;
  ED.cards=ED.cards.filter(x=>x.id!==c.id); edRefreshDirty();

}
/* ---- the money shot: draw the card face live on a canvas ---- */
function edPreview(){
  const cv=document.getElementById("ed-canvas"),x=cv.getContext("2d");
  const g=G(ED.slug),c=edCard(); const W=cv.width,H=cv.height;
  x.clearRect(0,0,W,H);
  if(!c)return;
  const col=edColors(g,c.type), sym=edSym(g);
  const rr=(a,b,w,h,r)=>{x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath();};
  x.fillStyle=col.bg; rr(12,12,W-24,H-24,34); x.fill();
  x.lineWidth=6; x.strokeStyle=col.fg; x.stroke();
  // title bar
  x.fillStyle=col.fg; rr(30,30,W-60,86,20); x.fill();
  x.fillStyle="#fff"; x.font="bold 46px DejaVu Sans, Arial, sans-serif"; x.textBaseline="middle";
  x.fillText((c.name||"Untitled").slice(0,20),52,74);
  // cost badge (first numeric attribute)
  const defs=g.schema||[]; const costKey=(defs[0]||{}).key;
  if(costKey&&(c.attributes||{})[costKey]!=null){
    x.beginPath();x.arc(W-70,73,34,0,7);x.fillStyle="#fff";x.fill();x.lineWidth=5;x.strokeStyle=col.fg;x.stroke();
    x.fillStyle=col.fg;x.font="bold 40px DejaVu Sans, Arial";x.textAlign="center";x.fillText(String(c.attributes[costKey]),W-70,75);x.textAlign="left";
  }
  // type line
  x.fillStyle=col.fg; x.font="italic 30px DejaVu Sans, Arial";
  x.fillText([c.type,(c.subtypes||[]).join(" ")].filter(Boolean).join(" · ").slice(0,28),40,150);
  // art well
  x.fillStyle="rgba(0,0,0,.06)"; rr(40,175,W-80,250,16); x.fill();
  const img=g.images[c.id];
  if(img&&!c.__isnew){const im=new Image();im.onload=()=>{x.save();rr(40,175,W-80,250,16);x.clip();x.drawImage(im,40,175,W-80,250);x.restore();};im.src=img;}
  else{x.fillStyle=col.fg;x.globalAlpha=.35;x.font="20px DejaVu Sans, Arial";x.textAlign="center";x.fillText("art",W/2,305);x.textAlign="left";x.globalAlpha=1;}
  // rules text with symbol glyph substitution + wrapping
  const txt=(c.text||"").replace(/\[(\w+)\]/g,(m,k)=>sym[k]||m);
  x.fillStyle="#1a1a1a"; x.font="30px DejaVu Sans, Arial";
  let ty=470; const words=txt.split(/\s+/); let line="";
  for(const w of words){const t=line?line+" "+w:w;
    if(x.measureText(t).width>W-90&&line){x.fillText(line,45,ty);ty+=40;line=w;}else line=t;
    if(ty>H-70)break;}
  if(line&&ty<=H-70)x.fillText(line,45,ty);
  // other attributes footer
  const rest=defs.slice(1).filter(d=>(c.attributes||{})[d.key]!=null).map(d=>`${d.name||d.key} ${c.attributes[d.key]}`).join("   ");
  if(rest){x.fillStyle=col.fg;x.font="bold 26px DejaVu Sans, Arial";x.fillText(rest.slice(0,30),45,H-50);}
}
function edSummary(){ // mirror carddiff.summarize titles
  const changed=[],added=[],removed=[];
  const om=new Map(ED.orig.map(c=>[c.id,c])),nm=new Map(ED.cards.map(c=>[c.id,c]));
  for(const[id,o]of om){const n=nm.get(id);if(!n)removed.push(o.name);else if(JSON.stringify(o)!==JSON.stringify(n))changed.push(n.name);}
  for(const[id,n]of nm)if(!om.has(id))added.push(n.name);
  const parts=[];const names=[...changed,...added.map(a=>a+" (new)"),...removed.map(r=>r+" (removed)")];
  const n=changed.length+added.length+removed.length;
  if(!n)return null;
  const verb=changed.length&&!added.length&&!removed.length?"changed":"updated";
  return {title:`cards: ${verb} ${n} card${n===1?"":"s"} (${names.slice(0,3).join(", ")}${names.length>3?", …":""})`, n};
}
function edBar(){
  const s=edSummary();
  $("#ed-del").style.display=edCard()?"":"none";
  $("#ed-commit").disabled=!s;
  $("#ed-msg").innerHTML=s
    ? `<b>${esc(s.title)}</b><br><span class="mut">this message writes itself from the diff — ${ED.access.canWrite?"lands as a commit":"opens a pull request"}</span>`
    : `<span class="mut">No changes yet. Pick a card and start editing — the preview updates live.</span>`;
}
async function edCommit(){
  const s=edSummary(); if(!s)return;
  const btn=$("#ed-commit"); btn.disabled=true; const was=btn.textContent; btn.textContent="Saving…";
  try{
    if(ED.access.canWrite){
      const r=await fetch(`/api/games/${ED.slug}/cards`,{method:"PUT",headers:{"content-type":"application/json",...edToken()},body:JSON.stringify(ED.cards)});
      const d=await r.json();
      if(r.status===200&&d.saved){toast(`<b>✓ Committed ${esc(d.commit)}</b><br>${esc(d.message)}<br><span style="opacity:.7">Now in ${esc(ED.slug)}'s history.</span>`);closeEditorForce();await reload();}
      else if(r.status===422)toast(`<b style="color:#ffa198">✗ Validation failed</b><br>`+(d.report||[]).filter(l=>l.includes("ERROR")).slice(0,3).map(esc).join("<br>"),9000);
      else if(r.status===403&&d.propose){ED.access.canWrite=false;$("#ed-commit").textContent="Propose as PR";toast("You don't have write access — switching to propose.",6000);}
      else toast(`<b style="color:#ffa198">✗ ${esc(d.error||r.status)}</b>`,8000);
    } else {
      const title=prompt("Title for your pull request:",s.title); if(!title){btn.disabled=false;btn.textContent=was;return;}
      const r=await fetch(`/api/games/${ED.slug}/cards/propose`,{method:"POST",headers:{"content-type":"application/json",...edToken()},body:JSON.stringify({cards:ED.cards,title})});
      const d=await r.json();
      if(r.status===201)toast(`<b>⇡ Pull request opened</b><br>${esc(d.message)}<br><span style="opacity:.7">Committed to your fork <b>${esc(d.fork)}</b> as ${esc(d.commit)} — owner can review on the Pull requests tab.</span>`,12000);
      else toast(`<b style="color:#ffa198">✗ ${esc(d.error||r.status)}</b>`,8000);
    }
  }catch(e){toast(`<b style="color:#ffa198">✗ ${esc(e.message)}</b>`,8000);}
  btn.disabled=false; btn.textContent=was; edBar();
}

function playtests(g){

  // insights: cost curve + most-flagged
  const curve={};
  for(const c of g.cards){const k=(c.attributes||{}).cost;if(k!=null)curve[k]=(curve[k]||0)+1;}
  const mx=Math.max(...Object.values(curve),1);
  const flags={};
  for(const s of g.playtests)for(const n of s.card_notes||[]){(flags[n.card_id]=flags[n.card_id]||[]).push(n.tag);}
  const names=Object.fromEntries(g.cards.map(c=>[c.id,c.name]));
  const rank=Object.entries(flags).sort((a,b)=>b[1].length-a[1].length).slice(0,5);
  const mins=g.playtests.reduce((a,s)=>a+(s.duration_minutes||0),0);
  const tagColor={balance:"var(--org)",confusing:"var(--red)",fun:"var(--grn)",bug:"var(--red)",timing:"var(--blu)",art:"var(--acc)"};
  $("#pane").innerHTML=`<div class="two"><div>

function history(g){

    <div class="commit" onclick="this.classList.toggle('open')">

      · ${h.introduced?`${h.introduced} cards introduced`:`${h.changes.length} card change${h.changes.length===1?"":"s"}`}</div></div>

      :`<div class="chg"><b>${esc(ch.name)}</b> ${ch.kind}</div>`).join("")||"<div class='chg' style='color:var(--mut)'>Initial import of all cards.</div>"}</div>

/* ---------- Issues: bug reports & balance debates ---------- */
function fmtWhen(ms){const d=new Date(ms);return isNaN(d)?"":d.toLocaleDateString();}
function commentThread(list){
  return `<div class="thread">${(list||[]).map(c=>`
    <div class="cmt"><div class="cmt-h"><span class="av sm">${esc((c.author_handle||"?")[0])}</span> <b>${esc(c.author_handle)}</b> <span class="mut">${fmtWhen(c.created_at)}</span></div>
    <div class="cmt-b">${esc(c.body)}</div></div>`).join("")||"<div class='mut' style='font-size:13px'>No comments yet.</div>"}</div>`;
}
function issues(g){
  if(!LIVE){$("#pane").innerHTML="<div class='emptystate'>Issues are a platform feature — run <code>node server.mjs</code>.<br><span style='font-size:13px'>Bug reports, balance debates, and design questions live here.</span></div>";return;}
  liveIssues(g);
}
async function liveIssues(g){
  const pane=$("#pane");
  pane.innerHTML="<div class='emptystate'>Loading issues…</div>";
  const list=await (await fetch(`/api/games/${g.slug}/issues`)).json();
  try{window.__catalog=await (await fetch('/api/games')).json();}catch(e){}
  const openForm=ME?`
    <div class="pr" style="margin-bottom:16px">
      <input id="iss-t" placeholder="Issue title — e.g. Wildfire opening is too strong" style="width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;box-sizing:border-box;margin-bottom:8px">
      <textarea id="iss-b" placeholder="Describe it — repro, playtest data, a proposed fix…" style="width:100%;min-height:66px;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;box-sizing:border-box;font:inherit"></textarea>
      <div style="margin-top:8px"><button class="btn primary" onclick="openIssue('${g.slug}')">Open issue</button></div>
    </div>`:`<div class="mut" style="font-size:13px;margin-bottom:14px">Sign in to open an issue.</div>`;
  const open=list.filter(i=>i.status==="open"),closed=list.filter(i=>i.status==="closed");
  const row=(i)=>`<div class="issrow" onclick="issueDetail('${g.slug}',${i.number})">
    <span class="istatus ${i.status}">${i.status==="open"?"◉":"✓"}</span>
    <div style="flex:1"><b>${esc(i.title)}</b> <span class="mut">#${i.number}</span>
      <div class="mut" style="font-size:12px">by ${esc(i.author_handle)}${i.comment_count?` · 💬 ${i.comment_count}`:""}</div></div></div>`;
  pane.innerHTML=openForm+
    `<div class="mut" style="font-size:13px;margin-bottom:8px">${open.length} open · ${closed.length} closed</div>`+
    (list.length?open.map(row).join("")+closed.map(row).join(""):"<div class='emptystate'>No issues yet — be the first to file one.</div>");
}
async function openIssue(slug){
  const title=$("#iss-t").value.trim(); if(!title){prNote("Title required",true);return;}
  const r=await fetch(`/api/games/${slug}/issues`,{method:"POST",headers:{"content-type":"application/json",...authHdr()},body:JSON.stringify({title,body:$("#iss-b").value})});
  const d=await r.json();
  if(r.status===201){prNote(`Opened issue #${d.number}`);liveIssues(G(slug));}
  else prNote(d.error||"failed",true);
}
async function issueDetail(slug,n){
  const i=await (await fetch(`/api/games/${slug}/issues/${n}`)).json();
  $("#pane").innerHTML=`
    <button class="btn" onclick="liveIssues(G('${slug}'))">← all issues</button>
    <div class="pr" style="margin-top:12px">
      <div class="prh"><span class="istatus ${i.status}" style="font-size:15px">${i.status==="open"?"◉ open":"✓ closed"}</span>
        &nbsp;<h3 style="display:inline">${esc(i.title)} <span class="mut">#${i.number}</span></h3>
        <div class="mut" style="font-size:13px;margin-top:5px">opened by <b>${esc(i.author)}</b> · ${fmtWhen(i.created_at)}</div></div>
      ${i.body?`<div class="cmt-b" style="padding:10px 0">${esc(i.body)}</div>`:""}
      ${commentThread(i.comments)}
      ${ME?`<div style="margin-top:12px"><textarea id="cbox" placeholder="Add to the discussion…" style="width:100%;min-height:60px;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;box-sizing:border-box;font:inherit"></textarea>
        <div style="margin-top:8px"><button class="btn primary" onclick="commentIssue('${slug}',${n})">Comment</button>
        ${(ME.handle===i.author||myOwns(slug))?`<button class="btn" onclick="closeIssue('${slug}',${n})">${i.status==="open"?"Close issue":"Reopen"}</button>`:""}</div></div>`:`<div class="mut" style="font-size:13px;margin-top:10px">Sign in to comment.</div>`}
    </div>`;
}
function myOwns(slug){const c=(window.__catalog||[]).find(x=>x.slug===slug);return c&&ME&&c.owner_handle===ME.handle;}
async function commentIssue(slug,n){
  const body=$("#cbox").value.trim(); if(!body)return;
  const r=await fetch(`/api/games/${slug}/issues/${n}/comments`,{method:"POST",headers:{"content-type":"application/json",...authHdr()},body:JSON.stringify({body})});
  if(r.status===201)issueDetail(slug,n); else prNote((await r.json()).error||"failed",true);
}
async function closeIssue(slug,n){
  const r=await fetch(`/api/games/${slug}/issues/${n}/close`,{method:"POST",headers:authHdr()});
  if(r.status===200)issueDetail(slug,n); else prNote((await r.json()).error||"failed",true);
}
/* ---- LIVE pull requests: the real merge loop, in the browser ---- */
function prNote(msg,bad){const n=document.createElement("div");n.textContent=msg;
  n.style.cssText="position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:"+(bad?"#b35900":"var(--grn)")+";color:#fff;padding:10px 22px;border-radius:8px;z-index:99;font-weight:600;box-shadow:0 4px 18px rgba(0,0,0,.3)";
  document.body.appendChild(n);setTimeout(()=>n.remove(),3500);}
const authHdr=()=>({Authorization:"Bearer "+localStorage.forge_token,"content-type":"application/json"});
function chgHtml(ch){return ch.kind==="changed"
  ?`<div class="chg"><b>${esc(ch.name)}</b> · ${esc(String(ch.field).replace("attributes.",""))}: <span class="old">${esc(String(ch.from))}</span> → <span class="new">${esc(String(ch.to))}</span></div>`
  :`<div class="chg"><b>${esc(ch.name)}</b> ${ch.kind}</div>`;}
async function liveSuggestions(g){
  const pane=$("#pane");
  pane.innerHTML="<div class='emptystate'>Loading pull requests…</div>";
  const [prs,catalog]=await Promise.all([
    (await fetch(`/api/games/${g.slug}/prs`)).json(),
    (await fetch(`/api/games`)).json()]);
  const meGames=(ME&&ME.games)||[];
  const myFork=meGames.find(s=>s===`${g.slug}-${ME&&ME.handle}`);
  const thisRow=catalog.find(c=>c.slug===g.slug);
  const proposeUp=thisRow&&thisRow.forked_from&&meGames.includes(g.slug)?thisRow.forked_from:null;
  let head="";
  if(myFork) head+=`<button class="btn primary" onclick="proposePr('${myFork}','${g.slug}')">⇡ Propose changes from your fork (${esc(myFork)})</button> `;
  if(proposeUp) head+=`<button class="btn primary" onclick="proposePr('${g.slug}','${proposeUp}')">⇡ Propose these changes to ${esc(proposeUp)}</button>`;
  if(head) head=`<div style="margin-bottom:14px">${head}</div>`;
  if(!prs.length){pane.innerHTML=head+"<div class='emptystate'>No pull requests yet.<br><span style='font-size:13px'>Fork this game, edit your copy, and propose the changes back — the diff will be cards, not code.</span></div>";return;}
  pane.innerHTML=head+prs.map(pr=>`
    <div class="pr" id="pr-${pr.id}">
      <div class="prh"><span class="prstate ${pr.status}">${pr.status[0].toUpperCase()+pr.status.slice(1)}</span>
        &nbsp;<h3 style="display:inline">${esc(pr.title)}</h3>
        <div style="color:var(--mut);font-size:13px;margin-top:6px"><b>${esc(pr.author_handle)}</b> proposes <code>${esc(pr.from_slug)}</code> → <code>${esc(g.slug)}</code></div></div>
      <div class="prbody" id="prb-${pr.id}"><button class="btn" onclick="prDetail('${g.slug}','${pr.id}')">View card changes</button></div>
    </div>`).join("");
}
async function prDetail(slug,id){
  const pr=await (await fetch(`/api/games/${slug}/prs/${id}`)).json();
  const box=$(`#prb-${id}`);
  const conflictNote=pr.conflicts&&pr.conflicts.length
    ?`<div class="chg" style="color:#b35900"><b>⚠ conflicts:</b> both sides changed ${pr.conflicts.map(esc).join(", ")} — resolve in the fork first</div>`:"";
  const actions=pr.status==="open"&&ME?`<div class="mergebar">
      <button class="btn primary" onclick="mergePr('${slug}','${id}')">Merge — commits as ${esc(pr.author)}</button>
      <button class="btn" onclick="closePr('${slug}','${id}')">Close</button>
      <span style="color:var(--mut);font-size:13px">Accepted changes keep ${esc(pr.author)}'s name in the history.</span></div>`
    :(pr.status==="merged"?`<div class="mergebar"><span style="color:var(--mut)">merged as <code>${esc(pr.merge_sha||"")}</code></span></div>`:"");
  const discussion=`<div style="margin-top:14px"><div class="mut" style="font-size:12px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:6px">Discussion</div>${commentThread(pr.comments)}
    ${ME?`<textarea id="prc-${id}" placeholder="Leave a review comment…" style="width:100%;min-height:56px;margin-top:8px;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;box-sizing:border-box;font:inherit"></textarea>
      <div style="margin-top:6px"><button class="btn" onclick="commentPr('${slug}','${id}')">Comment</button></div>`:``}</div>`;
  box.innerHTML=(pr.changes||[]).map(chgHtml).join("")+conflictNote+discussion+actions;
}
async function commentPr(slug,id){
  const el=$(`#prc-${id}`); const body=(el.value||"").trim(); if(!body)return;
  const r=await fetch(`/api/games/${slug}/prs/${id}/comments`,{method:"POST",headers:{"content-type":"application/json",...authHdr()},body:JSON.stringify({body})});
  if(r.status===201)prDetail(slug,id); else prNote((await r.json()).error||"failed",true);
}
async function mergePr(slug,id){
  const r=await fetch(`/api/games/${slug}/prs/${id}/merge`,{method:"POST",headers:authHdr()});
  const d=await r.json();
  if(r.ok){prNote(`Merged as ${d.commit} — ${d.changes.length} change${d.changes.length===1?"":"s"} landed`);setTimeout(()=>location.reload(),1200);}
  else prNote(d.error+(d.conflicts?": "+d.conflicts.join(", "):""),true);
}
async function closePr(slug,id){
  const r=await fetch(`/api/games/${slug}/prs/${id}/close`,{method:"POST",headers:authHdr()});
  const d=await r.json();
  if(r.ok){prNote("PR closed");prDetail(slug,id);liveSuggestions(G(slug));}
  else prNote(d.error,true);
}
async function proposePr(from,to){
  if(!ME){prNote("Sign in first",true);return;}
  const title=prompt(`Propose changes: ${from} → ${to}\n\nTitle for your pull request:`);
  if(!title) return;
  const r=await fetch(`/api/games/${to}/prs`,{method:"POST",headers:authHdr(),
    body:JSON.stringify({from,title})});
  const d=await r.json();
  if(r.ok) prNote(`PR opened: "${title}" (${d.changes.length} card change${d.changes.length===1?"":"s"})`);
  else prNote(d.error,true);
}
async function suggestions(g){
  if(LIVE) return liveSuggestions(g);
  if(!g.prs.length){$("#pane").innerHTML="<div class='emptystate'>No open pull requests.<br><span style='font-size:13px'>Fork this game, make changes, and open a PR — the diff will be cards, not code.</span></div>";return;}
  $("#pane").innerHTML=g.prs.map(pr=>{
    const byCard={};
    for(const ch of pr.changes){(byCard[ch.card]=byCard[ch.card]||{name:ch.name,fields:[]}).fields.push(ch);}
    return `<div class="pr">
    <div class="prh"><span class="prstate">Open</span> &nbsp;<h3 style="display:inline">${esc(pr.title)}</h3>
      <div style="color:var(--mut);font-size:13px;margin-top:6px"><b>${esc(pr.author)}</b> wants to merge <code>${esc(pr.branch)}</code> into <code>main</code> · ${Object.keys(byCard).length} card${Object.keys(byCard).length===1?"":"s"} changed</div></div>
    <div class="prbody">
      ${Object.entries(byCard).map(([cid,e])=>`
        <div class="prcard">
          <div><div style="font-size:11px;color:var(--mut);text-transform:uppercase;margin-bottom:4px">current</div>${G(g.slug).images[cid]?`<img src="${G(g.slug).images[cid]}">`:""}</div>
          <div class="arrow">→</div>
          <div><div style="font-size:11px;color:var(--mut);text-transform:uppercase;margin-bottom:4px">proposed</div>${pr.after[cid]?`<img src="${pr.after[cid]}">`:""}</div>
          <div style="flex:1;min-width:220px"><b>${esc(e.name)}</b>
            ${e.fields.map(f=>f.kind==="changed"?`<div class="chg">${esc(f.field.replace("attributes.",""))}: <span class="old">${esc(f.from)}</span> → <span class="new">${esc(f.to)}</span></div>`:`<div class="chg">${f.kind}</div>`).join("")}
          </div>
        </div>`).join("")}
    </div>
    <div class="mergebar">
      <button class="btn primary" onclick="alert('Platform: 3-way merge on card JSON; conflicts resolve per-card, pick-one.\\nToday: git merge ${esc(pr.branch)}')">Accept changes</button>
      <button class="btn" onclick="alert('Comments thread — playtest results belong here.')">💬 Discuss</button>
      <span style="color:var(--mut);font-size:13px">Every accepted change keeps ${esc(pr.author)}'s name in the game's history.</span>
    </div></div>`;}).join("");
}

function releases(g){
  $("#pane").innerHTML=g.releases.length?g.releases.slice().reverse().map(r=>`
    <div class="rel"><h3>🏷 ${esc(r.tag)} <span style="color:var(--mut);font-weight:400;font-size:13px">${esc(r.date)}</span></h3>

}

function banlist(g){
  const cardsById=Object.fromEntries(g.cards.map(c=>[c.id,c]));
  $("#pane").innerHTML=(g.formats.map(f=>{
    const r=g.restrictions.find(x=>x.id===f.active_restriction_id);
    return `<div class="box"><div class="bh">${esc(f.name)}</div><div class="bb">
      <div class="kv"><b>Card pool</b>${f.card_pool.map(s=>{const set=g.sets.find(x=>x.id===s);return esc(set?set.name:s)}).join(", ")}</div>

function decks(g){
  const cardsById=Object.fromEntries(g.cards.map(c=>[c.id,c]));
  $("#pane").innerHTML=g.decks.length?g.decks.map(d=>`
    <div class="box"><div class="bh">${esc(d.name)} ${d._legal?'<span class="badge legal">LEGAL</span>':'<span class="badge illegal">ILLEGAL</span>'}

    <div class="bb"><div style="font-size:13px">${Object.entries(d.cards).map(([cid,n])=>`${n}× ${esc(cardsById[cid]?.name||cid)}`).join(" · ")}</div>

}

      ${p.games.map(g=>`<div style="display:flex;justify-content:space-between;align-items:baseline;margin:9px 0">
        <b><a onclick="go('g/${g.slug}')">${esc(g.title)}</a></b>
        <span style="color:var(--mut);font-size:12.5px">${g.roles.map(esc).join(", ")}${g.commits?` · ${g.commits} commits`:""}${g.sessions?` · ${g.sessions} sessions`:""}</span>
      </div>`).join("")||"<span class='muted'>No games yet.</span>"}
    </div></div>
    <div class="box"><div class="bh">Recent commits</div><div class="bb">
      ${commits.slice(0,8).map(c=>`<div class="activity"><span>●</span><div>
        <b>${esc(c.subject)}</b> <span style="color:var(--mut)">in <a onclick="go('g/${c.slug}/history')">${esc(c.game)}</a> · ${esc(c.date)}</span></div></div>`).join("")||"<span class='muted'>No commits (playtesters count too — showing up to break games is a contribution).</span>"}
    </div></div>
  </div><div class="side">
    ${p.entries.length?`<div class="box"><div class="bh">🎪 Jam entries</div><div class="bb">
      ${p.entries.map(e=>`<div class="kv" style="margin:8px 0"><b>${esc(e.game)}</b><br>
        <span style="color:var(--mut);font-size:12px"><a onclick="go('jam/${e.jam_id}')">${esc(e.jam)}</a></span>
        ${e.award?`<br><span class="badge" style="color:var(--org);border-color:var(--org)">${esc(e.award)}</span>`:""}</div>`).join("")}
    </div></div>`:""}
    <div class="box"><div class="bh">On the platform</div><div class="bb" style="color:var(--mut);font-size:12.5px">
      This profile is computed from git history, playtest logs, and credits — no account needed to be seen.
      Accounts (stars, comments, notifications) come with the hosted platform.
    </div></div>
  </div></div></div></div>`;
}

/* ---------- jams ---------- */
const JSTATUS = {upcoming:["#0969da","Starts soon"],running:["#1a7f37","● Running"],judging:["#bc4c00","Judging"],complete:["#656d76","Complete"]};
function jamCountdown(j){
  const now=new Date(); const end=new Date(j.ends+"T23:59:59"); const start=new Date(j.starts);
  if(j.status==="running"){ const d=Math.max(0,Math.ceil((end-now)/864e5)); return `${d} day${d===1?"":"s"} left`; }
  if(j.status==="upcoming"){ const d=Math.max(0,Math.ceil((start-now)/864e5)); return `starts in ${d} day${d===1?"":"s"}`; }
  return j.status==="judging" ? "entries closed — judging underway" : "finished";
}
function jamsPage(){
  $("#view").innerHTML=`
  <div class="hero"><div class="wrap">
    <h1>Game jams</h1>
    <p>Time-boxed design sprints. A theme, a constraint, a deadline — and every entry is a real versioned game with print-and-play and TTS exports the moment it's submitted.</p>
  </div></div>
  <div class="wrap"><div class="gamegrid">${(DATA.jams||[]).map(j=>{
    const [color,label]=JSTATUS[j.status]||["#656d76",j.status];
    return `<div class="gcard">
      <h3><a onclick="go('jam/${j.id}')">${esc(j.title)}</a>
        <span class="badge" style="color:${color};border-color:${color}">${label}</span></h3>
      <div class="desc">${esc(j.tagline||"")}</div>
      <div class="meta"><span>🎨 theme: <b>${esc(j.theme)}</b></span>
        <span>📅 ${esc(j.starts)} → ${esc(j.ends)}</span>
        <span>🃏 ${(j.entries||[]).length} entries</span>
        <span>${jamCountdown(j)}</span></div>
    </div>`;}).join("")||"<div class='emptystate'>No jams yet.</div>"}
  </div></div>`;
}
function jamPage(id){
  const j=(DATA.jams||[]).find(x=>x.id===id);
  if(!j){ jamsPage(); return; }
  const [color,label]=JSTATUS[j.status]||["#656d76",j.status];
  const c=j.constraints||{};
  const rules=[];
  if(c.min_cards||c.max_cards) rules.push(`🃏 ${c.min_cards??1}–${c.max_cards??"∞"} unique cards`);
  if(c.max_deck_size) rules.push(`📦 ≤${c.max_deck_size} physical cards`);
  if(c.required_license) rules.push(`⚖️ license: ${c.required_license.join(" / ")}`);
  if(c.theme_word_required) rules.push(`🎨 theme word must appear in the game`);
  $("#view").innerHTML=`
  <div class="hero"><div class="wrap">
    <h1>${esc(j.title)} <span class="badge" style="color:#fff;border-color:rgba(255,255,255,.5)">${label}</span></h1>
    <p><b>Theme: ${esc(j.theme)}</b> · ${esc(j.starts)} → ${esc(j.ends)} · ${jamCountdown(j)}</p>
    <p>${esc(j.tagline||"")}</p>
    <div class="cta"><button class="btn primary" style="background:#e0632f;color:#fff;border:none"
      onclick="alert('Enter in 3 steps:\\n1. Make your game (import a spreadsheet or start in the editor)\\n2. Run: fmt jam-check your-game jams/${j.id}.yaml\\n3. Submit your game link before ${j.ends}\\n\\nOn the platform this is one button.')">🎪 Enter this jam</button></div>
  </div></div>
  <div class="wrap"><div class="pane"><div class="two"><div>
    <div class="box"><div class="bh">Entries <span class="count">${(j.entries||[]).length}</span></div><div class="bb">
      ${(j.entries||[]).map(e=>{
        const g=e.game_id?G(e.game_id):null;
        const thumb=g?Object.values(g.images)[0]:null;
        return `<div style="display:flex;gap:14px;align-items:center;margin:12px 0">
          ${thumb?`<img src="${thumb}" style="width:56px;border-radius:6px;box-shadow:0 2px 6px rgba(0,0,0,.2)">`:"<div style='width:56px;height:78px;border:1px solid var(--bd);border-radius:6px'></div>"}
          <div><b>${g?`<a onclick="go('g/${g.slug}')">${esc(e.title)}</a>`:esc(e.title)}</b>
            ${e.award?`<span class="badge" style="color:var(--org);border-color:var(--org)">${esc(e.award)}</span>`:""}
            <div style="color:var(--mut);font-size:12.5px">by ${userLink(e.author)}${e.submitted?` · ${esc(e.submitted)}`:""}</div></div>
        </div>`;}).join("")||"<div class='emptystate'>No entries yet — be first.</div>"}
    </div></div>
  </div><div class="side">
    <div class="box"><div class="bh">Rules (machine-checked)</div><div class="bb">
      ${rules.map(r=>`<div class="kv" style="margin:7px 0">${r}</div>`).join("")}
      ${c.notes?`<blockquote>${esc(c.notes)}</blockquote>`:""}
      <div class="mono" style="color:var(--mut);font-size:11px;margin-top:10px">fmt jam-check my-game jams/${j.id}.yaml</div>
    </div></div>
    ${(j.judging||[]).length?`<div class="box"><div class="bh">Judging</div><div class="bb">${j.judging.map((x,i)=>`<div class="kv">${i+1}. ${esc(x)}</div>`).join("")}</div></div>`:""}
    ${(j.prizes||[]).length?`<div class="box"><div class="bh">🏆 Prizes</div><div class="bb">${j.prizes.map(p=>`<div class="kv" style="margin:6px 0">${esc(p)}</div>`).join("")}</div></div>`:""}
  </div></div></div></div>`;
}

function community(g){
  const c = g.community || {};
  const gov = c.governance || {};
  const govLabel = {lead:"👑 Lead designer decides",council:"🏛 Council of maintainers",open:"🌊 Open — playtest bar decides"}[gov.model] || "Not declared";
  const statusStyle = {idea:"var(--mut)",in_design:"var(--blu)",playtesting:"var(--org)",released:"var(--grn)",parked:"var(--mut)"};
  const statusLabel = {idea:"idea",in_design:"in design",playtesting:"playtesting",released:"released",parked:"parked"};
  $("#pane").innerHTML = `<div class="two"><div>
    <div class="box"><div class="bh">Governance — how this game is led</div><div class="bb">
      <div style="font-size:15px;font-weight:600;margin-bottom:6px">${govLabel}</div>
      ${gov.maintainers?`<div class="kv"><b>Maintainers</b>${gov.maintainers.map(esc).join(", ")}</div>`:""}
      ${gov.decision_process?`<p style="font-size:13px;color:#444">${esc(gov.decision_process)}</p>`:""}
      <div style="color:var(--mut);font-size:12px">Disagree with the direction? <b>Fork it.</b> That's the appeal process — and great forks get linked back.</div>
    </div></div>
    ${(c.open_calls||[]).length?`<div class="box"><div class="bh">🙋 Help wanted</div><div class="bb">
      ${c.open_calls.map(o=>`<div style="margin:10px 0"><span class="badge" style="color:var(--org);border-color:var(--org);font-weight:600">${esc(o.role)}</span>
        <span style="font-size:13px"> ${esc(o.note)}</span></div>`).join("")}
    </div></div>`:""}
    ${(c.roadmap||[]).length?`<div class="box"><div class="bh">🗺 Roadmap</div><div class="bb">
      ${c.roadmap.map(r=>`<div style="display:flex;gap:12px;align-items:baseline;margin:9px 0">
        <span class="badge" style="color:${statusStyle[r.status]};border-color:currentColor;min-width:86px;text-align:center">${statusLabel[r.status]}</span>
        <div><b>${esc(r.title)}</b>${r.target?` <span style="color:var(--mut);font-size:12px">· ${esc(r.target)}</span>`:""}
        ${r.notes?`<div style="color:var(--mut);font-size:12.5px">${esc(r.notes)}</div>`:""}</div></div>`).join("")}
    </div></div>`:""}
    ${g.design_html?`<div class="box"><div class="bh">📓 Design notes — the why behind the what</div><div class="bb" style="max-width:700px">${g.design_html}</div></div>`:""}
  </div><div class="side">
    <div class="box"><div class="bh">Credits <span style="font-weight:400;color:var(--mut)">· auto-generated</span></div><div class="bb">
      ${g.credit_roll.slice().sort((a,b)=>(b.commits+b.sessions)-(a.commits+a.sessions)).map(p=>`
        <div style="display:flex;gap:10px;align-items:center;margin:9px 0">
          <div class="dot" style="width:26px;height:26px;font-size:12px;border-radius:50%;background:linear-gradient(135deg,#8c2f1b,#e0a458);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700">${esc(p.name[0].toUpperCase())}</div>
          <div><b style="font-size:13px">${userLink(p.name)}</b><br><span style="font-size:11.5px;color:var(--mut)">${p.roles.map(esc).join(", ")}${p.commits?` · ${p.commits} commit${p.commits!==1?"s":""}`:""}${p.sessions?` · ${p.sessions} session${p.sessions!==1?"s":""}`:""}</span></div>
        </div>`).join("")}
      <div style="color:var(--mut);font-size:11.5px;margin-top:10px">Playtesters are credited automatically — showing up to break the game is a contribution. <code>fmt credits</code></div>
    </div></div>
  </div></div>`;
}

render();
</script></body></html>
