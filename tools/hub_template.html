/* ---- save: LIVE -> PUT /api/games/:slug/layout (validated commit). STATIC ->
 * download layout.yaml + toast that a server is needed to save in place. ---- */
async function desSave(){
  if(!DES.layout) return;
  const isLive = typeof LIVE!=="undefined" && LIVE;
  if(isLive){
    const btn=document.getElementById("des-save"); if(btn){ btn.disabled=true; btn.textContent="Saving…"; }
    try{
      const r=await fetch(`/api/games/${DES.slug}/layout`,{method:"PUT",headers:authHdr(),body:JSON.stringify({layout:DES.layout})});
      const d=await r.json().catch(()=>({}));
      if(r.status===200 && (d.saved || d.saved===false)){
        if(d.saved===false){ toast("No changes to save."); }
        else{
          toast(`<b>✓ Committed ${esc(d.commit)}</b><br>${esc(d.message||"layout: update card design")}`);
          const g=G(DES.slug); if(g) g.layout=JSON.parse(JSON.stringify(DES.layout));
          DES.orig=JSON.parse(JSON.stringify(DES.layout));
        }
      } else if(r.status===401){ toast("Sign in to save changes."); authOpen(); }
      else if(r.status===403){ toast(esc(d.error||"No commit access to this game."),7000); }
      else if(r.status===422){ toast(`<b style="color:#ffa198">✗ Validation failed</b><br>`+((d.report||[]).filter(l=>l.includes("ERROR")).slice(0,3).map(esc).join("<br>")||esc(d.error||"invalid layout")),9000); }
      else toast(`<b style="color:#ffa198">✗ ${esc(d.error||r.status)}</b>`,8000);
    }catch(e){ toast(`<b style="color:#ffa198">✗ ${esc(e.message)}</b>`,8000); }
    desRenderFull();
  } else {
    const text=desYamlStringify(DES.layout);
    const blob=new Blob([text],{type:"text/yaml"});
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download="layout.yaml"; document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),2000);
    toast("Downloaded layout.yaml — server needed to save in place (run node server.mjs).",7000);
  }
}
function desCopyFallback(text,done){

function designNandeckAffectedFamilies(g,data){
  if(!g?.card_design)return [];
  if(data.affected_families?.length){const ids=new Set(data.affected_families);return g.card_design.families.filter(family=>ids.has(family.id));}
  const sources=new Set((data.changes||[]).map(change=>change.source_file).filter(Boolean));
  const componentBySource=new Map((g.card_design.components||[]).map(component=>[component.source,component.id]));
  let families=g.card_design.families.filter(family=>sources.has(g.card_design.system_path)||sources.has(family.source)||[...sources].some(source=>family.components?.includes(componentBySource.get(source))));
  if(!families.length)families=g.card_design.families.filter(family=>family.id===data.family);
  return families;
}
function designNandeckPreviewGame(g,family,data){
  const layout=JSON.parse(JSON.stringify(family.layout)), relevantSources=new Set([g.card_design.system_path,family.source]);
  for(const component of g.card_design.components||[])if(family.components?.includes(component.id))relevantSources.add(component.source);
  for(const change of data.changes||[]){
    if(change.source_file&&!relevantSources.has(change.source_file))continue;
    if(change.id==="card"){layout.card=layout.card||{};layout.card[change.path]=change.after;continue;}
    if(String(change.id).startsWith("font:")){layout.fonts=layout.fonts||[];if(change.after&&!layout.fonts.some(font=>font.id===change.after.id))layout.fonts.push(change.after);continue;}
    const region=(layout.regions||[]).find(item=>item.id===change.id);if(region)region[change.path]=change.after;
  }
  const families=g.card_design.families.map(item=>item.id===family.id?{...item,layout}:item);
  return {...g,card_design:{...g.card_design,families}};
}

async function designProjectDryRun(slug,file){
  prNote("Checking project against current Forge version…");
  const r=await fetch(`/api/games/${encodeURIComponent(slug)}/design/import`,{method:"POST",headers:edToken(),body:file});
  const data=await r.json().catch(()=>({}));
  if(!r.ok){prNote(data.error||"Could not inspect project",true);return;}
  DESIGN_PROJECT_IMPORT={slug,file,data};
  $("#mbody").innerHTML=designProjectReviewHtml(data,file);$("#modal").classList.add("on");

async function designProjectCommit(){
  if(!DESIGN_PROJECT_IMPORT)return;
  const {slug,file}=DESIGN_PROJECT_IMPORT, allowDelete=!!document.getElementById("design-project-delete")?.checked;
  const counts=designProjectCounts(DESIGN_PROJECT_IMPORT.data);
  if(counts.deletes&&!allowDelete){prNote("Review and allow the listed deletions first.",true);return;}
  const button=document.getElementById("design-project-commit");if(button){button.disabled=true;button.textContent="Validating + committing…";}
  const query=allowDelete?"?commit=1&allow_delete=1":"?commit=1";
  const r=await fetch(`/api/games/${encodeURIComponent(slug)}/design/import${query}`,{method:"POST",headers:edToken(),body:file});
  const data=await r.json().catch(()=>({}));
  if(!r.ok){if(button){button.disabled=false;button.textContent=DESIGN_PROJECT_IMPORT.data.propose?"Commit to fork + open PR":"Commit imported changes";}prNote(data.error||"Import failed",true);return;}
  $("#modal").classList.remove("on");prNote(data.proposed?`Committed ${data.commit} · PR ${data.pr} opened`:data.saved?`Committed ${data.commit}`:"No changes to commit");

}

// Accent = first type_colors fg, else first faction_colors fg, else the
// #232936 default -- but skip candidates too light to read as text/rules
// on the rulebook's white page (e.g. CAH's "black" card type is fg:#fff,
// meant for white-on-black card chrome, not a heading color on paper).
function rbUsableAccent(hex){
  const m=/^#([0-9a-fA-F]{6})$/.exec(hex||"");
  if(!m) return false;
  const n=parseInt(m[1],16), r=(n>>16)&255, gg=(n>>8)&255, b=n&255;
  return (0.299*r+0.587*gg+0.114*b)/255 < 0.78;

function rbAccent(g){
  const cands=[
    ...Object.keys(g.type_colors||{}).map(k=>(g.type_colors[k]||{}).fg),
    ...Object.keys(g.faction_colors||{}).map(k=>(g.faction_colors[k]||{}).fg),
  ];
  return cands.find(rbUsableAccent) || "#232936";
}

// Inline markdown -> HTML. Code spans are pulled out FIRST into a
// placeholder (protected from every rule below), so `snake_case_ids`
// littered through this project's rules text never get mangled by the
// *italic*/_italic_ regexes -- then bold/italic, then [sym] tokens
// render as the same glyph chips cardFrame() puts on cards (cfSym()).
function rbInline(g, s){
  const sym = cfSym(g);
  const stash = [];
  let raw = (s??"").toString().replace(/`([^`]+?)`/g, (m,c)=>{ stash.push(c); return " "+(stash.length-1)+" "; });
  let out = esc(raw);
  out = out.replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
  out = out.replace(/__(.+?)__/g, "<strong>$1</strong>");
  out = out.replace(/\*(.+?)\*/g, "<em>$1</em>");
  out = out.replace(/(^|\s)_([^\s_](?:[^_]*[^\s_])?)_(?=\s|$)/g, "$1<em>$2</em>");
  out = out.replace(/\[([a-z0-9_]+)\]/gi, (m,k)=> cfSymHtml(g,k,"cf-sym") || (sym[k] ? `<span class="cf-sym" title="${esc(k)}">${esc(sym[k])}</span>` : m));
  out = out.replace(/ (\d+) /g, (m,idx)=>`<code>${esc(stash[+idx])}</code>`);
  return out;
}

// (![caption](path) / ![caption|left](path) / ![caption|right](path)).
// "|left" / "|right" in the alt text (not the path) selects a floated,
// max-width:45% figure that prose wraps around; no suffix = a plain,
// full-column-width figure. path resolves against g.rules_assets -- the
// {markdown-path: data-URI} map build_hub.py embeds from the game's own
// assets/ dir (see embed_rules_assets() in tools/build_hub.py) -- so a
// self-contained hub.html still shows the image with no extra requests.
// http(s)/data URLs pass through untouched; anything else neither embedded
// nor absolute falls back to the raw path (best-effort under a live server).
function rbFigure(g, rawAlt, path){
  let caption = (rawAlt||"").toString(), align = "";
  const am = /^(.*)\|\s*(left|right)\s*$/i.exec(caption);
  if(am){ caption = am[1].trim(); align = am[2].toLowerCase(); }
  const isAbs = /^([a-z][a-z0-9+.-]*:)?\/\//i.test(path) || /^data:/i.test(path);
  const src = isAbs ? path : ((g.rules_assets || {})[path] || path);
  const cls = align ? ` rb-fig-${align}` : "";
  return `<figure class="rb-fig${cls}"><img src="${esc(src)}" alt="${esc(caption)}" loading="lazy">${

// "example": a fixed "EXAMPLE OF PLAY" label (kind-of-play callout, styled
// as a tinted/italic aside -- see .rb-example in RB_CSS); any trailing text
// after the word "example" on the opening fence line (::: example Turn 3)
// renders as a small subtitle next to the label instead of being dropped.
// "sidebar": the rest of the opening fence line IS the box's own title
// (::: sidebar Designer note -> "Designer note"); falls back to "Sidebar".
function rbContainer(g, kind, titleRest, innerHtml){
  if(kind==="example"){
    const sub = titleRest ? ` <span class="rb-example-sub">— ${rbInline(g,titleRest)}</span>` : "";

// Block-level compile: headings (anchor ids; ## also feeds the TOC),
// "> " runs -> NOTE boxes, pipe tables, -/* lists, 1. lists, hr, and
// paragraphs (contiguous plain lines join into one <p>, unlike the
// line-per-<p> of md_to_html()/_mdPrev -- an improvement, since these
// rulebooks are hand-wrapped prose spanning several source lines).
function rbCompile(g, md){
  const lines = (md||"").replace(/\r\n?/g,"\n").split("\n");
  const toc = [], usedIds = new Set();
  const mkId = (text)=>{ let base="rb-"+rbSlugify(g.slug)+"-"+rbSlugify(text), id=base, n=2;
    while(usedIds.has(id)) id=base+"-"+(n++); usedIds.add(id); return id; };
  const isHeading = l => /^#{1,6}\s+/.test(l);
  const isQuote = l => /^>\s?/.test(l);
  const isUl = l => /^\s*[-*]\s+/.test(l);
  const isOl = l => /^\s*\d+\.\s+/.test(l);
  const isHr = l => /^-{3,}$/.test(l.trim());
  const isFence = l => /^:::\s*(example|sidebar)\b/i.test(l.trim());
  const isFenceEnd = l => /^:::\s*$/.test(l.trim());
  const isImg = l => /^!\[[^\]]*\]\([^)\s]+\)\s*$/.test(l.trim());
  const isTableSep = l => /^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(l);
  const splitRow = l => l.trim().replace(/^\|/,"").replace(/\|$/,"").split("|").map(c=>c.trim());
  // compileBlock() runs the full block-level dispatch over an ARBITRARY lines
  // array -- called once for the whole document, and recursively for the
  // lines captured inside a ::: example / ::: sidebar fence, so nested
  // paragraphs/lists/tables/images inside a fence get the exact same
  // compiler as the top level (no second, weaker implementation).
  function compileBlock(blockLines){
    const out = [];
    let i=0, inUl=false, inOl=false;
    const closeLists=()=>{ if(inUl){out.push("</ul>");inUl=false;} if(inOl){out.push("</ol>");inOl=false;} };
    while(i<blockLines.length){
      const line = blockLines[i].replace(/\s+$/,"");
      if(line.trim()===""){ closeLists(); i++; continue; }
      const hm = /^(#{1,6})\s+(.*?)\s*#*$/.exec(line);
      if(hm){
        closeLists();
        const level=hm[1].length, text=hm[2].trim(), id=mkId(text);
        if(level===2) toc.push({id, text});
        out.push(`<h${level} id="${id}">${rbInline(g,text)}</h${level}>`);
        i++; continue;
      }
      if(isFence(line)){
        closeLists();
        const fm = /^:::\s*(example|sidebar)\b\s*(.*)$/i.exec(line.trim());
        const kind = fm[1].toLowerCase(), titleRest = fm[2].trim();
        i++;
        const inner=[];
        while(i<blockLines.length && !isFenceEnd(blockLines[i])){ inner.push(blockLines[i]); i++; }
        if(i<blockLines.length) i++; // consume closing ':::'
        out.push(rbContainer(g, kind, titleRest, compileBlock(inner)));
        continue;
      }
      if(isImg(line)){
        closeLists();
        const im = /^!\[([^\]]*)\]\(([^)\s]+)\)/.exec(line.trim());
        out.push(rbFigure(g, im[1], im[2]));
        i++; continue;
      }
      if(isQuote(line)){
        closeLists();
        const qlines=[];
        while(i<blockLines.length && isQuote(blockLines[i])){ qlines.push(blockLines[i].replace(/^>\s?/,"")); i++; }
        const paras=[]; let cur=[];
        for(const l of qlines){ if(l.trim()===""){ if(cur.length){paras.push(cur.join(" "));cur=[];} } else cur.push(l); }
        if(cur.length) paras.push(cur.join(" "));
        out.push(`<div class="rb-note"><div class="rb-note-h">Note</div>${paras.map(p=>`<p>${rbInline(g,p)}</p>`).join("")}</div>`);
        continue;
      }
      if(line.includes("|") && i+1<blockLines.length && isTableSep(blockLines[i+1])){
        closeLists();
        const header = splitRow(line); i+=2;
        const rows=[];
        while(i<blockLines.length && blockLines[i].trim()!=="" && blockLines[i].includes("|")){ rows.push(splitRow(blockLines[i])); i++; }
        out.push(`<table><thead><tr>${header.map(h=>`<th>${rbInline(g,h)}</th>`).join("")}</tr></thead><tbody>${
          rows.map(r=>`<tr>${r.map(c=>`<td>${rbInline(g,c)}</td>`).join("")}</tr>`).join("")}</tbody></table>`);
        continue;
      }
      if(isUl(line)){
        if(inOl){out.push("</ol>");inOl=false;}
        if(!inUl){out.push("<ul>");inUl=true;}
        out.push(`<li>${rbInline(g, line.replace(/^\s*[-*]\s+/,""))}</li>`);
        i++; continue;
      }
      if(isOl(line)){
        if(inUl){out.push("</ul>");inUl=false;}
        if(!inOl){out.push("<ol>");inOl=true;}
        out.push(`<li>${rbInline(g, line.replace(/^\s*\d+\.\s+/,""))}</li>`);
        i++; continue;
      }
      if(isHr(line)){ closeLists(); out.push("<hr>"); i++; continue; }
      closeLists();
      const para=[line]; i++;
      while(i<blockLines.length && blockLines[i].trim()!=="" && !isHeading(blockLines[i]) && !isQuote(blockLines[i]) && !isUl(blockLines[i]) && !isOl(blockLines[i]) && !isHr(blockLines[i]) && !isFence(blockLines[i]) && !isImg(blockLines[i])
            && !(blockLines[i].includes("|") && i+1<blockLines.length && isTableSep(blockLines[i+1]))){
        para.push(blockLines[i]); i++;
      }
      out.push(`<p>${rbInline(g, para.join(" "))}</p>`);
    }
    closeLists();
    return out.join("\n");
  }
  const html = compileBlock(lines);
  return {html, toc};
}

/* printRules(slug) -- true print rulebook: same rulebookHtml() (so the

 *
 * Pagination has two layers, and the second is allowed to fail silently:
 *   1. Plain @page/@media print CSS (unchanged from before) -- A4, two
 *      columns, break-avoid on headings/tables/etc, a position:fixed
 *      footer. This is what runs the print/"Save as PDF" dialog gets if

 *      versions/engines -- skipped rather than shipped flaky. */
function printRules(slug){
  const g = G(slug);

  if(!win){ toast("Pop-up blocked — allow pop-ups for this site to print the rulebook."); return; }
  const doc = `<!DOCTYPE html><html lang="en"><head><meta charset="utf-8">
<title>${esc(g.title)} — official rules</title>

<style>
${RB_CSS}
*{box-sizing:border-box}
html,body{margin:0;background:#e9ebee;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Helvetica,Arial,sans-serif;color:#1f2328}

  size:A4;margin:14mm;

}

}

function render(){

  const legacy=parts[0]==="g"&&!scoped?G(parts[1]):null, game=scoped||legacy;
  const tab=scoped?parts[3]:(legacy?parts[2]:null), mode=scoped?parts[4]:(legacy?parts[3]:null);

  for(const delay of [0,250,1000])setTimeout(()=>document.querySelectorAll('input[type="search"]').forEach(input=>{
    if(input.matches(':-webkit-autofill'))input.value="";

}

function searchAll(v){

  if(!location.hash || location.hash==="#"){ explorePage(v); return; }
  const current=(()=>{const p=location.hash.replace(/^#\/?/,"").split("/").map(decodeURIComponent);return p[0]==="g"?(GP(p[1],p[2])||G(p[1])):null})();
  if(current){ go(`${gameRoute(current)}/cards`); setTimeout(()=>{ const i=$("#cardq"); if(i){i.value=v; filterCards(current.slug);} },30); }
}

async function liveSync(slug){
  if(typeof LIVE==="undefined"||!LIVE) return;
  let s; try{ s=await (await fetch(`/api/games/${slug}/sync`)).json(); }catch{ return; }
  const pane=$("#pane"); if(!pane) return;
  const old=document.getElementById("sync-box"); if(old)old.remove();
  const box=document.createElement("div"); box.className="box"; box.id="sync-box"; box.style.marginBottom="14px";
  box.innerHTML = s.connected
    ? `<div class="bh">▦ Sheet working copy <span style="color:var(--mut);font-weight:400">· drafting stays in Sheets; accepted history starts in Forge</span></div><div class="bb">
        <div style="font-size:12.5px;color:var(--mut);word-break:break-all;margin-bottom:10px">${s.source_mode==="addon"?"Private Google Sheet tab · connected through Forge for Sheets":esc(s.url)}</div>
        ${s.forge_ahead?`<div class="chg" style="margin-bottom:10px"><b>Forge advanced after the last Sheet candidate.</b> The next check will merge independent work and block overlapping edits.</div>`:""}
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${s.source_mode==="addon"?`<button class="btn primary" disabled title="Open Extensions → Forge → Open candidate panel in the connected Sheet">Check from the Sheet add-on</button>`:`<button class="btn primary" onclick="syncPull('${slug}',true)">Check draft changes</button>`}
          <button class="btn" onclick="syncOff('${slug}')">Detach</button></div>
        <div id="sync-out" style="margin-top:10px"></div></div>`
    : `<div class="bh">▦ Attach a Sheet working copy</div><div class="bb">
        <div style="font-size:13px;color:var(--mut);margin-bottom:10px">Sheets keeps its collaboration and version history. Forge checks playable-object changes, validates and renders them, then lets you deliberately commit one candidate that every export and playtest can reproduce. For now, paste a published tab URL or use the Forge for Sheets add-on for a private Sheet.</div>
        <div style="display:flex;gap:8px"><input id="sync-url" placeholder="https://docs.google.com/spreadsheets/…" style="flex:1;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit">
        <button class="btn primary" onclick="syncConnect('${slug}')">Attach</button></div>
        <div id="sync-out" style="margin-top:10px"></div></div>`;
  pane.insertBefore(box, pane.firstChild);
}
async function syncConnect(slug){
  const el=$("#sync-url"); const url=(el&&el.value||"").trim(); if(!url)return;
  toast("Reading the working copy…");
  const r=await fetch(`/api/games/${slug}/sync/sheet`,{method:"PUT",headers:authHdr(),body:JSON.stringify({url})});
  const d=await r.json().catch(()=>({}));
  if(r.ok){ toast(`Working copy attached — ${d.cards} cards visible${d.identity_safe?"":" · add a permanent id column before renaming cards"}`,7000); liveSync(slug); }
  else toast(d.error||"couldn't attach working copy");
}
async function syncOff(slug){ await fetch(`/api/games/${slug}/sync/sheet`,{method:"DELETE",headers:authHdr()}); toast("Sheet working copy detached"); liveSync(slug); }
const SHEET_PREVIEWS={};
function syncVal(v,missing){ return missing?`<i style="color:var(--mut)">(missing)</i>`:`<code>${esc(JSON.stringify(v))}</code>`; }
function syncConflict(c){
  return `<div class="chg" style="border-left:3px solid var(--red);padding-left:10px;margin:8px 0">
    <b>${esc(c.name||c.id)}</b> · ${esc(c.entity)} <code>${esc(c.field)}</code>
    <div style="display:grid;grid-template-columns:70px 1fr;gap:3px 8px;margin-top:5px;font-size:12px">
      <span style="color:var(--mut)">Last candidate</span><span>${syncVal(c.base,c.base_missing)}</span>
      <span style="color:var(--mut)">Forge now</span><span>${syncVal(c.forge,c.forge_missing)}</span>
      <span style="color:var(--mut)">Sheet draft</span><span>${syncVal(c.sheet,c.sheet_missing)}</span>
    </div></div>`;
}
function syncCandidateCard(slug,item){
  const g=G(slug), before=item.before, candidate=item.candidate;
  const printing=(item.printings||[])[0]||null;
  const fields=(SHEET_PREVIEWS[slug]?.data?.changes||[]).filter(c=>c.card===item.id&&c.kind==="changed").map(c=>c.field.replace("attributes.",""));
  const face=(c,p)=>c?layoutCard(g,c,p||cfPrinting(g,c),{w:150,highlight:fields}):`<div style="width:150px;aspect-ratio:63.5/88.9;border:1px dashed var(--bd);border-radius:10px;display:grid;place-items:center;color:var(--mut);font-size:12px">card absent</div>`;
  return `<div class="chg" style="margin:10px 0"><b>${esc(candidate?.name||before?.name||item.id)}</b>
    <div style="display:flex;gap:14px;align-items:flex-start;overflow:auto;margin-top:8px">
      <div><div style="font-size:11px;color:var(--mut);margin-bottom:4px">FORGE NOW</div>${face(before,null)}</div>
      <div><div style="font-size:11px;color:var(--grn);margin-bottom:4px">CANDIDATE</div>${face(candidate,printing)}</div>
    </div></div>`;
}
async function syncPull(slug,dry){
  const out=$("#sync-out"); if(out)out.innerHTML="<span style='color:var(--mut);font-size:13px'>Checking playable objects and validation…</span>";
  if(!dry&&!SHEET_PREVIEWS[slug]) return syncPull(slug,true);
  const p=SHEET_PREVIEWS[slug];
  const qs=dry?"?dry=1":"";
  const commitBody=dry?{}:{preview:p.preview,
    commit_message:($("#sheet-commit-message")?.value||"").trim(),
    contributors:($("#sheet-contributors")?.value||"").split(",").map(v=>v.trim()).filter(Boolean)};
  const r=await fetch(`/api/games/${slug}/sync/pull${qs}`,{method:"POST",headers:authHdr(),body:JSON.stringify(commitBody)});
  const d=await r.json().catch(()=>({}));
  if(!r.ok){
    delete SHEET_PREVIEWS[slug];
    if(out)out.innerHTML=`<div class="chg" style="color:var(--red)"><b>${esc(d.error||"candidate check failed")}</b></div>`+
      ((d.conflicts||[]).map(syncConflict).join(""))+
      (d.stale?`<button class="btn" onclick="syncPull('${slug}',true)" style="margin-top:8px">Check again</button>`:"");
    return;
  }
  const ch=d.changes||[];
  if(!dry){
    delete SHEET_PREVIEWS[slug];
    if(d.saved){ toast(`Candidate committed as ${d.commit} — exports and playtests can now pin this exact version`); setTimeout(()=>location.reload(),1400); }
    else { if(out)out.innerHTML="<span style='color:var(--mut);font-size:13px'>✓ No draft changes to build. Sheets remains the editing workspace.</span>"; toast("No draft changes to build"); }
    return;
  }
  const conflicts=d.conflicts||[], pc=(d.printing_changes||[]).length;
  const warnings=(d.warnings||[]).map(w=>`<div style="font-size:12px;color:#8a5a00;margin-top:5px">⚠ ${esc(w)}</div>`).join("");
  if(conflicts.length){
    delete SHEET_PREVIEWS[slug];
    if(out)out.innerHTML=`<div class="chg" style="color:var(--red)"><b>${conflicts.length} conflict${conflicts.length===1?"":"s"} — no candidate can be committed.</b><br><span style="font-size:12px">Resolve each field in Forge or the Sheet, then check again.</span></div>`+
      conflicts.map(syncConflict).join("")+warnings;
    return;
  }
  SHEET_PREVIEWS[slug]={preview:d.preview,data:d};
  const validation=d.validation||{}, validationLines=(validation.report||[]).filter(l=>/error|warn|invalid/i.test(l)).slice(0,5);
  const validationHtml=validation.ok
    ? `<div style="font-size:12px;color:var(--grn);margin:7px 0">✓ Candidate passes game validation</div>`
    : `<div class="chg" style="color:var(--red);margin:7px 0"><b>Candidate fails validation</b>${validationLines.map(l=>`<div style="font-size:11px">${esc(l)}</div>`).join("")}</div>`;
  const count=d.counts||{}, cardPreviews=(d.candidate_cards||[]).slice(0,8).map(item=>syncCandidateCard(slug,item)).join("");
  const more=(d.candidate_cards||[]).length>8?`<div style="font-size:12px;color:var(--mut)">+ ${(d.candidate_cards||[]).length-8} more affected cards in the semantic diff above</div>`:"";
  const hasChanges=ch.length||pc;
  if(out)out.innerHTML=`<div style="font-size:13px;color:var(--mut);margin-bottom:7px">Compared with Forge <code>${esc((d.preview.head_sha||"").slice(0,8))}</code>. Sheets is already saved; these are the playable changes not yet promoted to Forge.</div>`+
    (hasChanges?`<div class="chg"><b>${count.cards||0} affected card${count.cards===1?"":"s"}</b> · ${count.modified||0} modified · ${count.added||0} added · ${count.removed||0} removed · ${pc} printing change${pc===1?"":"s"}</div>`:`<div style='font-size:13px'>✓ No uncommitted game changes.</div>`)+
    (ch.length?ch.map(chgHtml).join(""):"")+warnings+validationHtml+cardPreviews+more+
    (hasChanges&&d.can_commit?`<div style="display:grid;gap:7px;margin-top:12px">
      <label style="font-size:12px;color:var(--mut)">Commit message<textarea id="sheet-commit-message" rows="2" placeholder="What is this candidate trying to change?" style="display:block;width:100%;box-sizing:border-box;margin-top:3px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit;resize:vertical">${esc(d.summary||"")}</textarea></label>
      <label style="font-size:12px;color:var(--mut)">Other contributors <span style="font-weight:400">(comma separated; the person committing remains the verified submitter)</span><input id="sheet-contributors" placeholder="Names or Forge handles" style="display:block;width:100%;box-sizing:border-box;margin-top:3px;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;font:inherit"></label>
      <button class="btn primary" onclick="syncPull('${slug}',false)" style="justify-self:start">Commit this exact candidate</button></div>`:"");
}
function cards(g, mode){
  if(mode==="edit") return cardsEdit(g);
  const types=[...new Set(g.cards.map(c=>c.type))].sort();
  const mapped=[...new Set((g.source_overlay?.regions||[]).map(r=>r.src?.split(".").pop()).filter(Boolean))].map(x=>x.replaceAll("_"," ")).join(", ");
  const productionMapped=[...new Set((g.production?.templates||[]).flatMap(template=>(template.bindings||[]).filter(binding=>(binding.source||"card")==="card").map(binding=>binding.field)))].join(", ");
  const productionActive=g.production&&g.production.enabled!==false;

async function doExport(slug, fmt, label){
  if(!ME){_afterAuth=()=>doExport(slug,fmt,label);authOpen();return;}
  prNote(`Building ${label}…`);
  const r = await fetch(`/api/games/${slug}/export/${fmt}`, { method:"POST", headers: authHdr() });
  let d = await r.json();
  if(!r.ok){ prNote(d.error||"export failed", true); return; }
  while(r.status===202 && !["succeeded","failed"].includes(d.status)){
    prNote(`Building ${label}… ${d.progress||0}% · attempt ${d.attempt||1}`);
    await new Promise(resolve=>setTimeout(resolve,800));
    const status=await fetch(d.status_url,{headers:authHdr()});d=await status.json();
    if(!status.ok){prNote(d.error||"could not read export status",true);return;}
  }
  if(d.status==="failed"){prNote(d.error||"export failed",true);return;}
  const output=d.output||d,url=output.urls[0];
  prNote(`${label} ready — frozen at ${output.ref}`);
  window.open(url, "_blank");
}

function edValidationErrors(){

    const attrs=card.attributes||{};
    for(const def of defs){
      const value=attrs[def.key], choices=def.choices||def.enum||[];
      if(def.required&&value===undefined){errors.push(`${card.name||card.id}: ${def.name||def.key} is required`);continue;}
      if(value===undefined)continue;
      const typed=def.type==="integer"?Number.isInteger(value):def.type==="number"?typeof value==="number"&&!Number.isNaN(value):typeof value===def.type;
      if(!typed)errors.push(`${card.name||card.id}: ${def.name||def.key} must be ${def.type}`);
      else if(choices.length&&!choices.some(choice=>JSON.stringify(choice)===JSON.stringify(value)))errors.push(`${card.name||card.id}: ${def.name||def.key} must be ${choices.join(" or ")}`);

async function ngSubmit(close){
  const btn=document.getElementById("ng-ok"); if(!btn) return;
  const errEl=document.getElementById("ngErr"); errEl.style.display="none";
  const mode=document.querySelector('input[name="ng-mode"]:checked')?.value||"idea";
  const title=(document.getElementById("ng-title").value||"").trim();
  const spark=(document.getElementById("ng-spark").value||"").trim();
  const experience=(document.getElementById("ng-experience").value||"").trim();
  const mvp=(document.getElementById("ng-mvp").value||"").trim();
  const question=(document.getElementById("ng-question").value||"").trim();
  const anchor=(document.querySelector('input[name="ng-anchor"]:checked')?.value||"experience");
  const license=(document.getElementById("ng-license").value||"proprietary");
  const raw=(document.getElementById("ng-csv")?.value||"").trim();
  const sheetUrl=(document.getElementById("ng-sheet")?.value||"").trim();
  if(!title){ errEl.textContent="Title is required."; errEl.style.display=""; return; }
  if(mode==="idea"&&!spark){ errEl.textContent="Get the idea out of your head first — one rough sentence is enough."; errEl.style.display=""; return; }
  if(mode==="idea"&&!experience){ errEl.textContent="Describe how players should feel. This is the filter for later decisions."; errEl.style.display=""; return; }
  if(mode==="idea"&&!mvp){ errEl.textContent="Name the smallest thing you could put on a table and test."; errEl.style.display=""; return; }
  if(mode==="csv"&&!raw){ errEl.textContent="Paste card CSV, upload a .csv file, or load one of the examples."; errEl.style.display=""; return; }
  if(mode==="sheet"&&!/^https:\/\/docs\.google\.com\/spreadsheets\//i.test(sheetUrl)){
    errEl.textContent="Paste a Google Sheets tab URL beginning with https://docs.google.com/spreadsheets/."; errEl.style.display=""; return;
  }
  const was=btn.textContent; btn.disabled=true; btn.textContent="Creating…";
  try{
    let brief=null;
    if(mode==="idea"){
      brief={schema_version:1,status:"idea",starting_point:anchor,spark,
        design_intent:{player_experience:experience},mvp:{playable_slice:mvp}};
      if(question)brief.mvp.question=question;
    }
    const body={title,license}; if(brief)body.brief=brief; if(mode==="csv")body.csv=raw;
    const r=await fetch("/api/games",{method:"POST",headers:authHdr(),body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(r.status===201){
      if(mode==="sheet"){
        btn.textContent="Connecting sheet…";
        try{
          const sr=await fetch(`/api/games/${d.slug}/sync/sheet`,{method:"PUT",headers:authHdr(),body:JSON.stringify({url:sheetUrl})});
          const sd=await sr.json().catch(()=>({}));
          if(sr.ok){
            const pull=await fetch(`/api/games/${d.slug}/sync/pull`,{method:"POST",headers:authHdr()});
            if(!pull.ok){const pd=await pull.json().catch(()=>({}));toast(`Sheet connected, but its first snapshot needs attention: ${esc(pd.error||pull.status)} — review it from Cards.`,9000);}
          }
          else toast(`'${esc(d.slug)}' created, but connecting the sheet failed: ${esc(sd.error||sr.status)} — connect it later from the game page.`,9000);
        }catch(e){ toast(`'${esc(d.slug)}' created, but connecting the sheet failed — try again from the game page.`,9000); }
      }
      close();
      const outcome=mode==="idea"?"First direction committed":mode==="csv"?`${d.cards} card${d.cards===1?"":"s"} imported as one commit`:"Game created and Sheet working copy connected";
      toast(`<b>✓ ${esc(outcome)}</b><br>${mode==="idea"?"Now build only what the first test needs.":mode==="csv"?"Review the cards, choose a design, then invite a collaborator.":"Review the imported candidate on Cards; later Sheet edits stay drafts until you commit them."}`);
      const destination=d.url||`#/g/${d.slug}`;
      setTimeout(()=>{ location.href=`/?t=${Date.now()}${destination}${mode==="idea"?"":"/cards"}`; },1100); // reload -> hub rebakes with the new game
    } else if(r.status===401){
      close(); _afterAuth=newGameModal; authOpen();
    } else if(r.status===409 || r.status===422){
      let msg=d.error||`request failed (${r.status})`;
      if(Array.isArray(d.report)&&d.report.length) msg+=": "+d.report.slice(0,2).join("; ");
      errEl.textContent=msg; errEl.style.display="";
      btn.disabled=false; btn.textContent=was;
    } else {
      errEl.textContent=d.error||`request failed (${r.status})`; errEl.style.display="";
      btn.disabled=false; btn.textContent=was;
    }
  }catch(e){
    errEl.textContent=e.message||"network error"; errEl.style.display="";
    btn.disabled=false; btn.textContent=was;
  }
}

async function prototypeSubmit(slug,close){
  const err=document.getElementById("protoErr"), btn=document.getElementById("proto-ok");err.style.display="none";
  const val=id=>(document.getElementById(id)?.value||"").trim();
  const question=val("proto-question"),setup=val("proto-setup"),end=val("proto-end"),observe=val("proto-observe");
  const procedure=val("proto-procedure").split(/\n+/).map(s=>s.trim().replace(/^\d+[.)]\s*/,"")).filter(Boolean);
  const min=parseInt(val("proto-pmin"),10),max=parseInt(val("proto-pmax"),10),duration=parseInt(val("proto-duration"),10);
  const used=new Set();
  const materials=[...document.querySelectorAll("[data-proto-material]")].map(row=>{
    const kind=row.querySelector("[data-kind]").value,name=row.querySelector("[data-name]").value.trim(),quantity=parseInt(row.querySelector("[data-quantity]").value,10);
    let id=row.dataset.id||name.toLowerCase().replace(/[^a-z0-9]+/g,"_").replace(/^_+|_+$/g,"").slice(0,58)||kind;
    if(id.length<2)id=`${kind}_item`;let base=id,n=2;while(used.has(id))id=`${base}_${n++}`;used.add(id);
    return {id,kind,name,quantity};
  });
  const missing=!question||!setup||!end||!observe||!procedure.length||materials.some(m=>!m.name||!Number.isInteger(m.quantity)||m.quantity<1);
  if(missing){err.textContent="Complete the question, every material, setup, procedure, stopping point, and observation before committing.";err.style.display="";return;}
  if(!Number.isInteger(min)||!Number.isInteger(max)||min<1||max<min||!Number.isInteger(duration)||duration<1){err.textContent="Check the player range and timebox.";err.style.display="";return;}
  const prototype={schema_version:1,status:"ready",iteration:parseInt(val("proto-iteration"),10)||1,question,players:{min,max},duration_minutes:duration,materials,setup,procedure,end_condition:end,observation:{prompt:observe}};
  const was=btn.textContent;btn.disabled=true;btn.textContent="Committing…";
  try{
    const r=await fetch(`/api/games/${slug}/prototype`,{method:"PUT",headers:authHdr(),body:JSON.stringify(prototype)});const d=await r.json().catch(()=>({}));
    if(!r.ok){err.textContent=(d.error||"Could not commit the test")+(d.report?.length?`: ${d.report.filter(Boolean).slice(0,2).join("; ")}`:"");err.style.display="";btn.disabled=false;btn.textContent=was;return;}
    close();toast(`<b>✓ Runnable test committed</b><br>Iteration ${esc(d.iteration)} · ${esc(d.materials)} material${d.materials===1?"":"s"} · exact history preserved.`);
    setTimeout(()=>{location.href=`/?t=${Date.now()}#/g/${slug}/overview`;},650);
  }catch(e){err.textContent=e.message||"network error";err.style.display="";btn.disabled=false;btn.textContent=was;}
}

function edField(label, key, val, opts){
  const id="ef-"+key.replace(/\./g,"_");
  if(opts&&opts.type==="select")
    return `<div class="fld"><label>${esc(label)}</label><select id="${id}" onchange="edSet('${key}',this.value)">${opts.options.map(o=>`<option ${o===val?'selected':''}>${esc(o)}</option>`).join("")}</select></div>`;
  if(opts&&opts.type==="textarea"){
    const g=G(ED.slug), syms=(g.symbols||[]);
    const chips=edSymbolButtons(g,key,syms);
    return `<div class="fld"><label>${esc(label)}</label>${chips}<textarea id="${id}" oninput="edSet('${key}',this.value)">${esc(val||"")}</textarea></div>`;
  }
  const t=opts&&opts.type==="integer"?"number":"text";
  return `<div class="fld"><label>${esc(label)}</label><input id="${id}" type="${t}" value="${esc(val??"")}" oninput="edSet('${key}',${t==='number'?'this.valueAsNumber':'this.value'})"></div>`;
}
function edSymbolButtons(g,key,syms=g.symbols||[]){
  if(!syms.length) return "";
  return `<div style="margin-bottom:6px">${syms.map(s=>`<button type="button" class="symbtn" onclick="edInsert('${key}','[${s.key}]')" title="Insert ${esc(s.name||s.key)}">${cfSymHtml(g,s.key,"cf-sym")||esc(s.glyph||s.key)}<span>${esc(s.key)}</span></button>`).join("")}</div>`;
}
function edCtl(key,val,opts){
  const id="ef-"+key.replace(/\./g,"_");
  if(opts&&opts.type==="select"){
    const read=opts.valueType==="integer"||opts.valueType==="number"?"Number(this.value)":opts.valueType==="boolean"?"this.value==='true'":"this.value";
    return `<select id="${id}" onchange="edSet('${key}',${read})">${opts.options.map(o=>`<option value="${esc(String(o))}" ${o===val?'selected':''}>${esc(String(o))}</option>`).join("")}</select>`;

function edSummary(){ // mirror carddiff.summarize titles
  const changed=[],added=[],removed=[];

  for(const[id,o]of om){const n=nm.get(id);if(!n)removed.push(o.name);else if(JSON.stringify(o)!==JSON.stringify(n))changed.push(n.name);}
  for(const[id,n]of nm)if(!om.has(id))added.push(n.name);

  const verb=changed.length&&!added.length&&!removed.length?"changed":"updated";

}

function publicationBg(page,t){const b=page.background||{type:"paper"};if(b.type==="dark")return"linear-gradient(145deg,#111722,#26364a)";if(b.type==="corp")return`linear-gradient(145deg,${t.corp||"#23506f"},#102433)`;if(b.type==="runner")return`linear-gradient(145deg,${t.runner||"#6f3b73"},#25162a)`;if(b.type==="split")return`linear-gradient(180deg,${t.corp||"#23506f"} 0 49.5%,${t.runner||"#6f3b73"} 50.5% 100%)`;if(b.type==="gradient")return`linear-gradient(145deg,${b.from||t.corp},${b.to||t.runner})`;return t.paper;}
function publicationStyle(style={}){const a=[];if(style.align)a.push(`text-align:${style.align}`);if(style.valign)a.push(`justify-content:${style.valign==="middle"?"center":style.valign==="bottom"?"flex-end":"flex-start"}`);if(style.color)a.push(`color:${style.color}`);if(style.background)a.push(`background:${style.background}`);if(style.border)a.push(`border-color:${style.border}`);if(style.font_size_pt)a.push(`font-size:${style.font_size_pt*1.32}px`);if(style.columns)a.push(`--columns:${style.columns}`);if(style.padding_mm!=null)a.push(`padding:${style.padding_mm*3.1}px`);if(style.radius_mm!=null)a.push(`border-radius:${style.radius_mm*3.1}px`);if(style.opacity!=null)a.push(`opacity:${style.opacity}`);if(style.uppercase)a.push("text-transform:uppercase");return a.join(";");}
function pubCard(g,id,w){const c=(g.cards||[]).find(card=>card.id===id);return c?layoutCard(g,c,cfPrinting(g,c),{w:Math.max(44,Math.round(w))}):`<div class="mut">missing card: ${esc(id)}</div>`;}
function publicationScene(g,block,pageW){const placements=(block.placements||[]).map(p=>{const style=`left:${p.x}%;top:${p.y}%;width:${p.w}%;height:${p.h}%;transform:rotate(${p.rotate||0}deg);z-index:${p.z||1}`;if(p.kind==="card")return`<div class="pub-scene-item-ui" style="${style}"><div style="transform:rotate(${-(p.rotate||0)}deg)">${pubCard(g,p.card_id,pageW*(block.w/100)*(p.w/100)*.94)}</div></div>`;if(p.kind==="card-back")return`<div class="pub-scene-item-ui" style="${style}"><div class="pub-back-ui">${esc(p.label||"CARD")}</div></div>`;return`<div class="pub-scene-item-ui" style="${style}"><div class="pub-label-ui" style="background:${esc(p.tone||"#26364a")}">${esc(p.label||"")}</div></div>`}).join("");const arrows=(block.arrows||[]).map(a=>`<g><line x1="${a.x1}" y1="${a.y1}" x2="${a.x2}" y2="${a.y2}" stroke="${esc(a.tone||"#e05d32")}" marker-end="url(#pubuiarrow)"/><text x="${(a.x1+a.x2)/2}" y="${(a.y1+a.y2)/2-2}" fill="${esc(a.tone||"#e05d32")}">${esc(a.label||"")}</text></g>`).join("");return`<div class="pub-live-scene"><svg class="pub-arrows-ui" viewBox="0 0 100 100" preserveAspectRatio="none"><defs><marker id="pubuiarrow" markerWidth="5" markerHeight="5" refX="4" refY="2.5" orient="auto"><path d="M0 0L5 2.5L0 5Z" fill="#e5edf5"/></marker></defs>${arrows}</svg>${placements}</div>${block.caption?`<div class="pub-caption-ui">${esc(block.caption)}</div>`:""}`;}
function publicationBlock(g,doc,block,editable=false){const pageW=760,style=`left:${block.x}%;top:${block.y}%;width:${block.w}%;height:${block.h}%;${publicationStyle(block.style)}`,sel=editable&&PUB_EDIT?.blockId===block.id;let body="";if(block.type==="heading")body=`${block.kicker?`<div class="pub-kicker-ui">${esc(block.kicker)}</div>`:""}<h1>${esc(block.content||block.heading||"")}</h1>`;else if(block.type==="text")body=(block.content||"").split(/\n\s*\n/).map(p=>`<p>${esc(p)}</p>`).join("");else if(block.type==="callout"||block.type==="rule-reference")body=`${block.heading?`<h3>${esc(block.heading)}</h3>`:""}<p>${esc(block.content||"")}</p>`;else if(block.type==="steps")body=`${block.heading?`<h3>${esc(block.heading)}</h3>`:""}<ol>${(block.items||[]).map(v=>`<li>${esc(v)}</li>`).join("")}</ol>`;else if(block.type==="component-list")body=`${block.heading?`<h3>${esc(block.heading)}</h3>`:""}<ul>${(block.items||[]).map(v=>`<li>${esc(v)}</li>`).join("")}</ul>`;else if(block.type==="card")body=`<div class="pub-live-card">${pubCard(g,block.card_id,pageW*(block.w/100)*.88)}</div>${block.caption?`<div class="pub-caption-ui">${esc(block.caption)}</div>`:""}`;else if(block.type==="card-grid")body=`<div class="pub-live-grid">${(block.card_ids||[]).map(id=>pubCard(g,id,pageW*(block.w/100)*.42)).join("")}</div>${block.caption?`<div class="pub-caption-ui">${esc(block.caption)}</div>`:""}`;else if(block.type==="scene")body=publicationScene(g,block,pageW);else body=`<p>${esc(block.content||"")}</p>`;return`<section class="pub-block-ui pub-ui-${esc(block.type)}${sel?" selected":""}" data-editable="${editable?1:0}" data-block="${esc(block.id)}" style="${style}" ${editable?`onpointerdown="pubDragStart(event,'${esc(block.id)}')" onclick="pubSelectBlock(event,'${esc(block.id)}')"`:""}>${body}</section>`;}
function publicationCanvas(g,doc,index,editable=false){const p=doc.pages[index],t=doc.theme,f=doc.format,ratio=f.height_mm/f.width_mm;return`<div class="pub-canvas" id="pub-canvas" style="height:${760*ratio}px;--pub-paper:${esc(t.paper)};--pub-ink:${esc(t.ink)};--pub-muted:${esc(t.muted||"#596273")};--pub-accent:${esc(p.accent||t.accent)};--pub-body:${esc(t.body_font)};--pub-display:${esc(t.display_font)};background:${publicationBg(p,t)}">${p.section?`<div class="pub-running">${esc(p.section)}<span>${esc(doc.title)}</span></div>`:""}${(p.blocks||[]).map(b=>publicationBlock(g,doc,b,editable)).join("")}${p.show_page_number===false||t.page_number_style==="none"?"":`<div class="pub-number-ui" style="${t.page_number_style==="circle"?"border-radius:50%":""}">${index+1}</div>`}</div>`;}
function publicationOutputCards(g,data){const outputs=data.build?.outputs||[];if(!outputs.length)return`<div class="chg"><b>No frozen publication build at this commit yet.</b><br><span class="mut">The pages are live below. Build to freeze the print PDF, web book, preflight receipt, and portable source package.</span></div>`;return`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:9px">${outputs.map(o=>`<a class="box" style="display:block;margin:0;padding:12px;text-decoration:none;color:inherit" target="_blank" href="${rulebookCacheUrl(g.slug,data.ref,o.file)}"><b>${rulebookOutputIcon(o)} ${esc(o.label)}</b><div class="mono mut" style="font-size:10px;margin-top:5px">${esc(o.file)} · ${fmtBytes(o.size)}</div></a>`).join("")}</div>`;}
function publicationHero(g,data){const d=data.document,p=data.publication,f=d.format,adapters=p.editors||[];return`<div class="box pub-hero"><div class="bh" style="display:flex;align-items:center;gap:8px">Designed rulebook publication <span class="badge" style="margin-left:auto;color:var(--acc);border-color:#c6b5dc">${esc(p.kind)}</span></div><div class="bb"><h2 style="margin:0 0 4px">${esc(d.title)}</h2><div class="mut">${esc(d.subtitle||p.label)} · ${d.pages.length} designed pages · ${f.width_mm} × ${f.height_mm} mm · ${f.bleed_mm} mm bleed</div><p style="font-size:13px;line-height:1.55;max-width:850px">Content, page composition, linked cards, setup scenes, editor sources, and final exports are one versioned product. Change the layout here or hand the same source package to a production editor.</p><div style="display:flex;gap:7px;flex-wrap:wrap">${adapters.map(a=>`<span class="badge">${esc(a.label)} · ${esc(a.roundtrip)}</span>`).join("")}</div></div></div>`;}
function publicationPageView(g,data,index=PUB_VIEW_INDEX[g.slug]||0){PUB_VIEW_INDEX[g.slug]=Math.min(index,data.document.pages.length-1);const i=PUB_VIEW_INDEX[g.slug],d=data.document,pf=data.build?.preflight;$("#pane").innerHTML=`${publicationCss()}${publicationHero(g,data)}<div class="box"><div class="bh">Published pages <span class="mut" style="font-weight:400">· exact game objects placed into a designed book</span><div style="float:right;display:flex;gap:7px;margin-top:-5px"><button class="btn" onclick="go('g/${g.slug}/rules/reference')">Reference rules</button><button class="btn" onclick="go('g/${g.slug}/rules/edit')">✎ Design book</button><button class="btn primary" id="publication-build" onclick="publicationBuild('${g.slug}')">${data.build?"Rebuild / verify":"Build print publication"}</button></div></div><div class="bb"><div class="pub-pagebar">${d.pages.map((p,n)=>`<button class="pub-pagebtn ${n===i?"on":""}" onclick="publicationPageView(G('${g.slug}'),PUBLICATION_LIVE['${g.slug}'],${n})"><b>${n+1}. ${esc(p.name)}</b><br><span class="mut" style="font-size:10px">${esc(p.template)} · ${esc(p.section||"")}</span></button>`).join("")}</div><div class="pub-stage"><div class="pub-canvas-wrap">${publicationCanvas(g,d,i,false)}</div><div><div class="box" style="margin:0 0 10px"><div class="bh">Page dependencies</div><div class="bb" style="font-size:12px">${(()=>{const page=d.pages[i],cards=new Set();for(const b of page.blocks||[]){if(b.card_id)cards.add(b.card_id);for(const c of b.card_ids||[])cards.add(c);for(const p of b.placements||[])if(p.card_id)cards.add(p.card_id)}return cards.size?[...cards].map(id=>`<div class="mono" style="margin:4px 0">card:${esc(id)}</div>`).join(""):"<span class='mut'>No card dependencies on this page.</span>"})()}</div></div><div class="box" style="margin:0"><div class="bh">Build status</div><div class="bb"><div class="${pf?.ok?"pub-preflight-ok":data.build?"pub-preflight-warn":"mut"}">${data.build?(pf.ok?"✓ Production preflight passed":`⚠ ${(pf.warnings||[]).length} preflight warning(s)`):"Not built at this commit"}</div></div></div></div></div></div></div><div class="box"><div class="bh">Frozen outputs</div><div class="bb" id="publication-outputs">${publicationOutputCards(g,data)}</div></div><div class="two"><div><div class="box"><div class="bh">Version-controlled publication source</div><div class="bb">${(data.source_files||[]).map(path=>`<div class="pub-sourcefile"><span>▤</span><div style="flex:1"><b class="mono">${esc(path)}</b></div><button class="btn" onclick="publicationSourceOpen('${g.slug}','${encodeURIComponent(path)}')">Inspect / edit</button></div>`).join("")}</div></div></div><div class="side"><div class="box"><div class="bh">Two connected layers</div><div class="bb"><div class="activity"><span>▤</span><div><b>Learn to play</b><br><span class="mut">Art-directed pages, diagrams, examples, teaching flow.</span></div></div><div class="activity"><span>{ }</span><div><b>Comprehensive rules</b><br><span class="mut">Structured reference source and official formatter.</span><br><button class="btn" style="margin-top:6px" onclick="go('g/${g.slug}/rules/reference')">Open reference pipeline</button></div></div></div></div></div></div>`;}
async function publicationHydrate(g,edit=false){try{let data;if(LIVE){const r=await fetch(`/api/games/${encodeURIComponent(g.slug)}/rules/publication`,{headers:authHdr()});data=await r.json();if(!r.ok)throw new Error(data.error||`HTTP ${r.status}`)}else data={...g.rulebook_publication,ref:"preview",access:{can_write:false}};PUBLICATION_LIVE[g.slug]=data;edit?publicationDesigner(g,data):publicationPageView(g,data);}catch(e){$("#pane").innerHTML=`<div class="emptystate">Could not load the designed rulebook.<br>${esc(e.message)}</div>`}}
async function publicationBuild(slug){const btn=$("#publication-build");if(btn){btn.disabled=true;btn.textContent="Building print PDF…"}prNote("Rendering every designed page, checking linked game objects, overflow, trim, and bleed…");try{let r=await fetch(`/api/games/${encodeURIComponent(slug)}/export/publication`,{method:"POST",headers:authHdr()}),d=await r.json();if(!r.ok)throw new Error(d.error||`HTTP ${r.status}`);while(r.status===202&&!['succeeded','failed'].includes(d.status)){prNote(`Rendering publication… ${d.progress||0}% · attempt ${d.attempt||1}`);await new Promise(resolve=>setTimeout(resolve,800));r=await fetch(d.status_url,{headers:authHdr()});d=await r.json();if(!r.ok)throw new Error(d.error||"could not read publication status")}if(d.status==="failed")throw new Error(d.error||"publication export failed");const output=d.output||d,build=output.build;if(!build)throw new Error("publication export completed without build metadata");PUBLICATION_LIVE[slug]={...PUBLICATION_LIVE[slug],ref:output.ref,build};prNote(`${output.cached?"Verified cached":"Built"} ${build.page_count}-page publication · ${build.preflight.ok?"preflight passed":build.preflight.warnings.length+" warning(s)"}`);publicationPageView(G(slug),PUBLICATION_LIVE[slug]);}catch(e){prNote(`Publication build failed: ${e.message}`,true);if(btn){btn.disabled=false;btn.textContent="Build print publication"}}}
function pubCurrentPage(){return PUB_EDIT?.document?.pages?.[PUB_EDIT.pageIndex]}
function pubCurrentBlock(){return pubCurrentPage()?.blocks?.find(b=>b.id===PUB_EDIT.blockId)}
function pubDesignerShell(g){const d=PUB_EDIT.document,p=pubCurrentPage();return`${publicationCss()}<div class="dhead" style="padding:0 0 12px;border:none"><div style="flex:1"><h2 style="margin:0">Rulebook publication designer</h2><div class="sub">${d.title} · page ${PUB_EDIT.pageIndex+1} of ${d.pages.length} · drag blocks on the page, then commit the portable source</div></div><button class="btn" onclick="go('g/${g.slug}/rules')">Cancel</button><button class="btn primary" id="pub-save" onclick="publicationSave()">Commit publication</button></div><div class="pub-designer-grid"><div class="box" style="margin:0"><div class="bh">Pages <button class="btn" style="float:right;margin-top:-5px;padding:2px 7px" onclick="pubAddPage()">+</button></div><div class="bb" style="padding:7px">${d.pages.map((page,i)=>`<button class="pub-pagebtn ${i===PUB_EDIT.pageIndex?"on":""}" style="display:block;width:100%;margin:4px 0;min-width:0" onclick="pubPage(${i})"><b>${i+1}. ${esc(page.name)}</b><br><span class="mut" style="font-size:10px">${esc(page.template)}</span></button>`).join("")}<button class="btn" style="width:100%;margin-top:8px" onclick="pubDuplicatePage()">Duplicate page</button></div></div><div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px"><span class="mut" style="font-size:12px;padding:6px 2px">Add block:</span>${["heading","text","callout","card","steps"].map(type=>`<button class="btn" onclick="pubAddBlock('${type}')">+ ${type}</button>`).join("")}</div><div class="pub-canvas-wrap" id="pub-editor-canvas">${publicationCanvas(g,d,PUB_EDIT.pageIndex,true)}</div></div><div class="box pub-inspector" style="margin:0"><div class="bh">Inspector <button class="btn" style="float:right;margin-top:-5px;padding:2px 7px" onclick="publicationSourceOpen('${g.slug}','${encodeURIComponent(PUB_EDIT.sourcePath)}')">{ } JSON</button></div><div class="bb" id="pub-inspector">${pubInspectorHtml(g,p)}</div></div></div>`}
function publicationDesigner(g,data){if(LIVE&&!data.access?.signed_in){authOpen();go(`g/${g.slug}/rules`);return}if(LIVE&&!data.access?.can_write){$("#pane").innerHTML=`${publicationCss()}${publicationHero(g,data)}<div class="box"><div class="bb"><h3>This publication is read-only here.</h3><p>Create your edition to change pages, diagrams, or content. Your book stays independent unless you deliberately open a pull request.</p><button class="btn primary" onclick="forkGame('${g.slug}')">⑂ Create an editable edition</button></div></div>`;return}PUB_EDIT={slug:g.slug,g,document:structuredClone(data.document),sourcePath:data.source_path,pageIndex:0,blockId:data.document.pages[0]?.blocks?.[0]?.id||null};$("#pane").innerHTML=pubDesignerShell(g);}
function pubInspectorHtml(g,page){const b=pubCurrentBlock();if(!b)return`<div class="mut">Select a block on the page.</div>`;const field=(label,key,value,type="text")=>`<div class="fld"><label>${label}</label>${type==="textarea"?`<textarea oninput="pubSet('${key}',this.value)">${esc(value||"")}</textarea>`:`<input type="${type}" value="${esc(value??"")}" oninput="pubSet('${key}',${type==="number"?'Number(this.value)':'this.value'})">`}</div>`;return`<div class="mut mono" style="font-size:10px;margin-bottom:8px">${esc(b.id)} · ${esc(b.type)}</div><div class="pub-geom">${["x","y","w","h"].map(k=>field(k.toUpperCase(),k,b[k],"number")).join("")}</div>${["heading","text","callout","rule-reference","footer"].includes(b.type)?field("Heading","heading",b.heading):""}${["heading","text","callout","rule-reference","footer"].includes(b.type)?field("Content","content",b.content,"textarea"):""}${b.type==="heading"?field("Kicker","kicker",b.kicker):""}${b.type==="card"?`<div class="fld"><label>Linked card</label><select onchange="pubSet('card_id',this.value)">${g.cards.map(c=>`<option value="${esc(c.id)}" ${c.id===b.card_id?"selected":""}>${esc(c.name)}</option>`).join("")}</select></div>`:""}${["steps","component-list"].includes(b.type)?field("Items (one per line)","items_text",(b.items||[]).join("\n"),"textarea"):""}<div style="border-top:1px solid var(--bd);margin:12px 0 10px;padding-top:10px"><b style="font-size:12px">Appearance</b></div>${field("Font size (pt)","style.font_size_pt",b.style?.font_size_pt||10,"number")}${field("Text color","style.color",b.style?.color||"")}${field("Background","style.background",b.style?.background||"")}${field("Columns","style.columns",b.style?.columns||1,"number")}<div style="display:flex;gap:7px"><button class="btn" onclick="pubDuplicateBlock()">Duplicate</button><button class="btn danger" onclick="pubDeleteBlock()">Delete</button></div>`}
function pubRenderEditor(){const wrap=$("#pub-editor-canvas");if(wrap)wrap.innerHTML=publicationCanvas(PUB_EDIT.g,PUB_EDIT.document,PUB_EDIT.pageIndex,true);const insp=$("#pub-inspector");if(insp)insp.innerHTML=pubInspectorHtml(PUB_EDIT.g,pubCurrentPage());}

function pubAddBlock(type){const page=pubCurrentPage(),id=`${type}-${Date.now().toString(36)}`,base={id,type,x:10,y:10,w:36,h:14,style:{font_size_pt:10}};if(type==="heading")Object.assign(base,{content:"New section",kicker:"SECTION",h:12,style:{font_size_pt:24}});else if(type==="text")base.content="Write publication copy here.";else if(type==="callout")Object.assign(base,{heading:"NOTE",content:"Explain one important idea.",style:{font_size_pt:9,background:"#eee8de",padding_mm:3}});else if(type==="card")Object.assign(base,{card_id:PUB_EDIT.g.cards[0]?.id,w:28,h:42});else if(type==="steps")Object.assign(base,{heading:"STEPS",items:["First step","Second step"],h:28});page.blocks.push(base);PUB_EDIT.blockId=id;pubRenderEditor();}

/* ---------- Native rulebook pipelines ----------
 * A game may keep writing in the format its production team already uses.
 * Forge versions the source lock + game-owned overlays, invokes the pinned

// visual PR diff: layoutCard(before) -> layoutCard(after) per touched card
// (falls back to cardFrame() for games with no layout.yaml), using the
// small (before_cards/after_cards) payload the PR-detail route now sends.
// Changed numeric attributes get a green outline on the AFTER card --
// layHlClass() maps a region's src/attribute path back to the highlighted
// key so this works for layout-spec regions too, not just cardFrame().
function prVisualDiff(g,pr){
  const before=Object.fromEntries((pr.before_cards||[]).map(c=>[c.id,c]));
  const after=Object.fromEntries((pr.after_cards||[]).map(c=>[c.id,c]));
  if(!g||(!pr.before_cards&&!pr.after_cards))return"";
  const byCard={};
  for(const ch of (pr.changes||[])){
    const e=byCard[ch.card]||(byCard[ch.card]={kind:ch.kind,attrs:new Set()});
    e.kind=ch.kind;
    if(ch.kind==="changed"&&String(ch.field).startsWith("attributes."))e.attrs.add(ch.field.slice(11));
  }
  const ids=[...new Set((pr.changes||[]).map(c=>c.card))];
  const cells=ids.map(cid=>{
    const info=byCard[cid]||{kind:"changed",attrs:new Set()}, b=before[cid], a=after[cid];
    if(info.kind==="added"&&a) return `<div class="prcard"><div style="text-align:center">${layoutCard(g,a,cfPrinting(g,a),{w:150})}<div style="font-size:11px;color:var(--grn);margin-top:4px;font-weight:600">+ added</div></div></div>`;
    if(info.kind==="removed"&&b) return `<div class="prcard"><div style="text-align:center;opacity:.5;filter:grayscale(.6)">${layoutCard(g,b,cfPrinting(g,b),{w:150})}<div style="font-size:11px;color:var(--red);margin-top:4px;font-weight:600">− removed</div></div></div>`;
    if(b&&a) return `<div class="prcard"><div>${layoutCard(g,b,cfPrinting(g,b),{w:150})}</div><div class="arrow">→</div><div>${layoutCard(g,a,cfPrinting(g,a),{w:150,highlight:info.attrs})}</div></div>`;
    return "";
  }).join("");
  return cells?`<div style="margin-bottom:6px">${cells}</div>`:"";
}
function assetTextDiff(before,after){
  const a=(before??"").split("\n"),b=(after??"").split("\n");let start=0;
  while(start<a.length&&start<b.length&&a[start]===b[start])start++;
  let ai=a.length-1,bi=b.length-1;while(ai>=start&&bi>=start&&a[ai]===b[bi]){ai--;bi--;}
  const removed=a.slice(start,ai+1).slice(0,10).map(line=>`<div style="background:#ffebe9;color:#82071e;padding:1px 8px"><span class="mono">−</span> ${esc(line)}</div>`).join("");
  const added=b.slice(start,bi+1).slice(0,10).map(line=>`<div style="background:#dafbe1;color:#116329;padding:1px 8px"><span class="mono">+</span> ${esc(line)}</div>`).join("");
  return `<div style="font:11.5px/1.45 ui-monospace,Menlo,monospace;border:1px solid var(--bd);border-radius:7px;overflow:auto;max-height:260px">${removed||added?removed+added:"<div class='mut' style='padding:8px'>Binary or formatting-only change</div>"}</div>`;
}
async function prAssetDiff(pr){
  const files=pr.file_changes||[];if(!files.length)return"";
  const rows=await Promise.all(files.map(async file=>{
    let preview="";
    if(file.asset_kind==="image"){
      preview=`<div class="prcard"><div style="text-align:center;min-width:190px"><div class="mut" style="font-size:11px;text-transform:uppercase;margin-bottom:5px">current</div>${file.before_url?`<img loading="lazy" src="${esc(file.before_url)}">`:`<div class="asset-detail-preview mut" style="width:180px;min-height:170px">not present</div>`}</div><div class="arrow">→</div><div style="text-align:center;min-width:190px"><div class="mut" style="font-size:11px;text-transform:uppercase;margin-bottom:5px">proposed</div>${file.after_url?`<img loading="lazy" src="${esc(file.after_url)}">`:`<div class="asset-detail-preview mut" style="width:180px;min-height:170px">removed</div>`}</div></div>`;
    }else if(file.asset_kind==="text"||file.asset_kind==="template"){
      const read=async url=>url?(await fetch(url)).text():"";let before="",after="";
      try{[before,after]=await Promise.all([read(file.before_url),read(file.after_url)]);}catch(e){}
      preview=assetTextDiff(before,after);
    }
    return `<div class="box" style="margin:10px 0"><div class="bh" style="display:flex;gap:8px;align-items:center"><span class="badge">${esc(file.kind)}</span><code style="word-break:break-all">${esc(file.path)}</code><span class="mut" style="margin-left:auto">${esc(file.category)}</span></div><div class="bb">${preview||`<div class="chg"><b>${esc(file.kind)}</b> ${fmtBytes(file.before_size)} → ${fmtBytes(file.after_size)}</div>`}</div></div>`;
  }));
  return `<div style="margin:16px 0"><h4 style="margin:0 0 6px">Reusable source <span class="count">${files.length}</span></h4>${rows.join("")}</div>`;
}

async function cutRelease(slug){
  if(!ME){ toast("Sign in to cut a release"); return; }
  const v=await askForm("Cut a release",[{name:"tag",label:"Tag (e.g. v1.0)",placeholder:"v1.0"},{name:"title",label:"Title (optional)"}],"Release");
  if(!v||!v.tag) return;
  toast("Cutting release + freezing exports…");
  const r=await fetch(`/api/games/${slug}/releases`,{method:"POST",headers:authHdr(),body:JSON.stringify({tag:v.tag,title:v.title})});
  const d=await r.json();
  if(r.status===201){ toast(`Released ${d.tag} — pinned to ${d.sha}`); liveReleases(G(slug)); }
  else{toast(d.error||"couldn't cut release");liveReleases(G(slug));}
}

function logPlaytest(slug){
  if(typeof LIVE==="undefined"||!LIVE||!ME){ toast("Sign in on the platform server to log a playtest."); return; }
  const g=G(slug), cards=g.cards||[], S=window._ps||{}, tags=["balance","fun","confusing","bug","timing","art"];
  const ov=document.createElement("div");
  ov.style.cssText="position:fixed;inset:0;background:rgba(18,22,28,.5);z-index:200;display:flex;align-items:center;justify-content:center;padding:20px";
  const box=document.createElement("div");
  box.style.cssText="background:#fff;border-radius:14px;padding:22px 24px;max-width:520px;width:100%;max-height:88vh;overflow:auto;box-shadow:0 24px 60px rgba(0,0,0,.35)";
  box.innerHTML=`<h3 style="margin:0 0 4px;font-size:17px;font-weight:600">Log this playtest</h3>`+
    `<p style="margin:0 0 16px;color:var(--mut);font-size:13px">Pinned to the exact version you're testing — that's the whole point.</p>`+
    `<label style="display:block;font-size:13px;color:var(--mut);margin-bottom:12px">How did it go?<textarea id="pt-notes" style="display:block;width:100%;margin-top:5px;min-height:64px;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;box-sizing:border-box;font:inherit" placeholder="What worked, what dragged, what confused…"></textarea></label>`+
    `<div style="display:flex;gap:12px;margin-bottom:14px"><label style="flex:1;font-size:13px;color:var(--mut)">Your result<select id="pt-res" style="display:block;width:100%;margin-top:5px;padding:8px;border:1px solid var(--bd);border-radius:8px;font:inherit"><option value="">—</option><option value="win">win</option><option value="loss">loss</option><option value="draw">draw</option></select></label>`+
    `<label style="flex:1;font-size:13px;color:var(--mut)">Minutes<input id="pt-min" type="number" min="1" value="${S.turn?Math.max(5,S.turn*3):''}" style="display:block;width:100%;margin-top:5px;padding:8px;border:1px solid var(--bd);border-radius:8px;box-sizing:border-box;font:inherit"></label></div>`+
    `<div style="font-size:13px;color:var(--mut);margin-bottom:6px">Flag a card (optional)</div>`+
    `<div style="display:flex;gap:8px;margin-bottom:12px"><select id="pt-card" style="flex:1.3;padding:8px;border:1px solid var(--bd);border-radius:8px;font:inherit"><option value="">— card —</option>${cards.map(c=>`<option value="${esc(c.id)}">${esc(c.name)}</option>`).join("")}</select>`+
    `<select id="pt-tag" style="flex:1;padding:8px;border:1px solid var(--bd);border-radius:8px;font:inherit">${tags.map(t=>`<option>${t}</option>`).join("")}</select></div>`+
    `<input id="pt-cnote" placeholder="Note on that card…" style="width:100%;padding:9px 11px;border:1px solid var(--bd);border-radius:8px;box-sizing:border-box;font:inherit;margin-bottom:16px">`+
    `<div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn" id="pt-x">Cancel</button><button class="btn primary" id="pt-ok">Log playtest</button></div>`;
  ov.appendChild(box); document.body.appendChild(ov);
  const close=()=>ov.remove();
  box.querySelector("#pt-x").onclick=close; ov.addEventListener("mousedown",ev=>{if(ev.target===ov)close();});
  box.querySelector("#pt-ok").onclick=async()=>{
    const notes=box.querySelector("#pt-notes").value.trim(), res=box.querySelector("#pt-res").value, min=parseInt(box.querySelector("#pt-min").value,10);
    const cid=box.querySelector("#pt-card").value, tag=box.querySelector("#pt-tag").value, cnote=box.querySelector("#pt-cnote").value.trim();
    const body={location:"platform",players:[{name:ME,...(res?{result:res}:{})}]};
    if(min>0)body.duration_minutes=min; if(notes)body.notes=notes; if(cid&&cnote)body.card_notes=[{card_id:cid,tag,note:cnote}];
    const r=await fetch(`/api/games/${slug}/playtests`,{method:"POST",headers:authHdr(),body:JSON.stringify(body)});
    const d=await r.json().catch(()=>({}));
    if(r.ok){ toast(`Playtest logged — pinned to ${d.pinned||"this version"}`); close(); }
    else toast(d.error||"couldn't log playtest");
  };
}
function play(g){ window._ps={g,deckIdx:0,seed:String(Math.floor(Math.random()*1e6)),lib:[],hand:[],board:[],discard:[],life:20,turn:1,started:false}; renderPlay(); }
function _prng(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){h=Math.imul(h^s.charCodeAt(i),3432918353);h=h<<13|h>>>19;} let a=(h>>>0)||1; return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return ((t^t>>>14)>>>0)/4294967296;}; }
function _pshuffle(arr,s){ const r=_prng(s); const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function _plibrary(g,deck){ const byId=Object.fromEntries(g.cards.map(c=>[c.id,c])); let ids=[]; if(deck&&deck.cards){for(const [cid,n] of Object.entries(deck.cards)){for(let i=0;i<n;i++) ids.push(cid);}} else ids=g.cards.map(c=>c.id); return ids.map(id=>byId[id]).filter(Boolean); }
function playStart(){ const S=window._ps; const el=document.getElementById("pl-seed"); if(el)S.seed=el.value.trim()||S.seed; const deck=(S.g.decks||[])[S.deckIdx]; S.lib=_pshuffle(_plibrary(S.g,deck),S.seed); S.hand=S.lib.splice(0,7); S.board=[]; S.discard=[]; S.life=20; S.turn=1; S.started=true; renderPlay(); }
function playNew(){ window._ps.seed=String(Math.floor(Math.random()*1e6)); playStart(); }
function playDeckSel(i){ window._ps.deckIdx=i; playStart(); }
function pDraw(){ const S=window._ps; if(S.lib.length){S.hand.push(S.lib.shift());renderPlay();} }
function pPlay(i){ const S=window._ps; const c=S.hand.splice(i,1)[0]; if(c){S.board.push(c);renderPlay();} }
function pBoardDisc(i){ const S=window._ps; const c=S.board.splice(i,1)[0]; if(c){S.discard.push(c);renderPlay();} }
function pReturn(i){ const S=window._ps; const c=S.board.splice(i,1)[0]; if(c){S.hand.push(c);renderPlay();} }
function pLife(d){ window._ps.life+=d; renderPlay(); }
function pTurn(){ window._ps.turn++; pDraw(); }
function renderPlay(){
  const S=window._ps,g=S.g,tc=g.type_colors||{},decks=g.decks||[]; const e=s=>esc(s);
  const mini=(c,onclick,foot)=>{const col=tc[c.type]||{fg:'#555',bg:'#ececec'};const cost=(c.attributes||{}).cost;
    return `<div onclick="${onclick}" title="${e(c.text||'')}" style="cursor:pointer;width:100px;flex:none;border:1px solid var(--bd);border-top:4px solid ${col.fg};border-radius:8px;background:#fff;overflow:hidden" onmouseover="this.style.boxShadow='0 6px 16px rgba(0,0,0,.18)'" onmouseout="this.style.boxShadow=''">`+
      `<div style="background:${col.bg};color:${col.fg};padding:4px 6px;display:flex;justify-content:space-between;align-items:center;gap:3px;font-size:11px"><b style="line-height:1.05">${e(c.name)}</b>${cost!=null?`<span style="font-weight:700">${cost}</span>`:''}</div>`+
      `<div style="padding:5px 6px;font-size:10px;color:#3a3a3a;height:44px;overflow:hidden;line-height:1.25">${e(c.text||'')}</div>`+
      `<div style="font-size:9px;color:var(--mut);text-align:center;padding-bottom:3px">${foot||''}</div></div>`;};
  if(!S.started){
    $("#pane").innerHTML=`<div class="box"><div class="bh">🎮 Play — test your deck at the table</div><div class="bb">`+
      `<div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px">`+
        (decks.length>1?`<select onchange="playDeckSel(this.selectedIndex)" style="padding:6px 8px;border:1px solid var(--bd);border-radius:6px">${decks.map((d,i)=>`<option ${i===S.deckIdx?'selected':''}>${e(d.name||d.id)}</option>`).join("")}</select>`:`<span class="badge">${decks.length?e(decks[0].name||decks[0].id):'all cards'}</span>`)+
        `<label style="font-size:13px;color:var(--mut)">seed <input id="pl-seed" value="${e(S.seed)}" style="width:96px;padding:6px 8px;border:1px solid var(--bd);border-radius:6px;font:inherit"></label>`+
        `<button class="btn primary" onclick="playStart()">Shuffle &amp; play</button></div>`+
      `<div style="color:var(--mut);font-size:13px">Draw a hand, play cards to the table, track life and turns — a real solo playtest. The seed is deterministic, so a session reproduces exactly (copy it to share a game state).</div>`+
    `</div></div>`; return;
  }
  const board=S.board.map((c,i)=>mini(c,`pBoardDisc(${i})`,'&#9656; discard')).join("")||"<span style='color:var(--mut);align-self:center'>Play cards from your hand here.</span>";
  const hand=S.hand.map((c,i)=>mini(c,`pPlay(${i})`,'&#9656; play')).join("")||"<span style='color:var(--mut);align-self:center'>Hand empty — draw a card.</span>";
  $("#pane").innerHTML=`<div class="box"><div class="bb">`+
    `<div style="display:flex;gap:16px;flex-wrap:wrap;align-items:center;margin-bottom:14px;padding-bottom:12px;border-bottom:1px solid var(--bd)">`+
      `<button class="btn primary" onclick="pDraw()">Draw <span style="opacity:.8">(${S.lib.length})</span></button>`+
      `<div style="display:flex;align-items:center;gap:5px"><span style="color:var(--mut);font-size:12px">life</span><button class="btn" style="padding:2px 9px" onclick="pLife(-1)">−</button><b style="min-width:26px;text-align:center;font-size:16px">${S.life}</b><button class="btn" style="padding:2px 9px" onclick="pLife(1)">+</button></div>`+
      `<div style="display:flex;align-items:center;gap:6px"><span style="color:var(--mut);font-size:12px">turn</span><b style="font-size:16px">${S.turn}</b><button class="btn" style="padding:2px 8px" onclick="pTurn()">end turn ↻</button></div>`+
      `<span style="color:var(--mut);font-size:13px">discard <b>${S.discard.length}</b></span>`+
      `<div style="flex:1"></div><span style="color:var(--mut);font-size:12px">seed ${e(S.seed)}</span><button class="btn" onclick="logPlaytest('${g.slug}')">📝 Log playtest</button><button class="btn" onclick="playNew()">New game</button></div>`+
    `<div style="color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Table (click a card to discard)</div>`+
    `<div style="display:flex;gap:8px;flex-wrap:wrap;min-height:148px;background:#f3f5f8;border-radius:10px;padding:10px;margin-bottom:18px">${board}</div>`+
    `<div style="color:var(--mut);font-size:11px;text-transform:uppercase;letter-spacing:.05em;margin-bottom:6px">Your hand — ${S.hand.length} card${S.hand.length===1?'':'s'} (click to play)</div>`+
    `<div style="display:flex;gap:8px;flex-wrap:wrap;min-height:148px">${hand}</div>`+
  `</div></div>`;
}

  $("#pane").innerHTML=(g.formats.map(f=>{
    const r=g.restrictions.find(x=>x.id===f.active_restriction_id);
    return `<div class="box"><div class="bh">${esc(f.name)}</div><div class="bb">
      <div class="kv"><b>Card pool</b>${f.card_pool.map(s=>{const set=g.sets.find(x=>x.id===s);return esc(set?set.name:s)}).join(", ")}</div>

      ${r?`<h4 style="margin:14px 0 6px">${esc(r.name||r.id)} <span style="color:var(--mut);font-weight:400;font-size:12px">effective ${esc(r.date_start)}</span></h4>

const JSTATUS = {upcoming:["#0969da","Starts soon"],running:["#1a7f37","● Running"],judging:["#bc4c00","Judging"],complete:["#656d76","Complete"]};
function jamCountdown(j){
  const now=new Date(); const end=new Date(j.ends+"T23:59:59"); const start=new Date(j.starts);
  if(j.status==="running"){ const d=Math.max(0,Math.ceil((end-now)/864e5)); return `${d} day${d===1?"":"s"} left`; }
  if(j.status==="upcoming"){ const d=Math.max(0,Math.ceil((start-now)/864e5)); return `starts in ${d} day${d===1?"":"s"}`; }
  return j.status==="judging" ? "entries closed — judging underway" : "finished";
}
